<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="波段分析">
<meta name="theme-color" content="#f6f7f9">

<title>波段分析</title>

<style>

*{
box-sizing:border-box
}

html{
background:#f6f7f9;
-webkit-text-size-adjust:100%;
}

body{
margin:0;
background:#f6f7f9;
color:#17202a;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
-webkit-font-smoothing:antialiased;
}

button,
input{
font:inherit;
}

button{
-webkit-tap-highlight-color:transparent;
}

.app{
width:100%;
max-width:760px;
margin:0 auto;

padding-top:calc(env(safe-area-inset-top,0px) + 22px);
padding-right:max(16px,env(safe-area-inset-right,0px));
padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));
padding-left:max(16px,env(safe-area-inset-left,0px));
}

/* ===== 頂部 ===== */

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:14px;
min-height:62px;
margin:0 0 22px;
}

.brand{
font-size:25px;
font-weight:900;
line-height:1.15;
letter-spacing:-.5px;
min-width:0;
}

.brand small{
display:block;
color:#7c8795;
font-size:12px;
font-weight:600;
letter-spacing:0;
margin-top:6px;
}

.icon{
flex:0 0 auto;
border:1px solid #e0e4e9;
background:#fff;
border-radius:14px;
padding:11px 13px;
font-size:17px;
min-width:48px;
min-height:48px;
box-shadow:0 2px 8px rgba(20,30,40,.03);
}

/* ===== 搜尋 ===== */

.search{
display:flex;
gap:9px;
width:100%;
}

.search input{
flex:1;
min-width:0;
height:54px;
border:1px solid #dfe4e9;
background:#fff;
border-radius:15px;
padding:0 16px;
font-size:16px;
outline:none;
color:#17202a;
box-shadow:0 2px 8px rgba(20,30,40,.02);
}

.search input::placeholder{
color:#a5abb2;
}

.search input:focus{
border-color:#1769e0;
box-shadow:0 0 0 3px rgba(23,105,224,.08);
}

.primary{
flex:0 0 auto;
height:54px;
min-width:78px;
border:0;
background:#1769e0;
color:#fff;
border-radius:15px;
padding:0 18px;
font-weight:800;
font-size:15px;
}

/* ===== 分頁 ===== */

.tabs{
display:flex;
gap:8px;
margin:16px 0 20px;
overflow-x:auto;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
padding-bottom:2px;
}

.tabs::-webkit-scrollbar{
display:none;
}

.tab{
flex:0 0 auto;
white-space:nowrap;
border:1px solid #dfe4e9;
background:#fff;
border-radius:999px;
padding:10px 14px;
font-size:14px;
font-weight:750;
color:#687382;
}

.tab.on{
background:#17202a;
color:#fff;
border-color:#17202a;
}

/* ===== 通用 ===== */

.section-title{
font-size:18px;
font-weight:900;
margin:24px 2px 10px;
}

.muted{
color:#7d8793;
}

.empty,
.card{
background:#fff;
border:1px solid #e4e8ec;
border-radius:18px;
box-shadow:0 4px 18px rgba(24,34,45,.04);
}

.empty{
padding:20px 17px;
color:#7d8793;
font-size:14px;
line-height:1.6;
}

/* ===== 股票卡 ===== */

.stock-card{
padding:17px;
margin-bottom:11px;
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

.stock-card:active{
transform:scale(.995);
}

.row{
display:flex;
justify-content:space-between;
gap:12px;
align-items:flex-start;
}

.symbol{
font-size:18px;
font-weight:900;
line-height:1.25;
}

.name{
font-size:13px;
color:#7d8793;
margin-left:3px;
font-weight:700;
}

.price{
text-align:right;
font-size:21px;
font-weight:900;
line-height:1.2;
white-space:nowrap;
}

.change{
font-size:13px;
font-weight:800;
margin-top:5px;
text-align:right;
}

.up{
color:#d73a49;
}

.down{
color:#159447;
}

.status{
display:inline-flex;
align-items:center;
gap:5px;
border-radius:999px;
padding:7px 10px;
font-size:12px;
font-weight:800;
margin-top:12px;
}

.green{
background:#e9f8ef;
color:#148244;
}

.yellow{
background:#fff5d8;
color:#a06a00;
}

.gray{
background:#f0f2f4;
color:#6f7882;
}

.score{
font-size:12px;
color:#65717d;
margin-top:11px;
}

/* ===== 個股分析 ===== */

.hero{
padding:19px;
}

.hero-price{
font-size:34px;
font-weight:950;
letter-spacing:-1px;
margin-top:9px;
}

.live{
font-size:11px;
color:#697581;
margin-top:7px;
}

.pulse{
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
background:#19a15f;
margin-right:5px;
}

.strategy{
padding:18px;
margin-top:12px;
}

.strategy-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
}

.strategy-title{
font-size:20px;
font-weight:950;
}

.bigscore{
font-size:25px;
font-weight:950;
white-space:nowrap;
}

/* ===== TP SL ===== */

.levels{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-top:15px;
}

.level{
padding:13px;
border-radius:14px;
background:#f7f8fa;
border:1px solid #e7eaee;
min-width:0;
}

.level.full{
grid-column:1/-1;
}

.level span{
display:block;
font-size:11px;
color:#7c8793;
line-height:1.35;
}

.level strong{
display:block;
font-size:18px;
margin-top:4px;
line-height:1.25;
}

.entry{
background:#edf5ff;
border-color:#cfe1fa;
}

.sl{
background:#fff0f0;
border-color:#f4d0d0;
}

.tp{
background:#eef9f1;
border-color:#d0ebd8;
}

/* ===== 條件 ===== */

.conditions{
margin-top:16px;
border-top:1px solid #edf0f2;
padding-top:8px;
}

.cond{
padding:11px 0;
border-bottom:1px solid #f0f2f4;
font-size:13px;
font-weight:650;
line-height:1.4;
}

.ok{
color:#16864a;
}

.no{
color:#c44848;
}

.cond small{
display:block;
color:#7c8793;
margin:4px 0 0 19px;
line-height:1.5;
font-weight:500;
}

/* ===== 自選 ===== */

.fav{
width:100%;
border:1px solid #dfe4e9;
background:#fff;
border-radius:13px;
padding:12px;
font-weight:800;
margin-top:15px;
color:#17202a;
}

.back{
margin-bottom:14px;
}

.hidden{
display:none!important;
}

.note{
font-size:11px;
line-height:1.65;
color:#7c8793;
margin-top:20px;
padding:0 3px;
}

.loader{
padding:30px 20px;
text-align:center;
color:#687382;
}

/* ===== iPhone / 手機 ===== */

@media(max-width:480px){

.app{
padding-top:calc(env(safe-area-inset-top,0px) + 20px);
padding-right:max(15px,env(safe-area-inset-right,0px));
padding-left:max(15px,env(safe-area-inset-left,0px));
padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));
}

.top{
min-height:64px;
margin-bottom:20px;
}

.brand{
font-size:24px;
}

.brand small{
font-size:12px;
margin-top:5px;
}

.icon{
min-width:46px;
min-height:46px;
padding:10px 12px;
}

.search{
gap:8px;
}

.search input{
height:53px;
padding:0 15px;
font-size:16px;
}

.primary{
height:53px;
min-width:75px;
padding:0 15px;
}

.tabs{
margin-top:15px;
margin-bottom:19px;
}

.tab{
padding:9px 13px;
font-size:13px;
}

.stock-card{
padding:16px;
border-radius:17px;
}

.symbol{
font-size:17px;
}

.name{
font-size:12px;
}

.price{
font-size:20px;
}

.hero{
padding:17px;
}

.hero-price{
font-size:31px;
}

.strategy{
padding:17px;
}

.levels{
grid-template-columns:1fr 1fr;
}

.level{
padding:12px;
}

.level strong{
font-size:17px;
}

}

/* ===== 小螢幕 ===== */

@media(max-width:360px){

.brand{
font-size:22px;
}

.search input{
font-size:15px;
}

.primary{
min-width:70px;
padding:0 12px;
}

.price{
font-size:18px;
}

.symbol{
font-size:16px;
}

}

/* ===== PWA 全螢幕模式額外安全距離 ===== */

@media(display-mode:standalone){

.app{
padding-top:calc(env(safe-area-inset-top,0px) + 18px);
}

}

</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="brand">
波段分析
<small>台股即時策略</small>
</div>

<button
id="notify"
class="icon"
aria-label="開啟通知"
>
🔔
</button>

</header>

<main id="home">

<div class="search">

<input
id="q"
inputmode="numeric"
autocomplete="off"
placeholder="輸入台股代號，例如 2330"
>

<button
id="go"
class="primary"
>
分析
</button>

</div>

<div class="tabs">

<button
class="tab on"
data-tab="signal"
>
策略成立
</button>

<button
class="tab"
data-tab="near"
>
接近形成
</button>

<button
class="tab"
data-tab="watch"
>
我的自選
</button>

</div>

<div id="homeList"></div>

<div class="note">
首頁會掃描常用台股與你的自選股。正式策略需至少符合 7/8 條件；6/8 僅列為接近形成。首頁雷達每 60 秒更新。
</div>

</main>

<main
id="detail"
class="hidden"
>

<button
id="back"
class="icon back"
>
← 返回
</button>

<div id="detailBody"></div>

</main>

</div>

<script>

const WATCH_KEY='swing_tw_watch_v1';

const DEFAULT=[
'2330',
'2317',
'2454',
'2308',
'2382',
'3231',
'2881',
'2882',
'2891',
'2886',
'2603',
'2615'
];

let tab='signal';
let cache={};
let current='';
let detailTimer=null;
let radarTimer=null;

const $=id=>document.getElementById(id);

const fmt=(n,d=2)=>
Number.isFinite(+n)
?(+n).toLocaleString(
'zh-TW',
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
:'--';

const esc=s=>
String(s??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');

const watch=()=>{
try{
return JSON.parse(
localStorage.getItem(WATCH_KEY)||'[]'
)
}catch{
return[]
}
};

const saveWatch=a=>
localStorage.setItem(
WATCH_KEY,
JSON.stringify(
[...new Set(a)]
)
);

async function getStock(symbol){

const r=
await fetch(
'/api/stock?symbol='+
encodeURIComponent(symbol)+
'&t='+
Date.now(),
{
cache:'no-store'
}
);

const d=
await r.json();

if(!r.ok||!d.ok){
throw Error(
d.error||
'資料取得失敗'
)
}

return d
}

function avg(a){
return a.length
?a.reduce((x,y)=>x+y,0)/a.length
:0
}

function sma(a,n){
return avg(
a.slice(-n)
)
}

function ema(a,n){

if(!a.length)return 0;

let e=a[0];
let k=2/(n+1);

for(let i=1;i<a.length;i++){
e=
a[i]*k+
e*(1-k)
}

return e
}

function rsi(a,n=14){

if(a.length<=n){
return 50
}

let g=0;
let l=0;

for(
let i=a.length-n;
i<a.length;
i++
){

let d=
a[i]-a[i-1];

d>0
?g+=d
:l-=d

}

return l===0
?100
:100-
100/
(
1+
(g/n)/(l/n)
)
}

function atr(rows,n=14){

let a=[];

for(
let i=Math.max(
1,
rows.length-n
);
i<rows.length;
i++
){

let x=rows[i];
let p=rows[i-1].close;

a.push(
Math.max(
x.high-x.low,
Math.abs(x.high-p),
Math.abs(x.low-p)
)
)

}

return avg(a)
}

function analyzeData(d){

let rows=
d.rows
.map(x=>({
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0
}))
.filter(x=>x.close>0);

let c=
rows.map(x=>x.close);

let p=+d.price;

let m20=
sma(c,20);

let m60=
sma(c,60);

let A=
Math.max(
atr(rows),
p*.006
);

let R=
rsi(c);

let macd=
ema(
c.slice(-100),
12
)-
ema(
c.slice(-100),
26
);

let r20=
rows.slice(-20);

let r60=
rows.slice(-60);

let support=
Math.min(
...r20.map(
x=>x.low
)
);

let res=
Math.max(
...r20.map(
x=>x.high
)
);

let high60=
Math.max(
...r60.map(
x=>x.high
)
);

let vol=
rows.at(-1).volume;

let volAvg=
avg(
rows
.slice(-21,-1)
.map(
x=>x.volume
)
);

let vr=
volAvg
?vol/volAvg
:0;

let cond=[

[
'MA20 高於 MA60',
m20>m60,
'中期趨勢維持多頭排列'
],

[
'現價守在 MA60 上方',
p>=m60*.985,
'避免在中期結構已轉弱時進場'
],

[
'價格沒有過度遠離 MA20',
Math.abs(p-m20)<=A*2.2,
'避免追在短線過熱的位置'
],

[
'近期支撐仍有效',
p>=support*.99,
'價格尚未明顯跌破 20 日支撐'
],

[
'RSI 位於健康區',
R>=45&&R<=72,
'動能足夠，同時避免過熱'
],

[
'MACD 動能未明顯轉空',
macd>=-A*.05,
'短線動能沒有明顯惡化'
],

[
'成交量正常或偏強',
vr>=.8,
'量能至少接近 20 日正常水準'
],

[
'上方仍有波段空間',
Math.max(
res,
high60
)>p*1.025,
'上方目標空間足以規劃波段'
]

];

let passed=
cond.filter(
x=>x[1]
).length;

let score=
Math.round(
passed/8*100
);

let qualified=
passed>=7;

let near=
passed===6;

let entryHigh=
Math.min(
p,
Math.max(
m20,
support+A*.35
)
);

let entryLow=
Math.min(
entryHigh,
Math.max(
support,
m20-A*.55
)
);

if(entryLow>p){
entryLow=p
}

if(entryHigh>p){
entryHigh=p
}

let center=
(entryLow+entryHigh)/2;

let structural=
Math.min(
support-A*.35,
m20-A*.85
);

let maxRisk=
center*.055;

let minRisk=
Math.max(
A*.7,
center*.018
);

let sl=
Math.max(
structural,
center-maxRisk
);

if(
center-sl<
minRisk
){
sl=
center-minRisk
}

if(sl>=entryLow){

sl=
entryLow-
Math.max(
A*.55,
entryLow*.012
)

}

let risk=
Math.max(
center-sl,
A*.55
);

let pressure=
Math.max(
res,
high60
);

let tp1=
Math.max(
center+risk*1.35,
Math.min(
pressure,
center+risk*1.8
)
);

let tp2=
Math.max(
tp1+A*.45,
center+risk*2.15
);

let tp3=
Math.max(
tp2+A*.65,
center+risk*3.0
);

return{
...d,
ma20:m20,
ma60:m60,
rsi:R,
macd,
atr:A,
support,
resistance:res,
high60,
volumeRatio:vr,
conditions:cond,
passed,
score,
qualified,
near,
entryLow,
entryHigh,
sl,
tp1,
tp2,
tp3
}

}

function status(a){

return a.qualified
?[
'🟢 策略成立',
'green'
]
:a.near
?[
'🟡 接近形成',
'yellow'
]
:[
'⚪ 等待',
'gray'
]

}

function stockCard(a){

let s=
status(a);

let chg=
+a.changePercent;

return`
<div
class="card stock-card"
data-symbol="${a.symbol}"
>

<div class="row">

<div>

<div class="symbol">

${esc(a.symbol)}

<span class="name">
${esc(a.name||'')}
</span>

</div>

<div class="status ${s[1]}">
${s[0]}
</div>

</div>

<div>

<div class="price">
$${fmt(a.price)}
</div>

<div class="change ${chg>=0?'up':'down'}">

${chg>=0?'+':''}${fmt(chg)}%

</div>

</div>

</div>

<div class="score">
波段條件 ${a.passed}/8 ・ ${a.score} 分
</div>

</div>
`

}

function renderHome(){

let arr=
Object.values(cache);

let list=
tab==='signal'
?arr.filter(
x=>x.qualified
)
:tab==='near'
?arr.filter(
x=>x.near
)
:watch()
.map(
s=>cache[s]
)
.filter(Boolean);

list.sort(
(a,b)=>
b.score-a.score
);

$('homeList').innerHTML=
list.length
?list.map(
stockCard
).join('')
:`<div class="empty">${
tab==='signal'
?'目前沒有掃描到正式成立的波段策略。'
:tab==='near'
?'目前沒有接近形成的股票。'
:'尚未加入自選股票。'
}</div>`;

document
.querySelectorAll(
'[data-symbol]'
)
.forEach(
x=>
x.onclick=
()=>openDetail(
x.dataset.symbol
)
)

}

async function radar(){

let syms=[
...new Set([
...DEFAULT,
...watch()
])
];

await Promise.allSettled(
syms.map(
async s=>{

try{

cache[s]=
analyzeData(
await getStock(s)
)

}catch{}

}
)
);

renderHome();

notifySignals()

}

function notifySignals(){

if(
!('Notification'in window)||
Notification.permission!=='granted'
){
return
}

let old=
JSON.parse(
localStorage.getItem(
'swing_tw_signal_state'
)||'{}'
);

for(
let a of Object.values(cache)
){

if(
a.qualified&&
!old[a.symbol]
){

new Notification(
'🟢 '+
a.symbol+
' 波段策略成立',
{
body:
(a.name||'')+
' 現價 '+
fmt(a.price)+
'，符合 '+
a.passed+
'/8 條件'
}
);

old[a.symbol]=
Date.now()

}

}

localStorage.setItem(
'swing_tw_signal_state',
JSON.stringify(old)
)

}

function detailHTML(a){

let s=
status(a);

let fav=
watch().includes(
a.symbol
);

let chg=
+a.changePercent;

let target=
a.qualified
?`

<div class="levels">

<div class="level entry full">

<span>
👀 觀察進場區
</span>

<strong>
${fmt(a.entryLow)}
～
${fmt(a.entryHigh)}
</strong>

</div>

<div class="level sl full">

<span>
🛑 SL｜結構失效停損
</span>

<strong>
${fmt(a.sl)}
</strong>

</div>

<div class="level tp">

<span>
💰 TP1
</span>

<strong>
${fmt(a.tp1)}
</strong>

</div>

<div class="level tp">

<span>
💰 TP2
</span>

<strong>
${fmt(a.tp2)}
</strong>

</div>

<div class="level tp full">

<span>
🔥 TP3
</span>

<strong>
${fmt(a.tp3)}
</strong>

</div>

</div>

`

async function openDetail(symbol){

current=symbol;

$('home')
.classList.add(
'hidden'
);

$('detail')
.classList.remove(
'hidden'
);

$('detailBody').innerHTML=
'<div class="card loader">正在分析 '+
esc(symbol)+
'…</div>';

await refreshDetail();

clearInterval(
detailTimer
);

detailTimer=
setInterval(
refreshDetail,
20000
);

window.scrollTo(
0,
0
)

}

async function refreshDetail(){

if(!current)return;

let s=current;

try{

let a=
analyzeData(
await getStock(s)
);

if(current!==s){
return
}

cache[s]=a;

$('detailBody').innerHTML=
detailHTML(a);

bindFavorite(a,s)

}catch(e){

$('detailBody').innerHTML=
'<div class="empty">'+
esc(e.message)+
'</div>'

}

}

function bindFavorite(a,s){

const btn=
$('fav');

if(!btn)return;

btn.onclick=()=>{

let w=
watch();

w=
w.includes(s)
?w.filter(
x=>x!==s
)
:[
s,
...w
];

saveWatch(w);

$('detailBody').innerHTML=
detailHTML(a);

bindFavorite(a,s)

}

}

$('back').onclick=()=>{

current='';

clearInterval(
detailTimer
);

$('detail')
.classList.add(
'hidden'
);

$('home')
.classList.remove(
'hidden'
);

renderHome()

};

$('go').onclick=()=>{

let s=
$('q')
.value
.trim();

if(
/^\d{4,6}$/.test(s)
){

openDetail(s)

}else{

alert(
'請輸入正確的台股代號'
)

}

};

$('q').onkeydown=e=>{

if(e.key==='Enter'){
$('go').click()
}

};

document
.querySelectorAll(
'.tab'
)
.forEach(
b=>
b.onclick=()=>{

document
.querySelectorAll(
'.tab'
)
.forEach(
x=>
x.classList.remove(
'on'
)
);

b.classList.add(
'on'
);

tab=
b.dataset.tab;

renderHome()

}
);

$('notify').onclick=
async()=>{

if(
!('Notification'in window)
){

return alert(
'目前瀏覽器不支援通知'
)

}

let p=
await Notification.requestPermission();

alert(
p==='granted'
?'通知已開啟'
:'尚未允許通知'
)

};

radar();

radarTimer=
setInterval(
radar,
60000
);

</script>
