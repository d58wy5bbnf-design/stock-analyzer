<body>

<div class="wrap">

<h1>📈 波段技術分析器</h1>

<div class="sub">
自動分析趨勢、入場觀察區、支撐壓力、三段止盈與風險失效區。
</div>

<div class="search">

<input
id="symbol"
placeholder="2330 / NVDA / AAPL"
autocomplete="off">

<button id="go">
開始分析
</button>

</div>

<div class="hint">
台股直接輸入 2330；美股輸入 NVDA、AAPL。
</div>

<div id="status" class="status"></div>

<section id="hero" class="hero">

<div id="title" class="ticker"></div>

<div id="price" class="price"></div>

<div id="metrics" class="metrics"></div>

</section>

<div id="report" class="report"></div>

</div>

<script>

const $=id=>document.getElementById(id);

const fmt=n=>
Number(n).toLocaleString(undefined,{
maximumFractionDigits:2
});

function sma(a,n){

let s=a.slice(-Math.min(n,a.length));

return s.reduce((x,y)=>x+y,0)/s.length;

}

function ema(a,n){

if(!a.length)return 0;

let k=2/(n+1);
let v=a[0];

for(let i=1;i<a.length;i++)
v=a[i]*k+v*(1-k);

return v;

}

function rsi(a,n=14){

if(a.length<n+1)return 50;

let gain=0;
let loss=0;

for(let i=a.length-n;i<a.length;i++){

let d=a[i]-a[i-1];

if(d>0)gain+=d;
else loss-=d;

}

if(loss===0)return 100;

let rs=(gain/n)/(loss/n);

return 100-(100/(1+rs));

}

function avg(a){

return a.reduce((x,y)=>x+y,0)/a.length;

}

function clamp(x,min,max){

return Math.max(min,Math.min(max,x));

}

function pct(level,price){

return (level/price-1)*100;

}

function distance(level,price){

let p=pct(level,price);

if(p>0)
return `距現價 +${p.toFixed(1)}%`;

if(p<0)
return `距現價 ${p.toFixed(1)}%`;

return '接近現價';

}

/* ATR */

function atr(rows,n=14){

let recent=rows.slice(-(n+1));

let tr=[];

for(let i=1;i<recent.length;i++){

let h=recent[i].high;
let l=recent[i].low;
let pc=recent[i-1].close;

tr.push(
Math.max(
h-l,
Math.abs(h-pc),
Math.abs(l-pc)
)
);

}

return avg(tr);

}


/* 找出接近某價格的高點 */

function nearestAbove(values,price){

let v=values
.filter(x=>x>price)
.sort((a,b)=>a-b);

return v[0]||null;

}


async function run(){

let symbol=$('symbol').value.trim();

if(!symbol)return;

$('status').style.display='block';

$('status').textContent=
'正在計算波段結構、入場區、三段止盈與風險區…';

$('hero').style.display='none';
$('report').style.display='none';

try{

let response=await fetch(
'/api/stock?symbol='+
encodeURIComponent(symbol)
);

let d=await response.json();

if(!response.ok)
throw Error(d.error||'分析失敗');

let rows=d.rows;

if(!rows||rows.length<30)
throw Error('歷史行情資料不足');

let closes=rows.map(x=>x.close);

let price=closes.at(-1);

let ma20=sma(closes,20);

let ma60=sma(
closes,
Math.min(60,closes.length)
);

let rv=rsi(closes);

let macd=
ema(closes.slice(-80),12)
-
ema(closes.slice(-80),26);

let ATR=atr(rows,14);

let ATRpct=ATR/price*100;


/* ==========================
近期結構
========================== */

let r10=rows.slice(-10);
let r20=rows.slice(-20);
let r60=rows.slice(-Math.min(60,rows.length));

let low10=Math.min(...r10.map(x=>x.low));
let low20=Math.min(...r20.map(x=>x.low));
let low60=Math.min(...r60.map(x=>x.low));

let high10=Math.max(...r10.map(x=>x.high));
let high20=Math.max(...r20.map(x=>x.high));
let high60=Math.max(...r60.map(x=>x.high));


/* ==========================
支撐
========================== */

let supports=[
ma20,
ma60,
low10,
low20,
low60
]
.filter(x=>
Number.isFinite(x)&&
x<=price*1.02
)
.sort((a,b)=>b-a);

let support1=supports[0]||low20;

let support2=
supports.find(
x=>x<support1-ATR*.5
)
||low60;

if(support2>support1){

let t=support1;
support1=support2;
support2=t;

}


/* ==========================
入場區
========================== */

let entryCenter=support1;

let entryWidth=
clamp(
ATR*.35,
price*.004,
price*.018
);

let entryLow=
entryCenter-entryWidth;

let entryHigh=
entryCenter+entryWidth;

if(entryLow<=support2)
entryLow=support2+ATR*.15;


/* ==========================
策略基準進場價

用區間中心計算 R，
不是假設使用者真的在此成交
========================== */

let strategyEntry=
(entryLow+entryHigh)/2;


/* ==========================
止損 / 結構失效

第二支撐下方留 ATR 緩衝
========================== */

let stop=
Math.min(
support2-ATR*.35,
strategyEntry-ATR*1.15
);

if(stop<=0)
stop=strategyEntry-ATR*1.5;

let risk=
strategyEntry-stop;


/* ==========================
歷史壓力
========================== */

let resistanceCandidates=[
high10,
high20,
high60
]
.filter(x=>x>strategyEntry)
.sort((a,b)=>a-b);

let resistance1=
resistanceCandidates[0]
||strategyEntry+risk*1.5;

let resistance2=
resistanceCandidates.find(
x=>x>resistance1+ATR*.5
)
||strategyEntry+risk*2.5;


/* ==========================
三段止盈

先用 R 倍數建立目標，
再參考歷史壓力
========================== */

let rawTP1=
strategyEntry+risk*1.25;

let rawTP2=
strategyEntry+risk*2;

let rawTP3=
strategyEntry+risk*3;


/*
TP1 不應離第一壓力太遠
*/

let tp1=Math.min(
rawTP1,
resistance1
);

if(tp1<=strategyEntry)
tp1=rawTP1;


/*
TP2 至少高於 TP1
*/

let tp2=Math.max(
rawTP2,
tp1+ATR*.65
);

if(
resistance2>tp1 &&
resistance2<tp2
)
tp2=resistance2;


/*
TP3 為趨勢延伸目標
*/

let tp3=Math.max(
rawTP3,
tp2+ATR
);


/* ==========================
實際 R 倍數
========================== */

let rr1=
(tp1-strategyEntry)/risk;

let rr2=
(tp2-strategyEntry)/risk;

let rr3=
(tp3-strategyEntry)/risk;


/* ==========================
目前價格位置
========================== */

let positionText='';

if(price>entryHigh){

positionText=
`目前價格仍在波段觀察區上方，若採回踩型策略，主要等待區為 ${fmt(entryLow)}～${fmt(entryHigh)}。`;

}else if(
price>=entryLow &&
price<=entryHigh
){

positionText=
`目前價格已進入波段觀察區。這代表價格到達預先定義的技術區域，但仍需觀察是否出現止跌或重新轉強。`;

}else if(
price>stop
){

positionText=
`目前價格已跌破原入場觀察區，但尚未跌破策略失效位置。此階段屬於較弱的結構。`;

}else{

positionText=
`目前價格已低於這套策略計算出的結構失效位置，因此原本的波段多方假設需要重新分析。`;

}


/* ==========================
趨勢
========================== */

let trend='';
let trendClass='amber';

if(
price>ma20 &&
ma20>ma60 &&
macd>0
){

trend='偏多趨勢';
trendClass='green';

}else if(
price<ma20 &&
ma20<ma60
){

trend='偏弱趨勢';
trendClass='red';

}else{

trend='整理／轉折';
}


/* ==========================
HERO
========================== */

$('title').textContent=
`${d.name} · ${d.symbol}`;

$('price').textContent=
`${fmt(price)} ${d.currency}`;

$('metrics').innerHTML=`

<span class="pill">
MA20 ${fmt(ma20)}
</span>

<span class="pill">
MA60 ${fmt(ma60)}
</span>

<span class="pill">
RSI ${rv.toFixed(1)}
</span>

<span class="pill">
MACD ${macd.toFixed(2)}
</span>

<span class="pill">
ATR ${fmt(ATR)}
</span>

`;

$('hero').style.display='block';


/* ==========================
報告
========================== */

$('report').innerHTML=`

<div class="sectionTitle">
📋 波段策略總覽
</div>

<div class="card summary">

<div class="row">
<div class="left">目前趨勢</div>
<div class="right ${trendClass}">
${trend}
</div>
</div>

<div class="row">
<div class="left">目前價格</div>
<div class="right">
${fmt(price)}
</div>
</div>

<div class="row">
<div class="left">入場觀察區</div>
<div class="right green">
${fmt(entryLow)} ～ ${fmt(entryHigh)}
</div>
</div>

<div class="row">
<div class="left">策略計算基準價</div>
<div class="right">
${fmt(strategyEntry)}
</div>
</div>

<div class="row">
<div class="left">第一止盈</div>
<div class="right green">
${fmt(tp1)}
</div>
</div>

<div class="row">
<div class="left">第二止盈</div>
<div class="right green">
${fmt(tp2)}
</div>
</div>

<div class="row">
<div class="left">第三止盈</div>
<div class="right amber">
${fmt(tp3)}
</div>
</div>

<div class="row">
<div class="left">結構失效／停損參考</div>
<div class="right red">
${fmt(stop)}
</div>
</div>

</div>


<div class="sectionTitle">
🎯 波段入場觀察區
</div>

<div class="card entry">

<div class="label">
主要回踩觀察區
</div>

<div class="big green">
${fmt(entryLow)}
～
${fmt(entryHigh)}
</div>

<div class="small">
中心價 ${fmt(strategyEntry)}
</div>

<div class="reason">
${positionText}
</div>

<div class="divider"></div>

<div class="reason">

<strong>這個區間怎麼來的？</strong><br><br>

系統先尋找 MA20、MA60、
近期 10／20／60 日低點等技術結構，
再使用 ATR 波動程度建立區間。

因此不是單純用「現價跌 3% 就買」
這種固定百分比算法。

</div>

<div class="action">

<strong>進入區間後觀察 4 件事：</strong><br>

① 是否停止持續創低<br>
② 跌破支撐後能否快速收回<br>
③ 是否重新站回短線價格結構<br>
④ RSI／MACD 是否開始改善

</div>

</div>


<div class="sectionTitle">
💰 三段止盈策略
</div>


<div class="card tp1">

<div class="target">

<div>

<div class="label">
第一止盈 TP1
</div>

<div class="big green">
${fmt(tp1)}
</div>

</div>

<div class="targetNumber">
①
</div>

</div>

<div class="small">
由策略基準價計算：
${pct(tp1,strategyEntry)>=0?'+':''}
${pct(tp1,strategyEntry).toFixed(1)}%
</div>

<div class="rr">
報酬風險比約 ${rr1.toFixed(2)}R
</div>

<div class="reason">

第一段主要用來處理短線反彈後遇到的第一個壓力。

若採用分批出場規則，可將 TP1 視為
<strong>第一次降低部位風險的觀察點</strong>，
而不是預測價格一定會在這裡反轉。

</div>

<div class="action">

<strong>範例管理規則：</strong><br>

價格到 TP1 後，可將剩餘部位的風險管理
由原始失效線逐步提高至接近成本區，
避免已經出現一段有利移動後又承受完整原始風險。

</div>

</div>


<div class="card tp2">

<div class="target">

<div>

<div class="label">
第二止盈 TP2
</div>

<div class="big green">
${fmt(tp2)}
</div>

</div>

<div class="targetNumber">
②
</div>

</div>

<div class="small">

由策略基準價計算：
+${pct(tp2,strategyEntry).toFixed(1)}%

</div>

<div class="rr">
報酬風險比約 ${rr2.toFixed(2)}R
</div>

<div class="reason">

第二止盈屬於波段主要獲利區。

價格如果可以突破 TP1 並持續站穩，
代表行情有機會進一步向較大的波段壓力移動。

</div>

<div class="action">

<strong>範例管理規則：</strong><br>

到達 TP2 後，
可以進一步降低剩餘曝險；
剩餘部位則可觀察 MA20、
前一個波段低點或其他移動式結構。

</div>

</div>


<div class="card tp3">

<div class="target">

<div>

<div class="label">
第三止盈 TP3
</div>

<div class="big amber">
${fmt(tp3)}
</div>

</div>

<div class="targetNumber">
③
</div>

</div>

<div class="small">

由策略基準價計算：
+${pct(tp3,strategyEntry).toFixed(1)}%

</div>

<div class="rr">
報酬風險比約 ${rr3.toFixed(2)}R
</div>

<div class="reason">

第三止盈屬於趨勢延伸目標。

只有當價格突破前方壓力、
趨勢持續延伸時，
這個位置才會變得更有參考價值。

</div>

<div class="action">

<strong>範例管理規則：</strong><br>

若行情持續形成更高的高點與更高的低點，
剩餘部位可以使用移動式結構管理；
若趨勢結構遭破壞，就不必執著一定要等 TP3。

</div>

</div>


<div class="sectionTitle">
🛑 止損區／認賠離場
</div>

<div class="card stop">

<div class="label">
本次波段結構失效參考
</div>

<div class="big red">
${fmt(stop)}
</div>

<div class="small">
${distance(stop,price)}
</div>

<div class="reason">

這個位置不是隨便設定固定 -5%。

系統以
<strong>第二支撐 + ATR 波動緩衝</strong>
計算結構失效區。

也就是說：

如果價格只是盤中碰到支撐附近，
仍可能屬於正常波動。

但如果價格明顯跌破主要支撐結構，
原本「支撐後反彈」的策略前提就開始失效。

</div>

<div class="warning">

<strong>🔴 認賠規則範例</strong><br><br>

若你的交易原本就是依這套波段多方結構建立，
當價格有效跌破
<strong>${fmt(stop)}</strong>
時，就不應再用原本的多方支撐理由解釋持倉。<br><br>

此時應重新評估，而不是因為帳面虧損就任意把失效線一直往下移。

</div>

</div>


<div class="sectionTitle">
🛡️ 支撐結構
</div>

<div class="card">

<div class="row">

<div class="left">
第一支撐
</div>

<div class="right green">
${fmt(support1)}
</div>

</div>

<div class="row">

<div class="left">
第二支撐
</div>

<div class="right">
${fmt(support2)}
</div>

</div>

<div class="row">

<div class="left">
ATR 波動
</div>

<div class="right">
${fmt(ATR)}
