<script>

const WATCH_KEY='swing_tw_watch_v1';
const HISTORY_KEY='swing_tw_search_history_v1';
const PUSH_DEVICE_KEY='swing_tw_push_device_v1';

const DEFAULT=[
'2330','2317','2454','2308','2382','3231',
'2881','2882','2891','2886','2603','2615'
];

const HIGH_SCORE_LIMIT=20;
const WATCH_RADAR_LIMIT=50;
const DETAIL_CACHE_MS=90000;

let tab='signal';

let cache={};
let detailCache={};

let unified={
strategyReady:[],
radar:[],
longWatch:[],
generatedAt:0,
updatedAt:'',
cache:''
};

let current='';
let currentDetail=null;

let detailTimer=null;
let radarTimer=null;
let searchTimer=null;

let selectedSearchSymbol='';

const tabScroll={
signal:0,
near:0,
watch:0
};

let homeScrollY=0;

let touchStartX=0;
let touchStartY=0;
let touchTracking=false;

const $=id=>
document.getElementById(id);

const esc=s=>
String(s??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');

const fmt=(n,d=2)=>
Number.isFinite(+n)
?
(+n).toLocaleString(
'zh-TW',
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
:
'--';

const avg=a=>
a.length
?
a.reduce((x,y)=>x+y,0)/a.length
:
0;

const sma=(a,n)=>
a.length>=n
?
avg(a.slice(-n))
:
avg(a);

function ema(a,n){

if(!a.length)return 0;

let e=a[0];
const k=2/(n+1);

for(let i=1;i<a.length;i++){

e=
a[i]*k+
e*(1-k);

}

return e;

}

function rsi(a,n=14){

if(a.length<=n)return 50;

let g=0;
let l=0;

for(let i=a.length-n;i<a.length;i++){

const d=
a[i]-
a[i-1];

if(d>0){
g+=d;
}else{
l-=d;
}

}

if(l===0)return 100;

return 100-
100/
(
1+
(g/n)/(l/n)
);

}

function atr(rows,n=14){

const v=[];

for(
let i=Math.max(1,rows.length-n);
i<rows.length;
i++
){

const x=
rows[i];

const p=
rows[i-1].close;

v.push(
Math.max(
x.high-x.low,
Math.abs(x.high-p),
Math.abs(x.low-p)
)
);

}

return avg(v);

}

function clamp(v,min,max){

return Math.min(
max,
Math.max(min,v)
);

}

/* DEVICE */

function getDeviceId(){

let id=
localStorage.getItem(
PUSH_DEVICE_KEY
);

if(!id){

id=
window.crypto&&crypto.randomUUID
?
crypto.randomUUID()
:
'device-'+Date.now()+'-'+Math.random().toString(36).slice(2);

localStorage.setItem(
PUSH_DEVICE_KEY,
id
);

}

return id;

}

/* WATCH */

function watch(){

try{

const x=
JSON.parse(
localStorage.getItem(
WATCH_KEY
)||'[]'
);

return Array.isArray(x)
?
[
...new Set(
x
.map(String)
.filter(
v=>
/^\d{4,6}$/.test(v)
)
)
]
:
[];

}catch{

return [];

}

}

function saveWatchLocal(a){

const clean=[
...new Set(
(a||[])
.map(String)
.filter(
v=>
/^\d{4,6}$/.test(v)
)
)
];

localStorage.setItem(
WATCH_KEY,
JSON.stringify(clean)
);

return clean;

}

async function getCloudWatch(){

const r=
await fetch(
'/api/watchlist?deviceId='+
encodeURIComponent(
getDeviceId()
)+
'&t='+
Date.now(),
{
cache:'no-store'
}
);

const d=
await r.json();

if(!r.ok||!d.ok){

throw Error(
d.error||
'讀取雲端自選失敗'
);

}

return Array.isArray(d.symbols)
?
d.symbols
.map(String)
.filter(
v=>
/^\d{4,6}$/.test(v)
)
:
[];

}

async function saveCloudWatch(symbols){

const r=
await fetch(
'/api/watchlist',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
deviceId:getDeviceId(),
symbols
})
}
);

const d=
await r.json();

if(!r.ok||!d.ok){

throw Error(
d.error||
'雲端自選儲存失敗'
);

}

}

async function loadWatchlist(){

const local=
watch();

try{

const cloud=
await getCloudWatch();

const merged=[
...new Set([
...local,
...cloud
])
];

if(merged.length){

saveWatchLocal(
merged
);

const cs=
new Set(
cloud
);

if(
merged.some(
s=>
!cs.has(s)
)
){

try{

await saveCloudWatch(
merged
);

}catch(e){

console.warn(e);

}

}

}

return watch();

}catch(e){

console.warn(e);

return local;

}

}

/* PIVOTS */

function pivots(
rows,
left=3,
right=3
){

const lows=[];
const highs=[];

for(
let i=left;
i<rows.length-right;
i++
){

let lo=true;
let hi=true;

for(
let j=1;
j<=left;
j++
){

if(
rows[i].low>
rows[i-j].low
)lo=false;

if(
rows[i].high<
rows[i-j].high
)hi=false;

}

for(
let j=1;
j<=right;
j++
){

if(
rows[i].low>
rows[i+j].low
)lo=false;

if(
rows[i].high<
rows[i+j].high
)hi=false;

}

if(lo){

lows.push({
i,
value:rows[i].low
});

}

if(hi){

highs.push({
i,
value:rows[i].high
});

}

}

return{
lows,
highs
};

}

/* LEVEL CLUSTER */

function clusterLevels(
items,
distance
){

const sorted=
items
.filter(
x=>
Number.isFinite(+x.value)&&
+x.value>0
)
.sort(
(a,b)=>
a.value-b.value
);

const groups=[];

for(const item of sorted){

const last=
groups.at(-1);

if(
last&&
Math.abs(
item.value-
last.value
)<=distance
){

last.values.push(
item.value
);

last.value=
avg(
last.values
);

last.count++;

last.latest=
Math.max(
last.latest,
item.i||0
);

}else{

groups.push({
value:item.value,
values:[item.value],
count:1,
latest:item.i||0
});

}

}

return groups;

}

/* TRADE PLAN */

function buildTradePlan(
rows,
price,
A,
m20,
m60
){

const recent=
rows.slice(-240);

const P=
pivots(
recent,
3,
3
);

const mergeDistance=
Math.max(
A*.45,
price*.005
);

const supportRaw=[];

for(const x of P.lows){

if(
x.value<=price*1.012&&
x.value>=price*.82
){

supportRaw.push({
value:x.value,
i:x.i
});

}

}

if(
Number.isFinite(m20)&&
m20<=price*1.012&&
m20>=price*.82
){

supportRaw.push({
value:m20,
i:recent.length+5
});

}

if(
Number.isFinite(m60)&&
m60<=price*1.012&&
m60>=price*.82
){

supportRaw.push({
value:m60,
i:recent.length+4
});

}

for(const n of [10,20,60]){

const part=
rows.slice(-n);

if(!part.length)continue;

const low=
Math.min(
...part.map(
x=>x.low
)
);

if(
low<=price*1.012&&
low>=price*.82
){

supportRaw.push({
value:low,
i:recent.length+n
});

}

}

for(const x of P.highs){

if(
x.value>=price*.88&&
x.value<price&&
recent
.slice(x.i+1)
.some(
r=>
r.close>x.value*1.004
)
){

supportRaw.push({
value:x.value,
i:x.i
});

}

}

const supportGroups=
clusterLevels(
supportRaw,
mergeDistance
)
.filter(
x=>
x.value<=price*1.012&&
x.value>=price*.82
)
.sort(
(a,b)=>
b.value-a.value
);

const support1=
supportGroups[0]?.value||
null;

const support2=
support1
?
(
supportGroups.find(
x=>
x.value<
support1-
mergeDistance*.75
)?.value||
null
)
:
null;

const nearby=
supportGroups.filter(x=>{

const d=
(
price-
x.value
)/
price;

return d>=-.012&&
d<=.045;

});

let bestSupport=null;
let bestSupportScore=
-Infinity;

for(const x of nearby){

const d=
Math.max(
0,
(
price-
x.value
)/
price
);

const score=
Math.max(
0,
1-
d/.045
)*45
+
Math.min(
x.count,
4
)*10
+
(
recent.length
?
x.latest/
recent.length*
15
:
0
);

if(
score>
bestSupportScore
){

bestSupportScore=
score;

bestSupport=
x;

}

}

const pressureRaw=[];

for(const x of P.highs){

if(
x.value>=price*.90&&
x.value<=price*1.35
){

pressureRaw.push({
value:x.value,
i:x.i
});

}

}

for(
let end=20;
end<=recent.length;
end+=10
){

const block=
recent.slice(
Math.max(
0,
end-20
),
end
);

if(!block.length)continue;

const high=
Math.max(
...block.map(
x=>x.high
)
);

if(
high>=price*.90&&
high<=price*1.35
){

pressureRaw.push({
value:high,
i:end
});

}

}

const allPressureGroups=
clusterLevels(
pressureRaw,
mergeDistance
)
.filter(
x=>
x.value>=price*.90&&
x.value<=price*1.35
)
.sort(
(a,b)=>
a.value-b.value
);

const above=
allPressureGroups.filter(
x=>
x.value>
price+
mergeDistance*.15
);

const crossed=
allPressureGroups
.filter(
x=>
x.value<=price&&
x.value>=price*.98
)
.sort(
(a,b)=>
b.value-a.value
);

const nextResistance=
above[0]?.value||
null;

const crossedResistance=
crossed[0]?.value||
null;

let breakout=
nextResistance;

let breakoutState=
'BELOW';

if(
crossedResistance&&
(
price-
crossedResistance
)/
price<=.02
){

breakout=
crossedResistance;

breakoutState=
'BROKEN';

}

let planType=
'WAIT';

let entryLow=null;
let entryHigh=null;
let entryMid=null;
let sl=null;
let entryReady=false;

if(bestSupport){

planType=
'LIMIT';

const base=
bestSupport.value;

entryLow=
base-
Math.max(
A*.18,
price*.002
);

entryHigh=
Math.min(
base+
Math.max(
A*.30,
price*.0035
),
price*1.006
);

entryMid=
(
entryLow+
entryHigh
)/2;

const lower=[
...P.lows.map(
x=>x.value
),
...supportGroups.map(
x=>x.value
)
]
.filter(
v=>
v<
base-
mergeDistance*.20&&
v>=base*.90
)
.sort(
(a,b)=>
b-a
);

const invalidation=
lower[0]||
support2||
(
base-
A*.80
);

sl=
invalidation-
Math.max(
A*.25,
price*.003
);

if(
sl>=entryLow
){

sl=
entryLow-
Math.max(
A*.45,
price*.005
);

}

const tol=
Math.max(
A*.25,
price*.0035
);

entryReady=
price>=entryLow-tol&&
price<=entryHigh+tol;

}

let tp1=null;
let tp2=null;
let tp3=null;
let tp3Source='';

if(
Number.isFinite(entryMid)&&
breakout
){

const targets=
allPressureGroups
.map(
x=>x.value
)
.filter(
v=>
v>
breakout+
mergeDistance*.55
)
.sort(
(a,b)=>
a-b
);

const clean=[];

for(const v of targets){

const last=
clean.at(-1);

if(
!last||
v-last>
mergeDistance*.75
){

clean.push(v);

}

}

tp1=
clean[0]||
null;

tp2=
tp1
?
(
clean.find(
v=>
v>
tp1+
mergeDistance
)||
null
)
:
null;

tp3=
tp2
?
(
clean.find(
v=>
v>
tp2+
mergeDistance
)||
null
)
:
null;

if(tp3){

tp3Source=
'第三層歷史壓力';

}

if(
!tp3&&
tp1&&
tp2
){

const base=
support2||
support1||
entryMid;

tp3=
tp2+
Math.max(
tp2-base,
A*3
)*.618;

tp3Source=
'歷史壓力不足，Fib 0.618 延伸';

}

}

const risk=
Number.isFinite(entryMid)&&
Number.isFinite(sl)&&
entryMid>sl
?
entryMid-sl
:
null;

const riskPct=
risk
?
risk/
entryMid*
100
:
null;

const rr=t=>
Number.isFinite(t)&&
risk>0
?
(
t-
entryMid
)/
risk
:
null;

return{
support1,
support2,
bestSupport:bestSupport?.value||null,
bestSupportStrength:bestSupport?.count||0,
breakout,
breakoutState,
nextResistance,
crossedResistance,
planType,
entryLow,
entryHigh,
entryMid,
sl,
risk,
riskPct,
tp1,
tp2,
tp3,
tp3Source,
rr1:rr(tp1),
rr2:rr(tp2),
rr3:rr(tp3),
entryReady,
validPlan:
planType==='LIMIT'&&
Number.isFinite(entryLow)&&
Number.isFinite(entryHigh)&&
Number.isFinite(sl)&&
sl<entryLow&&
Number.isFinite(breakout)&&
Number.isFinite(tp1)&&
tp1>breakout,
pressureCount:
allPressureGroups.length,
entryDistance:
bestSupport
?
(
price-
bestSupport.value
)/
price*
100
:
null,
breakoutDistance:
breakout
?
(
breakout-
price
)/
price*
100
:
null
};

}

/* FULL ANALYSIS */

function analyzeData(
d,

){

if(
!Array.isArray(d.rows)||
d.rows.length<60
){

);

}

const rows=
d.rows
.map(x=>({
date:x.date||'',
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0
}))
.filter(
x=>
Number.isFinite(x.close)&&
x.close>0
);

if(rows.length<60){

throw Error(
'有效 K 線不足'
);

}

const closes=
rows.map(
x=>x.close
);

let price=
+d.price;

if(
!Number.isFinite(price)||
price<=0
){

price=
rows.at(-1).close;

}

const m20=
sma(
closes,
20
);

const m60=
sma(
closes,
60
);

const m120=
sma(
closes,
120
);

const A=
Math.max(
atr(rows),
price*.006
);

const R=
rsi(closes);

const macd=
ema(
closes.slice(-120),
12
)
-
ema(
closes.slice(-120),
26
);

const signal=
ema(
closes
.slice(-120)
.map(
(_,i,a)=>
ema(
a.slice(0,i+1),
12
)
-
ema(
a.slice(0,i+1),
26
)
),
9
);

const volume=
rows.at(-1).volume;

const volumeAverage=
avg(
rows
.slice(-21,-1)
.map(
x=>x.volume
)
);

const vr=
volumeAverage
?
volume/
volumeAverage
:
0;

const high20=
Math.max(
...rows
.slice(-20)
.map(
x=>x.high
)
);

let technical=0;
let volumeScore=0;
let chipScore=0;
let fundScore=null;
let newsScore=null;

const conditions=[];

function tc(
name,
ok,
points,
description
){

if(ok){

technical+=
points;

}

conditions.push([
name,
ok,
description
]);

}

tc(
'股價站上 MA20',
price>=m20,
4,
'短線趨勢維持在 20 日均線上方'
);

tc(
'MA20 高於 MA60',
m20>m60,
5,
'中期均線維持多頭排列'
);

tc(
'MA60 趨勢健康',
m60>=m120*.985,
3,
'中長期趨勢沒有明顯轉弱'
);

tc(
'RSI 位於健康區',
R>=45&&
R<=75,
3,
'動能足夠且尚未極端過熱'
);

tc(
'MACD 動能偏多',
macd>=signal,
3,
'短線動能高於訊號線'
);

tc(
'股價位於近期相對強勢區',
price>=high20*.96,
2,
'價格接近近期高點，波段結構仍有強度'
);

technical=
clamp(
technical,
0,
20
);

if(vr>=1){

volumeScore+=6;

}else if(vr>=.8){

volumeScore+=4;

}else if(vr>=.6){

volumeScore+=2;

}

const changePercent=
+d.changePercent||
0;

if(
changePercent>0&&
vr>=1
){

volumeScore+=5;

}else if(
changePercent>=0
){

volumeScore+=3;

}

let upVolumeDays=0;

const last10=
rows.slice(-10);

for(
let i=1;
i<last10.length;
i++
){

if(
last10[i].close>
last10[i-1].close&&
last10[i].volume>=
volumeAverage*.8
){

upVolumeDays++;

}

}

volumeScore+=
clamp(
upVolumeDays,
0,
5
);

if(
price>=high20*.98&&
vr>=1.1
){

volumeScore+=4;

}

volumeScore=
clamp(
volumeScore,
0,
20
);

const inst=
d.institutional||
{};

if(+inst.total5>0)chipScore+=5;
if(+inst.foreign5>0)chipScore+=4;
if(+inst.trust5>0)chipScore+=4;
if(+inst.total10>0)chipScore+=3;
if((+inst.totalBuyDays5||0)>=3)chipScore+=2;
if((+inst.foreignBuyDays5||0)>=3)chipScore+=2;

chipScore=
clamp(
chipScore,
0,
20
);

const fundamental=
d.fundamental||
{};

const revenue=
fundamental.revenue||
{};

const financial=
fundamental.financial||
{};

const fundAvailable=
!!(
revenue.available||
financial.available
);

if(fundAvailable){

fundScore=0;

if(
financial.profitable===true
){

fundScore+=6;

}else if(
financial.profitable==null
){

fundScore+=3;

}

if(
Number.isFinite(+financial.eps)&&
+financial.eps>0
){

fundScore+=4;

}

if(
Number.isFinite(+financial.epsGrowth)&&
+financial.epsGrowth>0
){

fundScore+=3;

}

if(
Number.isFinite(+revenue.yoy)
){

fundScore+=
+revenue.yoy>10
?
4
:
+revenue.yoy>0
?
3
:
0;

}

if(
Number.isFinite(+revenue.mom)&&
+revenue.mom>0
){

fundScore+=3;

}

fundScore=
clamp(
fundScore,
0,
20
);

}

if(
newsData?.available
){

newsScore=
clamp(
Math.round(
10+
Number(
newsData.overallScore||
0
)
),
0,
20
);

}

const available=[
technical,
volumeScore,
chipScore,
fundScore,
newsScore
]
.filter(
x=>
x!==null&&
Number.isFinite(+x)
);

const score=
clamp(
Math.round(
available.length
?
available.reduce(
(a,b)=>a+b,
0
)/
(
available.length*
20
)*
100
:
0
),
0,
100
);

const completeness=
available.length/
5*
100;

const plan=
buildTradePlan(
rows,
price,
A,
m20,
m60
);

return{
...d,
newsData,
price,
m20,
m60,
m120,
A,
R,
vr,
technical,
volumeScore,
chipScore,
fundScore,
newsScore,
score,
completeness,
conditions,
...plan
};

}

if(
t>=16&&
v>=16

v>=16&&
vr>=1.5
){

return `量能明顯放大約 ${fmt(vr,1)} 倍`;

}

}

return 'Radar 綜合條件進入觀察名單';

a.entryDistance!=null&&
a.entryDistance>3
){

text=

}else{

text=
`${trend}、${vol}，目前可持續追蹤；等待價格靠近 ${fmt(a.entryLow)}～${fmt(a.entryHigh)} 的最佳進場區。`;

return{
text,
tags:[
trend,
vol,
chip,
a.entryReady
?
'接近 Entry'

'等待位置'

};

}

async function analyzeStock(
symbol,
withNews=false,
force=false
){

const c=
detailCache[symbol];

if(
!force&&
withNews&&
c&&
Date.now()-c.time<
DETAIL_CACHE_MS
){

return c.data;

}

const[
s,
n
]=
await Promise.all([
getStock(symbol),
withNews
?
getNews(symbol)
:
Promise.resolve(null)
]);

const a=
analyzeData(
s,
n
);

if(withNews){

detailCache[symbol]={
time:Date.now(),
data:a
};

}

return a;

}

}
);

'touchend',
e=>{

touchTracking=
false;

const t=

const dx=
t.clientX-
touchStartX;

const dy=
Math.abs(
t.clientY-
touchStartY
);

dx>=85&&
dy<70
){

}

},
{

}
);

/* PUSH */

function pushSymbols(){

return[
...new Set([
...DEFAULT,
...watch()
])
];

}

function urlBase64ToUint8Array(s){

const p=
'='.repeat(
(
4-
s.length%4
)%4
);

const b=
(
s+p
)
.replace(
/-/g,
'+'
)
.replace(
/_/g,
'/'
);

const r=
atob(b);

const o=
new Uint8Array(
r.length
);

for(
let i=0;
i<r.length;
i++
){

o[i]=
r.charCodeAt(i);

}

return o;

}

async function savePushSubscription(
subscription
){

const r=
await fetch(
'/api/push-subscribe',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
deviceId:getDeviceId(),
subscription:
subscription.toJSON(),
symbols:
pushSymbols()
})
}
);

const d=
await r.json();

if(!r.ok||!d.ok){

throw Error(
d.error||
'Push 訂閱儲存失敗'
);

}

}

async function syncPushSymbols(){

try{

if(
!('serviceWorker' in navigator)
)return;

const reg=
await navigator
.serviceWorker
.getRegistration('/');

if(!reg)return;

const sub=
await reg
.pushManager
.getSubscription();

if(sub){

await savePushSubscription(
sub
);

}

}catch(e){

console.warn(e);

}

}

async function enablePush(){

if(
!('Notification' in window)||
!('PushManager' in window)
){

throw Error(
'此瀏覽器不支援通知'
);

}

if(
await Notification
.requestPermission()
!==
'granted'
){

throw Error(
'通知權限沒有開啟'
);

}

const reg=
await navigator
.serviceWorker
.register(
'/sw.js',
{
scope:'/',
updateViaCache:'none'
}
);

try{

await reg.update();

}catch{}

await navigator
.serviceWorker
.ready;

const cr=
await fetch(
'/api/push-config?t='+
Date.now(),
{
cache:'no-store'
}
);

const c=
await cr.json();

if(
!cr.ok||
!c.ok||
!c.publicKey
){

throw Error(
c.error||
'Push 公鑰取得失敗'
);

}

const old=
await reg
.pushManager
.getSubscription();

if(old){

try{

await old.unsubscribe();

}catch{}

}

const sub=
await reg
.pushManager
.subscribe({
userVisibleOnly:true,
applicationServerKey:
urlBase64ToUint8Array(
c.publicKey
)
});

await savePushSubscription(
sub
);

$('notify')
.classList
.add(
'push-on'
);

}

$('notify').onclick=
async()=>{

try{

await enablePush();

alert(
'通知已重新設定完成。'
);

}catch(e){

alert(
e.message||
'通知開啟失敗'
);

}

};
