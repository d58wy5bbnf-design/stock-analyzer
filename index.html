<body>

<div class="wrap">

<h1>📈 波段策略分析器</h1>

<div class="sub">
同時分析支撐回踩波段與高 R 突破回測兩套策略。
</div>

<div class="search">
<input id="symbol" placeholder="2330 / NVDA / AAPL" autocomplete="off">
<button id="go">開始分析</button>
</div>

<div class="hint">
台股直接輸入 2330；美股輸入 NVDA、AAPL。
</div>

<div id="status" class="status"></div>

<section id="hero" class="hero">
<div id="title" class="ticker"></div>
<div id="price" class="price"></div>
<div id="metrics" class="metrics"></div>
</section>

<div id="report" class="report"></div>

</div>

<script>

const $=id=>document.getElementById(id);

const fmt=n=>{
  if(!Number.isFinite(Number(n)))return "--";
  return Number(n).toLocaleString(undefined,{
    maximumFractionDigits:2
  });
};

function avg(a){
  if(!a.length)return 0;
  return a.reduce((x,y)=>x+y,0)/a.length;
}

function sma(a,n){
  return avg(a.slice(-Math.min(n,a.length)));
}

function ema(a,n){
  if(!a.length)return 0;
  let k=2/(n+1);
  let v=a[0];

  for(let i=1;i<a.length;i++){
    v=a[i]*k+v*(1-k);
  }

  return v;
}

function rsi(a,n=14){

  if(a.length<n+1)return 50;

  let g=0,l=0;

  for(let i=a.length-n;i<a.length;i++){

    let d=a[i]-a[i-1];

    if(d>0)g+=d;
    else l-=d;
  }

  if(!l)return 100;

  let rs=(g/n)/(l/n);

  return 100-100/(1+rs);
}

function atr(rows,n=14){

  let d=rows.slice(-(n+1));

  let tr=[];

  for(let i=1;i<d.length;i++){

    tr.push(
      Math.max(
        d[i].high-d[i].low,
        Math.abs(d[i].high-d[i-1].close),
        Math.abs(d[i].low-d[i-1].close)
      )
    );
  }

  return avg(tr);
}

function clamp(x,min,max){
  return Math.max(min,Math.min(max,x));
}

function pct(x,b){
  if(!b)return 0;
  return (x/b-1)*100;
}

function absPct(a,b){
  return Math.abs(pct(a,b));
}

function dist(level,price){

  let p=pct(level,price);

  if(p>0)return `距現價上方 ${Math.abs(p).toFixed(1)}%`;
  if(p<0)return `距現價下方 ${Math.abs(p).toFixed(1)}%`;

  return "接近現價";
}


/* ================================
尋找近期 swing low
================================ */

function recentSwingLow(rows){

  let data=rows.slice(-20);

  let candidates=[];

  for(let i=2;i<data.length-2;i++){

    if(
      data[i].low<=data[i-1].low &&
      data[i].low<=data[i-2].low &&
      data[i].low<=data[i+1].low &&
      data[i].low<=data[i+2].low
    ){
      candidates.push(data[i].low);
    }
  }

  if(!candidates.length){
    return Math.min(...data.map(x=>x.low));
  }

  return candidates.at(-1);
}


/* ================================
尋找近期 swing high
================================ */

function recentSwingHigh(rows){

  let data=rows.slice(-30);

  let candidates=[];

  for(let i=2;i<data.length-2;i++){

    if(
      data[i].high>=data[i-1].high &&
      data[i].high>=data[i-2].high &&
      data[i].high>=data[i+1].high &&
      data[i].high>=data[i+2].high
    ){
      candidates.push(data[i].high);
    }
  }

  if(!candidates.length){
    return Math.max(...data.map(x=>x.high));
  }

  return candidates.at(-1);
}


async function run(){

  let symbol=$("symbol").value.trim();

  if(!symbol)return;

  $("status").style.display="block";
  $("status").textContent=
  "正在分析兩套波段策略…";

  $("hero").style.display="none";
  $("report").style.display="none";

  try{

    let response=await fetch(
      "/api/stock?symbol="+encodeURIComponent(symbol)
    );

    let d=await response.json();

    if(!response.ok){
      throw Error(d.error||"分析失敗");
    }

    let rows=(d.rows||[]).filter(x=>
      Number.isFinite(x.close)&&
      Number.isFinite(x.high)&&
      Number.isFinite(x.low)
    );

    if(rows.length<30){
      throw Error("歷史行情資料不足");
    }

    let closes=rows.map(x=>x.close);

    let price=closes.at(-1);

    let ma20=sma(closes,20);
    let ma60=sma(closes,60);

    let rv=rsi(closes);

    let macd=
      ema(closes.slice(-80),12)-
      ema(closes.slice(-80),26);

    let ATR=atr(rows);

    let r10=rows.slice(-10);
    let r20=rows.slice(-20);
    let r60=rows.slice(-Math.min(60,rows.length));

    let low10=Math.min(...r10.map(x=>x.low));
    let low20=Math.min(...r20.map(x=>x.low));
    let low60=Math.min(...r60.map(x=>x.low));

    let high10=Math.max(...r10.map(x=>x.high));
    let high20=Math.max(...r20.map(x=>x.high));
    let high60=Math.max(...r60.map(x=>x.high));

    let swingLow=recentSwingLow(rows);
    let swingHigh=recentSwingHigh(rows);


    /* ===================================
       整體趨勢
    =================================== */

    let trend="整理／轉折";
    let trendClass="amber";

    if(price>ma20 && ma20>ma60 && macd>0){
      trend="偏多趨勢";
      trendClass="green";
    }

    else if(price<ma20 && ma20<ma60 && macd<0){
      trend="偏弱趨勢";
      trendClass="red";
    }


    /* ===================================
       策略一
       支撐回踩波段
    =================================== */

    let supports=[
      {name:"MA20",value:ma20},
      {name:"MA60",value:ma60},
      {name:"10日低點",value:low10},
      {name:"20日低點",value:low20},
      {name:"60日低點",value:low60},
      {name:"近期波段低點",value:swingLow}
    ]
    .filter(x=>
      Number.isFinite(x.value) &&
      x.value<=price*1.015
    )
    .sort((a,b)=>b.value-a.value);

    let support1=supports[0]?.value||low20;

    let support2=
      supports.find(
        x=>x.value<support1-Math.max(ATR*.45,price*.006)
      )?.value||low60;

    if(support2>support1){
      [support1,support2]=[support2,support1];
    }


    let reasons=[];

    if(absPct(ma20,support1)<1.5)
      reasons.push("MA20 共振");

    if(absPct(ma60,support1)<1.5)
      reasons.push("MA60 共振");

    if(absPct(low20,support1)<1.5)
      reasons.push("20日低點");

    if(absPct(swingLow,support1)<1.5)
      reasons.push("近期波段低點");

    if(!reasons.length)
      reasons.push("最近主要支撐");


    let width=clamp(
      ATR*.35,
      price*.004,
      price*.018
    );

    let entry1Low=support1-width;
    let entry1High=support1+width;

    if(entry1Low<=support2){
      entry1Low=support2+ATR*.15;
    }

    let entry1=(entry1Low+entry1High)/2;


    let stop1=Math.min(
      support2-ATR*.35,
      entry1-ATR*1.15
    );

    if(stop1>=entry1 || stop1<=0){
      stop1=entry1-ATR*1.25;
    }

    let risk1=entry1-stop1;


    let pressureCandidates=[
      high10,
      high20,
      high60,
      swingHigh
    ]
    .filter(x=>x>entry1)
    .sort((a,b)=>a-b);

    let pressure1=
      pressureCandidates[0]||
      entry1+risk1*1.5;


    let tp1=Math.min(
      entry1+risk1*1.5,
      pressure1
    );

    if(tp1<=entry1){
      tp1=entry1+risk1*1.5;
    }

    let tp2=Math.max(
      entry1+risk1*2.5,
      tp1+ATR*.7
    );

    let tp3=Math.max(
      entry1+risk1*4,
      tp2+ATR
    );


    /* ===================================
       策略一移動保護
    =================================== */

    let recentHighest=Math.max(
      ...rows.slice(-20).map(x=>x.high)
    );

    let trailing1=
      recentHighest-ATR*2;

    trailing1=Math.max(
      trailing1,
      stop1
    );


    let extension1=
      Math.max(
        tp3+ATR*1.5,
        entry1+risk1*5
      );


    /* ===================================
       策略一追價判斷
    =================================== */

    let chaseDistance=
      (price-entry1High)/ATR;

    let strategy1Status="";
    let strategy1StatusClass="statusAmber";

    if(price<stop1){

      strategy1Status=
      "目前已跌破策略一的結構失效位置，原本回踩波段假設需要重新計算。";

      strategy1StatusClass="statusRed";

    }

    else if(
      price>=entry1Low &&
      price<=entry1High
    ){

      strategy1Status=
      "目前位於策略一觀察區內。接下來重點是等待止跌與重新轉強，而不是只因碰到支撐就判定有效。";

      strategy1StatusClass="statusGreen";

    }

    else if(
      price>entry1High &&
      chaseDistance>1.5
    ){

      strategy1Status=
      `目前距離策略一觀察區已超過 ${chaseDistance.toFixed(1)} ATR，屬於追價距離偏遠，原本支撐策略的風險報酬結構已經不同。`;

      strategy1StatusClass="statusAmber";

    }

    else{

      strategy1Status=
      "目前尚未進入策略一主要回踩區，可繼續觀察價格是否靠近支撐。";

    }


    /* ===================================
       策略二
       高R突破回測
    =================================== */

    /*
      使用「前20日」而不是包含今天的20日高點，
      避免今天本身的新高被拿來當自己的突破位
    */

    let priorRows=rows.slice(0,-1);

    let prior20=priorRows.slice(-20);

    let breakoutLevel=
      Math.max(...prior20.map(x=>x.high));


    /*
      精準回測區：
      突破位附近 ± 0.2 ATR
    */

    let entry2Low=
      breakoutLevel-ATR*.20;

    let entry2High=
      breakoutLevel+ATR*.20;

    let entry2=
      (entry2Low+entry2High)/2;


    /*
      高R策略緊失效
    */

    let stop2=
      Math.min(
        entry2-ATR*.75,
        swingLow-ATR*.10
      );


    /*
      避免 stop 過遠，
      高R策略最多使用約 1 ATR 風險
    */

    let maxStopDistance=ATR*1.05;

    if(entry2-stop2>maxStopDistance){
      stop2=entry2-maxStopDistance;
    }

    if(stop2>=entry2){
      stop2=entry2-ATR*.75;
    }

    let risk2=entry2-stop2;


    /*
      2R / 3R / 5R
    */

    let htp1=entry2+risk2*2;
    let htp2=entry2+risk2*3;
    let htp3=entry2+risk2*5;


    /*
      趨勢延伸
    */

    let extension2=
      entry2+risk2*7;


    /*
      移動保護
    */

    let trailing2=
      recentHighest-ATR*1.8;

    trailing2=Math.max(
      trailing2,
      stop2
    );


    /* ===================================
       判斷是否真的突破
    =================================== */

    let latest=rows.at(-1);

    let breakoutConfirmed=
      latest.close>breakoutLevel &&
      price>ma20;


    /*
      是否已經突破太遠
    */

    let breakoutATRDistance=
      (price-breakoutLevel)/ATR;


    /*
      高R策略條件
    */

    let highRQuality=
      ma20>ma60 &&
      macd>0 &&
      rv>=50 &&
      rv<78;


    let strategy2Status="";
    let strategy2Class="statusPurple";


    if(!highRQuality){

      strategy2Status=
      "目前趨勢／動能條件尚未完全符合高 R 突破回測模式。這套策略先列為等待，不強行產生進場確認。";

      strategy2Class="statusAmber";

    }

    else if(
      !breakoutConfirmed &&
      price<breakoutLevel
    ){

      strategy2Status=
      `目前尚未有效突破 ${fmt(breakoutLevel)}，策略二先等待突破確認。`;

      strategy2Class="statusPurple";

    }

    else if(
      breakoutATRDistance>1.5
    ){

      strategy2Status=
      `雖然價格已突破，但目前距突破位約 ${breakoutATRDistance.toFixed(1)} ATR，距離偏遠。高 R 策略等待回測，而不是把遠離突破位的價格視為同一個進場區。`;

      strategy2Class="statusAmber";

    }

    else if(
      price>=entry2Low &&
      price<=entry2High
    ){

      strategy2Status=
      "價格目前位於突破回測觀察區。若突破位能由原本壓力轉成支撐，這才是策略二主要觀察的結構。";

      strategy2Class="statusGreen";

    }

    else if(
      breakoutConfirmed
    ){

      strategy2Status=
      `突破條件已出現。目前等待價格回測 ${fmt(entry2Low)}～${fmt(entry2High)} 附近，確認原壓力是否轉為支撐。`;

      strategy2Class="statusPurple";

    }

    else{

      strategy2Status=
      "策略二目前等待更清楚的突破與回測結構。";

    }


    /* ===================================
       Hero
    =================================== */

    $("title").textContent=
      `${d.name} · ${d.symbol}`;

    $("price").textContent=
      `${fmt(price)} ${d.currency||""}`;

    $("metrics").innerHTML=`
      <span class="pill">MA20 ${fmt(ma20)}</span>
      <span class="pill">MA60 ${fmt(ma60)}</span>
      <span class="pill">RSI ${rv.toFixed(1)}</span>
      <span class="pill">MACD ${macd.toFixed(2)}</span>
      <span class="pill">ATR ${fmt(ATR)}</span>
    `;

    $("hero").style.display="block";


    /* ===================================
       畫面
    =================================== */

    $("report").innerHTML=`

    <div class="sectionTitle">
    📊 市場結構
    </div>

    <div class="card">

      <div class="row">
        <div class="left">目前趨勢</div>
        <div class="right ${trendClass}">
          ${trend}
        </div>
      </div>

      <div class="row">
        <div class="left">現價</div>
        <div class="right">${fmt(price)}</div>
      </div>

      <div class="row">
        <div class="left">MA20</div>
        <div class="right">${fmt(ma20)}</div>
      </div>

      <div class="row">
        <div class="left">MA60</div>
        <div class="right">${fmt(ma60)}</div>
      </div>

      <div class="row">
        <div class="left">RSI</div>
        <div class="right">${rv.toFixed(1)}</div>
      </div>

      <div class="row">
        <div class="left">ATR</div>
        <div class="right">
          ${fmt(ATR)}
          (${(ATR/price*100).toFixed(1)}%)
        </div>
      </div>

    </div>


    <!-- ===============================
         策略一
    ================================ -->

    <div class="strategyHeader strategy1Header">

      <h2>
        🟢 策略一｜支撐回踩波段
      </h2>

      <p>
        等待價格回到主要支撐附近，
        利用較寬的結構失效空間承受正常震盪，
        再使用三段目標與趨勢續抱管理行情。
      </p>

    </div>


    <div class="card greenCard">

      <div class="label">
        入場觀察區
      </div>

      <div class="big green">
        ${fmt(entry1Low)} ～ ${fmt(entry1High)}
      </div>

      <div class="small">
        中心價 ${fmt(entry1)}
        ・${dist(entry1,price)}
      </div>

      <div class="divider"></div>

      ${reasons.map(x=>
        `<span class="tag">${x}</span>`
      ).join("")}

      <div class="statusBox ${strategy1StatusClass}">
        <strong>目前狀態</strong><br>
        ${strategy1Status}
      </div>

    </div>


    <div class="sectionTitle">
      💰 策略一｜三段獲利
    </div>

    <div class="card">

      <div class="targets">

        <div class="target">
          <div class="t">TP1</div>
          <div class="v green">${fmt(tp1)}</div>
          <div class="r">
            ${((tp1-entry1)/risk1).toFixed(1)}R
          </div>
        </div>

        <div class="target">
          <div class="t">TP2</div>
          <div class="v green">${fmt(tp2)}</div>
          <div class="r">
            ${((tp2-entry1)/risk1).toFixed(1)}R
          </div>
        </div>

        <div class="target">
          <div class="t">TP3</div>
          <div class="v amber">${fmt(tp3)}</div>
          <div class="r">
            ${((tp3-entry1)/risk1).toFixed(1)}R
          </div>
        </div>

      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="left">
          結構失效
        </div>
        <div class="right red">
          ${fmt(stop1)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          趨勢延伸參考
        </div>
        <div class="right amber">
          ${fmt(extension1)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          ATR 移動保護
        </div>
        <div class="right blue">
          ${fmt(trailing1)}
        </div>
      </div>

      <div class="reason">
        TP3 並不是強制結束點。
        若價格仍維持在 MA20 上方並持續形成較高高點與較高低點，
        趨勢部位可以繼續觀察。
      </div>

      <div class="statusBox statusGreen">

        <strong>趨勢續抱規則範例</strong><br><br>

        TP1：降低第一部分曝險。<br>
        TP2：進一步鎖定部分成果。<br>
        TP3：若趨勢仍完整，剩餘部位可改採移動式結構。<br><br>

        ATR 移動保護目前約：
        <strong>${fmt(trailing1)}</strong>

      </div>

    </div>


    <div class="sectionTitle">
      🛑 策略一｜失效
    </div>

    <div class="card redCard">

      <div class="label">
        支撐波段結構失效
      </div>

      <div class="big red">
        ${fmt(stop1)}
      </div>

      <div class="reason">
        若價格有效跌破此處，
        代表原本用來建立策略一的支撐結構已明顯受到破壞，
        應重新計算，而不是任意把原本的失效位置往下移。
      </div>

    </div>


    <!-- ===============================
         策略二
    ================================ -->

    <div class="strategyHeader strategy2Header">

      <h2>
        🟣 策略二｜高 R 突破回測
      </h2>

      <p>
        不在價格下跌過程直接接支撐。
        先等待市場突破，再觀察原壓力是否轉成支撐。
        使用較窄的結構失效空間換取較高的 R 倍數潛力。
      </p>

    </div>


    <div class="card purpleCard">

      <div class="label">
        關鍵突破位
      </div>

      <div class="big purple">
        ${fmt(breakoutLevel)}
      </div>

      <div class="small">
        以前 20 個交易日高點計算
      </div>

      <div class="divider"></div>

      <div class="label">
        精準回測觀察區
      </div>

      <div class="big purple">
        ${fmt(entry2Low)} ～ ${fmt(entry2High)}
      </div>

      <div class="small">
        以突破位 ± 0.20 ATR 建立
      </div>

      <div class="statusBox ${strategy2Class}">
        <strong>目前狀態</strong><br>
        ${strategy2Status}
      </div>

    </div>


    <div class="sectionTitle">
      🚀 策略二｜高 R 目標
    </div>

    <div class="card purpleCard">

      <div class="targets">

        <div class="target">
          <div class="t">2R</div>
          <div class="v purple">
            ${fmt(htp1)}
          </div>
          <div class="r">第一目標</div>
        </div>

        <div class="target">
          <div class="t">3R</div>
          <div class="v purple">
            ${fmt(htp2)}
          </div>
          <div class="r">第二目標</div>
        </div>

        <div class="target">
          <div class="t">5R</div>
          <div class="v amber">
            ${fmt(htp3)}
          </div>
          <div class="r">趨勢目標</div>
        </div>

      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="left">
          高 R 結構失效
        </div>
        <div class="right red">
          ${fmt(stop2)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          7R 延伸參考
        </div>
        <div class="right amber">
          ${fmt(extension2)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          ATR 移動保護
        </div>
        <div class="right blue">
          ${fmt(trailing2)}
        </div>
      </div>

      <div class="reason">
        第二套策略的重點不是預測一定會漲到 5R 或 7R，
        而是讓「錯的時候失效距離較明確」，
        同時在真正出現強趨勢時保留較大的上方延伸空間。
      </div>

    </div>


    <div class="sectionTitle">
      🔍 策略二｜確認條件
    </div>

    <div class="card">

      <div class="row">
        <div class="left">價格 > MA20</div>
        <div class="right ${price>ma20?"green":"red"}">
          ${price>ma20?"符合":"未符合"}
        </div>
      </div>

      <div class="row">
        <div class="left">MA20 > MA60</div>
        <div class="right ${ma20>ma60?"green":"red"}">
          ${ma20>ma60?"符合":"未符合"}
        </div>
      </div>

      <div class="row">
        <div class="left">MACD > 0</div>
        <div class="right ${macd>0?"green":"red"}">
          ${macd>0?"符合":"未符合"}
        </div>
      </div>

      <div class="row">
        <div class="left">RSI 50～78</div>
        <div class="right ${(rv>=50&&rv<78)?"green":"red"}">
          ${(rv>=50&&rv<78)?"符合":"未符合"}
        </div>
      </div>

      <div class="row">
        <div class="left">突破前20日高點</div>
        <div class="right ${breakoutConfirmed?"green":"amber"}">
          ${breakoutConfirmed?"已突破":"等待"}
        </div>
      </div>

      <div class="reason">
        條件不足時，策略二應保持等待。
        高 R 的來源不是把獲利目標隨意拉遠，
        而是等待較明確的突破／回測結構後，
        讓失效位置能夠相對靠近。
      </div>

    </div>


    <div class="sectionTitle">
      🔥 趨勢續抱模式
    </div>

    <div class="card blueCard">

      <div class="label">
        近期最高價
      </div>

      <div class="big">
        ${fmt(recentHighest)}
      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="left">
          策略一移動保護
        </div>
        <div class="right blue">
          ${fmt(trailing1)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          策略二移動保護
        </div>
        <div class="right purple">
          ${fmt(trailing2)}
        </div>
      </div>

      <div class="reason">
        移動保護以近期最高價減去 ATR 波動距離計算。
        當價格持續創高時，保護位置會跟著提高；
        它的目的在於讓強勢行情有延伸空間，
        同時避免把已經形成的趨勢完全放回原始失效區。
      </div>

    </div>


    <div class="sectionTitle">
      🧭 兩套策略流程
    </div>

    <div class="card">

      <div class="flow">

        <div class="flowBox">
          <div class="label">
            策略一
          </div>
          <div class="n green">
            回踩支撐
          </div>
          <div class="small">
            等支撐 → 止跌 → 分段管理 → 趨勢續抱
          </div>
        </div>

        <div class="flowBox">
          <div class="label">
            策略二
          </div>
          <div class="n purple">
            突破回測
          </div>
          <div class="small">
            等突破 → 回測 → 確認 → 高 R 趨勢管理
          </div>
        </div>

      </div>

      <div class="divider"></div>

      <div class="reason">

        <strong>策略一</strong>
        使用較寬的支撐結構，容許較多正常震盪。<br><br>

        <strong>策略二</strong>
        等待突破後才觀察回測，
        結構失效距離通常較窄，因此可能形成較高的 R 倍數，
        但緊失效也代表正常震盪更容易觸及。<br><br>

        兩套策略使用不同的進場前提，
        不應把其中一套的失效線拿去套另一套策略。

      </div>

    </div>


    <div class="note">

      ⚠️ 這是規則式技術分析工具。
      所有入場觀察區、2R／3R／5R、TP1／TP2／TP3、
      移動保護與結構失效位置均由歷史行情與技術規則計算。
      高 R 不代表較高勝率，也不存在能保證「更多利潤且更少虧損」的策略。
      跳空、滑價與流動性也可能造成實際成交價格與計算位置不同。

    </div>

    `;

    $("report").style.display="block";
    $("status").style.display="none";

  }

  catch(e){

    $("status").style.display="block";

    $("status").textContent=
      "❌ "+e.message+
      "。如果剛 Commit，請等待 Vercel 完成重新部署後再試。";

  }

}

$("go").onclick=run;

$("symbol").addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter")run();
  }
);

</script>

</body>
</html>
