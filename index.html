<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幽冥分析</title>
<meta name="theme-color" content="#050706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="幽冥分析">

<style>
*{box-sizing:border-box}
:root{
--bg:#050706;
--bg2:#080b09;
--card:#0d110f;
--card2:#101512;
--border:#27302b;
--border2:#344139;
--text:#f7faf8;
--muted:#89938d;
--green:#49e6ad;
--green2:#9cf3d1;
--red:#ff6675;
--red2:#ff9ca5;
--yellow:#ffd166;
--orange:#ff9f43;
--purple:#bd7cff;
--purple2:#e3c5ff;
--blue:#70b7ff;
--cyan:#6ee7f2;
--shadow:0 16px 42px rgba(0,0,0,.28)
}

html{background:var(--bg);scroll-behavior:smooth}

body{
margin:0;
background:
radial-gradient(circle at 15% 0%,rgba(73,230,173,.10),transparent 360px),
radial-gradient(circle at 90% 12%,rgba(112,183,255,.07),transparent 380px),
linear-gradient(180deg,#050706,#030504 55%,#050706);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
-webkit-font-smoothing:antialiased
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
width:min(100%,760px);
margin:auto;
padding:
max(18px,calc(env(safe-area-inset-top) + 12px))
max(14px,calc(env(safe-area-inset-right) + 11px))
max(80px,calc(env(safe-area-inset-bottom) + 24px))
max(14px,calc(env(safe-area-inset-left) + 11px))
}

.header,.section-head,.back-row,.hero-top,.stock-top,.recommend-top,.backtest-head{
display:flex;justify-content:space-between;align-items:center;gap:12px
}

.header{margin-bottom:14px}

.logo{
font-size:26px;
font-weight:950;
letter-spacing:-1.2px;
background:linear-gradient(90deg,#fff,#b9c8c0);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}
.logo small{
display:block;
font-size:11px;
font-weight:700;
color:var(--muted);
-webkit-text-fill-color:var(--muted);
letter-spacing:.5px;
margin-top:3px
}

.notify-btn,.refresh-btn,.more-btn,.favorite-btn,.position-save-btn,.return-recommend-btn,.strategy-quick-btn{
border:1px solid var(--border);
background:linear-gradient(180deg,#121814,#0c100e);
color:#e9efeb;
border-radius:12px;
padding:10px 12px;
font-size:13px;
font-weight:850;
box-shadow:0 5px 14px rgba(0,0,0,.15)
}

.market-tabs{
display:flex;
gap:7px;
background:rgba(8,11,9,.85);
border:1px solid var(--border);
padding:5px;
border-radius:15px;
margin-bottom:14px
}

.market-tab{
flex:1;
border:0;
background:transparent;
color:#737d77;
padding:11px 6px;
border-radius:11px;
font-size:13px;
font-weight:900
}

.market-tab.active{
background:linear-gradient(180deg,#1a211d,#121713);
color:white
}

.search-card,.card,.hero-card,.strategy-card,.recommend-card,.position-card,.backtest-card,.ai-card,.track-card,.monster-card{
background:linear-gradient(160deg,rgba(15,20,17,.98),rgba(8,11,9,.98));
border:1px solid var(--border);
border-radius:19px;
box-shadow:var(--shadow)
}

.search-card{
padding:14px;
margin-bottom:14px;
position:relative
}

.search-row{display:flex;gap:8px}

.search-input{
flex:1;
min-width:0;
border:1px solid #303a34;
background:#060907;
color:white;
border-radius:13px;
padding:14px 12px;
outline:none;
font-size:16px;
font-weight:800
}

.search-input:focus{
border-color:#4d7563;
box-shadow:0 0 0 3px rgba(73,230,173,.07)
}

.search-button{
border:0;
border-radius:13px;
padding:0 19px;
background:linear-gradient(135deg,#eff8f3,#bfe7d4);
color:#07100b;
font-weight:950
}

.search-suggest{
position:absolute;
left:14px;
right:14px;
top:69px;
z-index:100;
border:1px solid #303a34;
background:rgba(8,11,9,.98);
backdrop-filter:blur(18px);
border-radius:14px;
overflow:hidden;
box-shadow:0 18px 45px rgba(0,0,0,.55)
}

.search-suggest-item{
width:100%;
border:0;
border-bottom:1px solid #202722;
background:transparent;
color:white;
text-align:left;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.search-suggest-item:last-child{border-bottom:0}
.suggest-symbol{font-weight:950;font-size:14px}
.suggest-name{font-size:11px;color:#aeb7b2;margin-top:2px}
.suggest-market{font-size:9px;color:#89928d;border:1px solid #303833;border-radius:999px;padding:4px 7px}

.search-examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

.example,.history-item{
border:1px solid #27302b;
background:#101512;
color:#b4bdb8;
border-radius:999px;
padding:6px 9px;
font-size:11px;
font-weight:800
}

.search-history{margin-top:12px;padding-top:11px;border-top:1px solid #202722}
.search-history-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.search-history-title{font-size:11px;color:var(--muted);font-weight:900}
.search-history-clear{border:0;background:transparent;color:#777f7a;font-size:10px;padding:4px}
.search-history-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}

.home-entry-section{
margin:0 0 15px;
padding:12px;
border:1px solid rgba(73,230,173,.24);
border-radius:17px;
background:linear-gradient(135deg,rgba(73,230,173,.08),transparent 55%),linear-gradient(180deg,#0d1410,#090d0b)
}

.home-entry-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin:0 2px 9px
}

.home-entry-head-title{font-size:13px;font-weight:950;color:#dff9ee}
.home-entry-head-note{font-size:9px;color:#8fb9a7;border:1px solid #2a493c;background:#0c1812;padding:4px 7px;border-radius:999px}
.home-entry-list{display:grid;gap:7px}

.home-entry-alert{
width:100%;
display:flex;
align-items:center;
gap:9px;
padding:10px;
min-height:48px;
border:1px solid #2a463b;
background:linear-gradient(90deg,#0e1a14,#0a0f0c);
border-radius:13px;
cursor:pointer
}

.home-entry-dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--green);
box-shadow:0 0 12px rgba(73,230,173,.65);
flex:0 0 8px
}

.home-entry-info{min-width:0;flex:1}
.home-entry-top{display:flex;align-items:center;gap:6px;min-width:0}
.home-entry-symbol{font-size:13px;font-weight:950;white-space:nowrap}
.home-entry-name{font-size:11px;font-weight:800;color:#aeb9b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-entry-bottom{font-size:10px;color:#8fc8af;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-entry-price{text-align:right;white-space:nowrap}
.home-entry-price strong{display:block;font-size:15px;font-weight:950}
.home-entry-price span{display:block;font-size:9px;color:#7e8a83;margin-top:2px}
.home-entry-close{border:0;background:transparent;color:#69746e;font-size:14px;padding:6px 3px}

.monster-section{
margin:16px 0 4px;
padding:13px;
border-radius:19px;
border:1px solid rgba(189,124,255,.28);
background:radial-gradient(circle at top right,rgba(255,159,67,.08),transparent 45%),linear-gradient(150deg,rgba(189,124,255,.08),rgba(10,12,11,.95))
}

.monster-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.monster-title{font-size:16px;font-weight:950}
.monster-sub{font-size:10px;color:#a796b7;line-height:1.65;margin-top:4px}
.monster-list{display:grid;gap:8px}

.monster-item{
border:1px solid #43334f;
background:linear-gradient(135deg,#160f1d,#0b0c0b);
border-radius:14px;
padding:12px;
cursor:pointer
}

.monster-top{display:flex;justify-content:space-between;gap:10px}
.monster-symbol{font-size:16px;font-weight:950}
.monster-name{font-size:10px;color:#b8abbf;margin-left:6px}
.monster-score{text-align:right}
.monster-score strong{font-size:21px;font-weight:950;color:#e3c5ff}
.monster-score span{display:block;font-size:8px;color:#8e7c99}
.monster-state{font-size:11px;font-weight:900;color:#e2c5ff;margin-top:6px}
.monster-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.monster-chip{
font-size:9px;
font-weight:850;
padding:5px 7px;
border-radius:999px;
border:1px solid #493653;
color:#cdb6d8;
background:#120d16
}

.monster-chip.hot{border-color:#654321;color:#ffc887;background:#191107}

.section-head{margin:19px 1px 10px}
.section-title{font-size:15px;font-weight:950}
.section-sub{font-size:11px;line-height:1.6;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}

.stat{
background:#0c110e;
border:1px solid var(--border);
border-radius:15px;
padding:12px 9px
}

.stat span{display:block;font-size:10px;color:var(--muted)}
.stat strong{display:block;font-size:22px;margin-top:4px}
.update-line{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#858f89;margin:8px 2px 12px}
.stock-grid,.watch-list{display:grid;gap:9px}

.stock-card{
border:1px solid var(--border);
background:#0e1310;
border-radius:17px;
padding:14px;
cursor:pointer
}

.stock-title-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.symbol{font-size:17px;font-weight:950}
.stock-inline-name{font-size:12px;color:#aeb7b2;font-weight:800}
.stock-strategy-line{font-size:11px;color:#c0c8c3;margin-top:5px;font-weight:800}
.score{text-align:right}
.score strong{display:block;font-size:19px}
.score span{font-size:9px;color:var(--muted)}
.price-row{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.price{font-size:22px;font-weight:950}
.up{color:var(--red)}
.down{color:var(--green)}
.flat{color:#b8bdb9}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:10px;font-weight:850;padding:5px 7px;border-radius:999px;border:1px solid #2a332e;color:#adb7b1}
.chip.green{color:#a6ead3;border-color:#28503f}
.watch-open{font-size:10px;color:#727c76;margin-top:11px}

.watch-empty{
border:1px dashed #29312c;
background:#080b09;
border-radius:15px;
padding:16px 12px;
color:#7b857f;
font-size:11px;
line-height:1.7;
text-align:center
}

.watch-item{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border:1px solid var(--border);
background:#0d120f;
padding:12px;
border-radius:15px
}

.watch-main{min-width:0;flex:1;cursor:pointer}
.watch-symbol{font-weight:950;font-size:14px}
.watch-name{font-size:10px;color:var(--muted);margin-top:2px}
.watch-price{font-size:11px;color:#b6c0ba;margin-top:5px}
.watch-remove{border:1px solid #4b252a;background:#1a0d0f;color:#ff8e98;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:850}

.loading{padding:28px 10px;text-align:center;color:#909a94;font-size:13px}
.error{padding:14px;border:1px solid #4b252a;background:#1a0c0e;border-radius:14px;color:#ff9ba4;font-size:12px;line-height:1.7}
.hidden{display:none!important}

.back-row{margin-bottom:12px}
.back-button{border:1px solid var(--border);background:#0c110e;color:#e1e6e3;padding:10px 12px;border-radius:12px;font-weight:850}
.analysis-refresh{font-size:11px;color:var(--muted)}

.hero-card{padding:17px;margin-bottom:14px}
.hero-top{align-items:flex-start}
.hero-symbol{font-size:27px;font-weight:950}
.hero-name{font-size:13px;font-weight:850;color:#b2bbb6}
.market-pill{display:inline-block;font-size:10px;color:#aeb8b2;border:1px solid #303a34;padding:5px 8px;border-radius:999px;margin-top:7px}
.hero-price{text-align:right;font-size:32px;font-weight:950}
.hero-change{text-align:right;font-size:14px;font-weight:900;margin-top:4px}
.favorite-btn{width:100%;margin-top:14px}
.favorite-btn.active{color:#ffe394;border-color:#5c5127;background:#18160c}

.indicator-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.indicator{background:#080b09;border:1px solid #242c27;border-radius:13px;padding:10px 8px}
.indicator span{display:block;font-size:9px;color:#7d8781}
.indicator strong{display:block;font-size:14px;margin-top:3px}

.volume-card{margin-top:12px;border-top:1px solid #202722;padding-top:12px}
.volume-title{font-size:12px;font-weight:900}
.volume-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.volume-box{border:1px solid #252d28;border-radius:11px;padding:8px;background:#080b09}
.volume-box span{display:block;font-size:9px;color:#7d8781}
.volume-box strong{display:block;font-size:12px;margin-top:3px}

.big-section-title{font-size:17px;font-weight:950;margin:21px 2px 10px}

.position-card{padding:16px;margin-bottom:14px}
.position-title,.backtest-title{font-size:18px;font-weight:950}
.position-desc,.backtest-sub{font-size:11px;color:var(--muted);line-height:1.7;margin-top:5px}
.position-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.position-field{background:#080b09;border:1px solid #27302b;border-radius:13px;padding:10px}
.position-field.full{grid-column:1/-1}
.position-field label{display:block;font-size:10px;font-weight:850;color:#929c96;margin-bottom:7px}
.position-input{width:100%;border:0;outline:none;background:transparent;color:#fff;font-size:18px;font-weight:950;padding:0}
.position-unit{font-size:9px;color:#68726c;margin-top:5px}
.position-save-btn{width:100%;margin-top:10px}
.position-summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}
.position-summary{border:1px solid #27302b;background:#080b09;border-radius:13px;padding:10px}
.position-summary span{display:block;font-size:9px;color:#7d8781}
.position-summary strong{display:block;font-size:16px;margin-top:5px}

.track-card{padding:15px;margin-bottom:14px}
.track-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.track-title{font-size:17px;font-weight:950}
.track-sub{font-size:10px;color:#8f9993;line-height:1.7;margin-top:4px}
.track-status{font-size:9px;font-weight:950;padding:6px 8px;border-radius:999px;border:1px solid #2e4b3f;color:#a6ead3;background:#0c1712}
.track-current-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}
.track-level{border:1px solid #27302b;background:#080b09;border-radius:12px;padding:9px}
.track-level span{display:block;font-size:9px;color:#7d8781}
.track-level strong{display:block;font-size:14px;margin-top:4px}
.track-timeline{margin-top:13px;border-top:1px solid #202722}
.track-event{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid #1e2420}
.track-event-dot{width:8px;height:8px;border-radius:50%;background:#49e6ad;margin-top:5px}
.track-event-dot.tp{background:#ffd166}
.track-event-dot.sl{background:#ff6675}
.track-event-text{font-size:11px;line-height:1.65;color:#c3cbc6}
.track-event-time{font-size:9px;color:#747e78;margin-top:2px}

.recommend-card{padding:15px;margin-bottom:14px}
.recommend-top{align-items:flex-start}
.recommend-name{font-size:21px;font-weight:950}
.recommend-score{text-align:right}
.recommend-score strong{font-size:28px}
.recommend-score span{display:block;font-size:9px;color:var(--muted)}
.recommend-note{font-size:11px;color:#a5aea8;line-height:1.75;margin-top:10px}

.strategy-card{padding:16px;margin-bottom:10px}
.strategy-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.strategy-name{font-size:18px;font-weight:950}
.strategy-grade{font-size:10px;color:#9aa49e;margin-top:3px}
.strategy-score{font-size:24px;font-weight:950;text-align:right}
.strategy-score small{display:block;font-size:9px;color:#7b857f}

.strategy-market-price{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-top:13px;
padding:11px 12px;
border:1px solid #35443c;
border-radius:13px;
background:#090d0b
}

.strategy-market-price span{font-size:12px;font-weight:900;color:#aab8b0}
.strategy-market-price strong{font-size:23px;font-weight:950;color:#fff}

.condition-row{padding:11px 0;border-top:1px solid #202722;font-size:13px;font-weight:850;line-height:1.7}
.condition-row.good{color:#bdf2dc}
.condition-row.bad{color:#ff8d97}
.condition-explain{display:block;color:#858f89;font-size:11px;font-weight:500;margin:3px 0 0 20px;line-height:1.65}

.strategy-levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.strategy-level{border:1px solid #252d28;background:#080b09;border-radius:14px;padding:11px}
.strategy-level span{display:block;font-size:10px;font-weight:800;color:#858f89}
.strategy-level strong{display:block;font-size:20px;font-weight:950;margin-top:5px}
.level-entry{border-color:#2c5845}
.level-entry strong{color:#a6ead3}
.level-stop{border-color:#5a3036}
.level-stop strong{color:#ff8d97}
.level-pressure,.level-tp{border-color:#5c4e26}
.level-pressure strong,.level-tp strong{color:#ffd166}
.level-tp3{border-color:#654526}
.level-tp3 strong{color:#ffab55}

.strategy-quick-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:12px
}

.strategy-quick-btn{padding:10px 7px;font-size:11px}

.ai-card{padding:15px;margin-bottom:14px}
.ai-title{font-size:18px;font-weight:950}
.ai-sub{font-size:11px;color:#8c918e;line-height:1.7;margin-top:5px}
.ai-context{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ai-context span{border:1px solid #29322d;background:#080b09;border-radius:999px;padding:5px 7px;font-size:9px;color:#9ca49f}
.ai-messages{margin-top:12px;display:grid;gap:8px}
.ai-message{padding:11px 12px;border-radius:13px;font-size:12px;line-height:1.75;white-space:pre-wrap}
.ai-message.user{margin-left:30px;background:#172019;border:1px solid #2c4d3d}
.ai-message.bot{margin-right:16px;background:#0a0d0b;border:1px solid #2b312d;color:#d5d9d6}
.ai-row{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.ai-input{flex:1;min-height:48px;max-height:140px;resize:vertical;border:1px solid #303632;background:#060806;color:#fff;border-radius:13px;padding:12px;outline:none}
.ai-send{border:0;background:#e8eee9;color:#111;border-radius:12px;padding:13px 15px;font-weight:950}

.hidden{display:none!important}

@media(max-width:430px){
.app{
padding-left:max(11px,calc(env(safe-area-inset-left) + 11px));
padding-right:max(11px,calc(env(safe-area-inset-right) + 11px))
}
.logo{font-size:23px}
.indicator-strip{grid-template-columns:repeat(2,1fr)}
}

</style>
</head>

<body>

<div id="toastStack" class="toast-stack"></div>

<div class="app">

<div id="homeView">

<div class="header">
<div class="logo">幽冥分析<small>股票策略分析</small></div>
<button id="notifyButton" class="notify-btn">🔔 高勝率策略通知</button>
</div>

<div class="market-tabs">
<button id="twTab" class="market-tab active">🇹🇼 台股</button>
<button id="usTab" class="market-tab">🇺🇸 美股</button>
</div>

<div id="homeEntrySection" class="home-entry-section hidden">
<div class="home-entry-head">
<div class="home-entry-head-title">🎯 高品質進場提醒</div>
<div class="home-entry-head-note">保留 30 分鐘</div>
</div>
<div id="homeEntryList" class="home-entry-list"></div>
</div>

<div class="search-card">
<div class="search-row">
<input id="searchInput" class="search-input" autocomplete="off" placeholder="輸入代號或名稱，例如 台積 / 23 / NV">

function normalizeSymbol(v){
return String(v||"").trim().toUpperCase()
}

function safe(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;")
}

function fmt(v,d=2){
var n=Number(v);
if(!Number.isFinite(n))return"--";
return n.toLocaleString("zh-TW",{
minimumFractionDigits:d,
maximumFractionDigits:d
})
}

function pct(v){
var n=Number(v);
if(!Number.isFinite(n))return"--";
return(n>0?"+":"")+fmt(n,2)+"%"
}

function pclass(v){
var n=Number(v);
return n>0?"up":n<0?"down":"flat"
}

function currentTimeText(){
return new Date().toLocaleTimeString("zh-TW",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:false
})
}

function dateTimeText(t){
return new Date(t||Date.now()).toLocaleString("zh-TW",{
month:"2-digit",
day:"2-digit",
hour:"2-digit",
minute:"2-digit",
hour12:false
})
}

function average(values){
var a=values.map(Number).filter(Number.isFinite);
return a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN
}

function ema(values,period){
var a=values.map(Number).filter(Number.isFinite);
if(!a.length)return NaN;
var k=2/(period+1);
var out=a[0];
for(var i=1;i<a.length;i++)out=a[i]*k+out*(1-k);
return out
}/* 系統通知 */

/* 持倉 */
function getPositions(){
try{
var d=JSON.parse(localStorage.getItem(POSITION_KEY)||"{}");
return d&&typeof d==="object"?d:{}
}catch(e){return{}}
}

function getPosition(symbol){
return getPositions()[normalizeSymbol(symbol)]||null
}

function savePosition(symbol,data){
var all=getPositions();
symbol=normalizeSymbol(symbol);
if(!symbol)return;

all[symbol]={
entry:Number(data.entry)||0,
lots:Math.max(0,Math.floor(Number(data.lots)||0)),
odd:Math.max(0,Math.floor(Number(data.odd)||0)),
capitalReduction:Math.max(
0,
Math.min(99.99,Number(data.capitalReduction)||0)
),
updatedAt:Date.now()
};

localStorage.setItem(POSITION_KEY,JSON.stringify(all))
}

function positionShares(p,market){
if(!p)return 0;

if(market==="US"){
return Math.max(0,Number(p.lots)||0)+
Math.max(0,Number(p.odd)||0)
}

return Math.max(0,Number(p.lots)||0)*1000+
Math.max(0,Number(p.odd)||0)
}

function adjustedPosition(position,market){
var originalShares=positionShares(position,market);
var originalEntry=Number(position?.entry)||0;
var reduction=Math.max(
0,
Math.min(99.99,Number(position?.capitalReduction)||0)
);
var remainRatio=1-reduction/100;

if(!originalShares||!originalEntry||remainRatio<=0){
return{
originalShares,
originalEntry,
reduction,
shares:originalShares,
entry:originalEntry
}
}

return{
originalShares,
originalEntry,
reduction,
shares:originalShares*remainRatio,
entry:originalEntry/remainRatio
}
}

/* 技術指標 */
function historicalRSI(rows,period=14){
if(rows.length<period+1)return 50;

var a=rows.slice(-(period+1));
var gain=0;
var loss=0;

for(var i=1;i<a.length;i++){
var diff=Number(a[i].close)-Number(a[i-1].close);
if(diff>0)gain+=diff;
else loss+=Math.abs(diff)
}

var ag=gain/period;
var al=loss/period;

if(al===0)return 100;
return 100-(100/(1+ag/al))
}

function historicalMACD(rows){
var c=rows.map(x=>Number(x.close)).filter(Number.isFinite);
if(c.length<26)return 0;
return ema(c.slice(-80),12)-ema(c.slice(-80),26)
}

function historicalATR(rows,period=14){
if(rows.length<2)return 0;

var a=rows.slice(-(period+1));
var trs=[];

for(var i=1;i<a.length;i++){
var h=Number(a[i].high);
var l=Number(a[i].low);
var pc=Number(a[i-1].close);

var tr=Math.max(
h-l,
Math.abs(h-pc),
Math.abs(l-pc)
);

if(Number.isFinite(tr))trs.push(tr)
}

return average(trs)||0
}

function marketOf(d){
var rows=d.rows||[];
var last=rows.at(-1)||{};
var price=Number(d.price)||Number(last.close)||0;

var ma20=Number(d.ma20);
var ma60=Number(d.ma60);
var rsi=Number(d.rsi);
var macd=Number(d.macd);
var atr=Number(d.atr);

if(!Number.isFinite(ma20)){
ma20=average(rows.slice(-20).map(x=>x.close))||price
}

if(!Number.isFinite(ma60)){
ma60=average(rows.slice(-60).map(x=>x.close))||price
}

if(!Number.isFinite(rsi))rsi=50;
if(!Number.isFinite(macd))macd=0;

if(!Number.isFinite(atr)||atr<=0){
atr=historicalATR(rows,14)||price*.02
}

var recent20=rows.slice(-20);
var highs=recent20.map(x=>Number(x.high)).filter(Number.isFinite);
var lows=recent20.map(x=>Number(x.low)).filter(Number.isFinite);
var lows10=rows.slice(-10).map(x=>Number(x.low)).filter(Number.isFinite);

var resistance=Number(d.resistance);
if(!Number.isFinite(resistance)){
resistance=highs.length?Math.max(...highs):price
}

var support=Number(d.support);
if(!Number.isFinite(support)){
support=lows.length?Math.min(...lows):ma20
}

var low10=lows10.length?Math.min(...lows10):support;

return{
price,
ma20,
ma60,
rsi,
macd,
atr,
resistance,
support,
low10,
rows
}
}

function volumeMetrics(d,rows){
var last=rows.at(-1)||{};
var current=Number(d.volume??last.volume);

if(!Number.isFinite(current))current=0;

var vols=rows.slice(-21,-1)
.map(x=>Number(x.volume))
.filter(Number.isFinite);

var average20=vols.length?average(vols):0;

var ratio=Number(d.volumeRatio);

if(!Number.isFinite(ratio)||ratio<=0){
ratio=average20>0?current/average20:1
}

var level="正常量";

if(ratio>=2)level="明顯放量";
else if(ratio>=1.5)level="放量";
else if(ratio>=1.2)level="量能增溫";
else if(ratio<.7)level="量縮";

return{
current,
average20,
ratio,
level
}
}

function structureHealthy(m){
var rows=m.rows||[];
if(rows.length<10)return true;

var c=rows.slice(-5)
.map(x=>Number(x.close))
.filter(Number.isFinite);

if(c.length<3)return true;

return c.at(-1)>=c[0]*.96&&m.price>=m.ma60*.97
}

function pack(a){
var passed=a.filter(x=>x.pass).length;

return{
conditions:a,
passed,
total:a.length,
score:Math.round(passed/a.length*100),
qualified:passed>=7
}
}

return{
PULLBACK:pack(pull),
HIGH_R:pack(high),
SURGE:pack(surge)
}
}

function bestSetup(setups){
var a=[
{type:"PULLBACK",name:"支撐回踩",setup:setups.PULLBACK},
{type:"HIGH_R",name:"高 R 突破",setup:setups.HIGH_R},
{type:"SURGE",name:"強勢續攻",setup:setups.SURGE}
];

a.sort((x,y)=>
y.setup.score-x.setup.score||
y.setup.passed-x.setup.passed
);

return a[0]
}

function strategyTargets(type,m){
var price=Number(m.price)||0;
var atr=Math.max(
Number(m.atr)||price*.02,
price*.005
);

var ma20=Number(m.ma20)||price;
var ma60=Number(m.ma60)||price;
var resistance=Number(m.resistance)||price;
var support=Number(m.support)||ma20;
var low10=Number(m.low10)||support;

var entryLow;
var entryHigh;
var stop1;
var stop2;

if(type==="PULLBACK"){
entryLow=Math.max(
ma20-atr*.25,
support
);

entryHigh=Math.min(
price+atr*.15,
ma20+atr*.45
);

if(entryHigh<entryLow){
entryHigh=entryLow+atr*.25
}

stop1=Math.min(
entryLow-atr*.55,
support-atr*.25
);

stop2=Math.min(
ma60-atr*.35,
low10-atr*.3,
stop1-atr*.6
)

}else if(type==="HIGH_R"){

entryLow=Math.max(
resistance-atr*.12,
price-atr*.1
);

entryHigh=Math.max(
resistance+atr*.18,
price+atr*.1
);

if(entryHigh<entryLow){
entryHigh=entryLow+atr*.3
}

stop1=Math.min(
resistance-atr*.55,
entryLow-atr*.45
);

stop2=Math.min(
ma20-atr*.35,
low10-atr*.25,
stop1-atr*.65
)

}else{

entryLow=Math.max(
price-atr*.18,
ma20
);

entryHigh=price+atr*.28;

if(entryHigh<entryLow){
entryHigh=entryLow+atr*.3
}

stop1=Math.min(
price-atr*.9,
low10-atr*.15
);

stop2=Math.min(
ma20-atr*.45,
low10-atr*.4,
stop1-atr*.65
)
}

entryLow=Math.max(entryLow,price*.5);
entryHigh=Math.max(entryHigh,entryLow);

var center=(entryLow+entryHigh)/2;

if(stop1>=center){
stop1=center-atr*.8
}

if(stop2>=stop1){
stop2=stop1-atr*.7
}

var risk=Math.max(
center-stop1,
atr*.45
);

var previousHigh=Math.max(
resistance,
center
);

var tp1=Math.max(
previousHigh,
center+risk*1.2
);

var tp2=Math.max(
tp1+atr*.35,
center+risk*2
);

var tp3=Math.max(
tp2+atr*.45,
center+risk*3
);

return{
entryLow,
entryHigh,
center,
stop1,
stop2,
previousHigh,
risk,
tp1,
tp2,
tp3
}
}

/* 妖股模型 */
function monsterMetrics(d,m,v){
var rows=m.rows||[];
var last5=rows.slice(-5);
var last10=rows.slice(-10);

var closes5=last5
.map(x=>Number(x.close))
.filter(Number.isFinite);

var closes10=last10
.map(x=>Number(x.close))
.filter(Number.isFinite);

var fiveReturn=
closes5.length>=2
?(closes5.at(-1)/closes5[0]-1)*100
:0;

var tenReturn=
closes10.length>=2
?(closes10.at(-1)/closes10[0]-1)*100
:0;

var greenCount=0;
var strongClose=0;

last5.forEach(r=>{
var o=Number(r.open);
var c=Number(r.close);
var h=Number(r.high);
var l=Number(r.low);

if(c>o)greenCount++;

if(
Number.isFinite(h)&&
Number.isFinite(l)&&
h>l&&
c>=l+(h-l)*.72
){
strongClose++
}
});

var atrPct=m.price?m.atr/m.price*100:0;
var nearHigh=m.price>=m.resistance-m.atr*.7;
var trend=m.ma20>=m.ma60*.985&&m.price>=m.ma20*.98;
var momentum=m.macd>0&&m.rsi>=52;
var notTooHot=m.rsi<=78;
var volumeWarm=v.ratio>=1.25;
var volumeHot=v.ratio>=1.6;
var accelerating=fiveReturn>0&&fiveReturn>=tenReturn*.35;
var priceStrength=greenCount>=3||strongClose>=3;

var score=0;

if(trend)score+=16;
if(momentum)score+=16;
if(nearHigh)score+=15;
if(volumeWarm)score+=13;
if(volumeHot)score+=7;
if(priceStrength)score+=12;
if(accelerating)score+=10;
if(atrPct>=1.5)score+=6;
if(notTooHot)score+=5;

score=Math.min(100,score);

var alreadyExploded=
fiveReturn>=18||
tenReturn>=30||
m.rsi>82;

var state="觀察中";

if(alreadyExploded){
state="已明顯噴出｜避免追高"
}else if(score>=85){
state="🔥 啟動確認"
}else if(score>=75){
state="⚡ 啟動前兆"
}else if(score>=65){
state="👀 異常增溫"
}

var atr=Math.max(
m.atr,
m.price*.008
);

var entryLow=Math.max(
m.ma20,
m.price-atr*.25
);

var entryHigh=m.price+atr*.18;

var sl1=Math.min(
entryLow-atr*.7,
m.ma20-atr*.35
);

var sl2=Math.min(
sl1-atr*.7,
m.ma60-atr*.35
);

var risk=Math.max(
((entryLow+entryHigh)/2)-sl1,
atr*.6
);

var center=(entryLow+entryHigh)/2;

var tp1=Math.max(
m.resistance,
center+risk*1.4
);

var tp2=Math.max(
tp1+atr*.5,
center+risk*2.3
);

var tp3=Math.max(
tp2+atr*.7,
center+risk*3.5
);

return{
score,
state,
alreadyExploded,
fiveReturn,
tenReturn,
atrPct,
greenCount,
strongClose,
entryLow,
entryHigh,
sl1,
sl2,
tp1,
tp2,
tp3
}
}

/* =========================================================
   策略追蹤
   修正重點：
   每一支股票的追蹤資料完全分開。
   任何紀錄都必須同時符合目前股票代號才允許顯示／更新。
   ========================================================= */

function getStrategyTracks(){
try{
var d=JSON.parse(
localStorage.getItem(STRATEGY_TRACK_KEY)||"{}"
);

return d&&typeof d==="object"
?d
:{}

}catch(e){
return{}
}
}

function saveStrategyTracks(all){
localStorage.setItem(
STRATEGY_TRACK_KEY,
JSON.stringify(all)
)
}

function getStockTracks(symbol){
var key=normalizeSymbol(symbol);

if(!key)return[];

var all=getStrategyTracks();
var raw=Array.isArray(all[key])
?all[key]
:[];

/*
重要：
即使 localStorage 以前有錯誤資料，
這裡也再次確認 track.symbol 必須與目前股票完全一致。
*/
return raw
.filter(track=>
track&&
normalizeSymbol(track.symbol)===key
)
.sort((a,b)=>
Number(b.createdAt||b.enteredAt||0)-
Number(a.createdAt||a.enteredAt||0)
)
}

function addTrackEvent(track,type,price,text){
track.events=Array.isArray(track.events)
?track.events
:[];

track.events.unshift({
type:type,
price:Number(price)||0,
text:text,
at:Date.now()
});

track.events=track.events.slice(0,80)
}

function findActiveTrack(symbol,type){
var key=normalizeSymbol(symbol);

return getStockTracks(key).find(track=>
track&&
normalizeSymbol(track.symbol)===key&&
track.strategyType===type&&
!track.closedAt
)
}

function createTrack(d,b,t,price){
var all=getStrategyTracks();
var symbol=normalizeSymbol(d.symbol);

if(!symbol)return null;

var raw=Array.isArray(all[symbol])
?all[symbol]
:[];

/*
先清除這個 key 裡不屬於這支股票的錯誤舊資料，
避免以前的資料污染。
*/
var list=raw.filter(track=>
track&&
normalizeSymbol(track.symbol)===symbol
);

var existing=list.find(track=>
track&&
normalizeSymbol(track.symbol)===symbol&&
track.strategyType===b.type&&
!track.closedAt
);

if(existing)return existing;

var now=Date.now();

var track={
id:symbol+"_"+b.type+"_"+now,
symbol:symbol,
name:d.name||"",
market:d.market||"",
strategyType:b.type,
strategyName:b.name,
createdAt:now,
enteredAt:now,
entryPrice:price,

originalLevels:{
entryLow:t.entryLow,
entryHigh:t.entryHigh,
sl1:t.stop1,
sl2:t.stop2,
tp1:t.tp1,
tp2:t.tp2,
tp3:t.tp3
},

currentLevels:{
entryLow:t.entryLow,
entryHigh:t.entryHigh,
sl1:t.stop1,
sl2:t.stop2,
tp1:t.tp1,
tp2:t.tp2,
tp3:t.tp3,
updatedAt:now
},

hit:{
entry:true,
tp1:false,
tp2:false,
tp3:false,
sl1:false,
sl2:false
},

events:[]
};

addTrackEvent(
track,
"ENTRY",
price,
"進入 "+b.name+
" 進場區 "+
fmt(t.entryLow)+
"～"+
fmt(t.entryHigh)+
"，當時現價 "+
fmt(price)
);

list.unshift(track);

all[symbol]=list.slice(0,20);

saveStrategyTracks(all);

return track
}

function materiallyDifferent(oldValue,newValue,m){
var o=Number(oldValue);
var n=Number(newValue);

if(
!Number.isFinite(o)||
!Number.isFinite(n)
)return true;

var threshold=Math.max(
Number(m.atr||0)*.25,
Number(m.price||0)*.003
);

return Math.abs(o-n)>=threshold
}

function updateStrategyTracking(d,m,setups){
if(
!d||
!d.symbol||
!m||
!setups
)return;

var symbol=normalizeSymbol(d.symbol);

/*
如果現在畫面正在看另一支股票，
這個背景請求不准碰目前畫面的策略追蹤。
但雷達背景掃描本身仍可更新各自股票的 localStorage。
*/
var all=getStrategyTracks();

var raw=Array.isArray(all[symbol])
?all[symbol]
:[];

var list=raw.filter(track=>
track&&
normalizeSymbol(track.symbol)===symbol
);

if(!list.length)return;

var changed=false;
var price=Number(m.price)||0;

list.forEach(track=>{

if(
!track||
normalizeSymbol(track.symbol)!==symbol||
track.closedAt
)return;

var candidate=strategyTargets(
track.strategyType,
m
);

var old=
track.currentLevels||
track.originalLevels||
{};

var next={...old};

[
"entryLow",
"entryHigh",
"tp1",
"tp2",
"tp3"
].forEach(k=>{

if(
materiallyDifferent(
old[k],
candidate[k],
m
)
){
next[k]=candidate[k]
}

});

/*
已經進場之後：
SL 只能往上收緊，
不能因為股價下跌而把停損往下放。
*/
if(
materiallyDifferent(
old.sl1,
candidate.stop1,
m
)
){
next.sl1=Math.max(
Number(old.sl1)||candidate.stop1,
candidate.stop1
)
}

if(
materiallyDifferent(
old.sl2,
candidate.stop2,
m
)
){
next.sl2=Math.max(
Number(old.sl2)||candidate.stop2,
candidate.stop2
)
}

next.updatedAt=Date.now();
track.currentLevels=next;

var hit=
track.hit||
(track.hit={
entry:true,
tp1:false,
tp2:false,
tp3:false,
sl1:false,
sl2:false
});

function hitEvent(key,label,level,type){

if(hit[key])return;

hit[key]=true;

addTrackEvent(
track,
type,
price,
label+
"｜現價 "+
fmt(price)+
"｜目標 "+
fmt(level)
);

sendSystemNotification(
"幽冥分析｜"+
symbol+
" "+
label,
(track.name||"")+
"｜現價 "+
fmt(price)+
"｜"+
label+
" "+
fmt(level),
symbol,
"track-"+track.id+"-"+key
);

changed=true
}

if(price<=Number(next.sl2)){

hitEvent(
"sl1",
"觸及 SL1",
next.sl1,
"SL"
);

hitEvent(
"sl2",
"觸及 SL2",
next.sl2,
"SL"
);

track.closedAt=Date.now();
track.status="SL2";

}else if(price<=Number(next.sl1)){

hitEvent(
"sl1",
"觸及 SL1",
next.sl1,
"SL"
);

track.status="SL1";

}else{

if(price>=Number(next.tp1)){
hitEvent(
"tp1",
"達到 TP1",
next.tp1,
"TP"
)
}

if(price>=Number(next.tp2)){
hitEvent(
"tp2",
"達到 TP2",
next.tp2,
"TP"
)
}

if(price>=Number(next.tp3)){

hitEvent(
"tp3",
"達到 TP3",
next.tp3,
"TP"
);

track.closedAt=Date.now();
track.status="TP3"
}

}

changed=true
});

if(changed){

/*
只寫回這支股票自己的資料。
*/
all[symbol]=list;

saveStrategyTracks(all)
}
}

/* 首頁進場提醒 */
function getNotifyCooldown(){
try{
return JSON.parse(
localStorage.getItem(NOTIFY_COOLDOWN_KEY)||"{}"
)||{}
}catch(e){
return{}
}
}

function canNotify(key){
var d=getNotifyCooldown();
return !d[key]||
Date.now()-d[key]>ENTRY_NOTIFY_COOLDOWN
}

function markNotified(key){
var d=getNotifyCooldown();

d[key]=Date.now();

Object.keys(d).forEach(k=>{
if(Date.now()-d[k]>86400000){
delete d[k]
}

/* 回測 */
function strategyConditionAt(type,rows,index){
var part=rows.slice(
0,
index+1
);

if(part.length<65)return null;

var price=Number(
part.at(-1).close
);

var ma20=average(
part.slice(-20)
.map(x=>Number(x.close))
);

var ma60=average(
part.slice(-60)
.map(x=>Number(x.close))
);

var rsi=historicalRSI(
part,
14
);

var macd=historicalMACD(
part
);

var atr=historicalATR(
part,
14
);

var recent20=part.slice(-20);

var resistance=Math.max(
...recent20
.map(x=>Number(x.high))
.filter(Number.isFinite)
);

var support=Math.min(
...recent20
.map(x=>Number(x.low))
.filter(Number.isFinite)
);

var low10=Math.min(
...part.slice(-10)
.map(x=>Number(x.low))
.filter(Number.isFinite)
);

var vols=
part.slice(-21,-1)
.map(x=>Number(x.volume))
.filter(Number.isFinite);

var currentVolume=
Number(part.at(-1).volume)||0;

var avgVolume=
vols.length
?average(vols)
:0;

var ratio=
avgVolume>0
?currentVolume/avgVolume
:1;

var m={
price,
ma20,
ma60,
rsi,
macd,
atr,
resistance,
support,
low10,
rows:part
};

var v={
ratio,
current:currentVolume,
average20:avgVolume
};

var setups=buildStrategySetups(
{},
m,
v
);

var setup=setups[type];

if(!setup)return null;

return{
m,
v,
setup
}
}

function backtestStrategy(type,rows){
if(
!Array.isArray(rows)||
rows.length<80
){
return{
trades:0,
wins:0,
losses:0,
winRate:0,
avgR:0,
warning:true
}
}

var start=Math.max(
65,
rows.length-BACKTEST_DAYS
);

var trades=[];
var i=start;

while(i<rows.length-2){

var state=
strategyConditionAt(
type,
rows,
i
);

if(
!state||
state.setup.score<75
){
i++;
continue
}

var targets=
strategyTargets(
type,
state.m
);

var row=rows[i];
var close=Number(row.close);

var inZone=
close>=targets.entryLow&&
close<=targets.entryHigh;

if(!inZone){
i++;
continue
}

var entry=close;
var stop=targets.stop1;
var risk=entry-stop;

if(
!Number.isFinite(risk)||
risk<=0
){
i++;
continue
}

var target=
targets.tp2;

var result=null;
var exitR=0;

var end=Math.min(
rows.length-1,
i+BACKTEST_MAX_HOLD
);

for(
var j=i+1;
j<=end;
j++
){

var high=
Number(rows[j].high);

var low=
Number(rows[j].low);

if(low<=stop){

result="LOSS";
exitR=-1;
break
}

if(high>=target){

result="WIN";
exitR=
(target-entry)/risk;
break
}

}

if(!result){

var finalClose=
Number(rows[end].close);

exitR=
(finalClose-entry)/risk;

result=
exitR>0
?"WIN"
:"LOSS"
}

trades.push({
result,
r:exitR
});

i=end+1
}

var wins=
trades.filter(x=>
x.result==="WIN"
).length;

var losses=
trades.length-wins;

var winRate=
trades.length
?wins/trades.length*100
:0;

var avgR=
trades.length
?average(
trades.map(x=>x.r)
)
:0;

return{
trades:trades.length,
wins,
losses,
winRate,
avgR,
warning:
trades.length<BACKTEST_MIN_TRADES||
winRate<BACKTEST_WARNING_RATE
}
}

function buildBacktests(d){
var rows=d.rows||[];

return{
PULLBACK:backtestStrategy(
"PULLBACK",
rows
),
HIGH_R:backtestStrategy(
"HIGH_R",
rows
),
SURGE:backtestStrategy(
"SURGE",
rows
)
}
}

/* =========================================================
   這次最重要修正：
   股票切換時，舊 API 結果不准蓋到新股票。
   ========================================================= */

async function analyze(symbol){
symbol=normalizeSymbol(symbol);

if(!symbol)return;

/*
每次分析都取得新的 request ID。
例如：
先點 A 股票 -> request 101
再點 B 股票 -> request 102

即使 A 比 B 晚回來，
101 != 102，
A 的結果直接丟掉。
*/
var requestId=
++analysisRequestSeq;

saveSearchHistory(
symbol
);

var suggest=
el("searchSuggest");

if(suggest){
suggest.classList.add(
"hidden"
)
}

el("homeView")
.classList.add(
"hidden"
);

var view=
el("analysisView");

view.classList.remove(
"hidden",
"swiping-back",
"swipe-return"
);

view.style.transform="";
view.style.opacity="";

/*
先設定新股票，
再清除上一支股票所有暫存分析資料。
*/
currentAnalysisSymbol=
symbol;

currentAnalysisData=null;
currentMarketMetrics=null;
currentSetups=null;
currentBacktests=null;

el("analysisResult").innerHTML=
'<div class="loading">'+
'正在分析 '+
safe(symbol)+
'…</div>';

window.scrollTo({
top:0,
behavior:"smooth"
});

try{

var d=
await fetchStockData(
symbol
);

/*
=========================================================
防止舊股票回傳結果覆蓋目前股票
=========================================================
*/
if(
requestId!==analysisRequestSeq||
normalizeSymbol(currentAnalysisSymbol)!==symbol
){
return
}

/*
API 如果意外回傳另一支股票，
也禁止顯示。
*/
if(
normalizeSymbol(d.symbol)!==symbol
){
throw new Error(
"股票資料代號不一致，已停止顯示舊資料"
)
}

buildAnalysis(
d,
symbol
);

}catch(e){

/*
如果使用者已經切去另一支，
舊股票錯誤訊息也不能跳出來。
*/
if(
requestId!==analysisRequestSeq||
normalizeSymbol(currentAnalysisSymbol)!==symbol
){
return
}

el("analysisResult").innerHTML=
'<div class="error">'+
safe(e.message)+
'</div>'
}
}

/* 個股自動更新 */
async function refreshCurrentAnalysis(){
if(
analysisRefreshing||
!currentAnalysisSymbol
)return;

var symbol=
normalizeSymbol(
currentAnalysisSymbol
);

var requestId=
analysisRequestSeq;

analysisRefreshing=true;

try{

var d=
await fetchStockData(
symbol
);

/*
更新完成時：
1. request ID 必須沒變
2. 使用者仍然在同一支股票
3. API 回來的 symbol 也必須相同
*/
if(
requestId!==analysisRequestSeq||
normalizeSymbol(currentAnalysisSymbol)!==symbol||
normalizeSymbol(d.symbol)!==symbol
){
return
}

buildAnalysis(
d,
symbol
);

}catch(e){
/*
自動更新失敗不覆蓋原本畫面
*/
}finally{
analysisRefreshing=false
}
}

/* 妖股候選掃描 */
async function scanMonsterCandidates(){
var map=new Map();

function add(x){
if(!x||!x.symbol)return;

var symbol=
normalizeSymbol(
x.symbol
);

if(!map.has(symbol)){
map.set(
symbol,
{
symbol,
name:x.name||""
}
)
}
}

if(radarData){

[
"strategyReady",
"strategy",
"longWatch",
"long",
"radar",
"watch"
].forEach(k=>{

(radarData[k]||[])
.forEach(add)

})
}

getWatchlist()
.forEach(add);

var candidates=
[...map.values()]
.slice(0,18);

if(!candidates.length){
monsterStocks=[];
renderMonsterStocks();
return
}

var results=[];

for(var i=0;i<candidates.length;i++){

var c=candidates[i];

try{

var d=
await fetchStockData(
c.symbol
);

var m=
marketOf(d);

var v=
volumeMetrics(
d,
m.rows
);

var z=
monsterMetrics(
d,
m,
v
);

results.push({
symbol:normalizeSymbol(d.symbol),
name:d.name||c.name||"",
price:m.price,
volumeRatio:v.ratio,
monster:z
});

/*
妖股背景掃描只做妖股提醒，
不允許呼叫 buildAnalysis，
所以不會污染目前個股分析畫面。
*/
checkMonsterNotification(
d,
m,
v,
z
);

}catch(e){}

}

monsterStocks=
results.sort(
(a,b)=>
b.monster.score-
a.monster.score
);

renderMonsterStocks()
}

}

/* iPhone 左滑返回 */
(function(){
var startX=0;
var startY=0;
var moving=false;

var view=
el("analysisView");

view.addEventListener(
"touchstart",
e=>{

if(
view.classList.contains("hidden")||
!e.touches||
!e.touches.length
)return;

var t=
e.touches[0];

if(t.clientX>35)return;

startX=t.clientX;
startY=t.clientY;
moving=true

},
{
passive:true
}
);

view.addEventListener(
"touchmove",
e=>{

if(
!moving||
!e.touches||
!e.touches.length
)return;

var t=
e.touches[0];

var dx=
t.clientX-startX;

var dy=
Math.abs(
t.clientY-startY
);

if(
dx<=0||
dy>80
)return;

var x=
Math.min(
dx,
window.innerWidth
);

view.classList.add(
"swiping-back"
);

view.style.transform=
"translateX("+x+"px)";

view.style.opacity=
String(
Math.max(
.35,
1-x/window.innerWidth*.65
)
)

},
{
passive:true
}
);

view.addEventListener(
"touchend",
e=>{

if(!moving)return;

moving=false;

var changed=
e.changedTouches&&
e.changedTouches[0];

var dx=
changed
?changed.clientX-startX
:0;

if(dx>window.innerWidth*.28){

view.style.transform=
"translateX(100%)";

view.style.opacity="0";

setTimeout(
goBackHome,
160
)

}else{

view.classList.add(
"swipe-return"
);

view.style.transform="";
view.style.opacity="";

setTimeout(()=>{
view.classList.remove(
"swiping-back",
"swipe-return"
)
},180)

}

},
{
passive:true
}
)
})();
