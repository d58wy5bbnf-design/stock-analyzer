<script>
const WATCH_KEY="yaozi_watchlist";
const HISTORY_KEY="yaozi_search_history_v1";
const POSITION_KEY="yaozi_positions_v46";

const NOTIFY_COOLDOWN_KEY="yaozi_entry_notify_cooldown_v1";
const HOME_ENTRY_KEY="yaozi_home_entry_alerts_v1";
const STRATEGY_TRACK_KEY="yaozi_strategy_tracking_v1";
const POSITION_SL_KEY="yaozi_position_sl_notify_v1";
const MONSTER_NOTIFY_KEY="yaozi_monster_notify_v1";

const BACKTEST_DAYS=365;
const BACKTEST_OBSERVE_DAYS=30;
const BACKTEST_MIN_TRADES=8;
const BACKTEST_WARNING_RATE=70;
const BACKTEST_MAX_HOLD=20;

const ENTRY_NOTIFY_COOLDOWN=30*60*1000;
const HOME_ENTRY_LIFETIME=30*60*1000;

var currentAnalysisSymbol="";
var currentAnalysisData=null;
var radarData=null;
var currentMarketMetrics=null;
var currentSetups=null;
var currentBacktests=null;
var analysisRefreshing=false;
var searchTimer=null;
var monsterStocks=[];

var expanded={
watch:true,
strategy:true,
long:true,
radar:true
};

var countdownSeconds=60;

function el(id){
return document.getElementById(id)
}

function safe(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
}

function fmt(n,d=2){
n=Number(n);
if(!Number.isFinite(n))return"--";

return n.toLocaleString("zh-TW",{
minimumFractionDigits:d,
maximumFractionDigits:d
})
}

function pct(n){
n=Number(n);
if(!Number.isFinite(n))return"--";
return(n>=0?"+":"")+fmt(n,2)+"%"
}

function pclass(n){
return Number(n)>=0?"up":"down"
}

function currentTimeText(){
return new Date().toLocaleTimeString("zh-TW",{
hour:"2-digit",
minute:"2-digit"
})
}

function average(a){
var x=a.filter(Number.isFinite);
return x.length?x.reduce((s,n)=>s+n,0)/x.length:0
}

function sma(values,p){
if(values.length<p)return average(values);
return average(values.slice(-p))
}

function ema(values,p){
if(!values.length)return 0;

var k=2/(p+1);
var e=values[0];

for(var i=1;i<values.length;i++){
e=values[i]*k+e*(1-k)
}

return e
}

function calcRSI(closes,p=14){
if(closes.length<=p)return 50;

var gains=0;
var losses=0;

for(var i=closes.length-p;i<closes.length;i++){
var diff=closes[i]-closes[i-1];

if(diff>0)gains+=diff;
else losses-=diff
}

if(losses===0)return 100;

var rs=(gains/p)/(losses/p);
return 100-(100/(1+rs))
}

function calcATR(rows,p=14){
if(rows.length<2)return 0;

var trs=[];

for(var i=Math.max(1,rows.length-p);i<rows.length;i++){
var h=Number(rows[i].high);
var l=Number(rows[i].low);
var pc=Number(rows[i-1].close);

trs.push(
Math.max(
h-l,
Math.abs(h-pc),
Math.abs(l-pc)
)
)
}

return average(trs)
}

function normalizeRow(r){
return{
date:r.date,
open:Number(r.open),
high:Number(r.high),
low:Number(r.low),
close:Number(r.close),
volume:Number(r.volume||0)
}
}

function getRows(d){
return(d.rows||[])
.map(normalizeRow)
.filter(x=>Number.isFinite(x.close)&&x.close>0)
}

function marketOf(d){
var rows=getRows(d);
var closes=rows.map(x=>x.close);

var price=Number(d.price||closes.at(-1));
var ma20=sma(closes,20);
var ma60=sma(closes,60);

var e12=ema(closes.slice(-100),12);
var e26=ema(closes.slice(-100),26);

var macd=e12-e26;
var rsi=calcRSI(closes,14);

ratio>=2?"明顯放量":
ratio>=1.3?"量能偏強":
ratio>=.8?"量能正常":
"量能偏低";

return{
current,
average20,
ratio,
level
}
}

function strategyTargets(type,m){
var price=m.price;
var atr=Math.max(m.atr,price*.005);

var entryLow;
var entryHigh;

if(type==="PULLBACK"){
entryLow=Math.max(
m.support,
m.ma20-atr*.45
);

entryHigh=Math.max(
entryLow,
Math.min(
price,
m.ma20+atr*.35
)
)
}else if(type==="HIGH_R"){
entryLow=Math.max(
m.ma20,
m.resistance-atr*.55
);

entryHigh=Math.max(
entryLow,
Math.min(
price,
m.resistance+atr*.2
)
)
}else{
entryLow=Math.max(
m.ma20,
price-atr*.7
);

entryHigh=Math.max(
entryLow,
Math.min(
price,
price-atr*.1
)
)
}

entryLow=Math.max(entryLow,price*.5);

/* 觀察入場區間不得高於目前市價 */
if(entryLow>price)entryLow=price;
if(entryHigh>price)entryHigh=price;
if(entryHigh<entryLow)entryLow=entryHigh;

var center=(entryLow+entryHigh)/2;

var stop1;
var stop2;

if(type==="PULLBACK"){
stop1=Math.min(
entryLow-atr*.65,
m.ma20-atr*.9
);

stop2=Math.min(
stop1-atr*.65,
m.support-atr*.45
)
}else if(type==="HIGH_R"){
stop1=Math.min(
entryLow-atr*.7,
m.resistance-atr*1.05
);

stop2=Math.min(
stop1-atr*.7,
m.ma20-atr*.65
)
}else{
stop1=Math.min(
entryLow-atr*.8,
m.ma20-atr*.55
);

stop2=Math.min(
stop1-atr*.75,
m.ma20-atr*1.25
)
}

if(stop1>=entryLow){
stop1=entryLow-atr*.7
}

if(stop2>=stop1){
stop2=stop1-atr*.65
}

var risk=Math.max(center-stop1,atr*.65);

var previousHigh=Math.max(
m.resistance,
m.high60
);

var tp1=Math.max(
center+risk*1.2,
Math.min(previousHigh,center+risk*1.7)
);

var tp2=Math.max(
tp1+atr*.45,
center+risk*2
);

var tp3=Math.max(
tp2+atr*.6,
center+risk*3
);

return{
entryLow,
entryHigh,
center,
stop1,
stop2,
previousHigh,
tp1,
tp2,
tp3
}
}

function simpleBacktest(rows,type){
var start=
Math.max(
60,
rows.length-BACKTEST_DAYS
);

var trades=0;
var wins=0;
var losses=0;
var totalR=0;

for(
var i=start;
i<rows.length-2;
i++
){

var slice=
rows.slice(0,i+1);

var d={
rows:slice,
price:slice.at(-1).close
};

var m=
marketOf(d);

var v=
volumeMetrics(
d,
slice
);

var setups=
buildStrategySetups(
d,
m,
v
);

var setup=
setups[type];

if(!setup.qualified){
continue
}

var t=
strategyTargets(
type,
m
);

var next=
rows[i+1];

var entry=
Number(next.open)||
Number(next.close);

if(
entry<
t.entryLow*.96||
entry>
t.entryHigh*1.04
){
continue
}

var risk=
entry-t.stop1;

if(risk<=0){
continue
}

var target=
Math.max(
t.tp1,
entry+risk*1.15
);

trades++;

var result=null;

for(
var j=i+1;
j<=Math.min(
rows.length-1,
i+BACKTEST_MAX_HOLD
);
j++
){

var bar=rows[j];

var hitStop=
bar.low<=t.stop1;

var hitTarget=
bar.high>=target;

if(hitStop){
result=-1;
break
}

if(hitTarget){
result=
(target-entry)/risk;
break
}

}

if(result===null){

var end=
rows[
Math.min(
rows.length-1,
i+BACKTEST_MAX_HOLD
)
].close;

result=
(end-entry)/risk
}

totalR+=result;

if(result>0){
wins++
}else{
losses++
}

i+=2
}

return{
trades,
wins,
losses,
winRate:
trades
?wins/trades*100
:0,
avgR:
trades
?totalR/trades
:0
}
}

function run365Backtest(rows){
return{
PULLBACK:
simpleBacktest(
rows,
"PULLBACK"
),
HIGH_R:
simpleBacktest(
rows,
"HIGH_R"
),
SURGE:
simpleBacktest(
rows,
"SURGE"
)
}
}

function backtestObservation(rows){

BACKTEST_OBSERVE_DAYS,
rows.length
)
}
}

(function(){
var view=
el("analysisView");

var startX=0;
var startY=0;
var currentX=0;
var startTime=0;
var tracking=false;
var locked=false;

view.addEventListener(
"touchstart",
function(e){

if(
view.classList.contains("hidden")||
e.touches.length!==1
){
return
}

var t=e.touches[0];

if(t.clientX>32){
return
}

startX=t.clientX;
startY=t.clientY;
currentX=startX;
startTime=Date.now();
tracking=true;
locked=false;

view.classList.add(
"swiping-back"
)

},
{passive:true}
);

view.addEventListener(
"touchmove",
function(e){

if(
!tracking||
e.touches.length!==1
){
return
}

var t=e.touches[0];

var dx=
Math.max(
0,
t.clientX-startX
);

var dy=
Math.abs(
t.clientY-startY
);

if(!locked){

if(
dy>10&&
dy>dx
){

tracking=false;

view.classList.remove(
"swiping-back"
);

return
}

if(dx>8){
locked=true
}

}

if(!locked)return;

currentX=t.clientX;

var width=
Math.max(
window.innerWidth,
1
);

var progress=
Math.min(
dx/width,
1
);

view.style.transform=
"translate3d("+
dx+
"px,0,0)";

view.style.opacity=
String(
1-progress*.18
);

if(e.cancelable){
e.preventDefault()
}

},
{passive:false}
);

function finish(){
if(!tracking)return;

tracking=false;

view.classList.remove(
"swiping-back"
);

var dx=
Math.max(
0,
currentX-startX
);

var elapsed=
Math.max(
Date.now()-startTime,
1
);

var velocity=
dx/elapsed;

var back=
dx>
Math.min(
window.innerWidth*.28,
120
)||
velocity>.55;

view.classList.add(
"swipe-return"
);

if(back){

view.style.transform=
"translate3d(100vw,0,0)";

view.style.opacity=".82";

setTimeout(
goBackHome,
210
)

}else{

view.style.transform=
"translate3d(0,0,0)";

view.style.opacity="1";

setTimeout(()=>{
view.classList.remove(
"swipe-return"
);

view.style.transform="";
view.style.opacity=""
},230)

}
}

view.addEventListener(
"touchend",
finish,
{passive:true}
);

view.addEventListener(
"touchcancel",
finish,
{passive:true}
)
})();

function getEntryNotifyState(){
try{
return JSON.parse(
localStorage.getItem(
"yaozi_entry_notify_state_v3"
)||"{}"
)||{}
}catch(e){
return{}
}
}

function saveEntryNotifyState(x){
try{
localStorage.setItem(
"yaozi_entry_notify_state_v3",
JSON.stringify(x||{})
)
}catch(e){}
}

function pullbackZoneFromRadarItem(s){
var low=
Number(
s.entryLow??
s.entry_low??
s.observationLow??
s.observation_low
);

var high=
Number(
s.entryHigh??
s.entry_high??
s.observationHigh??
s.observation_high
);

if(
Number.isFinite(low)&&
Number.isFinite(high)&&
low>0&&
high>0
){

if(high<low){
var z=low;
low=high;
high=z
}

return{
low,
high
}
}

var price=
Number(s.price);

var ma20=
Number(s.ma20);

var support=
Number(s.support);

var atr=
Number(s.atr);

if(
Number.isFinite(price)&&
price>0&&
Number.isFinite(ma20)&&
ma20>0&&
Number.isFinite(atr)&&
atr>0
){

if(
!Number.isFinite(support)||
support<=0
){
support=ma20
}

low=
Math.max(
ma20-atr*.25,
support
);

high=
Math.min(
price+atr*.15,
ma20+atr*.45
);

if(high<low){
high=
low+atr*.25
}

if(low>price){
low=price
}

if(high>price){
high=price
}

if(high<low){
low=high
}

return{
low,
high
}
}

return null
}

function isPullbackRadarItem(s){
var name=
String(
s.strategy||
s.strategyName||
s.type||
""
).toUpperCase();

return(
name.includes("回踩")||
name.includes("PULLBACK")
)
}

function sendEntryNotification(
title,
body,
key
){
if(
!("Notification" in window)||
Notification.permission!=="granted"
){
return
}

var state=
getEntryNotifyState();

var now=
Date.now();

var last=
Number(
state[key]||0
);

if(
now-last<
30*60*1000
){
return
}

try{
new Notification(
title,
{
body,
tag:key,
renotify:false
}
);

state[key]=now;

saveEntryNotifyState(
state
)

}catch(e){}
}

function checkRadarEntryNotifications(d){
var formal=
Array.isArray(d.strategyReady)
?d.strategyReady
:[];

var radar=
Array.isArray(d.radar)
?d.radar
:[];

var all=[
...formal,
...radar
];

var seen={};

all.forEach(s=>{

var symbol=
String(
s.symbol||""
).toUpperCase();

if(!symbol)return;

if(
!isPullbackRadarItem(s)
){
return
}

var score=
Number(
s.entryScore??
s.score
);

var price=
Number(s.price);

var zone=
pullbackZoneFromRadarItem(s);

if(
!Number.isFinite(price)||
price<=0
){
return
}

if(
!zone||
!Number.isFinite(zone.low)||
!Number.isFinite(zone.high)
){
return
}

var inZone=
price>=zone.low&&
price<=zone.high;

var formalItem=
formal.find(
x=>
String(
x.symbol||""
).toUpperCase()===
symbol
);

var passed=
Number(
s.passed??
s.conditionPassed??
s.conditionsPassed
);

var total=
Number(
s.total??
s.conditionTotal??
s.conditionsTotal
);

if(
!Number.isFinite(passed)
){

if(Number.isFinite(score)){
passed=
Math.round(
score/100*8
)
}else{
passed=0
}

}

if(
!Number.isFinite(total)||
total<=0
){
total=8
}

var formalQualified=
passed>=7||
score>=88||
!!formalItem;

var stateKey=
symbol+"_"+
(formalQualified?"formal":"near");

if(seen[stateKey]){
return
}

seen[stateKey]=1;

if(
formalQualified&&
inZone
){

var body=
(s.name
?String(s.name)+" "
:"")+
"支撐回踩策略已成立，目前符合 "+
passed+
"/"+
total+
" 條件。"+
"目前已進入回踩觀察區 "+
fmt(zone.low)+
"～"+
fmt(zone.high)+
"，現價 "+
fmt(price)+
"。";

sendEntryNotification(
"🟢 "+
symbol+
" 回踩正式訊號",
body,
"pullback_formal_"+symbol
);

return
}

var nearQualified=
passed===6||
(
score>=75&&
score<88
);

if(
nearQualified&&
inZone
){

var body2=
(s.name
?String(s.name)+" "
:"")+
"目前符合 "+
passed+
"/"+
total+
" 條件，且已進入回踩觀察區 "+
fmt(zone.low)+
"～"+
fmt(zone.high)+
"，現價 "+
fmt(price)+
"。這是接近形成預警，尚非正式策略成立。";

sendEntryNotification(
"🟡 "+
symbol+
" 回踩接近形成",
body2,
"pullback_near_"+symbol
)

}
})
}

function renderSearchSuggestions(items){
var box=
el("searchSuggest");

if(!box)return;

if(
!Array.isArray(items)||
!items.length
){
box.innerHTML="";
box.classList.add("hidden");
return
}

box.innerHTML=
items.slice(0,8)
.map(x=>{

var symbol=
String(
x.symbol||
x.code||
x.ticker||
""
).toUpperCase();

var name=
String(
x.name||
x.stockName||
""
);

if(!symbol)return"";

return`
<div
class="suggest-item"
data-suggest="${safe(symbol)}"
>

<div class="suggest-symbol">
${safe(symbol)}
</div>

<div class="suggest-name">
${safe(name)}
</div>

</div>
`
}).join("");

box.classList.remove("hidden");

box.querySelectorAll("[data-suggest]")
.forEach(x=>{

x.onclick=()=>{

var symbol=
x.dataset.suggest;

el("searchInput").value=
symbol;

box.classList.add("hidden");

analyze(symbol)
}

})
}

async function searchSymbols(q){
try{

var r=
await fetch(
"/api/search?q="+
encodeURIComponent(q)+
"&t="+Date.now(),
{
cache:"no-store"
}
);

var d=
await r.json();

var a=
Array.isArray(d)
?d
:Array.isArray(d.results)
?d.results
:Array.isArray(d.data)
?d.data
:[];

renderSearchSuggestions(a)

}catch(e){
renderSearchSuggestions([])
}
}
