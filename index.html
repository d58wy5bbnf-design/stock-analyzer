<script>

const WATCH_KEY =
'swing_tw_watch_v1';

const HISTORY_KEY =
'swing_tw_search_history_v1';

const DEFAULT = [
'2330','2317','2454','2308',
'2382','3231','2881','2882',
'2891','2886','2603','2615'
];

let tab='signal';
let cache={};
let current='';
let detailTimer=null;
let radarTimer=null;
let searchTimer=null;
let selectedSearchSymbol='';

const $ =
id=>document.getElementById(id);

const fmt =
(n,d=2)=>
Number.isFinite(+n)
?
(+n).toLocaleString(
'zh-TW',
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
:
'--';

const esc =
s=>
String(s??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');


/* =========================================================
   LocalStorage
========================================================= */

const watch=()=>{

try{

const x=
JSON.parse(
localStorage.getItem(WATCH_KEY)||'[]'
);

return Array.isArray(x)?x:[];

}catch{
return [];
}

};

const saveWatch =
a=>
localStorage.setItem(
WATCH_KEY,
JSON.stringify([...new Set(a)])
);

const searchHistory=()=>{

try{

const x=
JSON.parse(
localStorage.getItem(HISTORY_KEY)||'[]'
);

return Array.isArray(x)?x:[];

}catch{
return [];
}

};

function saveSearchHistory(a){

if(!a?.symbol)return;

let h=
searchHistory()
.filter(
x=>x.symbol!==a.symbol
);

h.unshift({
symbol:String(a.symbol),
name:String(a.name||''),
time:Date.now()
});

localStorage.setItem(
HISTORY_KEY,
JSON.stringify(h.slice(0,10))
);

}


/* =========================================================
   API
========================================================= */

async function getStock(symbol){

const r=
await fetch(
'/api/stock?symbol='+
encodeURIComponent(symbol)+
'&t='+Date.now(),
{cache:'no-store'}
);

let d;

try{
d=await r.json();
}catch{
throw Error('股票資料格式錯誤');
}

if(!r.ok||!d.ok){
throw Error(
d.error||'資料取得失敗'
);
}

return d;

}


/* =========================================================
   Indicators
========================================================= */

function avg(a){

return a.length
?
a.reduce((x,y)=>x+y,0)/a.length
:
0;

}

function sma(a,n){
return avg(a.slice(-n));
}

function ema(a,n){

if(!a.length)return 0;

let e=a[0];
const k=2/(n+1);

for(let i=1;i<a.length;i++){
e=a[i]*k+e*(1-k);
}

return e;

}

function rsi(a,n=14){

if(a.length<=n)return 50;

let g=0,l=0;

for(
let i=a.length-n;
i<a.length;
i++
){

const d=a[i]-a[i-1];

if(d>0)g+=d;
else l-=d;

}

if(l===0)return 100;

return 100-
100/(1+(g/n)/(l/n));

}

function atr(rows,n=14){

let values=[];

for(
let i=Math.max(1,rows.length-n);
i<rows.length;
i++
){

const x=rows[i];
const p=rows[i-1].close;

values.push(
Math.max(
x.high-x.low,
Math.abs(x.high-p),
Math.abs(x.low-p)
)
);

}

return avg(values);

}


/* =========================================================
   結構工具
========================================================= */

function clusterLevels(
values,
tolerance
){

let sorted=
values
.filter(
x=>Number.isFinite(x)&&x>0
)
.sort((a,b)=>a-b);

let groups=[];

for(const value of sorted){

let found=null;

for(const g of groups){

if(
Math.abs(
value-g.value
)
<=tolerance
){

found=g;
break;

}

}

if(found){

found.values.push(value);

found.value=
avg(found.values);

found.hits++;

}else{

groups.push({
value,
values:[value],
hits:1
});

}

}

return groups;

}


function structureAnalysis(
rows,
price,
A,
m20,
m60
){

const recent=
rows.slice(-120);

const volumeBase=
avg(
recent
.slice(-21,-1)
.map(x=>x.volume)
);

let supportCandidates=[];
let pressureCandidates=[];


/*
  Swing High / Swing Low
*/

for(
let i=2;
i<recent.length-2;
i++
){

const x=recent[i];

const swingLow=
x.low<=recent[i-1].low &&
x.low<=recent[i-2].low &&
x.low<=recent[i+1].low &&
x.low<=recent[i+2].low;

const swingHigh=
x.high>=recent[i-1].high &&
x.high>=recent[i-2].high &&
x.high>=recent[i+1].high &&
x.high>=recent[i+2].high;

if(swingLow){

supportCandidates.push(
x.low,
x.close
);

}

if(swingHigh){

pressureCandidates.push(
x.high,
x.close
);

}

}


/*
  爆量 K
*/

const volumeKs=
recent
.filter(
x=>
volumeBase>0 &&
x.volume>=volumeBase*1.55
)
.slice(-12);

for(const x of volumeKs){

supportCandidates.push(
x.low,
x.close
);

pressureCandidates.push(
x.high
);

}


/*
  均線也視為結構候選
*/

supportCandidates.push(
m20,
m60
);

pressureCandidates.push(
m20,
m60
);


const tolerance=
Math.max(
A*.38,
price*.006
);

const supports=
clusterLevels(
supportCandidates,
tolerance
)
.filter(
x=>x.value<price*1.008
)
.sort(
(a,b)=>
b.value-a.value
);

const pressures=
clusterLevels(
pressureCandidates,
tolerance
)
.filter(
x=>x.value>price*1.003
)
.sort(
(a,b)=>
a.value-b.value
);


/*
  支撐優先考慮：
  靠近現價 + 被碰過多次
*/

function supportScore(x){

const distance=
Math.abs(price-x.value)/price;

return (
x.hits*2
-
distance*35
);

}

const supportPool=
supports
.slice(0,8)
.sort(
(a,b)=>
supportScore(b)-supportScore(a)
);


let support1=
supportPool[0]?.value
||
Math.min(
m20,
price-A
);


let support2=
supportPool
.find(
x=>
x.value<
support1-
tolerance*.7
)
?.value
||
Math.min(
m60,
support1-A
);


/*
  關鍵突破：
  找離現價最近的上方真實結構
*/

let breakout=
pressures[0]?.value
||
Math.max(
...rows.slice(-20).map(x=>x.high)
);


/*
  第一、第二壓力
*/

let pressure1=
pressures.find(
x=>
x.value>
breakout+
tolerance*.55
)
?.value;


if(!pressure1){

pressure1=
breakout+
Math.max(
A*1.3,
price*.025
);

}


let pressure2=
pressures.find(
x=>
x.value>
pressure1+
tolerance*.55
)
?.value;


if(!pressure2){

pressure2=
pressure1+
Math.max(
A*1.6,
price*.035
);

}


/*
  爆量 K 支撐
*/

let volumeSupport=null;

for(
let i=volumeKs.length-1;
i>=0;
i--
){

const x=volumeKs[i];

if(
x.close<price*1.01
){

volumeSupport=
x.close;

break;

}

}


return {

support1,
support2,
breakout,
pressure1,
pressure2,
volumeSupport,
volumeKs:volumeKs.length

};

}


/* =========================================================
   主分析
========================================================= */

function analyzeData(d){

if(
!Array.isArray(d.rows) ||
d.rows.length<60
){
throw Error(
'歷史資料不足，無法分析'
);
}

let rows=
d.rows
.map(x=>({
date:x.date||'',
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0
}))
.filter(
x=>
Number.isFinite(x.close)&&
x.close>0
);

if(rows.length<60){
throw Error('有效 K 線不足');
}

const c=
rows.map(x=>x.close);

let p=+d.price;

if(!Number.isFinite(p)||p<=0){
p=rows.at(-1).close;
}

const m5=sma(c,5);
const m13=sma(c,13);
const m20=sma(c,20);
const m60=sma(c,60);

const A=
Math.max(
atr(rows),
p*.006
);

const R=rsi(c);

const macd=
ema(c.slice(-100),12)-
ema(c.slice(-100),26);

const r20=
rows.slice(-20);

const r60=
rows.slice(-60);

const support=
Math.min(
...r20.map(x=>x.low)
);

const res=
Math.max(
...r20.map(x=>x.high)
);

const high60=
Math.max(
...r60.map(x=>x.high)
);

const vol=
rows.at(-1).volume;

const volAvg=
avg(
rows
.slice(-21,-1)
.map(x=>x.volume)
);

const vr=
volAvg
?
vol/volAvg
:
0;


/*
  原本 8 條策略完全保留
*/

const cond=[

[
'MA20 高於 MA60',
m20>m60,
'中期趨勢維持多頭排列'
],

[
'現價守在 MA60 上方',
p>=m60*.985,
'避免在中期結構已轉弱時進場'
],

[
'價格沒有過度遠離 MA20',
Math.abs(p-m20)<=A*2.2,
'避免追在短線過熱的位置'
],

[
'近期支撐仍有效',
p>=support*.99,
'價格尚未明顯跌破 20 日支撐'
],

[
'RSI 位於健康區',
R>=45&&R<=72,
'動能足夠，同時避免過熱'
],

[
'MACD 動能未明顯轉空',
macd>=-A*.05,
'短線動能沒有明顯惡化'
],

[
'成交量正常或偏強',
vr>=.8,
'量能至少接近 20 日正常水準'
],

[
'上方仍有波段空間',
Math.max(res,high60)>p*1.025,
'上方目標空間足以規劃波段'
]

];

const passed=
cond.filter(x=>x[1]).length;

const score=
Math.round(
passed/8*100
);

const qualified=
passed>=7;

const near=
passed===6;


/*
  新結構分析
*/

const structure=
structureAnalysis(
rows,
p,
A,
m20,
m60
);


/*
  第一支撐帶
*/

const support1High=
Math.min(
p,
structure.support1+
A*.18
);

const support1Low=
Math.max(
0,
structure.support1-
A*.18
);


/*
  第二支撐帶
*/

const support2High=
Math.min(
support1Low,
structure.support2+
A*.18
);

const support2Low=
Math.max(
0,
structure.support2-
A*.18
);


/*
  進場區：
  優先使用最近有效支撐
*/

let entryHigh=
Math.min(
p,
support1High
);

let entryLow=
Math.min(
entryHigh,
support1Low
);


/*
  如果價格正在支撐上方很遠，
  不追價，仍保留回測區。
*/

if(
p-entryHigh>A*2.3
){

entryHigh=
Math.min(
p,
m20+A*.25
);

entryLow=
Math.min(
entryHigh,
m20-A*.35
);

}


/*
  結構 SL：
  第二支撐下方 / ATR 緩衝
*/

let sl=
Math.min(
support1Low-A*.55,
support2High-A*.15
);

const maxRisk=
p*.065;

if(
p-sl>maxRisk
){

sl=
p-maxRisk;

}

if(sl>=entryLow){

sl=
entryLow-
Math.max(
A*.55,
entryLow*.012
);

}


/*
  TP 不再硬套固定 R
  優先真實壓力結構
*/

let tp1=
structure.breakout;

if(
tp1<=p*1.006
){

tp1=
structure.pressure1;

}


let tp2=
Math.max(
structure.pressure1,
tp1+A*.65
);


let tp3=
Math.max(
structure.pressure2,
tp2+A*.85
);


/*
  確保目標排序
*/

if(tp2<=tp1){

tp2=
tp1+
Math.max(
A*.8,
p*.018
);

}

if(tp3<=tp2){

tp3=
tp2+
Math.max(
A,
p*.025
);

}


/*
  籌碼
*/

const chip=
d.institutional||{};

const chipBull=
chip.available &&
(
chip.total5>0 ||
chip.foreign5>0 ||
chip.trust5>0
);

const chipText=
!chip.available

'目前無法人資料'

chip.total5>0
?
'近 5 日法人偏多'

chip.total5<0
?
'近 5 日法人偏空'
:
'近 5 日法人持平';


return {

...d,

ma5:m5,
ma13:m13,
ma20:m20,

macd,

support,

/* =========================================================
   Notification
========================================================= */

function notifySignals(){

if(
!(
'Notification' in window
)
||
Notification.permission!=='granted'
)return;

let old={};

try{

old=
JSON.parse(
localStorage.getItem(
'swing_tw_signal_state'
)||'{}'
);

}catch{}

for(
const a of Object.values(cache)
){

if(
a.qualified &&
!old[a.symbol]
){

new Notification(
'🟢 '+a.symbol+' 波段策略成立',
{
body:
(a.name||'')+
' 現價 '+fmt(a.price)+
'，符合 '+a.passed+
'/8 條件'
}
);

old[a.symbol]=Date.now();

}

}

localStorage.setItem(
'swing_tw_signal_state',
JSON.stringify(old)
);

}

/* =========================================================
   Detail navigation
========================================================= */

async function openDetail(symbol){

symbol=
String(symbol||'').trim();

if(!symbol)return;

selectedSearchSymbol='';
hideSuggestions();

current=symbol;

$('home').classList.add('hidden');
$('detail').classList.remove('hidden');

$('detailBody').innerHTML=
'<div class="card loader">正在分析 '+
esc(symbol)+
'…</div>';

await refreshDetail();

clearInterval(detailTimer);

detailTimer=
setInterval(
refreshDetail,
20000
);

window.scrollTo(0,0);

}


async function refreshDetail(){

if(!current)return;

const s=current;

try{

const a=
analyzeData(
await getStock(s)
);

if(current!==s)return;

cache[s]=a;

saveSearchHistory({
symbol:a.symbol,
name:a.name||''
});

$('detailBody').innerHTML=
detailHTML(a);

bindFavorite(s,a);

}catch(e){

$('detailBody').innerHTML=
'<div class="empty">'+
esc(
e.message||
'資料取得失敗'
)+
'</div>';

}

}


function bindFavorite(
symbol,
analysis
){

const button=$('fav');

if(!button)return;

button.onclick=()=>{

let w=watch();

if(w.includes(symbol)){

w=w.filter(
x=>x!==symbol
);

}else{

w=[
symbol,
...w
];

}

saveWatch(w);

$('detailBody').innerHTML=
detailHTML(analysis);

bindFavorite(
symbol,
analysis
);

};

}


$('back').onclick=()=>{

current='';

clearInterval(detailTimer);

$('detail').classList.add('hidden');
$('home').classList.remove('hidden');

renderHome();

};


/* =========================================================
   Search
========================================================= */

async function searchStocks(q){

const r=
await fetch(
'/api/search?q='+
encodeURIComponent(q)+
'&t='+Date.now(),
{cache:'no-store'}
);

let d;

try{
d=await r.json();
}catch{
throw Error(
'搜尋 API 回傳格式錯誤'
);
}

if(!r.ok||!d.ok){
throw Error(
d.error||'搜尋失敗'
);
}

return Array.isArray(d.items)
?d.items
:[];

}


function hideSuggestions(){

const box=$('suggestions');

box.classList.add('hidden');
box.innerHTML='';

}


function renderSearchHistory(){

const history=
searchHistory();

if(!history.length){

hideSuggestions();
return;

}

const box=$('suggestions');

box.innerHTML=

`
<div class="history-head">

<span>最近搜尋</span>

<button
id="clearHistory"
class="history-clear"
type="button"
>
清除
</button>

</div>
`

+

history.map(
x=>`

<button
class="suggestion"
type="button"
data-history="${esc(x.symbol)}"
>

<div>

<div class="suggestion-main">
${esc(x.name||x.symbol)}
</div>

<div class="suggestion-code">
${esc(x.symbol)}
</div>

</div>

<div class="suggestion-market">
最近搜尋
</div>

</button>

`
).join('');

box.classList.remove('hidden');

box
.querySelectorAll('[data-history]')
.forEach(
button=>{

button.onclick=()=>{

const symbol=
button.dataset.history;

const item=
history.find(
x=>x.symbol===symbol
);

selectedSearchSymbol=symbol;

$('q').value=
item?.name
?
item.name+' '+symbol
:
symbol;

hideSuggestions();
openDetail(symbol);

};

}
);

const clear=$('clearHistory');

if(clear){

clear.onclick=e=>{

e.preventDefault();
e.stopPropagation();

localStorage.removeItem(
HISTORY_KEY
);

hideSuggestions();

};

}

}


function renderSuggestions(items){

const box=$('suggestions');

if(!items?.length){

hideSuggestions();
return;

}

box.innerHTML=
items.map(
x=>`

<button
class="suggestion"
type="button"
data-pick="${esc(x.symbol)}"
>

<div>

<div class="suggestion-main">
${esc(x.name||x.symbol)}
</div>

<div class="suggestion-code">
${esc(x.symbol)}
</div>

</div>

<div class="suggestion-market">
${x.market==='TWO'?'上櫃':'上市'}
</div>

</button>

`
).join('');

box.classList.remove('hidden');

box
.querySelectorAll('[data-pick]')
.forEach(
button=>{

button.onclick=()=>{

const symbol=
button.dataset.pick;

const item=
items.find(
x=>x.symbol===symbol
);

selectedSearchSymbol=symbol;

$('q').value=
item
?
item.name+' '+item.symbol
:
symbol;

hideSuggestions();
openDetail(symbol);

};

}
);

}


$('q').addEventListener(
'focus',
()=>{

if(!$('q').value.trim()){
renderSearchHistory();
}

}
);


$('q').addEventListener(
'input',
()=>{

selectedSearchSymbol='';

clearTimeout(searchTimer);

const keyword=
$('q').value.trim();

if(!keyword){

renderSearchHistory();
return;

}

searchTimer=
setTimeout(
async()=>{

try{

const items=
await searchStocks(keyword);

if(
$('q').value.trim()!==keyword
)return;

renderSuggestions(items);

}catch(e){

console.error(e);
hideSuggestions();

}

},
180
);

}
);


$('go').onclick=
async()=>{

const raw=
$('q').value.trim();

if(selectedSearchSymbol){

return openDetail(
selectedSearchSymbol
);

}

const direct=
(
raw.match(/\d{4,6}/)
||
[]
)[0];

if(direct){

return openDetail(direct);

}

if(!raw){

return alert(
'請輸入股票代號或名稱'
);

}

try{

const items=
await searchStocks(raw);

if(items.length===1){

return openDetail(
items[0].symbol
);

}

if(items.length>1){

renderSuggestions(items);
return;

}

alert(
'找不到符合的台股'
);

}catch(e){

alert(
e.message||
'搜尋失敗'
);

}

};


$('q').onkeydown=e=>{

if(e.key==='Enter'){

e.preventDefault();
$('go').click();

}

if(e.key==='Escape'){
hideSuggestions();
}

};


document.addEventListener(
'click',
e=>{

if(
!e.target.closest('.search-box')
&&
!e.target.closest('#go')
){

hideSuggestions();

}

}
);


/* =========================================================
   Tabs
========================================================= */

document
.querySelectorAll('.tab')

b=>{

b.onclick=()=>{

document
.querySelectorAll('.tab')

b.classList.add('on');

tab=b.dataset.tab;

radar();
