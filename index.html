<style>
*{box-sizing:border-box}
:root{--bg:#030504;--card:#0b0e0c;--border:#292e2b;--text:#f6f7f6;--muted:#8c918e;--green:#45e0ad;--red:#ff6976;--yellow:#ffc85a;--purple:#ae63ff;--orange:#ff9f43;--blue:#70b7ff}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at top,rgba(43,111,84,.09),transparent 28%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{width:min(100%,900px);margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
.header{margin-bottom:24px}
.header-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-size:31px;font-weight:950;letter-spacing:-1.5px}
.subtitle{margin-top:9px;color:var(--muted);font-size:13px}
.version{padding:7px 11px;border-radius:999px;color:var(--green);border:1px solid rgba(69,224,173,.25);background:rgba(69,224,173,.07);font-size:12px;font-weight:900}

.card{background:rgba(11,14,12,.97);border:1px solid var(--border);border-radius:21px;padding:16px;margin-bottom:15px}
.section{margin-top:27px}
.section-title{font-size:20px;font-weight:950}
.section-sub{color:var(--muted);font-size:11px;margin-top:5px;line-height:1.6}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 3px 13px}
.big-section-title{margin:31px 5px 15px;font-size:24px;font-weight:950;scroll-margin-top:25px}

.search-title{color:var(--muted);font-size:12px;margin:0 0 10px 4px}
.search-form{display:grid;grid-template-columns:1fr 100px;gap:9px}
.search-input,.position-input,.position-select{width:100%;height:53px;border:1px solid #303532;border-radius:15px;padding:0 15px;background:#070908;color:white;outline:none;font-size:16px}
.search-input:focus,.position-input:focus,.position-select:focus{border-color:rgba(69,224,173,.6)}
.search-btn{border:0;border-radius:15px;background:var(--green);color:#06130e;font-weight:950}
.examples{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.example{border:1px solid #292e2b;background:#111412;color:#a6aca8;border-radius:999px;padding:6px 10px;font-size:10px}

.watch-section{margin-top:25px}
.watch-grid,.grid{display:grid;gap:9px}
.watch-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0b0e0c;border:1px solid rgba(255,200,90,.20);border-radius:17px;padding:14px}
.watch-main{flex:1;cursor:pointer}
.watch-symbol{font-size:18px;font-weight:950}
.watch-name{color:var(--muted);font-size:11px;margin-top:4px}
.watch-open{color:var(--yellow);font-size:11px;margin-top:8px}
.watch-remove{width:38px;height:38px;border:1px solid #303532;background:#101311;color:#888e8a;border-radius:12px;font-size:17px}
.empty-watch{color:#777d79;border:1px dashed #292e2b;border-radius:16px;padding:18px;text-align:center;font-size:12px;line-height:1.7}

.favorite-btn{width:100%;min-height:48px;margin-top:15px;border-radius:15px;border:1px solid rgba(255,200,90,.28);background:rgba(255,200,90,.06);color:var(--yellow);font-weight:900}
.favorite-btn.active{background:rgba(255,200,90,.12);border-color:rgba(255,200,90,.5)}

.refresh{border:1px solid #303532;background:#111412;color:#d7dbd8;border-radius:12px;padding:9px 11px;font-size:12px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{text-align:center;background:#0a0d0b;border:1px solid #252a27;border-radius:14px;padding:12px 4px}
.stat strong{display:block;font-size:17px}
.stat span{display:block;margin-top:5px;color:var(--muted);font-size:9px}

.stock-card{padding:15px;border-radius:18px;border:1px solid #292e2b;background:#0b0e0c;cursor:pointer}

.stock-top{display:flex;justify-content:space-between;gap:10px}
.symbol{font-size:19px;font-weight:950}
.name{color:#9da39f;font-size:12px;margin-top:4px}
.score{text-align:right}
.score strong{display:block;font-size:23px}
.score span{color:var(--muted);font-size:9px}
.price-row{display:flex;gap:9px;align-items:baseline;margin-top:13px}
.price{font-size:22px;font-weight:950}
.up,.good{color:var(--green)}
.down,.bad{color:var(--red)}
.flat{color:#ddd}
.warn{color:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{border:1px solid #292e2b;background:#131614;border-radius:9px;padding:5px 8px;color:#bcc1be;font-size:10px}
.chip.green{color:var(--green)}

.back-btn{min-height:48px;border:1px solid #303532;border-radius:15px;background:#0e110f;color:#eee;font-weight:850;padding:0 15px}

.analysis-heading{margin:24px 3px 15px}
.analysis-heading h1{margin:0;font-size:27px}
.analysis-heading p{color:var(--muted);font-size:12px;margin:7px 0 0}

.live-tracker{margin:0 0 15px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid rgba(69,224,173,.28);background:rgba(69,224,173,.06);border-radius:17px;padding:13px 15px}
.live-tracker-main{color:var(--green);font-size:12px;font-weight:950}
.live-tracker-sub{color:var(--muted);font-size:10px;margin-top:5px}
.live-tracker-count{font-size:21px;font-weight:950}

.hero-top{display:flex;justify-content:space-between;gap:15px}
.hero-stock-title{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}
.hero-symbol{font-size:31px;font-weight:950}

.hero-price{text-align:right;font-size:30px;font-weight:950}
.market-pill{display:inline-block;margin-top:12px;border:1px solid #303532;border-radius:999px;padding:6px 10px;color:var(--green);font-size:11px}

.indicator-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:20px}
.indicator{background:#070a08;border:1px solid #242925;border-radius:14px;padding:12px}
.indicator span{color:var(--muted);font-size:10px}
.indicator strong{display:block;margin-top:5px;font-size:15px}

.position-card{border:1px solid rgba(112,183,255,.35);background:#0b0e0c;border-radius:24px;padding:20px}

.position-delete{border:1px solid rgba(255,105,118,.25);background:rgba(255,105,118,.05);color:var(--red)}
.position-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}
.position-stat{background:#070908;border:1px solid #252a27;border-radius:14px;padding:12px}

.avg-status{font-size:21px;font-weight:950;line-height:1.4}
.avg-sub{font-size:11px;line-height:1.8;color:#aeb4b0;margin-top:8px}
.avg-zone{margin-top:13px;border:1px solid rgba(69,224,173,.22);background:rgba(69,224,173,.04);border-radius:14px;padding:13px;font-size:11px;line-height:1.8}
.avg-plans{display:grid;gap:9px;margin-top:14px}

.matcher-strategy.purple{color:#c899ff}
.matcher-strategy.orange{color:var(--orange)}
.matcher-strategy.yellow{color:var(--yellow)}
.matcher-note{margin-top:13px;color:#c8cdca;font-size:13px;line-height:1.9}
.matcher-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.matcher-score{background:#070908;border:1px solid #252a27;border-radius:14px;padding:12px 7px;text-align:center}
.matcher-score span{display:block;color:#858b87;font-size:9px}

.strategy-jump{cursor:pointer;transition:transform .15s ease,border-color .15s ease,background .15s ease}

.strategy-flash{animation:strategyFlash .7s ease}

.overview-value{text-align:right;font-size:18px;font-weight:950}

.target-box{background:#070a08;border:1px solid #252a27;border-radius:18px;padding:17px 18px}
.target-label{color:#8d938f;font-size:13px;margin-bottom:8px}

.condition-row{padding:7px 0;border-bottom:1px solid #1e231f}

.strategy-status{margin-top:14px;padding:12px 13px;border-radius:13px;background:#0b0f0c;font-weight:950}

.kbar-card{background:#080b09;border:1px solid #292e2b;border-radius:24px;padding:16px;overflow:hidden}
.kbar-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:13px}
.kbar-title{font-size:20px;font-weight:950}
.kbar-sub{color:var(--muted);font-size:10px;margin-top:5px}
.kbar-live{color:var(--green);font-size:10px;font-weight:900;border:1px solid rgba(69,224,173,.25);border-radius:999px;padding:7px 9px}
.kbar-periods{display:flex;overflow-x:auto;gap:7px;padding:2px 0 11px}
.kbar-period{flex:0 0 auto;border:1px solid #292e2b;background:#101311;color:#aeb3b0;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:850}
.kbar-period.active{background:rgba(69,224,173,.10);color:var(--green)}
.kbar-info{min-height:47px;padding:9px 11px;border:1px solid #232824;background:#050706;border-radius:12px;margin-bottom:10px;font-size:10px;color:#aeb4b0}
.kbar-wrap{position:relative;width:100%;height:370px;background:#050706;border:1px solid #202522;border-radius:16px;overflow:hidden;touch-action:pan-y}
#kbarCanvas{display:block;width:100%;height:370px}
.kbar-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,6,.82);color:#8e9590;z-index:3}
.kbar-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:11px}
.kbar-help{color:#6f7571;font-size:9px}
.latest-btn{border:1px solid rgba(69,224,173,.3);background:rgba(69,224,173,.07);color:var(--green);border-radius:11px;padding:9px 11px;font-size:10px;font-weight:900}

.backtest-card{border-color:rgba(69,224,173,.28);margin-bottom:12px}
.backtest-head{display:flex;justify-content:space-between;gap:12px}
.backtest-title{font-size:21px;font-weight:950}
.backtest-target{border:1px solid rgba(255,200,90,.3);color:var(--yellow);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;white-space:nowrap}
.backtest-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}
.backtest-stat{background:#070908;border:1px solid #252a27;border-radius:14px;padding:12px}
.backtest-stat span{display:block;color:#858b87;font-size:9px}
.backtest-stat strong{display:block;margin-top:5px;font-size:18px}
.backtest-result{margin-top:14px;padding:13px;border-radius:14px;background:#070908;border:1px solid #252a27;font-size:12px;line-height:1.8}

.loading{text-align:center;padding:50px 10px;color:var(--muted)}

.indicator-strip{grid-template-columns:repeat(4,1fr)}

}
</style>
</head>

<script>
"use strict";

var WATCH_KEY="yaozi_watchlist";
var POSITION_KEY="yaozi_positions_v31";
var STRICT_TARGET_WINRATE=70;
var STRICT_MIN_SAMPLE=20;

var countdownSeconds=300;
var homeScroll=0;
var currentStock=null;
var currentAnalysisSymbol="";
var currentAnalysisData=null;
var currentMarketState=null;

var analysisCountdownTimer=null;
var analysisCountdown=30;
var analysisRefreshing=false;

var KBAR_TF="5m";
var KBAR_DATA=[];
var KBAR_LOADING=false;
var KBAR_VIEW_COUNT=45;
var KBAR_END_INDEX=0;
var KBAR_SELECTED_INDEX=null;
var KBAR_TIMER=null;

var KBAR_DRAGGING=false;
var KBAR_DRAG_START_X=0;
var KBAR_DRAG_START_END=0;
var KBAR_PINCH_START_DISTANCE=0;
var KBAR_PINCH_START_COUNT=45;

function el(x){
return document.getElementById(x);
}

function safe(v){
var d=document.createElement("div");
d.textContent=v==null?"":String(v);
return d.innerHTML;
}

function fmt(v,d){
if(d===undefined)d=2;
v=Number(v);

return Number.isFinite(v)
?v.toLocaleString("zh-TW",{maximumFractionDigits:d})
:"--";
}

function pct(v){
v=Number(v);

return Number.isFinite(v)
?(v>0?"+":"")+v.toFixed(2)+"%"
:"--";
}

function pclass(v){
v=Number(v);
return v>0?"up":v<0?"down":"flat";
}

function clamp(v,a,b){
return Math.max(a,Math.min(b,v));
}

function currentTimeText(){
return new Date().toLocaleTimeString("zh-TW",{hour12:false});
}

function SMA(a,p){
if(a.length<p)return NaN;
return a.slice(-p).reduce((x,y)=>x+Number(y),0)/p;
}

function EMA(a,p){
if(a.length<p)return NaN;

var e=a.slice(0,p).reduce((x,y)=>x+Number(y),0)/p;
var k=2/(p+1);

for(var i=p;i<a.length;i++){
e=Number(a[i])*k+e*(1-k);
}

return e;
}

function RSI(a,p){
p=p||14;

if(a.length<=p)return NaN;

var r=a.slice(-(p+1));
var g=0;
var l=0;

for(var i=1;i<r.length;i++){
var d=Number(r[i])-Number(r[i-1]);

if(d>0)g+=d;
else l+=Math.abs(d);
}

g/=p;
l/=p;

return l===0?100:100-(100/(1+g/l));
}

function ATR(r,p){
p=p||14;

if(r.length<=p)return NaN;

var a=[];

for(var i=1;i<r.length;i++){
var h=+r[i].high;
var l=+r[i].low;
var c=+r[i-1].close;

a.push(
Math.max(
h-l,
Math.abs(h-c),
Math.abs(l-c)
)
);
}

return SMA(a,p);
}

/* =========================
   策略跳轉

========================= */

function findHTFSwingStructure(rows){
var data=rows.slice(-120);
var p=[];

if(data.length<30){
return{low:NaN,type:"NONE"};
}

for(var i=3;i<data.length-3;i++){

var l=+data[i].low;

if(
l<+data[i-1].low&&
l<+data[i-2].low&&
l<+data[i-3].low&&
l<=+data[i+1].low&&
l<=+data[i+2].low&&
l<=+data[i+3].low
){

var before=data.slice(
Math.max(0,i-20),
i
);

var after=data.slice(
i+1,
Math.min(data.length,i+25)
);

if(!before.length||!after.length){
continue;
}

var ph=Math.max(...before.map(x=>+x.high));
var ah=Math.max(...after.map(x=>+x.high));

p.push({
low:l,
confirmed:ah>ph,
date:data[i].date||""
});

}
}

var c=p.filter(x=>x.confirmed);

if(c.length){

var z=c[c.length-1];
var pr=c.length>1?c[c.length-2]:null;

return{
low:z.low,
type:pr&&z.low>pr.low?"HL":"SWING_LOW",
date:z.date
};
}

if(p.length){

var last=p[p.length-1];

return{
low:last.low,
type:"SWING_LOW",
date:last.date
};
}

return{
low:Math.min(...data.slice(-20).map(x=>+x.low)),
type:"FALLBACK"
};
}

function getHTFStructureState(rows,l,a){

var c=+rows[rows.length-1].close;
var b=l-a*.15;

return{
broken:Number.isFinite(l)&&c<b,
warning:Number.isFinite(l)&&c>=b&&c<l+a*.5,
buffer:b
};
}

function updatePositionProtection(p,m){

var h=Math.max(
+p.highWater||p.entry,
m.price
);

var protect=+p.protectPrice;

if(!Number.isFinite(protect)){
protect=p.initialStop;
}

var R=+p.initialR||m.atr;
var g=(h-p.entry)/R;
var c=protect;

if(g>=1){
c=Math.max(c,p.entry);
}

if(g>=1.5){
c=Math.max(c,p.entry+R*.25);
}

if(g>=2){
c=Math.max(c,p.entry+R*.75);
}

if(g>=3){
c=Math.max(c,p.entry+R*1.5);
}

if(g>=1){

c=Math.max(
c,
Math.min(
Math.max(
m.ma20-m.atr*.5,
m.recent3Low-m.atr*.25
),
m.price-m.atr*.35
)
);

}

c=Math.max(protect,c);

p.highWater=h;
p.protectPrice=c;

var a=getPositions();

a[p.symbol]=p;

savePositions(a);

return p;
}

]
};

var l=KBAR_DATA.at(-1);
var p=KBAR_DATA.at(-2);

KBAR_DATA.slice(-5).map(x=>+x.close),
5
);

r.push("✓ 站上分 K SMA5");

r.push("✓ 最新 K 收紅／平");

function calculateStrategyRecommendation(
m,
resistance,
structureState
){

var pullback=0;
var highR=0;
var surge=0;

/* 支撐回踩 */

if(m.ma20>m.ma60){
pullback+=25;
}

if(
m.price>=m.ma20-m.atr*.5
){
pullback+=15;
}

if(
m.price<=m.ma20+m.atr*1.3
){
pullback+=15;
}

if(
m.rsi>=42&&
m.rsi<=68
){
pullback+=15;
}

if(m.macd>=0){
pullback+=15;
}

if(!structureState.broken){
pullback+=15;
}

/* 高 R */

if(m.ma20>m.ma60){
highR+=20;
}

if(m.price>m.ma20){
highR+=15;
}

if(m.macd>0){
highR+=15;
}

if(
m.rsi>=52&&
m.rsi<=72
){
highR+=15;
}

if(
m.price>=resistance-m.atr*.5
){
highR+=20;
}

if(!structureState.broken){
highR+=15;
}

/* 強勢續攻 */

if(m.ma20>m.ma60){
surge+=20;
}

if(m.price>m.ma20){
surge+=15;
}

if(m.macd>0){
surge+=15;
}

if(
m.rsi>=58&&
m.rsi<=74
){
surge+=15;
}

if(
m.price>=resistance-m.atr*.25
){
surge+=20;
}

if(!structureState.broken){
surge+=15;
}

pullback=clamp(
pullback,
0,
100
);

highR=clamp(
highR,
0,
100
);

surge=clamp(
surge,
0,
100
);

var best="PULLBACK";
var bestScore=pullback;

if(highR>bestScore){
best="HIGH_R";
bestScore=highR;
}

if(surge>bestScore){
best="SURGE";
bestScore=surge;
}

return{
pullback,
highR,
surge,
best,
bestScore
};
}

function backtestIndicators(rows,index){

var p=rows.slice(0,index+1);

if(p.length<90){
return null;
}

var c=p.map(x=>+x.close);

var ma20=SMA(c,20);
var ma60=SMA(c,60);

var old20=
SMA(
c.slice(0,-5),
20
);

var old60=
SMA(
c.slice(0,-10),
60
);

var rsi=RSI(c,14);

var macd=
EMA(c.slice(-100),12)-
EMA(c.slice(-100),26);

var atr=ATR(p,14);

if(!(atr>0)){
return null;
}

var prior=
p.slice(-21,-1);

if(prior.length<20){
return null;
}

var res=
Math.max(
...prior.map(x=>+x.high)
);

var st=
findHTFSwingStructure(p);

var sl=+st.low;

var b=rows[index];

var o=+b.open;
var h=+b.high;
var l=+b.low;
var cl=+b.close;

var range=
Math.max(
h-l,
.000001
);

return{
close:cl,
open:o,
ma20,
ma60,
ma20Rising:
Number.isFinite(old20)&&
ma20>old20,

ma60Rising:
Number.isFinite(old60)&&
ma60>old60,

rsi,
macd,
atr,

resistance:res,
structureLow:sl,

bodyRatio:
Math.abs(cl-o)/range,

closeLocation:
(cl-l)/range,

breakoutATR:
(cl-res)/atr,

aboveMA20:

function buildBacktestTrade(rows,i,s){

var ei=i+1;

if(ei>=rows.length){
return null;
}

var e=+rows[ei].open;

var stop=
s.structureLow-
s.atr*.15;

if(!(e>stop)){
return null;
}

var R=e-stop;
var ra=R/s.atr;
var rp=R/e;

if(
ra<.8||
ra>(
s.strategy==="HIGH_R"
?6
:5.5
)||
rp>(
s.strategy==="HIGH_R"
?.16
:.14
)
){
return null;
}

var a=
s.strategy==="HIGH_R"
?2
:1.5;

var b=
s.strategy==="HIGH_R"
?3
:2.5;

var c=
s.strategy==="HIGH_R"
?5
:4;

return{
strategy:s.strategy,
entryIndex:ei,
entry:e,
stop,
risk:R,

tp1:e+R*a,
tp2:e+R*b,
tp3:e+R*c,

m1:a,
m2:b,
m3:c,

signalDate:s.signalDate
};
}

function simulateTrade(rows,t){

var end=
Math.min(
rows.length-1,
t.entryIndex+80
);

var p1=false;
var p2=false;
var p3=false;

for(
var i=t.entryIndex;
i<=end;
i++
){

var l=+rows[i].low;
var h=+rows[i].high;

/* 同一根碰 SL 與 TP，保守先判 SL */

if(l<=t.stop){

return{
result:"LOSS",
r:-1,
tp1:p1,
tp2:p2,
tp3:p3,
exitIndex:i
};

}

if(h>=t.tp1){

p1=true;

p2=
h>=t.tp2;

p3=
h>=t.tp3;

for(
var j=i;
j<=end;
j++
){

if(
+rows[j].low<=t.stop
){
break;
}

if(
+rows[j].high>=t.tp2
){
p2=true;
}

if(
+rows[j].high>=t.tp3
){
p3=true;
break;
}

}

return{
result:"WIN",
r:t.m1,
tp1:true,
tp2:p2,
tp3:p3,
exitIndex:i
};

}
}

return{
result:"LOSS",
r:
(+rows[end].close-t.entry)/
t.risk,
tp1:false,
tp2:false,
tp3:false,
exitIndex:end
};
}

function runStrategyBacktest(rows,type){

var tr=[];
var next=90;

for(
var i=90;
i<rows.length-2;
i++
){

if(i<next){
continue;
}

var s=
type==="HIGH_R"
?strictHighRSignal(rows,i)
:strictSurgeSignal(rows,i);

if(!s){
continue;
}

var t=
buildBacktestTrade(
rows,
i,
s
);

if(!t){
continue;
}

var r=
simulateTrade(
rows,
t
);

tr.push({
result:r.result,
r:r.r,
tp1:r.tp1,
tp2:r.tp2,
tp3:r.tp3
});

next=
r.exitIndex+1;
}

var n=tr.length;

if(!n){
return{total:0};
}

var w=
tr.filter(
x=>x.result==="WIN"
).length;

var wr=
w/n*100;

var rate=
k=>
tr.filter(x=>x[k]).length/n*100;

var avg=
tr.reduce(
(a,x)=>a+x.r,
0
)/n;

var st=0;
var mx=0;

tr.forEach(x=>{

if(x.result==="LOSS"){

st++;
mx=Math.max(mx,st);

}else{

st=0;

}

});

return{
total:n,
wins:w,
losses:n-w,
winRate:wr,

tp1Rate:rate("tp1"),
tp2Rate:rate("tp2"),
tp3Rate:rate("tp3"),

slRate:(n-w)/n*100,
averageR:avg,
maxLosingStreak:mx,

sampleEnough:
n>=STRICT_MIN_SAMPLE,

targetReached:
n>=STRICT_MIN_SAMPLE&&
wr>=STRICT_TARGET_WINRATE
};
}

function normalizeDailyRows(r){

return r.map(x=>{

var raw=
x.date??
x.time??
x.datetime??
x.timestamp;

var ts=
typeof raw==="number"
?raw
:new Date(raw).getTime();

if(ts<1e12){
ts*=1000;
}

return{
timestamp:ts,
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+(
x.volume??
x.Trading_Volume??
0
)
};

})
.filter(
x=>
Number.isFinite(x.timestamp)&&
Number.isFinite(x.close)
)
.sort(
(a,b)=>
a.timestamp-b.timestamp
);
}

function aggregateCandles(d,t){

if(t==="1d"){
return d;
}

var m=new Map;

d.forEach(c=>{

var x=
new Date(c.timestamp);

var k=
t==="1mo"
?x.getFullYear()+"-"+(x.getMonth()+1)

:t==="1y"
?String(x.getFullYear())

:(()=>{

var q=
new Date(x);

q.setDate(
q.getDate()-
((q.getDay()+6)%7)
);

return q.toDateString();

})();

if(!m.has(k)){

m.set(
k,
{...c}
);

}else{

var z=
m.get(k);

z.high=
Math.max(
z.high,
c.high
);

z.low=
Math.min(
z.low,
c.low
);

z.close=
c.close;

z.volume+=
c.volume;

}

});

return Array.from(
m.values()
);
}

async function loadKBar(){

if(KBAR_LOADING){
return;
}

KBAR_LOADING=true;

var load=
el("kbarLoading");

try{

var c;

if(isHistoricalTF(KBAR_TF)){

c=
aggregateCandles(
normalizeDailyRows(
currentAnalysisData.rows||[]
),
KBAR_TF
);

if(el("kbarLive")){
el("kbarLive").textContent=
"歷史 K 線";
}

}else{

var r=
await fetch(
"/api/kbar?symbol="+
encodeURIComponent(
currentAnalysisSymbol
)+
"&timeframe="+
KBAR_TF+
"&t="+
Date.now(),
{
cache:"no-store"
}
);

var d=
await r.json();

if(!r.ok||!d.ok){

throw Error(
d.error||
"K 線取得失敗"
);

}

c=
(d.candles||[])
.map(x=>({

timestamp:
(
+x.timestamp<1e12
?+x.timestamp*1000
:+x.timestamp
)||
new Date(x.time).getTime(),

open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0

}));

if(el("kbarLive")){
el("kbarLive").textContent=
"🟢 Fugle 分 K";
}

}

KBAR_DATA=c;
KBAR_END_INDEX=c.length;
KBAR_SELECTED_INDEX=null;

drawKBar();
updateKBarInfo();
refreshAveragePanel();

if(!isHistoricalTF(KBAR_TF)){
startKBarTimer();
}

if(load){
load.classList.add("hidden");
}

}catch(e){

if(load){
load.textContent=e.message;
}

}finally{

KBAR_LOADING=false;

}
}

var c=
el("kbarCanvas");

if(!c){
return;
}

c.ontouchstart=e=>{

if(e.touches.length===1){

KBAR_DRAGGING=true;

KBAR_DRAG_START_X=
e.touches[0].clientX;

KBAR_DRAG_START_END=
KBAR_END_INDEX;

}else if(
e.touches.length===2
){

KBAR_PINCH_START_DISTANCE=
touchDistance(e.touches);

KBAR_PINCH_START_COUNT=
KBAR_VIEW_COUNT;

}

};

c.ontouchmove=e=>{

if(e.touches.length===2){

e.preventDefault();

var d=
touchDistance(e.touches);

KBAR_VIEW_COUNT=
clamp(
Math.round(
KBAR_PINCH_START_COUNT*
KBAR_PINCH_START_DISTANCE/d
),
15,
120
);

drawKBar();

}else if(KBAR_DRAGGING){

var px=
c.clientWidth/
KBAR_VIEW_COUNT;

var dif=
Math.round(
(
KBAR_DRAG_START_X-
e.touches[0].clientX
)/px
);

KBAR_END_INDEX=
clamp(
KBAR_DRAG_START_END+dif,
Math.min(
KBAR_VIEW_COUNT,
KBAR_DATA.length
),
KBAR_DATA.length
);

drawKBar();

}

};

c.ontouchend=()=>{
KBAR_DRAGGING=false;
};

c.onclick=e=>{
selectCandleAt(
e.clientX
);
};
}

function touchDistance(t){

return Math.hypot(
t[0].clientX-t[1].clientX,
t[0].clientY-t[1].clientY
);
}

function selectCandleAt(x){

var c=
el("kbarCanvas");

var r=
c.getBoundingClientRect();

var s=
Math.max(
0,
KBAR_END_INDEX-
KBAR_VIEW_COUNT
);

var v=
KBAR_DATA.slice(
s,
KBAR_END_INDEX
);

if(!v.length){
return;
}

var slot=
(r.width-62)/
v.length;

var i=
Math.floor(
(
x-r.left-8
)/slot
);

KBAR_SELECTED_INDEX=
s+
clamp(
i,
0,
v.length-1
);

drawKBar();
updateKBarInfo();
}

function updateKBarInfo(){

if(!KBAR_DATA.length){
return;
}

var c=
KBAR_DATA[
KBAR_SELECTED_INDEX??
KBAR_DATA.length-1
];

if(!c){
return;
}

var info=el("kbarInfo");

if(!info){
return;
}

info.innerHTML=

'<strong>'+
new Date(
c.timestamp
).toLocaleString(
"zh-TW",
{
hour12:false
}
)+
'</strong>'+

'　O '+fmt(c.open)+
'　H '+fmt(c.high)+
'　L '+fmt(c.low)+
'　C '+fmt(c.close)+
'　V '+fmt(c.volume,0);
}

function drawKBar(){

var cv=
el("kbarCanvas");

if(
!cv||
!KBAR_DATA.length
){
return;
}

var w=
cv.clientWidth;

var h=370;

var dpr=
devicePixelRatio||1;

cv.width=
w*dpr;

cv.height=
h*dpr;

var x=
cv.getContext("2d");

x.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

x.clearRect(
0,
0,
w,
h
);

var s=
Math.max(
0,
KBAR_END_INDEX-
KBAR_VIEW_COUNT
);

var d=
KBAR_DATA.slice(
s,
KBAR_END_INDEX
);

if(!d.length){
return;
}

var L=8;
var R=55;
var T=14;
var B=285;

var cw=
w-L-R;

var ch=
B-T;

var max=
Math.max(
...d.map(z=>z.high)
);

var min=
Math.min(
...d.map(z=>z.low)
);

var rg=
max-min||1;

max+=rg*.08;
min-=rg*.08;

rg=max-min;

var y=
v=>
T+
(max-v)/rg*ch;

var slot=
cw/d.length;

var body=
Math.max(
1,
Math.min(
12,
slot*.62
)
);

d.forEach((c,i)=>{

var xx=
L+
slot*i+
slot/2;

var up=
c.close>=c.open;

x.strokeStyle=
x.fillStyle=
up
?"#45e0ad"
:"#ff6976";

x.beginPath();

x.moveTo(
xx,
y(c.high)
);

x.lineTo(
xx,
y(c.low)
);

x.stroke();

x.fillRect(
xx-body/2,
Math.min(
y(c.open),
y(c.close)
),
body,
Math.max(
1.5,
Math.abs(
y(c.close)-
y(c.open)
)
)
);

});

/* 選中 K 棒 */

if(
KBAR_SELECTED_INDEX!==null&&
KBAR_SELECTED_INDEX>=s&&
KBAR_SELECTED_INDEX<KBAR_END_INDEX
){

var local=
KBAR_SELECTED_INDEX-s;

var sx=
L+
slot*local+
slot/2;

x.strokeStyle=
"rgba(255,255,255,.35)";

x.beginPath();
x.moveTo(sx,T);
x.lineTo(sx,B);
x.stroke();

}

/* 價格刻度 */

x.fillStyle=
"#747b76";

x.font=
"10px -apple-system";

for(var g=0;g<=4;g++){

var py=
T+
ch*g/4;

var pv=
max-
rg*g/4;

x.fillText(
fmt(pv,2),
w-R+5,
py+3
);

}
}

   返回
========================= */

function backHome(){

stopAnalysisTracker();
stopKBarTimer();

el("analysisPage").classList.add(
"hidden"
);

el("homePage").classList.remove(
"hidden"
);

setTimeout(()=>{

scrollTo(
0,
homeScroll
);

},10);
}

/* =========================
   EVENTS
========================= */

el("backTop").onclick=
backHome;

el("backBottom").onclick=
backHome;

el("stockSearchForm").onsubmit=e=>{

e.preventDefault();

analyze(
el("symbolInput").value
);

};

document.querySelectorAll(
".example"
)
.forEach(b=>{

b.onclick=()=>analyze(
b.dataset.symbol
);

});

el("refreshButton").onclick=
loadRadar;

/* 首頁雷達倒數 */

setInterval(()=>{

countdownSeconds--;

if(countdownSeconds<=0){

countdownSeconds=300;

loadRadar();

}

var m=
Math.floor(
countdownSeconds/60
);

var s=
countdownSeconds%60;

el("countdown").textContent=

String(m).padStart(2,"0")+
":"+
String(s).padStart(2,"0");

},1000);

/* resize */

window.addEventListener(
"resize",
()=>{

if(KBAR_DATA.length){
drawKBar();
}

}
);

/* 回到 APP 時立即更新 */

document.addEventListener(
"visibilitychange",
()=>{

if(
!document.hidden&&
currentAnalysisSymbol&&
!el("analysisPage").classList.contains("hidden")
){

refreshCurrentAnalysis();

}

}
);

/* START */

renderWatchlist();
loadRadar();

</script>
</body>
</html>
