<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>妖子平台 2.6</title>

<meta name="theme-color" content="#050807">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="妖子平台">

<style>
*{box-sizing:border-box}

:root{
  --bg:#030504;
  --card:#0b0e0c;
  --border:#292e2b;
  --text:#f6f7f6;
  --muted:#8c918e;
  --green:#45e0ad;
  --red:#ff6976;
  --yellow:#ffc85a;
  --purple:#ae63ff;
  --blue:#70b7ff;
}

html{
  background:var(--bg);
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,rgba(43,111,84,.08),transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
}

button,input{font:inherit}
button{cursor:pointer}

.app{
  width:min(100%,900px);
  margin:auto;
  padding:
    calc(22px + env(safe-area-inset-top))
    16px
    calc(60px + env(safe-area-inset-bottom));
}

.hidden{display:none!important}

.header{margin-bottom:24px}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
}

.brand{
  font-size:31px;
  font-weight:950;
  letter-spacing:-1.5px;
}

.subtitle{
  margin-top:9px;
  color:var(--muted);
  font-size:13px;
}

.version{
  padding:7px 11px;
  border-radius:999px;
  color:var(--green);
  border:1px solid rgba(69,224,173,.25);
  background:rgba(69,224,173,.07);
  font-size:12px;
  font-weight:900;
}

.card{
  background:rgba(11,14,12,.97);
  border:1px solid var(--border);
  border-radius:21px;
  padding:16px;
  margin-bottom:15px;
}

.section{margin-top:27px}

.section-title{
  font-size:20px;
  font-weight:950;
}

.section-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
  line-height:1.6;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:0 3px 13px;
}

/* 搜尋 */

.search-title{
  color:var(--muted);
  font-size:12px;
  margin:0 0 10px 4px;
}

.search-form{
  display:grid;
  grid-template-columns:1fr 100px;
  gap:9px;
}

.search-input{
  width:100%;
  height:53px;
  border:1px solid #303532;
  border-radius:15px;
  padding:0 15px;
  background:#070908;
  color:white;
  outline:none;
  font-size:17px;
  text-transform:uppercase;
}

.search-input:focus{
  border-color:rgba(69,224,173,.6);
}

.search-btn{
  border:0;
  border-radius:15px;
  background:var(--green);
  color:#06130e;
  font-weight:950;
}

.examples{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:11px;
}

.example{
  border:1px solid #292e2b;
  background:#111412;
  color:#a6aca8;
  border-radius:999px;
  padding:6px 10px;
  font-size:10px;
}

/* 自選股 */

.watch-section{margin-top:25px}

.watch-grid{
  display:grid;
  gap:9px;
}

.watch-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  background:#0b0e0c;
  border:1px solid rgba(255,200,90,.20);
  border-radius:17px;
  padding:14px;
}

.watch-main{
  flex:1;
  cursor:pointer;
}

.watch-symbol{
  font-size:18px;
  font-weight:950;
}

.watch-name{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.watch-open{
  color:var(--yellow);
  font-size:11px;
  margin-top:8px;
}

.watch-remove{
  width:38px;
  height:38px;
  border:1px solid #303532;
  background:#101311;
  color:#888e8a;
  border-radius:12px;
  font-size:17px;
}

.empty-watch{
  color:#777d79;
  border:1px dashed #292e2b;
  border-radius:16px;
  padding:18px;
  text-align:center;
  font-size:12px;
  line-height:1.7;
}

.favorite-btn{
  width:100%;
  min-height:48px;
  margin-top:15px;
  border-radius:15px;
  border:1px solid rgba(255,200,90,.28);
  background:rgba(255,200,90,.06);
  color:var(--yellow);
  font-weight:900;
}

.favorite-btn.active{
  background:rgba(255,200,90,.12);
  border-color:rgba(255,200,90,.5);
}

/* 雷達 */

.refresh{
  border:1px solid #303532;
  background:#111412;
  color:#d7dbd8;
  border-radius:12px;
  padding:9px 11px;
  font-size:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.stat{
  text-align:center;
  background:#0a0d0b;
  border:1px solid #252a27;
  border-radius:14px;
  padding:12px 4px;
}

.stat strong{
  display:block;
  font-size:17px;
}

.stat span{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:9px;
}

.grid{
  display:grid;
  gap:10px;
}

.stock-card{
  padding:15px;
  border-radius:18px;
  border:1px solid #292e2b;
  background:#0b0e0c;
  cursor:pointer;
}

.stock-card.priority{
  border-color:rgba(69,224,173,.28);
}

.stock-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.symbol{
  font-size:19px;
  font-weight:950;
}

.name{
  color:#9da39f;
  font-size:12px;
  margin-top:4px;
}

.score{text-align:right}

.score strong{
  display:block;
  font-size:23px;
}

.score span{
  color:var(--muted);
  font-size:9px;
}

.price-row{
  display:flex;
  gap:9px;
  align-items:baseline;
  margin-top:13px;
}

.price{
  font-size:22px;
  font-weight:950;
}

.up{color:var(--green)}
.down{color:var(--red)}
.flat{color:#ddd}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:11px;
}

.chip{
  border:1px solid #292e2b;
  background:#131614;
  border-radius:9px;
  padding:5px 8px;
  color:#bcc1be;
  font-size:10px;
}

.chip.green{color:var(--green)}

/* 分析頁 */

.back-btn{
  min-height:48px;
  border:1px solid #303532;
  border-radius:15px;
  background:#0e110f;
  color:#eee;
  font-weight:850;
  padding:0 15px;
}

.back-btn.full{
  width:100%;
  margin-top:22px;
}

.analysis-heading{
  margin:24px 3px 15px;
}

.analysis-heading h1{
  margin:0;
  font-size:27px;
}

.analysis-heading p{
  color:var(--muted);
  font-size:12px;
  margin:7px 0 0;
}

.hero-card{
  background:#0b0e0c;
  border:1px solid #292e2b;
  border-radius:24px;
  padding:21px;
}

.hero-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.hero-symbol{
  font-size:31px;
  font-weight:950;
}

.hero-name{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}

.hero-price{
  text-align:right;
  font-size:30px;
  font-weight:950;
}

.hero-change{
  text-align:right;
  margin-top:5px;
  font-size:13px;
}

.market-pill{
  display:inline-block;
  margin-top:12px;
  border:1px solid #303532;
  border-radius:999px;
  padding:6px 10px;
  color:var(--green);
  font-size:11px;
}

.indicator-strip{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:20px;
}

.indicator{
  background:#070a08;
  border:1px solid #242925;
  border-radius:14px;
  padding:12px;
}

.indicator span{
  color:var(--muted);
  font-size:10px;
}

.indicator strong{
  display:block;
  margin-top:5px;
  font-size:15px;
}

.big-section-title{
  margin:31px 5px 15px;
  font-size:24px;
  font-weight:950;
}

/* 大字總覽 */

.overview-card{
  background:#0b0e0c;
  border:1px solid #303532;
  border-radius:24px;
  padding:22px;
}

.overview-card.purple-card{
  border-color:rgba(174,99,255,.42);
  background:
    radial-gradient(circle at top right,rgba(174,99,255,.05),transparent 38%),
    #0b0e0c;
}

.overview-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:16px 0;
}

.overview-label{
  color:#949a96;
  font-size:16px;
}

.overview-value{
  text-align:right;
  font-size:18px;
  font-weight:950;
}

.overview-value.green{color:var(--green)}
.overview-value.yellow{color:var(--yellow)}
.overview-value.red{color:var(--red)}
.overview-value.purple{color:#c899ff}

.divider{
  height:1px;
  background:#282d2a;
  margin:21px 0;
}

.overview-text{
  color:#d0d4d1;
  font-size:14px;
  line-height:2;
}

/* 入場大卡 */

.entry-card{
  border:1px solid rgba(69,224,173,.58);
  border-radius:24px;
  padding:22px;
  background:
    radial-gradient(circle at top right,rgba(69,224,173,.06),transparent 40%),
    #0a0e0c;
}

.entry-card.purple{
  border-color:rgba(174,99,255,.55);
  background:
    radial-gradient(circle at top right,rgba(174,99,255,.07),transparent 40%),
    #0a0e0c;
}

.entry-label{
  color:#858b87;
  font-size:14px;
}

.entry-price{
  color:var(--green);
  font-size:31px;
  font-weight:950;
  margin-top:10px;
  letter-spacing:-1px;
}

.entry-card.purple .entry-price{
  color:#c899ff;
}

.entry-sub{
  margin-top:9px;
  color:#969c98;
  font-size:12px;
  line-height:1.7;
}

.reason-title{
  color:#929894;
  font-size:14px;
  margin-bottom:13px;
}

.reason-tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:18px;
}

.reason-tag{
  border:1px solid #343936;
  border-radius:999px;
  padding:7px 11px;
  color:#c2c7c4;
  font-size:11px;
}

.detail-text{
  font-size:14px;
  color:#d2d6d3;
  line-height:2;
}

/* 策略細節 */

.strategy-card{
  border-radius:24px;
  padding:22px;
  background:#0b0e0c;
  margin-top:15px;
}

.strategy-card.green{
  border:1px solid rgba(69,224,173,.35);
}

.strategy-card.purple{
  border:1px solid rgba(174,99,255,.40);
}

.strategy-name{
  font-size:22px;
  font-weight:950;
}

.strategy-status{
  color:#999f9b;
  margin-top:7px;
  font-size:13px;
}

.strategy-status strong{color:var(--text)}

.check-list{margin-top:19px}

.check{
  padding:11px 0;
  border-bottom:1px solid #202522;
  font-size:13px;
  line-height:1.7;
}

.check:last-child{border-bottom:0}

.good{color:#bdf2dc}
.warn{color:#f4d68b}
.bad{color:#ffabb2}

.level-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:18px;
}

.level-box{
  background:#070a08;
  border-radius:13px;
  padding:12px;
}

.level-box span{
  color:#888e8a;
  font-size:10px;
}

.level-box strong{
  display:block;
  margin-top:6px;
  font-size:14px;
}

.level-box.stop{
  border:1px solid rgba(255,105,118,.25);
}

.level-box.stop strong{color:var(--red)}
.level-box.tp strong{color:var(--green)}
.level-box.tp3 strong{color:var(--yellow)}
.level-box.extend strong{color:#c899ff}

.explain-box{
  margin-top:18px;
  background:#070a08;
  border-radius:15px;
  padding:15px;
  color:#c9cecb;
  font-size:13px;
  line-height:1.9;
}

.r-box{
  margin-top:13px;
  background:#090b0a;
  border:1px solid rgba(174,99,255,.25);
  border-radius:15px;
  padding:14px;
  color:#aaa0b3;
  font-size:11px;
  line-height:1.9;
}

/* 綜合判讀 */

.brain-card{
  border:1px solid rgba(112,183,255,.28);
  background:#0b0e0c;
  border-radius:24px;
  padding:22px;
}

.brain-summary{
  color:#e1e4e2;
  font-size:14px;
  line-height:2;
}

.brain-item{
  margin-top:10px;
  border-radius:13px;
  padding:12px;
  background:#070a08;
  font-size:12px;
  line-height:1.75;
}

.loading{
  text-align:center;
  padding:50px 10px;
  color:var(--muted);
}

.error{
  padding:16px;
  color:var(--red);
  border:1px solid rgba(255,105,118,.25);
  border-radius:15px;
}

.data-note{
  color:#737975;
  font-size:10px;
  line-height:1.7;
  margin-top:18px;
}

.footer{
  text-align:center;
  color:#515653;
  font-size:10px;
  margin-top:30px;
}

@media(min-width:700px){
  .grid,.watch-grid{grid-template-columns:repeat(2,1fr)}
  .indicator-strip{grid-template-columns:repeat(4,1fr)}
  .level-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<main class="app">

<!-- 首頁 -->
<div id="homePage">

<header class="header">
  <div class="header-row">
    <div>
      <div class="brand">妖子平台</div>
      <div class="subtitle">🇹🇼 台股即時異動 · 🇺🇸 美股技術分析</div>

<section class="card">

  <form id="stockSearchForm" class="search-form">

    <input
      id="symbolInput"

<!-- 市場掃描 -->

</div>

</div>

<script>
"use strict";

var radarData=null;
var countdownSeconds=300;
var homeScroll=0;
var currentStock=null;

var WATCH_KEY="yaozi_watchlist_v26";

function el(id){
  return document.getElementById(id);
}

function safe(v){
  var d=document.createElement("div");
  d.textContent=v==null?"":String(v);
  return d.innerHTML;
}

function fmt(v,d){
  if(d===undefined)d=2;

  var x=Number(v);

  if(!Number.isFinite(x))return "--";

  return x.toLocaleString("zh-TW",{
    maximumFractionDigits:d
  });
}

function pct(v){
  var x=Number(v);

  if(!Number.isFinite(x))return "--";

  return (x>0?"+":"")+x.toFixed(2)+"%";
}

function pclass(v){
  var x=Number(v);

  if(x>0)return "up";
  if(x<0)return "down";

  return "flat";
}

function normalize(v){
  return String(v||"")
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9.\-]/g,"");
}

/* =========================
   自選股
========================= */

function getWatchlist(){

  try{

    var data=JSON.parse(
      localStorage.getItem(WATCH_KEY)||"[]"
    );

    return Array.isArray(data)
      ?data
      :[];

  }catch(e){

    return [];
  }
}

function saveWatchlist(list){

  localStorage.setItem(
    WATCH_KEY,
    JSON.stringify(list)
  );

  renderWatchlist();
}

function isFavorite(symbol){

  return getWatchlist().some(function(stock){

    return String(stock.symbol)===
      String(symbol);
  });
}

function toggleFavorite(stock){

  if(!stock||!stock.symbol)return;

  var list=getWatchlist();

  var index=list.findIndex(function(item){

    return String(item.symbol)===
      String(stock.symbol);
  });

  if(index>=0){

    list.splice(index,1);

  }else{

    list.unshift({
      symbol:String(stock.symbol),
      name:String(stock.name||""),
      market:String(stock.market||"")
    });
  }

  saveWatchlist(list);
  updateFavoriteButton();
}

function removeFavorite(symbol){

  var list=getWatchlist().filter(function(stock){

    return String(stock.symbol)!==
      String(symbol);
  });

  saveWatchlist(list);
}

function updateFavoriteButton(){

  var button=el("favoriteButton");

  if(!button||!currentStock)return;

  if(isFavorite(currentStock.symbol)){

    button.textContent=
      "★ 已加入自選 · 點擊移除";

    button.classList.add("active");

  }else{

    button.textContent=
      "☆ 加入自選";

    button.classList.remove("active");
  }
}

function renderWatchlist(){

  var root=el("watchGrid");

  if(!root)return;

  var list=getWatchlist();

  if(!list.length){

    root.innerHTML=

/* =========================
   指標
========================= */

function SMA(values,period){

  if(values.length<period)return NaN;

  var a=values.slice(-period);
  var total=0;

  for(var i=0;i<a.length;i++){
    total+=Number(a[i]);
  }

  return total/period;
}

function EMA(values,period){

  if(values.length<period)return NaN;

  var total=0;

  for(var i=0;i<period;i++){
    total+=Number(values[i]);
  }

  var ema=total/period;
  var k=2/(period+1);

  for(var j=period;j<values.length;j++){

    ema=
      Number(values[j])*k+
      ema*(1-k);
  }

  return ema;
}

function RSI(values,period){

  period=period||14;

  if(values.length<=period)return NaN;

  var a=values.slice(-(period+1));

  var gains=0;
  var losses=0;

  for(var i=1;i<a.length;i++){

    var diff=
      Number(a[i])-
      Number(a[i-1]);

    if(diff>0){
      gains+=diff;
    }else{
      losses+=Math.abs(diff);
    }
  }

  var ag=gains/period;
  var al=losses/period;

  if(al===0)return 100;

  var rs=ag/al;

  return 100-(100/(1+rs));
}

function ATR(rows,period){

  period=period||14;

  if(rows.length<=period)return NaN;

  var tr=[];

  for(var i=1;i<rows.length;i++){

    var high=Number(rows[i].high);
    var low=Number(rows[i].low);
    var prev=Number(rows[i-1].close);

    tr.push(
      Math.max(
        high-low,
        Math.abs(high-prev),
        Math.abs(low-prev)
      )
    );
  }

  return SMA(tr,period);
}

/* =========================
   分析主程式
========================= */

function buildAnalysis(data){

  var rows=
    Array.isArray(data.rows)
      ?data.rows
      :[];

  if(rows.length<60){

    throw new Error(
      "歷史資料不足"
    );
  }

  var closes=
    rows.map(function(row){

      return Number(row.close);
    });

  var symbol=
    String(data.symbol||"");

  var price=
    Number(data.livePrice);

  var live=null;

  /* 雷達即時價格 */

  if(
    data.market==="TW" &&
    radarData
  ){

    var groups=[
      radarData.radar||[],
      radarData.longWatch||[],
      radarData.volumeLeaders||[],
      radarData.momentumLeaders||[]
    ];

    for(
      var g=0;
      g<groups.length;
      g++
    ){

      for(
        var z=0;
        z<groups[g].length;
        z++
      ){

        if(
          String(groups[g][z].symbol)===
          symbol
        ){

          live=
            groups[g][z];

          break;
        }
      }

      if(live)break;
    }
  }

  if(
    live &&
    Number.isFinite(
      Number(live.price)
    )
  ){

    price=
      Number(live.price);
  }

  if(!Number.isFinite(price)){

    price=
      closes[
        closes.length-1
      ];
  }

  /* 指標 */

  var ma20=
    SMA(closes,20);

  var ma60=
    SMA(closes,60);

  var rsi=
    RSI(closes,14);

  var recent=
    closes.slice(-80);

  var macd=
    EMA(recent,12)-
    EMA(recent,26);

  var atr=
    ATR(rows,14);

  var prior20=
    rows.slice(-21,-1);

  var resistance=
    Math.max.apply(
      null,
      prior20.map(function(row){

        return Number(row.high);
      })
    );

  var low10=
    Math.min.apply(
      null,
      rows.slice(-10)
      .map(function(row){

        return Number(row.low);
      })
    );

  var low20=
    Math.min.apply(
      null,
      rows.slice(-20)
      .map(function(row){

        return Number(row.low);
      })
    );

  var low60=
    Math.min.apply(
      null,
      rows.slice(-60)
      .map(function(row){

        return Number(row.low);
      })
    );

  var support=
    Math.max(
      low10,
      Math.min(ma20,price)-
      atr*.5
    );

  var trend="整理";

  if(
    price>ma20 &&
    ma20>ma60
  ){

    trend=
      "偏多趨勢";

  }else if(
    price<ma20 &&
    ma20<ma60
  ){

    trend=
      "偏弱趨勢";
  }

  /* =========================
     回踩策略
  ========================= */

  var entryLow=
    Math.max(
      support,
      ma20-atr*.5
    );

  var entryHigh=
    ma20+atr*.35;

  if(entryLow>entryHigh){

    var temp=
      entryLow;

    entryLow=
      entryHigh;

    entryHigh=
      temp;
  }

  var center=
    (entryLow+entryHigh)/2;

  var distanceEntry=
    ((price-center)/price)*100;

  var stop=
    Math.min(
      support-atr*.5,
      entryLow-atr
    );

  var setupRisk=
    Math.max(
      center-stop,
      atr*.5
    );

  var tp1=
    center+
    setupRisk*1.5;

  var tp2=
    center+
    setupRisk*2.5;

  var tp3=
    center+
    setupRisk*4;

     高 R 突破回測
  ========================= */

    resistance-

  var breakHigh=
    resistance+
    atr*.35;

  if(breakLow>breakHigh){

      breakLow;

    breakLow=
      breakHigh;

    breakHigh=
      breakTemp;
  }

    高 R 的策略入場基準

  */

  var breakCenter=
    (breakLow+breakHigh)/2;

    Math.min(
      resistance-atr*.8,
      breakCenter-atr*.5
    );

    1R = 策略中心 - SL

  var breakRisk=
    Math.max(
      breakCenter-breakStop,
      atr*.5
    );

    TP1 = 2R
    TP2 = 3R
    TP3 = 5R
    延伸 = 7R

  var highTp1=
    breakCenter+
    breakRisk*2;

  var highTp2=

    breakRisk*3;

/* =========================
   畫面元件
========================= */

function indicator(name,value){

  return (
    '<div class="indicator">'+
      '<span>'+
        safe(name)+
      '</span>'+
      '<strong>'+
        safe(value)+
      '</strong>'+
    '</div>'
  );
}

function overviewRow(
  label,
  value,
  color
){

  return (
    '<div class="overview-row">'+
      '<div class="overview-label">'+
        safe(label)+
      '</div>'+
      '<div class="overview-value '+
        safe(color||"")+
      '">'+
        safe(value)+
      '</div>'+
    '</div>'
  );
}

function level(
  name,
  value,
  type
){

  return (
    '<div class="level-box '+
      safe(type||"")+
    '">'+
      '<span>'+
        safe(name)+
      '</span>'+
      '<strong>'+
        safe(value)+
      '</strong>'+
    '</div>'
  );
}

function renderTags(tags){

  return tags.map(function(tag){

    return (
      '<div class="reason-tag">'+
        safe(tag)+
      '</div>'
    );

  }).join("");
}

function renderChecks(checks){

  return checks.map(function(item){

    return (
      '<div class="check '+
        safe(item[0])+
      '">'+
        safe(item[1])+
      '</div>'
    );

  }).join("");
}

function renderBrain(items){

  return items.map(function(item){

    return (
      '<div class="brain-item '+
        safe(item[0])+
      '">'+
        safe(item[1])+
      '</div>'
    );

  }).join("");
}

/* =========================
   雷達
========================= */

el("refreshButton")
  .onclick=
  loadRadar;

async function loadRadar(){

  try{

    var response=
      await fetch(
        "/api/radar?t="+
        Date.now(),
        {cache:"no-store"}
      );

    var data=
      await response.json();

    if(
      !response.ok||
      !data.ok
    ){

      throw new Error(
        "雷達失敗"
      );
    }

    radarData=data;

    el("scanCount")
      .textContent=
      fmt(data.scanned,0);

    el("radarCount")
      .textContent=
      fmt(data.found,0);

    el("longCount")
      .textContent=
      fmt(
        data.longWatchCount,
        0
      );

    el("updateText")
      .textContent=
      "FinMind Sponsor 即時資料 · 更新 "+
      new Date()
      .toLocaleTimeString(
        "zh-TW"
      );

    renderStocks(
      "longGrid",
      data.longWatch||[],
      true
    );

    renderStocks(
      "radarGrid",
      data.radar||[],
      false
    );

    countdownSeconds=300;

  }catch(error){

    el("updateText")
      .textContent=
      "即時雷達連線失敗";
  }
}

function renderStocks(
  target,
  list,
  longMode
){

  var root=
    el(target);

  if(!list.length){

    root.innerHTML=
      '<div class="card">'+
      '目前沒有符合條件的股票'+
      '</div>';

    return;
  }

  var html="";

  list.forEach(function(stock){

    html+=

      '<article class="stock-card '+
      (
        longMode &&
        stock.longStatus===
        "優先觀察"
          ?"priority"
          :""
      )+
      '" data-stock="'+
      safe(stock.symbol)+
      '">'+

        '<div class="stock-top">'+

          '<div>'+

            '<div class="symbol">'+
              safe(stock.symbol)+
            '</div>'+

            '<div class="name">'+
              safe(
                stock.name||
                "台股"
              )+
              ' · '+
              safe(
                longMode
                  ?stock.longStatus
                  :stock.level
              )+
            '</div>'+

          '</div>'+

          '<div class="score">'+

            '<strong>'+
              safe(stock.score)+
            '</strong>'+

            '<span>'+
              '異動分數'+
            '</span>'+

          '</div>'+

        '</div>'+

        '<div class="price-row">'+

          '<div class="price">'+
            fmt(stock.price)+
          '</div>'+

          '<div class="'+
            pclass(
              stock.changePercent
            )+
          '">'+
            pct(
              stock.changePercent
            )+
          '</div>'+

        '</div>'+

        '<div class="chips">'+

          '<div class="chip green">'+
            '量比 '+
            fmt(
              stock.volumeRatio,
              1
            )+
            'x'+
          '</div>'+

          '<div class="chip">'+
            '高點 '+
            fmt(stock.high)+
          '</div>'+

          '<div class="chip">'+
            '位置 '+
            fmt(
              stock.dayPosition,
              0
            )+
            '%'+
          '</div>'+

        '</div>'+

      '</article>';
  });

  root.innerHTML=
    html;

  root
  .querySelectorAll(
    "[data-stock]"
  )
  .forEach(function(card){

    card.onclick=function(){

      var symbol=
        this.dataset.stock;

      el("symbolInput")
        .value=
        symbol;

      analyze(symbol);
    };
  });
}

/* =========================
   五分鐘自動更新
========================= */

setInterval(function(){

  countdownSeconds--;

  if(
    countdownSeconds<=0
  ){

    countdownSeconds=300;

    loadRadar();
  }

  var minutes=
    Math.floor(
      countdownSeconds/60
    );

  var seconds=
    countdownSeconds%60;

  el("countdown")
    .textContent=
    String(minutes)
      .padStart(2,"0")+
    ":"+
    String(seconds)
      .padStart(2,"0");

},1000);

/* 啟動 */

renderWatchlist();
loadRadar();

</script>
