<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>妖子平台 4.5</title>
<meta name="theme-color" content="#030504">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="妖子平台">

<style>
*{box-sizing:border-box}
:root{
--bg:#030504;
--card:#0b0e0c;
--border:#292e2b;
--text:#f6f7f6;
--muted:#8c918e;
--green:#45e0ad;
--red:#ff6976;
--yellow:#ffc85a;
--purple:#bd7cff;
--orange:#ff9f43;
--blue:#70b7ff
}

html{background:var(--bg);scroll-behavior:smooth}

body{
margin:0;
background:radial-gradient(circle at top,rgba(43,111,84,.12),transparent 420px),var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
-webkit-font-smoothing:antialiased
}

button,input{font:inherit}
button{cursor:pointer}

.app{
width:min(100%,760px);
margin:auto;
padding:18px 14px 80px
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-bottom:16px
}

.logo{
font-size:24px;
font-weight:950;
letter-spacing:-1px
}

.logo small{
display:block;
font-size:10px;
font-weight:650;
color:var(--muted);
letter-spacing:.4px;
margin-top:3px
}

.notify-btn,.refresh-btn,.more-btn,.favorite-btn{
border:1px solid var(--border);
background:#101411;
color:#e7eae8;
border-radius:12px;
padding:10px 12px;
font-size:12px;
font-weight:850
}

.refresh-btn:active,.more-btn:active,.notify-btn:active,.favorite-btn:active{
transform:scale(.98)
}

.market-tabs{
display:flex;
gap:7px;
background:#080b09;
border:1px solid var(--border);
padding:5px;
border-radius:14px;
margin-bottom:14px
}

.market-tab{
flex:1;
border:0;
background:transparent;
color:#777d79;
padding:10px 6px;
border-radius:10px;
font-size:12px;
font-weight:900
}

.market-tab.active{
background:#151a17;
color:white
}

.search-card,.card,.hero-card,.strategy-card,.position-card,.kbar-card,.backtest-card,.brain-card,.recommend-card{
background:linear-gradient(180deg,#0d110f,#090c0a);
border:1px solid var(--border);
border-radius:18px;
box-shadow:0 12px 32px rgba(0,0,0,.2)
}

.search-card{
padding:14px;
margin-bottom:14px
}

.search-row{
display:flex;
gap:8px
}

.search-input{
flex:1;
min-width:0;
border:1px solid #303632;
background:#060806;
color:white;
border-radius:12px;
padding:13px 12px;
outline:none;
font-size:15px;
font-weight:800
}

.search-input:focus{border-color:#4c6559}

.search-button{
border:0;
border-radius:12px;
padding:0 18px;
background:#e8eee9;
color:#111;
font-weight:950
}

.search-examples{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:10px
}

.example{
border:1px solid #252a27;
background:#101310;
color:#a9aeab;
border-radius:999px;
padding:6px 9px;
font-size:10px;
font-weight:800
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin:18px 1px 10px
}

.section-title{
font-size:14px;
font-weight:950
}

.section-sub{
font-size:10px;
line-height:1.6;
color:var(--muted)
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:12px
}

.stat{
background:#0a0d0b;
border:1px solid var(--border);
border-radius:14px;
padding:12px 9px
}

.stat span{
display:block;
font-size:9px;
color:var(--muted)
}

.stat strong{
display:block;
font-size:20px;
margin-top:4px
}

.update-line{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
font-size:10px;
color:#858b87;
margin:8px 2px 12px
}

.stock-grid{
display:grid;
gap:9px
}

.stock-card{
border:1px solid var(--border);
background:linear-gradient(180deg,#0d100e,#080b09);
border-radius:16px;
padding:13px;
cursor:pointer
}

.stock-card.priority{
border-color:#3a594c
}

.stock-top{
display:flex;
justify-content:space-between;
gap:10px
}

.stock-title-line{
display:flex;
align-items:baseline;
gap:8px;
flex-wrap:wrap
}

.symbol{
font-size:16px;
font-weight:950
}

.stock-inline-name{
font-size:11px;
color:#aeb3b0;
font-weight:800
}

.stock-strategy-line{
font-size:10px;
color:#b9bebc;
margin-top:5px;
font-weight:800
}

.score{
text-align:right
}

.score strong{
display:block;
font-size:18px
}

.score span{
font-size:8px;
color:var(--muted)
}

.price-row{
display:flex;
align-items:baseline;
gap:10px;
margin-top:10px
}

.price{
font-size:20px;
font-weight:950
}

.up{color:var(--red)}
.down{color:var(--green)}
.flat{color:#b8bdb9}

.chips{
display:flex;
flex-wrap:wrap;
gap:5px;
margin-top:10px
}

.chip{
font-size:9px;
font-weight:850;
padding:5px 7px;
border-radius:999px;
border:1px solid #2a2f2c;
color:#adb2af
}

.chip.green{color:#a6ead3;border-color:#25483b}
.chip.purple{color:#d6b6ff;border-color:#4b3565}
.chip.orange{color:#ffc98f;border-color:#5d4125}

.watch-open{
font-size:9px;
color:#707672;
margin-top:11px
}

.watch-list{
display:grid;
gap:8px
}

.watch-item{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border:1px solid var(--border);
background:#0b0e0c;
padding:11px;
border-radius:14px
}

.watch-main{
min-width:0;
cursor:pointer
}

.watch-symbol{
font-weight:950;
font-size:13px
}

.watch-name{
font-size:9px;
color:var(--muted);
margin-top:2px
}

.watch-remove{
border:0;
background:#1a0d0f;
color:#ff8e98;
border-radius:9px;
padding:7px 9px
}

.loading{
padding:28px 10px;
text-align:center;
color:#909692;
font-size:12px
}

.error{
padding:14px;
border:1px solid #4b252a;
background:#1a0c0e;
border-radius:14px;
color:#ff9ba4;
font-size:11px;
line-height:1.7
}

.hidden{display:none!important}

.back-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:12px
}

.back-button{
border:1px solid var(--border);
background:#0c100d;
color:#ddd;
padding:9px 11px;
border-radius:11px;
font-weight:850
}

.analysis-refresh{
font-size:10px;
color:var(--muted)
}

.hero-card{
padding:16px;
margin-bottom:14px
}

.hero-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px
}

.hero-symbol{
font-size:24px;
font-weight:950
}

.hero-name{
font-size:12px;
font-weight:850;
color:#aeb3b0
}

.market-pill{
display:inline-block;
font-size:9px;
color:#aeb4b0;
border:1px solid #303531;
padding:5px 7px;
border-radius:999px;
margin-top:7px
}

.hero-price{
text-align:right;
font-size:28px;
font-weight:950
}

.hero-change{
text-align:right;
font-size:12px;
font-weight:900;
margin-top:4px
}

.favorite-btn{
width:100%;
margin-top:14px
}

.favorite-btn.active{
color:#ffe394;
border-color:#5c5127;
background:#18160c
}

.indicator-strip{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:13px
}

.indicator{
background:#080b09;
border:1px solid #222724;
border-radius:12px;
padding:10px 8px
}

.indicator span{
display:block;
font-size:8px;
color:#777d79
}

.indicator strong{
display:block;
font-size:12px;
margin-top:3px
}

.volume-card{
margin-top:12px;
border-top:1px solid #202522;
padding-top:12px
}

.volume-title{
font-size:11px;
font-weight:900
}

.volume-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
margin-top:8px
}

.volume-box{
border:1px solid #232824;
border-radius:10px;
padding:8px
}

.volume-box span{
display:block;
font-size:8px;
color:#777d79
}

.volume-box strong{
display:block;
font-size:11px;
margin-top:3px
}

.big-section-title{
font-size:15px;
font-weight:950;
margin:20px 2px 10px
}

.recommend-card{
padding:15px
}

.recommend-top{
display:flex;
justify-content:space-between;
gap:12px;
align-items:flex-start
}

.recommend-name{
font-size:20px;
font-weight:950
}

.recommend-score{
text-align:right
}

.recommend-score strong{
font-size:24px
}

.recommend-score span{
display:block;
font-size:8px;
color:var(--muted)
}

.recommend-note{
font-size:10px;
color:#a5aaa7;
line-height:1.75;
margin-top:10px
}

.recommend-mini-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:12px
}

.recommend-mini{
border:1px solid #272c29;
background:#080b09;
border-radius:12px;
padding:9px 7px;
text-align:center
}

.recommend-mini span{
display:block;
font-size:8px;
color:#777d79
}

.recommend-mini strong{
display:block;
font-size:14px;
margin-top:3px
}

.recommend-levels{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:10px
}

.recommend-level{
border:1px solid #262b28;
border-radius:11px;
padding:9px
}

.recommend-level span{
display:block;
font-size:8px;
color:#777d79
}

.recommend-level strong{
display:block;
font-size:11px;
margin-top:3px
}

.position-card{
padding:15px
}

.position-form{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.position-input{
width:100%;
border:1px solid #303632;
background:#070907;
color:white;
border-radius:11px;
padding:11px;
outline:none
}

.position-actions{
display:flex;
gap:8px;
margin-top:8px
}

.position-save{
flex:1;
border:0;
background:#dfe7e1;
color:#111;
border-radius:11px;
padding:10px;
font-weight:950
}

.position-delete{
border:1px solid #4b252a;
background:#160b0d;
color:#ff8e98;
border-radius:11px;
padding:10px
}

.position-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:10px
}

.position-stat{
border:1px solid #252a27;
border-radius:11px;
padding:9px
}

.position-stat span{
display:block;
font-size:8px;
color:#777d79
}

.position-stat strong{
display:block;
font-size:12px;
margin-top:3px
}

.kbar-card{
padding:14px
}

.kbar-tabs{
display:flex;
gap:6px;
overflow-x:auto;
padding:8px 0 4px;
-webkit-overflow-scrolling:touch
}

.kbar-tab{
flex:0 0 auto;
border:1px solid #292e2b;
background:#0a0d0b;
color:#8c918e;
border-radius:9px;
padding:7px 9px;
font-size:9px;
font-weight:850
}

.kbar-tab.active{
background:#e3e9e5;
color:#111
}

.kbar-chart-wrap{
margin-top:8px;
border:1px solid #202522;
border-radius:12px;
overflow:hidden;
background:#050705
}

#kbarCanvas{
width:100%;
height:500px;
display:block;
touch-action:none
}

.kbar-info{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:1px;
background:#202522;
border-bottom:1px solid #202522
}

.kbar-info-item{
background:#080b09;
padding:7px;
font-size:8px;
color:#777d79
}

.kbar-info-item strong{
display:block;
font-size:10px;
color:#d9dcda;
margin-top:2px
}

.kbar-status{
padding:8px 10px;
font-size:9px;
color:#858b87;
border-top:1px solid #202522
}

.kbar-status.live{color:#93dfc4}
.kbar-status.error{color:#ff8e98}

.strategy-card{
padding:15px;
margin-bottom:10px
}

.strategy-head{
display:flex;
justify-content:space-between;
gap:10px
}

.strategy-name{
font-size:16px;
font-weight:950
}

.strategy-grade{
font-size:9px;
color:#999f9b;
margin-top:3px
}

.strategy-score{
font-size:22px;
font-weight:950;
text-align:right
}

.strategy-score small{
display:block;
font-size:8px;
color:#777d79
}

.condition-row{
padding:11px 0;
border-top:1px solid #202522;
font-size:12px;
font-weight:850;
line-height:1.7
}

.condition-row.good{color:#bdf2dc}
.condition-row.warn{color:#f4d68b}
.condition-row.bad{color:#ff8d97}

.condition-detail,.condition-explain{
display:block;
color:#858b87;
font-size:10px;
font-weight:500;
margin:3px 0 0 20px;
line-height:1.65
}

.strategy-levels{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:11px
}

.strategy-level{
border:1px solid #242925;
border-radius:11px;
padding:9px
}

.strategy-level span{
display:block;
font-size:8px;
color:#777d79
}

.strategy-level strong{
display:block;
font-size:11px;
margin-top:3px
}

.qualified-badge{
margin-top:10px;
padding:8px;
border-radius:10px;
font-size:9px;
font-weight:850;
color:#a9ead4;
background:#0d1c16;
border:1px solid #224538
}

.qualified-badge.not-qualified{
color:#c3c6c4;
background:#101311;
border-color:#292e2b
}

.backtest-card{
padding:14px;
margin-bottom:9px
}

.backtest-head{
display:flex;
justify-content:space-between;
gap:10px
}

.backtest-name{
font-size:13px;
font-weight:950
}

.winrate{
font-size:21px;
font-weight:950
}

.backtest-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
margin-top:10px
}

.backtest-stat{
border:1px solid #242925;
border-radius:10px;
padding:8px
}

.backtest-stat span{
display:block;
font-size:8px;
color:#777d79
}

.backtest-stat strong{
display:block;
font-size:11px;
margin-top:3px
}

.brain-card{
padding:14px
}

.brain-summary{
font-size:10px;
color:#a5aaa7;
line-height:1.7;
margin-bottom:8px
}

.brain-item{
border-top:1px solid #202522;
padding:10px 0;
font-size:10px;
font-weight:850
}

.brain-item.good{color:#a9ead4}
.brain-item.warn{color:#f1cf7c}

.data-note{
font-size:9px;
color:#6f7471;
line-height:1.75;
margin:16px 4px
}

@media(max-width:430px){
.app{padding-left:11px;padding-right:11px}
.logo{font-size:21px}
.indicator-strip{grid-template-columns:repeat(2,1fr)}
.recommend-levels,.strategy-levels{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div class="app">

<div id="homeView">

<div class="header">
<div class="logo">
妖子平台
<small>股票策略分析 4.5</small>
</div>

<button id="notifyButton" class="notify-btn">
🔔 高勝率策略通知
</button>
</div>

<div class="market-tabs">
<button id="twTab" class="market-tab active">🇹🇼 台股</button>
<button id="usTab" class="market-tab">🇺🇸 美股</button>
</div>

<div class="search-card">
<div class="search-row">
<input id="searchInput" class="search-input" placeholder="輸入股票代號，例如 2330 / NVDA">
<button id="searchButton" class="search-button">分析</button>
</div>

<div class="search-examples">
<button class="example" data-example="2330">2330</button>
<button class="example" data-example="2317">2317</button>
<button class="example" data-example="2454">2454</button>
<button class="example" data-example="NVDA">NVDA</button>
<button class="example" data-example="AAPL">AAPL</button>
<button class="example" data-example="TSLA">TSLA</button>
</div>
</div>

<div id="watchSection">
<div class="section-head">
<div>
<div class="section-title">⭐ 我的自選</div>
<div class="section-sub">點股票直接進入完整分析</div>
</div>
</div>
<div id="watchList" class="watch-list"></div>
</div>

<div id="twMarket">

<div class="section-head">
<div>
<div class="section-title">🇹🇼 台股市場掃描</div>
<div class="section-sub">使用母版本策略掃描條件</div>
</div>

<button id="refreshButton" class="refresh-btn">重新掃描</button>
</div>

<div class="stats">
<div class="stat">
<span>掃描股票</span>
<strong id="scanCount">--</strong>
</div>

<div class="stat">
<span>符合策略</span>
<strong id="strategyCount">--</strong>
</div>

<div class="stat">
<span>異動股票</span>
<strong id="radarCount">--</strong>
</div>
</div>

<div class="update-line">
<span id="updateText">正在掃描市場…</span>
<span id="countdown">01:00</span>
</div>

<div class="section-head">
<div>
<div class="section-title">🎯 自動偵測符合策略股票</div>
<div class="section-sub">母版本策略掃描結果</div>
</div>
<button class="more-btn" data-more="strategy">查看更多符合策略股票</button>
</div>

<div id="strategyGrid" class="stock-grid"></div>

<div class="section-head">
<div>
<div class="section-title">🟢 做多觀察</div>
<div class="section-sub">趨勢與位置較適合持續觀察</div>
</div>
<button class="more-btn" data-more="long">查看更多做多觀察股票</button>
</div>

<div id="longGrid" class="stock-grid"></div>

<div class="section-head">
<div>
<div class="section-title">⚡ 市場異動雷達</div>
<div class="section-sub">價格與成交量異動</div>
</div>
<button class="more-btn" data-more="radar">查看更多異動股票</button>
</div>

<div id="radarGrid" class="stock-grid"></div>

</div>

<div id="usMarket" class="hidden">
<div class="section-head">
<div>
<div class="section-title">🇺🇸 美股最近分析</div>
<div class="section-sub">搜尋過的美股會顯示在這裡</div>
</div>
</div>

<div id="usRecentGrid" class="stock-grid"></div>
</div>

</div>

<div id="analysisView" class="hidden">

<div class="back-row">
<button id="backButton" class="back-button">← 返回</button>
<div id="analysisRefresh" class="analysis-refresh">每 30 秒更新</div>
</div>

<div id="analysisResult"></div>

</div>

</div>

<script>
const WATCH_KEY="yaozi_watchlist";
const POSITION_KEY="yaozi_positions_v31";
const HISTORY_KEY="yaozi_search_history_v1";

const STRICT_TARGET_WINRATE=70;
const STRICT_MIN_SAMPLE=20;

var currentStock=null;
var currentAnalysisSymbol="";
var currentAnalysisData=null;
var analysisTimer=null;

var radarData=null;

var expanded={
strategy:false,
long:false,
radar:false
};

var countdownSeconds=60;

var KBAR_TF="5";
var KBAR_DATA=[];
var KBAR_TIMER=null;
var KBAR_LOADING=false;

var KBAR_FAVORITE_KEY="yaozi_kbar_favorites_v1";

var KBAR_ALL_TF=[
"1","3","5","10","15","30","60",
"2h","4h","6h","12h",
"1d","1w","1mo","1y"
];

var KBAR_TF_NAME={
"1":"1分",
"3":"3分",
"5":"5分",
"10":"10分",
"15":"15分",
"30":"30分",
"60":"1小時",
"2h":"2小時",
"4h":"4小時",
"6h":"6小時",
"12h":"12小時",
"1d":"日K",
"1w":"週K",
"1mo":"月K",
"1y":"年K"
};

var KBAR_VIEW={
offset:0,
selected:null,

function safe(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;")
}

function fmt(v,d=2){
var n=Number(v);
if(!Number.isFinite(n))return"--";

return n.toLocaleString(
"zh-TW",
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
}

function pct(v){
var n=Number(v);

if(!Number.isFinite(n))return"--";

return(
(n>0?"+":"")+
fmt(n,2)+
"%"
)
}

function pclass(v){
var n=Number(v);

if(n>0)return"up";
if(n<0)return"down";

return"flat"
}

function clamp(v,a,b){
return Math.max(a,Math.min(b,v))
}

function currentTimeText(){

"zh-TW",
{
hour:"2-digit",

function lastNum(a){
if(!Array.isArray(a)||!a.length)return null;

for(var i=a.length-1;i>=0;i--){
var n=Number(a[i]);

if(Number.isFinite(n))return n
}

return null
}

function marketOf(d){

var rows=d.rows||[];

var last=rows.at(-1)||{};

var price=
Number(d.price)||
Number(last.close)||
0;

var ma20=
Number(d.ma20);

var ma60=
Number(d.ma60);

var rsi=
Number(d.rsi);

var macd=
Number(d.macd);

var atr=
Number(d.atr);

if(!Number.isFinite(ma20)){

var a=rows
.slice(-20)
.map(x=>+x.close)
.filter(Number.isFinite);

ma20=
a.length
?a.reduce((s,x)=>s+x,0)/a.length
:price

}

if(!Number.isFinite(ma60)){

var b=rows
.slice(-60)
.map(x=>+x.close)
.filter(Number.isFinite);

ma60=
b.length
?b.reduce((s,x)=>s+x,0)/b.length
:price

}

if(!Number.isFinite(rsi)){
rsi=50
}

if(!Number.isFinite(macd)){
macd=0
}

if(!Number.isFinite(atr)){

var recent=rows.slice(-14);

var trs=[];

for(var i=1;i<recent.length;i++){

var c=recent[i];
var p=recent[i-1];

trs.push(
Math.max(
+c.high-+c.low,
Math.abs(+c.high-+p.close),
Math.abs(+c.low-+p.close)
)
)

}

atr=
trs.length
?trs.reduce((s,x)=>s+x,0)/trs.length
:price*.02

}

var resistance=
Number(d.resistance);

if(!Number.isFinite(resistance)){

resistance=
Math.max(
...rows
.slice(-20)
.map(x=>+x.high)
.filter(Number.isFinite)
)

}

var support=
Number(d.support);

if(!Number.isFinite(support)){

support=
Math.min(
...rows
.slice(-20)
.map(x=>+x.low)
.filter(Number.isFinite)
)

}

var low10=
Math.min(
...rows
.slice(-10)
.map(x=>+x.low)
.filter(Number.isFinite)
);

var high10=
Math.max(
...rows
.slice(-10)
.map(x=>+x.high)
.filter(Number.isFinite)
);

return{
price,
ma20,
ma60,
rsi,
macd,
atr,
resistance,
support,
low10,
high10
}
}

function volumeMetrics(d,rows){

var current=
Number(d.volume)||
Number(rows.at(-1)?.volume)||
0;

var vols=
rows
.slice(-21,-1)
.map(x=>Number(x.volume))
.filter(x=>Number.isFinite(x)&&x>0);

var average20=
vols.length
?vols.reduce((a,b)=>a+b,0)/vols.length
:current;

var ratio=
average20>0
?current/average20
:0;

var level=
ratio>=2
?"爆量"
:ratio>=1.5
?"明顯放量"
:ratio>=1.2
?"溫和放量"
:ratio>=.8
?"正常"
:"量縮";

return{
current,
average20,
ratio,
level
}
}

function strategyConditions(type,d,m,v){

var price=m.price;

var structure=
price>m.ma60&&
m.ma20>=m.ma60;

var notBroken=
price>=m.low10&&
price>=m.ma60*.98;

if(type==="PULLBACK"){

return[
{
pass:m.ma20>m.ma60,
title:"MA20 高於 MA60",
explain:"中期趨勢維持多頭排列"
},
{
pass:price>=m.ma20-m.atr*.5,
title:"價格沒有明顯跌破 MA20",
explain:"避免回踩已轉成明顯破位"
},
{
pass:price<=m.ma20+m.atr*1.3,
title:"距離 MA20 不過度延伸",
explain:"避免追在離均線太遠的位置"
},
{
pass:m.rsi>=42,
title:"RSI 不低於 42",
explain:"動能不能過度疲弱"
},
{
pass:m.rsi<=68,
title:"RSI 不高於 68",
explain:"避免短線過熱"
},
{
pass:m.macd>=0,
title:"MACD 位於零軸附近或以上",
explain:"確認中短線動能沒有明顯轉弱"
},
{
pass:notBroken,
title:"近期結構未被破壞",
explain:"價格仍守住近期低點與主要趨勢位置"
},
{
pass:v.ratio<=1.6,
title:"回踩量能沒有異常爆量",
explain:"大量下跌回踩的風險較高"
}
]

}

if(type==="HIGH_R"){

return[
{
pass:m.ma20>m.ma60,
title:"MA20 高於 MA60",
explain:"主要趨勢偏多"
},
{
pass:price>m.ma20,
title:"價格位於 MA20 上方",
explain:"價格仍站在短中期趨勢線之上"
},
{
pass:m.macd>0,
title:"MACD 大於 0",
explain:"動能保持正值"
},
{
pass:m.rsi>=52,
title:"RSI 至少 52",
explain:"需要一定程度的多方動能"
},
{
pass:m.rsi<=72,
title:"RSI 不高於 72",
explain:"避免突破前已經過熱"
},
{
pass:price>=m.resistance-m.atr*.5,
title:"價格接近 20 日壓力",
explain:"高 R 策略等待壓力突破或突破確認"
},
{
pass:v.ratio>=1.2,
title:"成交量至少 1.2 倍",
explain:"突破需要量能確認"
},
{
pass:notBroken&&structure,
title:"當下結構仍完整",
explain:"MA60 與近期低點沒有被明顯跌破"
}
]

}

return[
{
pass:m.ma20>m.ma60,
title:"MA20 高於 MA60",
explain:"趨勢保持偏多"
},
{
pass:price>m.ma20,
title:"價格位於 MA20 上方",
explain:"強勢股通常保持在短中期均線上方"
},
{
pass:m.macd>0,
title:"MACD 大於 0",
explain:"動能保持正向"
},
{
pass:m.rsi>=58,
title:"RSI 至少 58",
explain:"續攻需要較強動能"
},
{
pass:m.rsi<=74,
title:"RSI 不高於 74",
explain:"避免極端過熱"
},
{
pass:price>=m.resistance-m.atr*.25,
title:"價格逼近或突破壓力",
explain:"續攻策略要求價格保持強勢"
},
{
pass:v.ratio>=1.5,
title:"成交量至少 1.5 倍",
explain:"強勢續攻需要更明顯的量能"
},
{
pass:notBroken&&structure,
title:"當下多頭結構未破壞",
explain:"價格與均線結構仍支持續攻"
}
]
}

function buildStrategySetups(d,m,v){

var result={};

[
"PULLBACK",
"HIGH_R",
"SURGE"
].forEach(type=>{

var conditions=
strategyConditions(
type,
d,
m,
v
);

var passed=
conditions.filter(x=>x.pass).length;

result[type]={
conditions,
passed,
total:conditions.length,
score:
Math.round(
passed/
conditions.length*
100
),
qualified:
passed>=7
}

});

return result
}

function calculateStrategyRecommendation(m,v,setups){

var price=m.price;

var structureState=
price>m.ma60&&
m.ma20>=m.ma60;

var structureBroken=
price<m.ma60||
m.ma20<m.ma60||
price<m.low10;

var pullback=0;

if(m.ma20>m.ma60)pullback+=25;
if(price>=m.ma20-m.atr*.5)pullback+=15;
if(price<=m.ma20+m.atr*1.3)pullback+=15;
if(m.rsi>=42&&m.rsi<=68)pullback+=15;
if(m.macd>=0)pullback+=15;
if(!structureBroken)pullback+=15;

if(v.ratio<=1.35)pullback+=5;
if(v.ratio>=2)pullback-=10;

var highR=0;

if(m.ma20>m.ma60)highR+=20;
if(price>m.ma20)highR+=15;
if(m.macd>0)highR+=15;
if(m.rsi>=52&&m.rsi<=72)highR+=15;
if(price>=m.resistance-m.atr*.5)highR+=20;
if(!structureBroken)highR+=15;
if(v.ratio>=1.2)highR+=5;

var surge=0;

if(m.ma20>m.ma60)surge+=20;
if(price>m.ma20)surge+=15;
if(m.macd>0)surge+=15;
if(m.rsi>=58&&m.rsi<=74)surge+=15;
if(price>=m.resistance-m.atr*.25)surge+=20;
if(!structureBroken)surge+=15;
if(v.ratio>=1.5)surge+=5;

if(structureBroken){
pullback-=25;
highR-=30;
surge-=35;
}

pullback=Math.round(clamp(pullback,0,100));
highR=Math.round(clamp(highR,0,100));
surge=Math.round(clamp(surge,0,100));

var list=[
{
key:"PULLBACK",
name:"支撐回踩",
score:pullback,
target:"pullbackStrategy"
},
{
key:"HIGH_R",
name:"高 R 突破",
score:highR,
target:"highRStrategy"
},
{
key:"SURGE",
name:"強勢續攻",
score:surge,
target:"surgeStrategy"
}
];

list.sort(
(a,b)=>b.score-a.score
);

return{
best:list[0],
scores:{
PULLBACK:pullback,
HIGH_R:highR,
SURGE:surge
},
structureState,
structureBroken
}
}

function createPosition(d,entry,quantity,m){

entry=Number(entry);
quantity=Number(quantity);

if(
!Number.isFinite(entry)||
entry<=0
){
throw Error("請輸入正確成本價")
}

if(
!Number.isFinite(quantity)||
quantity<=0
){
throw Error("請輸入正確持有數量")
}

var initialStop=
Math.min(
m.ma60,
m.low10,
entry-m.atr*1.5
);

return{
entry,
quantity,
initialStop,
protectedStop:initialStop,
createdAt:Date.now()
}
}

function updatedPosition(p,m){

if(!p)return null;

var protectedStop=
Number(p.protectedStop)||
Number(p.initialStop)||
0;

var candidate=

========================= */

function normalizeDailyRows(rows){

return rows
.map(x=>{

var raw=
x.date||
x.time||
x.timestamp;

var ts=
typeof raw==="number"
?raw
:new Date(raw).getTime();

return{
timestamp:ts,
time:
Number.isFinite(ts)
?new Date(ts).toISOString()
:String(raw||""),
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0
}

})
.filter(x=>
Number.isFinite(x.timestamp)&&
Number.isFinite(x.open)&&
Number.isFinite(x.high)&&
Number.isFinite(x.low)&&
Number.isFinite(x.close)
)
.sort(
(a,b)=>a.timestamp-b.timestamp
)

}

function dailyBucketKey(ts,tf){

var d=
new Date(ts);

if(tf==="1d"){

return(
d.getFullYear()+
"-"+
String(
d.getMonth()+1
).padStart(2,"0")+
"-"+
String(
d.getDate()
).padStart(2,"0")
)

}

if(tf==="1w"){

var x=
new Date(
d.getFullYear(),
d.getMonth(),
d.getDate()
);

var day=
x.getDay();

var diff=
day===0
?-6
:1-day;

x.setDate(
x.getDate()+diff
);

return(
x.getFullYear()+
"-"+
String(
x.getMonth()+1
).padStart(2,"0")+
"-"+
String(
x.getDate()
).padStart(2,"0")
)

}

if(tf==="1mo"){

return(
d.getFullYear()+
"-"+
String(
d.getMonth()+1
).padStart(2,"0")
)

}

return String(
d.getFullYear()
)

}

function aggregateDailyCandles(rows,tf){

if(tf==="1d"){
return rows
}

var map=
new Map();

rows.forEach(x=>{

var key=
dailyBucketKey(
x.timestamp,
tf
);

if(!map.has(key)){

map.set(
key,
{
timestamp:x.timestamp,
time:x.time,
open:x.open,
high:x.high,
low:x.low,
close:x.close,
volume:x.volume
}
);

return
}

var z=
map.get(key);

z.high=
Math.max(
z.high,
x.high
);

z.low=
Math.min(
z.low,
x.low
);

z.close=
x.close;

z.volume+=
Number(x.volume)||0

});

return[
...map.values()
].sort(
(a,b)=>a.timestamp-b.timestamp
)

}

/* =========================
   EMA + MACD
========================= */

function calculateKBarIndicators(rows){

var closes=[];

var ema5=null;
var ema20=null;
var ema60=null;
var ema12=null;
var ema26=null;
var signal=null;

var k5=2/6;
var k20=2/21;
var k60=2/61;
var k12=2/13;
var k26=2/27;
var k9=2/10;

rows.forEach((x,i)=>{

var close=
+x.close;

closes.push(close);

if(i===4){

ema5=
closes
.slice(0,5)
.reduce(
(a,b)=>a+b,
0
)/5

}else if(i>4){

ema5=
close*k5+
ema5*(1-k5)

}

x.ema5=
i>=4
?ema5
:null;

if(i===19){

ema20=
closes
.slice(0,20)
.reduce(
(a,b)=>a+b,
0
)/20

}else if(i>19){

ema20=
close*k20+
ema20*(1-k20)

}

x.ema20=
i>=19
?ema20
:null;

if(i===59){

ema60=
closes
.slice(0,60)
.reduce(
(a,b)=>a+b,
0
)/60

}else if(i>59){

ema60=
close*k60+
ema60*(1-k60)

}

x.ema60=
i>=59
?ema60
:null;

if(i===11){

ema12=
closes
.slice(0,12)
.reduce(
(a,b)=>a+b,
0
)/12

}else if(i>11){

ema12=
close*k12+
ema12*(1-k12)

}

if(i===25){

ema26=
closes
.slice(0,26)
.reduce(
(a,b)=>a+b,
0
)/26

}else if(i>25){

ema26=
close*k26+
ema26*(1-k26)

}

if(
i>=25&&
Number.isFinite(ema12)&&
Number.isFinite(ema26)
){

x.dif=
ema12-
ema26;

if(signal==null){

signal=
x.dif

}else{

signal=
x.dif*k9+
signal*(1-k9)

}

x.signal=
signal;

x.hist=
(
x.dif-
signal
)*2

}else{

x.dif=null;
x.signal=null;
x.hist=null

}

})

}

function getKBarVisibleCount(width){

if(width<390)return 45;
if(width<600)return 55;

return 70
}

function getKBarWindow(rows,width){

var count=
Math.min(
getKBarVisibleCount(width),
rows.length
);

var maxOffset=
Math.max(
0,
rows.length-count
);

KBAR_VIEW.offset=
clamp(
KBAR_VIEW.offset,
0,
maxOffset
);

var end=
rows.length-
KBAR_VIEW.offset;

var start=
Math.max(
0,
end-count
);

return{
start,
end,
rows:
rows.slice(
start,
end
)
}

}

function drawIndicatorLine(
g,
rows,
key,
xOf,
yOf,
stroke
){

var started=false;

g.beginPath();

rows.forEach((x,i)=>{

var v=
Number(
x[key]
);

if(
!Number.isFinite(v)
)return;

var X=xOf(i);
var Y=yOf(v);

if(!started){

g.moveTo(X,Y);
started=true

}else{

g.lineTo(X,Y)

}

});

if(started){

g.strokeStyle=stroke;
g.lineWidth=1.35;
g.stroke()

}

}

function drawKBar(rows){

var c=
el("kbarCanvas");

if(
!c||
!rows.length
)return;

var rect=
c.getBoundingClientRect();

var w=
Math.max(
300,
rect.width
);

var h=500;

var dpr=
window.devicePixelRatio||
1;

c.width=
Math.round(
w*dpr
);

c.height=
Math.round(
h*dpr
);

var g=
c.getContext("2d");

g.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

g.clearRect(
0,
0,
w,
h
);

var L=8;
var R=52;

var PRICE_TOP=15;
var PRICE_BOTTOM=300;

var VOL_TOP=307;
var VOL_BOTTOM=350;

var MACD_TOP=380;
var MACD_BOTTOM=475;

var win=
getKBarWindow(
rows,
w
);

var a=
win.rows;

if(!a.length)return;

var priceValues=[];

a.forEach(x=>{

[
x.high,
x.low,
x.ema5,
x.ema20,
x.ema60
].forEach(v=>{

v=
Number(v);

if(
Number.isFinite(v)
){

priceValues.push(v)

}

})

});

var hi=
Math.max(
...priceValues
);

var lo=
Math.min(
...priceValues
);

var padding=
(hi-lo||1)*
.08;

hi+=padding;
lo-=padding;

var range=
hi-lo||
1;

var chartW=
w-L-R;

var step=
chartW/
a.length;

var bw=
Math.max(
2,
Math.min(
9,
step*.62
)
);

var xOf=i=>
L+
step*i+
step/2;

var priceY=p=>
PRICE_TOP+
(hi-p)/
range*
(
PRICE_BOTTOM-
PRICE_TOP
);

for(
var k=0;
k<=4;
k++
){

var yy=
PRICE_TOP+
(
PRICE_BOTTOM-
PRICE_TOP
)*
k/4;

g.strokeStyle=
"rgba(255,255,255,.065)";

g.lineWidth=1;

g.beginPath();

g.moveTo(
L,
yy
);

g.lineTo(
w-R,
yy
);

g.stroke();

var val=

========================= */

function kbarIndexFromX(clientX){

var c=
el("kbarCanvas");

if(
!c||
!KBAR_DATA.length
)return null;

var rect=
c.getBoundingClientRect();

var w=
rect.width;

var win=
getKBarWindow(
KBAR_DATA,
w
);

var chartW=
w-60;

var x=
clientX-
rect.left-
8;

if(
x<0||
x>chartW
)return null;

var local=
Math.floor(
x/
(
chartW/
win.rows.length
)
);

local=
clamp(
local,
0,
win.rows.length-1
);

return(
win.start+
local
)

}

function selectKBarAtX(x){

var index=
kbarIndexFromX(x);

if(index==null)return;

KBAR_VIEW.selected=
index;

updateKInfo(
KBAR_DATA[index],
index
);

drawKBar(
KBAR_DATA
)

}

function moveKBarWindow(deltaPixels){

var c=
el("kbarCanvas");

if(
!c||
!KBAR_DATA.length
)return;

var width=
c.getBoundingClientRect()
.width;

var count=
Math.min(
getKBarVisibleCount(width),
KBAR_DATA.length
);

var pixelsPerBar=
Math.max(
5,
(width-60)/
count
);

var deltaBars=
Math.round(
deltaPixels/
pixelsPerBar
);

var maxOffset=
Math.max(
0,
KBAR_DATA.length-
count
);

KBAR_VIEW.offset=
clamp(
KBAR_VIEW.startOffset+
deltaBars,
0,
maxOffset
);

drawKBar(
KBAR_DATA
)

}

function resetKBarLatest(){

KBAR_VIEW.offset=0;
KBAR_VIEW.selected=null;

drawKBar(
KBAR_DATA
);

if(
KBAR_DATA.length
){

updateKInfo(
KBAR_DATA.at(-1),
KBAR_DATA.length-1
)

}

}

function bindKBarInteractions(){

var c=
el("kbarCanvas");

if(!c)return;

c.ontouchstart=e=>{

if(
!e.touches?.length
)return;

KBAR_VIEW.dragging=true;
KBAR_VIEW.moved=false;

KBAR_VIEW.startX=
e.touches[0].clientX;

KBAR_VIEW.startOffset=
KBAR_VIEW.offset;

selectKBarAtX(
e.touches[0].clientX
)

};

c.ontouchmove=e=>{

if(
!KBAR_VIEW.dragging||
!e.touches?.length
)return;

e.preventDefault();

var x=
e.touches[0].clientX;

var dx=
x-
KBAR_VIEW.startX;

if(
Math.abs(dx)>7
){

KBAR_VIEW.moved=true;

moveKBarWindow(dx);

var index=
kbarIndexFromX(x);

if(index!=null){

KBAR_VIEW.selected=
index;

updateKInfo(
KBAR_DATA[index],
index
)

}

}else{

selectKBarAtX(x)

}

};

c.ontouchend=e=>{

if(
!KBAR_VIEW.dragging
)return;

if(
!KBAR_VIEW.moved&&
e.changedTouches?.length
){

var rect=
c.getBoundingClientRect();

var x=
e.changedTouches[0]
.clientX;

if(
x>
rect.right-52
){

resetKBarLatest()

}else{

selectKBarAtX(x)

}

}

KBAR_VIEW.dragging=false

};

c.onmousedown=e=>{

KBAR_VIEW.dragging=true;
KBAR_VIEW.moved=false;

KBAR_VIEW.startX=
e.clientX;

KBAR_VIEW.startOffset=
KBAR_VIEW.offset;

selectKBarAtX(
e.clientX
)

};

c.onmousemove=e=>{

if(
KBAR_VIEW.dragging
){

var dx=
e.clientX-
KBAR_VIEW.startX;

if(
Math.abs(dx)>5
){

KBAR_VIEW.moved=true;

moveKBarWindow(dx);

var index=
kbarIndexFromX(
e.clientX
);

if(index!=null){

KBAR_VIEW.selected=
index;

updateKInfo(
KBAR_DATA[index],
index
)

}

}else{

selectKBarAtX(
e.clientX
)

}

return
}

selectKBarAtX(
e.clientX
)

};

c.ondblclick=
resetKBarLatest

}

window.addEventListener(
"mouseup",
()=>{
KBAR_VIEW.dragging=false
}
);

s.name||
"";

var strategyLine=

mode==="strategy"&&
strategyText

?
'<div class="stock-strategy-line">'+
safe(
s.strategyEmoji||
""
)+
" "+
safe(strategyText)+
'</div>'

:mode==="long"

?
'<div class="stock-strategy-line">'+
safe(
s.longStatus||
"觀察"
)+
'</div>'

:"";

return(

'<article class="stock-card '+
(
mode==="strategy"
?"priority"
:""
)+
'" data-stock="'+
safe(s.symbol)+
'">'+

'<div class="stock-top">'+

'<div>'+

'<div class="stock-title-line">'+
'<div class="symbol">'+
safe(s.symbol)+
'</div>'+
'<div class="stock-inline-name">'+
safe(stockName)+
'</div>'+
'</div>'+

strategyLine+

'</div>'+

'<div class="score">'+
'<strong>'+
safe(score)+
'</strong>'+
'<span>'+
(
mode==="strategy"
?"策略符合分數"
:"異動分數"
)+
'</span>'+
'</div>'+

'</div>'+

'<div class="price-row">'+
'<div class="price">'+
fmt(s.price)+
'</div>'+
'<div class="'+
pclass(
s.changePercent
)+
'">'+
pct(
s.changePercent
)+
'</div>'+
'</div>'+

'<div class="chips">'+

'<div class="chip green">'+
'量比 '+
fmt(
s.volumeRatio,
1
)+
'x'+
'</div>'+

(
mode==="strategy"&&
grade
?
'<div class="chip purple">'+
safe(grade)+
'</div>'
:""
)+

(
mode==="strategy"&&
Number.isFinite(
Number(
s.pullbackScore
)
)
?
'<div class="chip">'+
'回踩 '+
fmt(
s.pullbackScore,
0
)+
'</div>'
:""
)+

(
mode==="strategy"&&
Number.isFinite(
Number(
s.highRScore
)
)
?
'<div class="chip">'+
'高R '+
fmt(
s.highRScore,
0
)+
'</div>'
:""
)+

(
mode==="strategy"&&
Number.isFinite(
Number(
s.surgeScore
)
)
?
'<div class="chip">'+
'續攻 '+
fmt(
s.surgeScore,
0
)+
'</div>'
:""
)+

'</div>'+

'<div class="watch-open">'+
'查看完整策略條件 →'+
'</div>'+

'</article>'

)

}).join("");

r
.querySelectorAll(
"[data-stock]"
)
.forEach(x=>{

x.onclick=()=>{
analyze(
x.dataset.stock
)
}

})

}

/* =========================
   查看更多
========================= */

document
.querySelectorAll(
"[data-more]"
)
.forEach(b=>{

b.onclick=()=>{

var k=
b.dataset.more;

expanded[k]=
!expanded[k];

b.textContent=
expanded[k]
?"收起"
:k==="strategy"
?"查看更多符合策略股票"
:k==="long"
?"查看更多做多觀察股票"
:"查看更多異動股票";

renderRadarSections()

}

});

/* =========================
   台股 / 美股
========================= */

function showMarket(market){

var tw=
market==="TW";

el("twMarket")
.classList.toggle(
"hidden",
!tw
);

el("usMarket")
.classList.toggle(
"hidden",
tw
);

el("twTab")
.classList.toggle(
"active",
tw
);

el("usTab")
.classList.toggle(
"active",
!tw
);

renderWatchlist();
renderUSRecent()

}

el("twTab").onclick=()=>{
showMarket("TW")
};

el("usTab").onclick=()=>{
showMarket("US")
};

/* =========================
   美股最近分析
========================= */

function renderUSRecent(){

var box=
el("usRecentGrid");

var a=
getHistory()
.filter(
x=>x.market==="US"
)
.slice(0,12);

if(!a.length){

box.innerHTML=
'<div class="card" style="padding:13px">'+
'<div class="section-sub">'+
'搜尋 NVDA、AAPL、TSLA 等美股後，會顯示在這裡。'+
'</div>'+
'</div>';

return
}

box.innerHTML=
a.map(x=>

'<article class="stock-card" data-us="'+
safe(x.symbol)+
'">'+

'<div class="stock-title-line">'+
'<div class="symbol">'+
'🇺🇸 '+
safe(x.symbol)+
'</div>'+
'<div class="stock-inline-name">'+
safe(
x.name||
""
)+
'</div>'+
'</div>'+

'<div class="watch-open">'+
'查看完整分析 →'+
'</div>'+

'</article>'

).join("");

box
.querySelectorAll(
"[data-us]"
)
.forEach(x=>{

x.onclick=()=>{
analyze(
x.dataset.us
)
}

})

}

/* =========================
   通知
========================= */

el("notifyButton").onclick=
async()=>{

if(
!(
"Notification"
in window
)
){

alert(
"目前瀏覽器不支援系統通知。"
);

return
}

if(
Notification.permission===
"granted"
){

alert(
"高勝率策略通知已開啟。"
);

return
}

try{

var p=
await Notification
.requestPermission();

el("notifyButton").textContent=
p==="granted"
?"🔔 高勝率策略通知已開啟"
:"🔕 系統通知未允許";

}catch(e){}

};

/* =========================
   首頁 60 秒倒數
========================= */

setInterval(()=>{

countdownSeconds--;

if(
countdownSeconds<=0
){

countdownSeconds=60;

if(
!document.hidden
){

loadRadar()

}

}

var m=
Math.floor(
countdownSeconds/
60
);

var s=
countdownSeconds%
60;

el("countdown").textContent=
String(m)
.padStart(
2,
"0"
)+
":"+
String(s)
.padStart(
2,
"0"
);

},1000);

/* =========================
   回到 App 時重新整理
========================= */

document.addEventListener(
"visibilitychange",
()=>{

if(
!document.hidden
){

if(
currentAnalysisSymbol
){

refreshCurrentAnalysis()

}else{

loadRadar()

}

}

}
);

/* =========================
   K BAR resize
========================= */

window.addEventListener(
"resize",
()=>{

if(
KBAR_DATA.length
){

drawKBar(
KBAR_DATA
)

}

}
);

/* =========================
   初始化
========================= */

renderWatchlist();
renderUSRecent();
loadRadar();

if(
"Notification"
in window&&
Notification.permission===
"granted"
){

el("notifyButton").textContent=
"🔔 高勝率策略通知已開啟"

}
</script>

</body>
</html>
