<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>妖子平台 4.5</title>
<meta name="theme-color" content="#030504">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="妖子平台">

<style>
*{box-sizing:border-box}
:root{
--bg:#030504;
--card:#0b0e0c;
--border:#292e2b;
--text:#f6f7f6;
--muted:#8c918e;
--green:#45e0ad;
--red:#ff6976;
--yellow:#ffc85a;
--purple:#bd7cff;
--orange:#ff9f43;
--blue:#70b7ff
}
html{background:var(--bg);scroll-behavior:smooth}
body{
margin:0;
background:radial-gradient(circle at top,rgba(43,111,84,.12),transparent 420px),var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
-webkit-font-smoothing:antialiased
}
button,input{font:inherit}
button{cursor:pointer}

.app{
width:min(100%,760px);
margin:auto;
padding-top:max(18px,calc(env(safe-area-inset-top) + 12px));
padding-right:max(14px,calc(env(safe-area-inset-right) + 11px));
padding-bottom:max(80px,calc(env(safe-area-inset-bottom) + 24px));
padding-left:max(14px,calc(env(safe-area-inset-left) + 11px))
}

.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.logo{font-size:24px;font-weight:950;letter-spacing:-1px}
.logo small{display:block;font-size:10px;font-weight:650;color:var(--muted);letter-spacing:.4px;margin-top:3px}

.notify-btn,.refresh-btn,.more-btn,.favorite-btn{
border:1px solid var(--border);
background:#101411;
color:#e7eae8;
border-radius:12px;
padding:10px 12px;
font-size:12px;
font-weight:850
}

.refresh-btn:active,.more-btn:active,.notify-btn:active,.favorite-btn:active{transform:scale(.98)}

.market-tabs{
display:flex;
gap:7px;
background:#080b09;
border:1px solid var(--border);
padding:5px;
border-radius:14px;
margin-bottom:14px
}

.market-tab{
flex:1;
border:0;
background:transparent;
color:#777d79;
padding:10px 6px;
border-radius:10px;
font-size:12px;
font-weight:900
}

.market-tab.active{background:#151a17;color:white}

.search-card,.card,.hero-card,.strategy-card,.position-card,.kbar-card,.backtest-card,.brain-card,.recommend-card{
background:linear-gradient(180deg,#0d110f,#090c0a);
border:1px solid var(--border);
border-radius:18px;
box-shadow:0 12px 32px rgba(0,0,0,.2)
}

.search-card{padding:14px;margin-bottom:14px}
.search-row{display:flex;gap:8px}

.search-input{
flex:1;
min-width:0;
border:1px solid #303632;
background:#060806;
color:white;
border-radius:12px;
padding:13px 12px;
outline:none;
font-size:15px;
font-weight:800
}

.search-input:focus{border-color:#4c6559}

.search-button{
border:0;
border-radius:12px;
padding:0 18px;
background:#e8eee9;
color:#111;
font-weight:950
}

.search-examples{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:10px
}

.example{
border:1px solid #252a27;
background:#101310;
color:#a9aeab;
border-radius:999px;
padding:6px 9px;
font-size:10px;
font-weight:800
}

/* ===== 搜尋紀錄 ===== */

.search-history{
margin-top:12px;
padding-top:11px;
border-top:1px solid #202522
}

.search-history-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.search-history-title{
font-size:10px;
color:var(--muted);
font-weight:900
}

.search-history-clear{
border:0;
background:transparent;
color:#777d79;
font-size:9px;
padding:4px
}

.search-history-list{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:8px
}

.history-item{
border:1px solid #252a27;
background:#101310;
color:#c5cac7;
border-radius:999px;
padding:6px 10px;
font-size:10px;
font-weight:850
}

.history-item:active{transform:scale(.97)}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin:18px 1px 10px
}

.section-title{font-size:14px;font-weight:950}
.section-sub{font-size:10px;line-height:1.6;color:var(--muted)}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:12px
}

.stat{
background:#0a0d0b;
border:1px solid var(--border);
border-radius:14px;
padding:12px 9px
}

.stat span{display:block;font-size:9px;color:var(--muted)}
.stat strong{display:block;font-size:20px;margin-top:4px}

.update-line{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
font-size:10px;
color:#858b87;
margin:8px 2px 12px
}

.stock-grid{display:grid;gap:9px}

.stock-card{
border:1px solid var(--border);
background:linear-gradient(180deg,#0d100e,#080b09);
border-radius:16px;
padding:13px;
cursor:pointer
}

.stock-card.priority{border-color:#3a594c}
.stock-top{display:flex;justify-content:space-between;gap:10px}
.stock-title-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.symbol{font-size:16px;font-weight:950}
.stock-inline-name{font-size:11px;color:#aeb3b0;font-weight:800}
.stock-strategy-line{font-size:10px;color:#b9bebc;margin-top:5px;font-weight:800}
.score{text-align:right}
.score strong{display:block;font-size:18px}
.score span{font-size:8px;color:var(--muted)}
.price-row{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.price{font-size:20px;font-weight:950}
.up{color:var(--red)}
.down{color:var(--green)}
.flat{color:#b8bdb9}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}

.chip{
font-size:9px;
font-weight:850;
padding:5px 7px;
border-radius:999px;
border:1px solid #2a2f2c;
color:#adb2af
}

.chip.green{color:#a6ead3;border-color:#25483b}
.chip.purple{color:#d6b6ff;border-color:#4b3565}
.chip.orange{color:#ffc98f;border-color:#5d4125}
.watch-open{font-size:9px;color:#707672;margin-top:11px}
.watch-list{display:grid;gap:8px}

.watch-item{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border:1px solid var(--border);
background:#0b0e0c;
padding:11px;
border-radius:14px
}

.watch-main{min-width:0;cursor:pointer}
.watch-symbol{font-weight:950;font-size:13px}
.watch-name{font-size:9px;color:var(--muted);margin-top:2px}

.watch-remove{
border:0;
background:#1a0d0f;
color:#ff8e98;
border-radius:9px;
padding:7px 9px
}

.loading{padding:28px 10px;text-align:center;color:#909692;font-size:12px}

.error{
padding:14px;
border:1px solid #4b252a;
background:#1a0c0e;
border-radius:14px;
color:#ff9ba4;
font-size:11px;
line-height:1.7
}

.hidden{display:none!important}

.back-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:12px
}

.back-button{
border:1px solid var(--border);
background:#0c100d;
color:#ddd;
padding:9px 11px;
border-radius:11px;
font-weight:850
}

.analysis-refresh{font-size:10px;color:var(--muted)}
.hero-card{padding:16px;margin-bottom:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero-symbol{font-size:24px;font-weight:950}
.hero-name{font-size:12px;font-weight:850;color:#aeb3b0}

.market-pill{
display:inline-block;
font-size:9px;
color:#aeb4b0;
border:1px solid #303531;
padding:5px 7px;
border-radius:999px;
margin-top:7px
}

.hero-price{text-align:right;font-size:28px;font-weight:950}
.hero-change{text-align:right;font-size:12px;font-weight:900;margin-top:4px}
.favorite-btn{width:100%;margin-top:14px}
.favorite-btn.active{color:#ffe394;border-color:#5c5127;background:#18160c}

.indicator-strip{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:13px
}

.indicator{
background:#080b09;
border:1px solid #222724;
border-radius:12px;
padding:10px 8px
}

.indicator span{display:block;font-size:8px;color:#777d79}
.indicator strong{display:block;font-size:12px;margin-top:3px}

.volume-card{
margin-top:12px;
border-top:1px solid #202522;
padding-top:12px
}

.volume-title{font-size:11px;font-weight:900}

.volume-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
margin-top:8px
}

.volume-box{
border:1px solid #232824;
border-radius:10px;
padding:8px
}

.volume-box span{display:block;font-size:8px;color:#777d79}
.volume-box strong{display:block;font-size:11px;margin-top:3px}

.big-section-title{
font-size:15px;
font-weight:950;
margin:20px 2px 10px
}

.recommend-card,.position-card,.kbar-card,.backtest-card,.brain-card{padding:15px}
.recommend-card{margin-bottom:14px}

.recommend-top{
display:flex;
justify-content:space-between;
gap:12px;
align-items:flex-start
}

.recommend-name{font-size:20px;font-weight:950}

.recommend-score{
text-align:right;
min-width:72px
}

.recommend-score strong{
font-size:27px;
line-height:1
}

.recommend-score span{
display:block;
font-size:8px;
color:var(--muted);
margin-top:5px
}

.recommend-note{
font-size:10px;
color:#a5aaa7;
line-height:1.75;
margin-top:10px
}

.recommend-badge{
display:inline-block;
margin-top:7px;
border:1px solid #29483c;
color:#a6ead3;
background:#0d1713;
border-radius:999px;
padding:5px 8px;
font-size:9px;
font-weight:900
}

.recommend-mini-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:12px
}

.recommend-mini{
border:1px solid #272c29;
background:#080b09;
border-radius:12px;
padding:10px 7px;
text-align:center;
color:var(--text)
}

.recommend-mini.best{
border-color:#315c4b;
background:#0d1713
}

.recommend-mini span{
display:block;
font-size:8px;
color:#929894
}

.recommend-mini strong{
display:block;
font-size:14px;
margin-top:4px
}

.strategy-jump{cursor:pointer}
.strategy-jump:active{transform:scale(.985)}

.recommend-levels{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:10px
}

.recommend-level{
border:1px solid #262b28;
border-radius:11px;
padding:9px
}

.recommend-level span{display:block;font-size:8px;color:#777d79}
.recommend-level strong{display:block;font-size:11px;margin-top:3px}

.position-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.position-input{
width:100%;
border:1px solid #303632;
background:#070907;
color:white;
border-radius:11px;
padding:11px;
outline:none
}

.position-actions{display:flex;gap:8px;margin-top:8px}

.position-save{
flex:1;
border:0;
background:#dfe7e1;
color:#111;
border-radius:11px;
padding:10px;
font-weight:950
}

.position-delete{
border:1px solid #4b252a;
background:#160b0d;
color:#ff8e98;
border-radius:11px;
padding:10px
}

.position-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:10px
}

.position-stat{
border:1px solid #252a27;
border-radius:11px;
padding:9px
}

.position-stat span{display:block;font-size:8px;color:#777d79}
.position-stat strong{display:block;font-size:12px;margin-top:3px}

.strategy-card{
padding:15px;
margin-bottom:10px
}

.strategy-head{
display:flex;
justify-content:space-between;
gap:10px
}

.strategy-name{font-size:16px;font-weight:950}
.strategy-grade{font-size:9px;color:#999f9b;margin-top:3px}
.strategy-score{font-size:22px;font-weight:950;text-align:right}
.strategy-score small{display:block;font-size:8px;color:#777d79}

.condition-row{
padding:11px 0;
border-top:1px solid #202522;
font-size:12px;
font-weight:850;
line-height:1.7
}

.condition-row.good{color:#bdf2dc}
.condition-row.bad{color:#ff8d97}

.condition-explain{
display:block;
color:#858b87;
font-size:10px;
font-weight:500;
margin:3px 0 0 20px;
line-height:1.65
}

.strategy-levels{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-top:12px
}

.strategy-level{
border:1px solid #242925;
background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.005));
border-radius:13px;
padding:11px
}

.strategy-level span{
display:block;
font-size:9px;
font-weight:800;
color:#7f8681
}

.strategy-level strong{
display:block;
font-size:18px;
font-weight:950;
letter-spacing:-.25px;
margin-top:5px
}

.strategy-reason{
font-size:10px;
font-weight:500;
line-height:1.7;
color:#8d938f;
margin-top:8px
}

.level-entry{border-color:#28493c}
.level-entry strong{color:#a6ead3}
.level-stop{border-color:#512b30}
.level-stop strong{color:#ff8d97}
.level-pressure{border-color:#554a24}
.level-pressure strong{color:#ffc85a}
.level-hold{border-color:#294760}
.level-hold strong{color:#70b7ff}
.level-tp{border-color:#554a24}
.level-tp strong{color:#ffc85a}
.level-tp3{border-color:#5d4125}
.level-tp3 strong{color:#ff9f43}
.rr-text{font-size:10px!important;color:#d8bd70!important;margin-top:5px}

.strategy-summary{
margin-top:12px;
border:1px solid #262c28;
border-radius:13px;
padding:12px;
background:#080b09;
font-size:10px;
color:#a5aaa7;
line-height:1.8
}

.strategy-summary strong{color:#f3f5f4}

.qualified-badge{
margin-top:10px;
padding:8px;
border-radius:10px;
font-size:9px;
font-weight:850;
color:#a9ead4;
background:#0d1c16;
border:1px solid #224538
}

.qualified-badge.not-qualified{
color:#c3c6c4;
background:#101311;
border-color:#292e2b
}

.data-note{
font-size:9px;
color:#6f7471;
line-height:1.75;
margin:16px 4px
}

/* ===== iPhone 左滑返回動畫 ===== */

#analysisView{
will-change:transform;
touch-action:pan-y;
transition:
transform .24s cubic-bezier(.22,.61,.36,1),
opacity .24s ease
}

#analysisView.swiping-back{
transition:none
}

#analysisView.swipe-return{
transition:
transform .22s cubic-bezier(.22,.61,.36,1),
opacity .22s ease
}

@media(max-width:430px){

.app{
padding-left:max(11px,calc(env(safe-area-inset-left) + 11px));
padding-right:max(11px,calc(env(safe-area-inset-right) + 11px));
padding-top:max(22px,calc(env(safe-area-inset-top) + 14px))
}

.logo{font-size:21px}
.indicator-strip{grid-template-columns:repeat(2,1fr)}
.recommend-levels,.strategy-levels{grid-template-columns:1fr 1fr}

}
</style>
</head>

<body>
<div class="app">

<div id="homeView">

<div class="header">
<div class="logo">
妖子平台
<small>股票策略分析 4.5</small>
</div>

<button id="notifyButton" class="notify-btn">
🔔 高勝率策略通知
</button>
</div>

<div class="market-tabs">
<button id="twTab" class="market-tab active">🇹🇼 台股</button>
<button id="usTab" class="market-tab">🇺🇸 美股</button>
</div>

<div class="search-card">

<div class="search-row">
<input
id="searchInput"
class="search-input"
placeholder="輸入股票代號，例如 2330 / NVDA"
>

<button id="searchButton" class="search-button">
分析
</button>
</div>

<div class="search-examples">
<button class="example" data-example="2330">2330</button>
<button class="example" data-example="2317">2317</button>
<button class="example" data-example="2454">2454</button>
<button class="example" data-example="NVDA">NVDA</button>
<button class="example" data-example="AAPL">AAPL</button>
<button class="example" data-example="TSLA">TSLA</button>
</div>

<div id="searchHistory" class="search-history hidden">

<div class="search-history-head">
<div class="search-history-title">
🕘 最近搜尋
</div>

<button id="clearHistory" class="search-history-clear">
清除
</button>
</div>

<div id="searchHistoryList" class="search-history-list"></div>

</div>

</div>

<div id="watchSection">

<div class="section-head">
<div>
<div class="section-title">⭐ 我的自選</div>
<div class="section-sub">點股票直接進入完整分析</div>
</div>
</div>

<div id="watchList" class="watch-list"></div>

</div>

<div id="twMarket">

<div class="section-head">

<div>
<div class="section-title">🇹🇼 台股市場掃描</div>
<div class="section-sub">使用母版本策略掃描條件</div>
</div>

<button id="refreshButton" class="refresh-btn">
重新掃描
</button>

</div>

<div class="stats">

<div class="stat">
<span>掃描股票</span>
<strong id="scanCount">--</strong>
</div>

<div class="stat">
<span>符合策略</span>
<strong id="strategyCount">--</strong>
</div>

<div class="stat">
<span>異動股票</span>
<strong id="radarCount">--</strong>
</div>

</div>

<div class="update-line">
<span id="updateText">正在掃描市場…</span>
<span id="countdown">01:00</span>
</div>

<div class="section-head">

<div>
<div class="section-title">🎯 自動偵測符合策略股票</div>
<div class="section-sub">母版本策略掃描結果</div>
</div>

<button class="more-btn" data-more="strategy">
查看更多符合策略股票
</button>

</div>

<div id="strategyGrid" class="stock-grid"></div>

<div class="section-head">

<div>
<div class="section-title">🟢 做多觀察</div>
<div class="section-sub">趨勢與位置較適合持續觀察</div>
</div>

<button class="more-btn" data-more="long">
查看更多做多觀察股票
</button>

</div>

<div id="longGrid" class="stock-grid"></div>

<div class="section-head">

<div>
<div class="section-title">⚡ 市場異動雷達</div>
<div class="section-sub">價格與成交量異動</div>
</div>

<button class="more-btn" data-more="radar">
查看更多異動股票
</button>

</div>

<div id="radarGrid" class="stock-grid"></div>

</div>

<div id="usMarket" class="hidden">

<div class="section-head">
<div>
<div class="section-title">🇺🇸 美股最近分析</div>
<div class="section-sub">搜尋過的美股會顯示在這裡</div>
</div>
</div>

<div id="usRecentGrid" class="stock-grid"></div>

</div>

</div>

<div id="analysisView" class="hidden">

<div class="back-row">
<button id="backButton" class="back-button">
← 返回
</button>

<div id="analysisRefresh" class="analysis-refresh">
每 30 秒更新
</div>
</div>

<div id="analysisResult"></div>

</div>

</div>

<script>

const WATCH_KEY="yaozi_watchlist";
const POSITION_KEY="yaozi_positions_v31";
const HISTORY_KEY="yaozi_search_history_v1";

const STRICT_TARGET_WINRATE=70;
const STRICT_MIN_SAMPLE=20;

var currentStock=null;
var currentAnalysisSymbol="";
var currentAnalysisData=null;
var analysisTimer=null;
var radarData=null;

var expanded={
strategy:false,
long:false,
radar:false
};

var countdownSeconds=60;

function el(id){
return document.getElementById(id)
}

function safe(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;")
}

function fmt(v,d=2){

var n=Number(v);

if(!Number.isFinite(n)){
return"--"
}

return n.toLocaleString("zh-TW",{
minimumFractionDigits:d,
maximumFractionDigits:d
})
}

function pct(v){

var n=Number(v);

if(!Number.isFinite(n)){
return"--"
}

return(n>0?"+":"")+fmt(n,2)+"%"
}

function marketOf(d){

var rows=d.rows||[];

var last=
rows.at(-1)||{};

var price=
Number(d.price)||
Number(last.close)||
0;

var ma20=
Number(d.ma20);

var ma60=
Number(d.ma60);

var rsi=
Number(d.rsi);

var macd=
Number(d.macd);

var atr=
Number(d.atr);

if(!Number.isFinite(ma20)){

var a=
rows
.slice(-20)
.map(x=>+x.close)
.filter(Number.isFinite);

ma20=
a.length
?a.reduce((s,x)=>s+x,0)/a.length
:price

}

if(!Number.isFinite(ma60)){

var b=
rows
.slice(-60)
.map(x=>+x.close)
.filter(Number.isFinite);

ma60=
b.length
?b.reduce((s,x)=>s+x,0)/b.length
:price

}

if(!Number.isFinite(rsi)){
rsi=50
}

if(!Number.isFinite(macd)){
macd=0
}

if(!Number.isFinite(atr)){

var recent=
rows.slice(-14);

var trs=[];

for(var i=1;i<recent.length;i++){

var c=
recent[i];

var p=
recent[i-1];

trs.push(

Math.max(

+c.high-+c.low,

Math.abs(
+c.high-+p.close
),

Math.abs(
+c.low-+p.close
)

)

)

}

atr=
trs.length
?trs.reduce((s,x)=>s+x,0)/trs.length
:price*.02

}

var highs20=
rows
.slice(-20)
.map(x=>+x.high)
.filter(Number.isFinite);

var lows20=
rows
.slice(-20)
.map(x=>+x.low)
.filter(Number.isFinite);

var lows10=
rows
.slice(-10)
.map(x=>+x.low)
.filter(Number.isFinite);

var highs10=
rows
.slice(-10)
.map(x=>+x.high)
.filter(Number.isFinite);

var lows3=
rows
.slice(-3)
.map(x=>+x.low)
.filter(Number.isFinite);

var resistance=
Number(d.resistance);

if(!Number.isFinite(resistance)){

resistance=
highs20.length
?Math.max(...highs20)
:price

}

var support=
Number(d.support);

if(!Number.isFinite(support)){

support=
lows20.length
?Math.min(...lows20)
:price

}

return{

price,
ma20,
ma60,
rsi,
macd,
atr,
resistance,
support,

low10:
lows10.length
?Math.min(...lows10)
:price,

high10:
highs10.length
?Math.max(...highs10)
:price,

recent3Low:
lows3.length
?Math.min(...lows3)
:(lows10.length
?Math.min(...lows10)
:price)

}

}

function volumeMetrics(d,rows){

var current=
Number(d.volume)||
Number(rows.at(-1)?.volume)||
0;

var vols=
rows
.slice(-21,-1)
.map(x=>Number(x.volume))
.filter(
x=>
Number.isFinite(x)&&
x>0
);

var average20=
vols.length
?vols.reduce((a,b)=>a+b,0)/vols.length
:current;

var ratio=
average20>0
?current/average20
:0;

var level=
ratio>=2
?"爆量":
ratio>=1.5
?"明顯放量":
ratio>=1.2
?"溫和放量":
ratio>=.8
?"正常":
"量縮";

return{
current,
average20,
ratio,
level
}

}

/* ==================================================
   三套策略各自的目標價格
================================================== */

function strategyTargetLevels(type,m){

var atr=
Math.max(
Number(m.atr)||0,
.01
);

var price=
Number(m.price)||0;

var res=
Number(m.resistance)||
price;

var low10=
Number(m.low10)||
price;

var ma20=
Number(m.ma20)||
price;

var ma60=
Number(m.ma60)||
price;

var recent3Low=
Number(m.recent3Low);

if(!Number.isFinite(recent3Low)){
recent3Low=low10
}

var entryLow;
var entryHigh;
var center;
var stop1;
var stop2;
var risk;
var extension1;
var extension2;
var extension3;
var tp1;
var tp2;
var tp3;

var previousHigh=
res;


/* ===== 支撐回踩 ===== */

if(type==="PULLBACK"){

var support=
Math.max(
low10,
Math.min(ma20,price)-atr*.5
);

entryLow=
Math.max(
support,
ma20-atr*.5
);

entryHigh=
ma20+atr*.35;

if(entryLow>entryHigh){

[
entryLow,
entryHigh
]=[
entryHigh,
entryLow
]

}

center=
(entryLow+entryHigh)/2;

stop1=
Math.min(
support-atr*.5,
entryLow-atr
);

stop2=
Math.min(
ma60-atr*.25,
low10-atr*.35,
stop1-atr*.35
);

if(stop2>=stop1){
stop2=stop1-atr*.35
}

risk=
Math.max(
center-stop1,
atr*.5
);

extension1=
center+risk*1.5;

extension2=
center+risk*2.5;

extension3=
center+risk*4;

tp1=
previousHigh>center
?previousHigh
:extension1;

tp2=
Math.max(
extension2,
tp1+risk
);

tp3=
Math.max(
extension3,
tp2+risk*1.25
);

}


/* ===== 高 R 突破 ===== */

else if(type==="HIGH_R"){

entryLow=
res-atr*.25;

entryHigh=
res+atr*.35;

center=
(entryLow+entryHigh)/2;

stop1=
Math.min(
res-atr*.8,
center-atr*.5
);

stop2=
Math.min(
ma20-atr*.5,
low10-atr*.25,
stop1-atr*.35
);

if(stop2>=stop1){
stop2=stop1-atr*.35
}

risk=
Math.max(
center-stop1,
atr*.5
);

extension1=
center+risk*2;

extension2=
center+risk*3;

extension3=
center+risk*5;

tp1=
previousHigh>center
?previousHigh
:extension1;

tp2=
Math.max(
extension2,
tp1+risk
);

tp3=
Math.max(
extension3,
tp2+risk*1.5
);

}


/* ===== 強勢續攻 ===== */

else{

entryLow=
price-atr*.2;

entryHigh=
price+atr*.15;

center=
(entryLow+entryHigh)/2;

stop1=
Math.max(
recent3Low-atr*.15,
center-atr*1.2
);

if(stop1>=center){
stop1=center-atr*1.2
}

stop2=
Math.min(
ma20-atr*.45,
low10-atr*.2,
stop1-atr*.35
);

if(stop2>=stop1){
stop2=stop1-atr*.35
}

risk=
Math.max(
center-stop1,
atr*.5
);

extension1=
center+risk*1.5;

extension2=
center+risk*2.5;

extension3=
center+risk*4;

tp1=
previousHigh>center
?previousHigh
:extension1;

tp2=
Math.max(
extension2,
tp1+risk
);

tp3=
Math.max(
extension3,
tp2+risk*1.25
);

}

return{

entryLow,
entryHigh,
center,
stop1,
stop2,
previousHigh,
tp1,
tp2,
tp3,
extension1,
extension2,
extension3,
risk

}

}

function strategyRR(entry,target,stop){

var risk=
Number(entry)-
Number(stop);

var reward=
Number(target)-
Number(entry);

if(
!Number.isFinite(risk)||
!Number.isFinite(reward)||
risk<=0
){
return"--"
}

return(
reward/risk
).toFixed(2)+"R"

}

/* ==================================================
   iPhone 左側往右滑返回
================================================== */

(function(){

var view=
el("analysisView");

var startX=0;
var startY=0;
var currentX=0;
var startTime=0;

var tracking=false;
var locked=false;

view.addEventListener(
"touchstart",
function(e){

if(
view.classList.contains("hidden")||
e.touches.length!==1
){
return
}

var t=
e.touches[0];

/* 必須從左側開始 */

if(t.clientX>32){
return
}

startX=
t.clientX;

startY=
t.clientY;

currentX=
startX;

startTime=
Date.now();

tracking=true;
locked=false;

view.classList.add(
"swiping-back"
)

},
{
passive:true
}
);

view.addEventListener(
"touchmove",
function(e){

if(
!tracking||
e.touches.length!==1
){
return
}

var t=
e.touches[0];

var dx=
Math.max(
0,
t.clientX-startX
);

var dy=
Math.abs(
t.clientY-startY
);

if(!locked){

if(
dy>10&&
dy>dx
){

tracking=false;

view.classList.remove(
"swiping-back"
);

return

}

if(dx>8){
locked=true
}

}

if(!locked){
return
}

currentX=
t.clientX;

var width=
Math.max(
window.innerWidth,
1
);

var progress=
Math.min(
dx/width,
1
);

view.style.transform=
"translate3d("+
dx+
"px,0,0)";

view.style.opacity=
String(
1-progress*.18
);

if(e.cancelable){
e.preventDefault()
}

},
{
passive:false
}
);

function finishSwipe(){

if(!tracking){
return
}

tracking=false;

view.classList.remove(
"swiping-back"
);

var dx=
Math.max(
0,
currentX-startX
);

var elapsed=
Math.max(
Date.now()-startTime,
1
);

var velocity=
dx/elapsed;

var shouldBack=

dx>
Math.min(
window.innerWidth*.28,
120
)

||

velocity>.55;

view.classList.add(
"swipe-return"
);

if(shouldBack){

view.style.transform=
"translate3d(100vw,0,0)";

view.style.opacity=
"0.82";

setTimeout(
goBackHome,
210
);

}else{

view.style.transform=
"translate3d(0,0,0)";

view.style.opacity=
"1";

setTimeout(
function(){

view.classList.remove(
"swipe-return"
);

view.style.transform="";
view.style.opacity="";

},
230
);

}

}

view.addEventListener(
"touchend",
finishSwipe,
{
passive:true
}
);

view.addEventListener(
"touchcancel",
finishSwipe,
{
passive:true
}
);

})();
