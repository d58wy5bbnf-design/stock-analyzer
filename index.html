<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幽冥分析</title>
<meta name="theme-color" content="#050706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="幽冥分析">

<style>
*{box-sizing:border-box}
:root{
--bg:#050706;
--bg2:#080b09;
--card:#0d110f;
--card2:#101512;
--border:#27302b;
--border2:#344139;
--text:#f7faf8;
--muted:#89938d;
--green:#49e6ad;
--green2:#9cf3d1;
--red:#ff6675;
--red2:#ff9ca5;
--yellow:#ffd166;
--orange:#ff9f43;
--purple:#bd7cff;
--purple2:#e3c5ff;
--blue:#70b7ff;
--cyan:#6ee7f2;
--shadow:0 16px 42px rgba(0,0,0,.28)
}

html{background:var(--bg);scroll-behavior:smooth}

body{
margin:0;
background:
radial-gradient(circle at 15% 0%,rgba(73,230,173,.10),transparent 360px),
radial-gradient(circle at 90% 12%,rgba(112,183,255,.07),transparent 380px),
linear-gradient(180deg,#050706,#030504 55%,#050706);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
-webkit-font-smoothing:antialiased
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
width:min(100%,760px);
margin:auto;
padding:
max(18px,calc(env(safe-area-inset-top) + 12px))
max(14px,calc(env(safe-area-inset-right) + 11px))
max(80px,calc(env(safe-area-inset-bottom) + 24px))
max(14px,calc(env(safe-area-inset-left) + 11px))
}

.header,.section-head,.back-row,.hero-top,.stock-top,.recommend-top,.backtest-head{
display:flex;justify-content:space-between;align-items:center;gap:12px
}

.header{margin-bottom:14px}

.logo{
font-size:26px;
font-weight:950;
letter-spacing:-1.2px;
background:linear-gradient(90deg,#fff,#b9c8c0);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}
.logo small{
display:block;
font-size:11px;
font-weight:700;
color:var(--muted);
-webkit-text-fill-color:var(--muted);
letter-spacing:.5px;
margin-top:3px
}

.notify-btn,.refresh-btn,.more-btn,.favorite-btn,.position-save-btn,.return-recommend-btn,.strategy-quick-btn{
border:1px solid var(--border);
background:linear-gradient(180deg,#121814,#0c100e);
color:#e9efeb;
border-radius:12px;
padding:10px 12px;
font-size:13px;
font-weight:850;
box-shadow:0 5px 14px rgba(0,0,0,.15)
}

.market-tabs{
display:flex;
gap:7px;
background:rgba(8,11,9,.85);
border:1px solid var(--border);
padding:5px;
border-radius:15px;
margin-bottom:14px
}
.market-tab{
flex:1;border:0;background:transparent;color:#737d77;
padding:11px 6px;border-radius:11px;font-size:13px;font-weight:900
}
.market-tab.active{background:#1a211d;color:#fff}

.search-card,.card,.hero-card,.strategy-card,.recommend-card,.position-card,.backtest-card,.ai-card,.track-card,.monster-card{
background:linear-gradient(160deg,rgba(15,20,17,.98),rgba(8,11,9,.98));
border:1px solid var(--border);
border-radius:19px;
box-shadow:var(--shadow)
}

.search-card{padding:14px;margin-bottom:14px;position:relative}
.search-row{display:flex;gap:8px}
.search-input{
flex:1;min-width:0;border:1px solid #303a34;background:#060907;color:#fff;
border-radius:13px;padding:14px 12px;outline:none;font-size:16px;font-weight:800
}
.search-button{
border:0;border-radius:13px;padding:0 19px;
background:linear-gradient(135deg,#eff8f3,#bfe7d4);color:#07100b;font-weight:950
}
.search-suggest{
position:absolute;left:14px;right:14px;top:69px;z-index:100;
border:1px solid #303a34;background:rgba(8,11,9,.98);
border-radius:14px;overflow:hidden
}
.search-suggest-item{
width:100%;border:0;border-bottom:1px solid #202722;background:transparent;
color:#fff;text-align:left;padding:12px;display:flex;justify-content:space-between;gap:10px
}

.search-examples,.chips,.monster-meta,.ai-context{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.example,.history-item{
border:1px solid #27302b;background:#101512;color:#b4bdb8;
border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800
}

.hidden{display:none!important}
.section-head{margin:19px 1px 10px}
.section-title{font-size:15px;font-weight:950}
.section-sub{font-size:11px;line-height:1.6;color:var(--muted)}
.big-section-title{font-size:17px;font-weight:950;margin:21px 2px 10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#0c110e;border:1px solid var(--border);border-radius:15px;padding:12px 9px}
.stat span{display:block;font-size:10px;color:var(--muted)}
.stat strong{display:block;font-size:22px;margin-top:4px}

.stock-grid,.watch-list,.monster-list{display:grid;gap:9px}
.stock-card{
border:1px solid var(--border);background:#0e1310;border-radius:17px;padding:14px;cursor:pointer
}
.stock-title-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.symbol{font-size:17px;font-weight:950}
.stock-inline-name{font-size:12px;color:#aeb7b2;font-weight:800}
.price-row{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.price{font-size:22px;font-weight:950}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:#b8bdb9}
.chip{font-size:10px;padding:5px 7px;border-radius:999px;border:1px solid #2a332e;color:#adb7b1}
.chip.green{color:#a6ead3;border-color:#28503f}

.back-row{margin-bottom:12px}
.back-button{
border:1px solid var(--border);background:#0c110e;color:#e1e6e3;
padding:10px 12px;border-radius:12px;font-weight:850
}
.analysis-refresh{font-size:11px;color:var(--muted)}

.hero-card{padding:17px;margin-bottom:14px}
.hero-top{align-items:flex-start}
.hero-symbol{font-size:27px;font-weight:950}
.hero-name{font-size:13px;font-weight:850;color:#b2bbb6}
.hero-price{text-align:right;font-size:32px;font-weight:950}
.hero-change{text-align:right;font-size:14px;font-weight:900;margin-top:4px}
.market-pill{
display:inline-block;font-size:10px;color:#aeb8b2;border:1px solid #303a34;
padding:5px 8px;border-radius:999px;margin-top:7px
}
.favorite-btn{width:100%;margin-top:14px}

.indicator-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.indicator{background:#080b09;border:1px solid #242c27;border-radius:13px;padding:10px 8px}
.indicator span{display:block;font-size:9px;color:#7d8781}
.indicator strong{display:block;font-size:14px;margin-top:3px}

.volume-card{margin-top:12px;border-top:1px solid #202722;padding-top:12px}
.volume-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.volume-box{border:1px solid #252d28;border-radius:11px;padding:8px;background:#080b09}
.volume-box span{display:block;font-size:9px;color:#7d8781}
.volume-box strong{display:block;font-size:12px;margin-top:3px}

.position-card,.recommend-card,.backtest-card,.ai-card,.track-card,.strategy-card{padding:15px;margin-bottom:14px}
.position-title,.backtest-title{font-size:18px;font-weight:950}
.position-desc,.backtest-sub{font-size:11px;color:var(--muted);line-height:1.7;margin-top:5px}
.position-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.position-field{background:#080b09;border:1px solid #27302b;border-radius:13px;padding:10px}
.position-field.full{grid-column:1/-1}
.position-field label{display:block;font-size:10px;color:#929c96;margin-bottom:7px}
.position-input{width:100%;border:0;outline:none;background:transparent;color:#fff;font-size:18px;font-weight:950}
.position-save-btn{width:100%;margin-top:10px}

.position-summary-grid,.entry-analysis-grid,.track-current-grid{
display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px
}
.position-summary,.entry-analysis-box,.track-level{
border:1px solid #27302b;background:#080b09;border-radius:13px;padding:10px
}
.position-summary span,.entry-analysis-box span,.track-level span{display:block;font-size:9px;color:#7d8781}
.position-summary strong,.entry-analysis-box strong,.track-level strong{display:block;font-size:16px;margin-top:5px}

.position-risk,.entry-status,.entry-road{
margin-top:12px;border:1px solid #292e2b;border-radius:14px;padding:12px;
font-size:11px;line-height:1.75;color:#b4bdb8
}
.position-risk.good,.entry-status.good{border-color:#24513f;background:#0b1712}
.position-risk.warn,.entry-status.warn{border-color:#5b4822;background:#181307}
.position-risk.bad,.entry-status.bad{border-color:#57282e;background:#190c0e}

.strategy-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.strategy-name{font-size:18px;font-weight:950}
.strategy-grade{font-size:10px;color:#9aa49e;margin-top:3px}
.strategy-score{font-size:24px;font-weight:950;text-align:right}
.strategy-score small{display:block;font-size:9px;color:#7b857f}

.strategy-market-price{
display:flex;align-items:center;justify-content:space-between;gap:10px;
margin-top:13px;padding:11px 12px;border:1px solid #35443c;border-radius:13px;
background:#090d0b
}
.strategy-market-price span{font-size:12px;font-weight:900;color:#aab8b0}
.strategy-market-price strong{font-size:23px;font-weight:950}

.condition-row{
padding:11px 0;border-top:1px solid #202722;font-size:13px;font-weight:850;line-height:1.7
}
.condition-row.good{color:#bdf2dc}
.condition-row.bad{color:#ff8d97}
.condition-explain{
display:block;color:#858f89;font-size:11px;font-weight:500;margin:3px 0 0 20px;line-height:1.65
}

.strategy-levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.strategy-level{border:1px solid #252d28;background:#080b09;border-radius:14px;padding:11px}
.strategy-level span{display:block;font-size:10px;font-weight:800;color:#858f89}
.strategy-level strong{display:block;font-size:20px;font-weight:950;margin-top:5px}
.level-entry{border-color:#2c5845;background:#0c1812}
.level-entry strong{color:#a6ead3}
.level-stop{border-color:#5a3036;background:#180d0f}
.level-stop strong{color:#ff8d97}
.level-pressure,.level-tp{border-color:#5c4e26;background:#171307}
.level-pressure strong,.level-tp strong{color:#ffd166}
.level-tp3{border-color:#654526;background:#1a1208}
.level-tp3 strong{color:#ffab55}
.rr-text{font-size:11px!important;color:#d8bd70!important;margin-top:5px}

.qualified-badge{
margin-top:10px;padding:8px;border-radius:10px;font-size:10px;font-weight:850;
color:#a9ead4;background:#0d1c16;border:1px solid #224538
}
.qualified-badge.not-qualified{color:#c3c6c4;background:#101311;border-color:#292e2b}

.strategy-quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}

.recommend-top{align-items:flex-start}
.recommend-name{font-size:21px;font-weight:950}
.recommend-score{text-align:right}
.recommend-score strong{font-size:28px}
.recommend-score span{display:block;font-size:9px;color:var(--muted)}
.recommend-note{font-size:11px;color:#a5aea8;line-height:1.75;margin-top:10px}
.recommend-badge{
display:inline-block;margin-top:7px;border:1px solid #29483c;color:#a6ead3;
background:#0d1713;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900
}
.recommend-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.recommend-mini{
border:1px solid #272f2a;background:#080b09;border-radius:12px;padding:10px 7px;
text-align:center;color:var(--text)
}
.recommend-mini span{display:block;font-size:9px;color:#929c96}
.recommend-mini strong{display:block;font-size:15px;margin-top:4px}

.backtest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.backtest-item{border:1px solid #292e2b;background:#080b09;border-radius:14px;padding:11px}
.backtest-name{font-size:12px;font-weight:950}
.backtest-rate{font-size:25px;font-weight:950;margin-top:7px}
.backtest-stats{font-size:10px;color:#aeb3b0;line-height:1.8;margin-top:9px}

.ai-title{font-size:18px;font-weight:950}
.ai-sub{font-size:11px;color:#8c918e;line-height:1.7;margin-top:5px}
.ai-messages{margin-top:12px;display:grid;gap:8px}
.ai-message{padding:11px 12px;border-radius:13px;font-size:12px;line-height:1.75;white-space:pre-wrap}
.ai-message.user{margin-left:30px;background:#172019;border:1px solid #2c4d3d}
.ai-message.bot{margin-right:16px;background:#0a0d0b;border:1px solid #2b312d;color:#d5d9d6}
.ai-row{display:flex;gap:8px;margin-top:12px}
.ai-input{
flex:1;min-height:48px;resize:vertical;border:1px solid #303632;background:#060806;
color:#fff;border-radius:13px;padding:12px;outline:none
}
.ai-send{border:0;background:#e8eee9;color:#111;border-radius:12px;padding:13px 15px;font-weight:950}

.monster-section{
margin:16px 0 4px;padding:13px;border-radius:19px;border:1px solid rgba(189,124,255,.28);
background:#120d19
}
.monster-section-head{display:flex;justify-content:space-between;gap:10px}
.monster-title{font-size:16px;font-weight:950}
.monster-sub{font-size:10px;color:#a796b7;line-height:1.65;margin-top:4px}
.monster-item{border:1px solid #43334f;background:#160f1d;border-radius:14px;padding:12px;cursor:pointer}
.monster-score strong{font-size:21px;font-weight:950}
.monster-score span{display:block;font-size:8px;color:#8e7c99}
.monster-state{font-size:11px;font-weight:900;color:#e2c5ff;margin-top:6px}
.monster-chip{
font-size:9px;font-weight:850;padding:5px 7px;border-radius:999px;
border:1px solid #493653;color:#cdb6d8;background:#120d16
}
.monster-empty{padding:14px;font-size:10px;color:#998ba1;text-align:center}

.home-entry-section{
margin:0 0 15px;padding:12px;border:1px solid rgba(73,230,173,.24);
border-radius:17px;background:#0d1410
}
.home-entry-head{display:flex;justify-content:space-between;margin-bottom:9px}
.home-entry-list{display:grid;gap:7px}
.home-entry-alert{
display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #2a463b;
background:#0e1a14;border-radius:13px;cursor:pointer
}
.home-entry-info{flex:1;min-width:0}
.home-entry-symbol{font-size:13px;font-weight:950}
.home-entry-name{font-size:11px;color:#aeb9b3}
.home-entry-bottom{font-size:10px;color:#8fc8af;margin-top:3px}
.home-entry-price{text-align:right}
.home-entry-price strong{display:block;font-size:15px}
.home-entry-price span{font-size:9px;color:#7e8a83}
.home-entry-close{border:0;background:transparent;color:#69746e}

.toast-stack{
position:fixed;z-index:9999;top:14px;left:50%;transform:translateX(-50%);
width:min(calc(100% - 24px),420px)
}
.entry-toast{
border:1px solid #344139;background:rgba(11,15,12,.97);
border-radius:13px;padding:11px 12px
}
.entry-toast-title{font-size:12px;font-weight:950;margin-top:3px}

.loading{padding:28px 10px;text-align:center;color:#909a94;font-size:13px}
.error{padding:14px;border:1px solid #4b252a;background:#1a0c0e;border-radius:14px;color:#ff9ba4}

@media(max-width:430px){
.indicator-strip{grid-template-columns:repeat(2,1fr)}
.backtest-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div id="toastStack" class="toast-stack"></div>

<div class="app">
<div id="homeView">

<div class="header">
<div class="logo">幽冥分析<small>股票策略分析</small></div>
<button id="notifyButton" class="notify-btn">🔔 高勝率策略通知</button>
</div>

<div class="market-tabs">
<button id="twTab" class="market-tab active">🇹🇼 台股</button>
<button id="usTab" class="market-tab">🇺🇸 美股</button>
</div>

<div id="homeEntrySection" class="home-entry-section hidden">
<div class="home-entry-head">
<div class="section-title">🎯 高品質進場提醒</div>
<div class="section-sub">保留 30 分鐘</div>
</div>
<div id="homeEntryList" class="home-entry-list"></div>
</div>

<div class="search-card">
<div class="search-row">
<input id="searchInput" class="search-input" autocomplete="off" placeholder="輸入代號或名稱，例如 台積 / 23 / NV">
<button id="searchButton" class="search-button">分析</button>
</div>
<div id="searchSuggest" class="search-suggest hidden"></div>

<div class="search-examples">
<button class="example" data-example="2330">2330</button>
<button class="example" data-example="2317">2317</button>
<button class="example" data-example="2454">2454</button>
<button class="example" data-example="NVDA">NVDA</button>
<button class="example" data-example="AAPL">AAPL</button>
<button class="example" data-example="TSLA">TSLA</button>
</div>

<div id="searchHistory" class="hidden">
<div class="section-head">
<div class="section-sub">🕘 最近搜尋</div>
<button id="clearHistory" class="more-btn">清除</button>
</div>
<div id="searchHistoryList" class="search-examples"></div>
</div>
</div>

<div class="section-head">
<div>
<div class="section-title">⭐ 我的自選</div>
<div class="section-sub">搜尋股票後可加入自選</div>
</div>
<button id="watchToggleButton" class="more-btn">全部收起</button>
</div>
<div id="watchList" class="watch-list"></div>

<div id="twMarket">
<div class="monster-section">
<div class="monster-section-head">
<div>
<div class="monster-title">🔥 妖股追蹤</div>
<div class="monster-sub">偵測放量、動能、突破與波動擴張。</div>
</div>
</div>
<div id="monsterList" class="monster-list">
<div class="monster-empty">正在掃描…</div>
</div>
</div>

<div class="section-head">
<div>
<div class="section-title">🇹🇼 台股市場掃描</div>
<div class="section-sub">使用母版本策略掃描條件</div>
</div>
<button id="refreshButton" class="refresh-btn">重新掃描</button>
</div>

<div class="stats">
<div class="stat"><span>掃描股票</span><strong id="scanCount">--</strong></div>
<div class="stat"><span>符合策略</span><strong id="strategyCount">--</strong></div>
<div class="stat"><span>異動股票</span><strong id="radarCount">--</strong></div>
</div>

<div class="section-head">
<div class="section-sub" id="updateText">正在掃描市場…</div>
<div class="section-sub" id="countdown">01:00</div>
</div>

<div class="section-head">
<div><div class="section-title">🎯 自動偵測符合策略股票</div></div>
<button class="more-btn" data-more="strategy">全部收起</button>
</div>
<div id="strategyGrid" class="stock-grid"></div>

<div class="section-head">
<div><div class="section-title">🟢 做多觀察</div></div>
<button class="more-btn" data-more="long">全部收起</button>
</div>
<div id="longGrid" class="stock-grid"></div>

<div class="section-head">
<div><div class="section-title">⚡ 市場異動雷達</div></div>
<button class="more-btn" data-more="radar">全部收起</button>
</div>
<div id="radarGrid" class="stock-grid"></div>
</div>

<div id="usMarket" class="hidden">
<div class="section-head"><div class="section-title">🇺🇸 美股最近分析</div></div>
<div id="usRecentGrid" class="stock-grid"></div>
</div>
</div>

<div id="analysisView" class="hidden">
<div class="back-row">
<button id="backButton" class="back-button">← 返回</button>
<div id="analysisRefresh" class="analysis-refresh">每 30 秒更新</div>
</div>
<div id="analysisResult"></div>
</div>
</div>

<script>
const WATCH_KEY="yaozi_watchlist";
const HISTORY_KEY="yaozi_search_history_v1";
const POSITION_KEY="yaozi_positions_v46";
const NOTIFY_COOLDOWN_KEY="yaozi_entry_notify_cooldown_v1";
const HOME_ENTRY_KEY="yaozi_home_entry_alerts_v1";

const ENTRY_NOTIFY_COOLDOWN=30*60*1000;
const HOME_ENTRY_LIFETIME=30*60*1000;

var currentAnalysisSymbol="";
var currentAnalysisData=null;
var currentMarketMetrics=null;
var currentSetups=null;
var analysisRefreshing=false;
var analysisRequestSeq=0;
var radarData=null;
var monsterStocks=[];
var expanded={watch:true,strategy:true,long:true,radar:true};
var countdownSeconds=60;

function el(id){return document.getElementById(id)}

function safe(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;")
}

function fmt(v,d=2){
var n=Number(v);
if(!Number.isFinite(n))return"--";
return n.toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d})
}

function pct(v){
var n=Number(v);
if(!Number.isFinite(n))return"--";
return(n>0?"+":"")+fmt(n,2)+"%"
}

function pclass(v){
var n=Number(v);
return n>0?"up":n<0?"down":"flat"
}

function average(values){
var a=values.map(Number).filter(Number.isFinite);
return a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN
}

function ema(values,period){
var a=values.map(Number).filter(Number.isFinite);
if(!a.length)return NaN;
var k=2/(period+1),out=a[0];
for(var i=1;i<a.length;i++)out=a[i]*k+out*(1-k);
return out
}

function currentTimeText(){
return new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})
}

/* 指標 */
function historicalATR(rows,period=14){
if(rows.length<2)return 0;
var a=rows.slice(-(period+1)),trs=[];
for(var i=1;i<a.length;i++){
var h=Number(a[i].high),l=Number(a[i].low),pc=Number(a[i-1].close);
trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)))
}
return average(trs)||0
}

function marketOf(d){
var rows=d.rows||[];
var last=rows.at(-1)||{};
var price=Number(d.price)||Number(last.close)||0;
var ma20=Number(d.ma20);
var ma60=Number(d.ma60);
var rsi=Number(d.rsi);
var macd=Number(d.macd);
var atr=Number(d.atr);

if(!Number.isFinite(ma20))ma20=average(rows.slice(-20).map(x=>x.close))||price;
if(!Number.isFinite(ma60))ma60=average(rows.slice(-60).map(x=>x.close))||price;
if(!Number.isFinite(rsi))rsi=50;
if(!Number.isFinite(macd))macd=0;
if(!Number.isFinite(atr)||atr<=0)atr=historicalATR(rows)||price*.02;

var highs=rows.slice(-20).map(x=>Number(x.high)).filter(Number.isFinite);
var lows=rows.slice(-20).map(x=>Number(x.low)).filter(Number.isFinite);
var lows10=rows.slice(-10).map(x=>Number(x.low)).filter(Number.isFinite);

var resistance=Number(d.resistance);
if(!Number.isFinite(resistance))resistance=highs.length?Math.max(...highs):price;

var support=Number(d.support);
if(!Number.isFinite(support))support=lows.length?Math.min(...lows):ma20;

return{
price,ma20,ma60,rsi,macd,atr,resistance,support,
low10:lows10.length?Math.min(...lows10):support,
rows
}
}

function volumeMetrics(d,rows){
var last=rows.at(-1)||{};
var current=Number(d.volume??last.volume)||0;
var vols=rows.slice(-21,-1).map(x=>Number(x.volume)).filter(Number.isFinite);
var average20=vols.length?average(vols):0;
var ratio=Number(d.volumeRatio);
if(!Number.isFinite(ratio)||ratio<=0)ratio=average20>0?current/average20:1;

var level="正常量";
if(ratio>=2)level="明顯放量";
else if(ratio>=1.5)level="放量";
else if(ratio>=1.2)level="量能增溫";
else if(ratio<.7)level="量縮";

return{current,average20,ratio,level}
}

function structureHealthy(m){
var c=m.rows.slice(-5).map(x=>Number(x.close)).filter(Number.isFinite);
return c.length<3||c.at(-1)>=c[0]*.96&&m.price>=m.ma60*.97
}

/* 策略 */
function buildStrategySetups(d,m,v){
var price=m.price,ma20=m.ma20,ma60=m.ma60,rsi=m.rsi,macd=m.macd,atr=m.atr,resistance=m.resistance;
var notBroken=price>=ma60*.97;
var structure=structureHealthy(m);

var pull=[
{title:"MA20 高於 MA60",pass:ma20>ma60,explain:"短期均線位於中期均線上方。"},
{title:"價格沒有明顯跌破 MA20",pass:price>=ma20-atr*.5,explain:"價格仍接近短期多頭支撐。"},
{title:"價格沒有離 MA20 過遠",pass:price<=ma20+atr*1.3,explain:"避免追價。"},
{title:"RSI 不低於 42",pass:rsi>=42,explain:"避免動能過弱。"},
{title:"RSI 不高於 68",pass:rsi<=68,explain:"避免短線過熱。"},
{title:"MACD 不低於 0",pass:macd>=0,explain:"動能維持偏多。"},
{title:"中期結構尚未跌破",pass:notBroken,explain:"價格仍維持 MA60 附近之上。"},
{title:"量能沒有過度爆量",pass:v.ratio<=1.6,explain:"避免爆量後追高。"}
];

var high=[
{title:"MA20 高於 MA60",pass:ma20>ma60,explain:"中短期趨勢向上。"},
{title:"價格站在 MA20 上方",pass:price>ma20,explain:"價格維持短期支撐之上。"},
{title:"MACD 大於 0",pass:macd>0,explain:"正向動能。"},
{title:"RSI 至少 52",pass:rsi>=52,explain:"買方動能偏強。"},
{title:"RSI 不高於 72",pass:rsi<=72,explain:"避免過熱。"},
{title:"價格接近前高／壓力",pass:price>=resistance-atr*.5,explain:"等待突破。"},
{title:"量比至少 1.2 倍",pass:v.ratio>=1.2,explain:"需要量能支持。"},
{title:"結構沒有破壞",pass:notBroken&&structure,explain:"價格結構完整。"}
];

var surge=[
{title:"MA20 高於 MA60",pass:ma20>ma60,explain:"主要趨勢向上。"},
{title:"價格站在 MA20 上方",pass:price>ma20,explain:"維持短期均線上方。"},
{title:"MACD 大於 0",pass:macd>0,explain:"正向動能延續。"},
{title:"RSI 至少 58",pass:rsi>=58,explain:"需要較強動能。"},
{title:"RSI 不高於 74",pass:rsi<=74,explain:"避免過熱。"},
{title:"價格逼近或突破前高",pass:price>=resistance-atr*.25,explain:"價格處於強勢位置。"},
{title:"量比至少 1.5 倍",pass:v.ratio>=1.5,explain:"需要明顯量能。"},
{title:"多頭結構完整",pass:notBroken&&structure,explain:"趨勢仍完整。"}
];

function pack(a){
var passed=a.filter(x=>x.pass).length;
return{
conditions:a,
passed,
total:a.length,
score:Math.round(passed/a.length*100),
qualified:passed>=7
}
}

return{PULLBACK:pack(pull),HIGH_R:pack(high),SURGE:pack(surge)}
}

function bestSetup(setups){
var a=[
{type:"PULLBACK",name:"支撐回踩",setup:setups.PULLBACK},
{type:"HIGH_R",name:"高 R 突破",setup:setups.HIGH_R},
{type:"SURGE",name:"強勢續攻",setup:setups.SURGE}
];
a.sort((x,y)=>y.setup.score-x.setup.score);
return a[0]
}

/*
核心修正：
1. 策略「進場區」永遠不能整段落在目前市價上方。
2. 若目前價格已經跌破原本計算出的進場區，重新以目前市價與支撐結構建立有效觀察區。
3. SL 必須低於進場中心。
4. TP 必須高於進場中心。
*/
function strategyTargets(type,m){
var price=Number(m.price)||0;
var atr=Math.max(Number(m.atr)||price*.02,price*.005);
var ma20=Number(m.ma20)||price;
var ma60=Number(m.ma60)||price;
var resistance=Number(m.resistance)||price;
var support=Number(m.support)||ma20;
var low10=Number(m.low10)||support;

var entryLow,entryHigh,stop1,stop2;

if(type==="PULLBACK"){
entryLow=Math.max(Math.min(ma20-atr*.25,price),Math.min(support,price));
entryHigh=Math.min(price,Math.max(entryLow,ma20+atr*.25));
}
else if(type==="HIGH_R"){
entryLow=Math.max(price-atr*.25,Math.min(resistance-atr*.12,price));
entryHigh=price;
}
else{
entryLow=Math.max(price-atr*.30,Math.min(ma20,price));
entryHigh=price;
}

/* 保證進場區合理且目前市價不會低於整個進場區 */
entryLow=Math.min(entryLow,price);
entryHigh=Math.min(Math.max(entryHigh,entryLow),price);

if(entryHigh-entryLow<atr*.08){
entryLow=Math.max(0,price-atr*.25);
entryHigh=price;
}

var center=(entryLow+entryHigh)/2;

if(type==="PULLBACK"){
stop1=Math.min(entryLow-atr*.55,support-atr*.25);
stop2=Math.min(ma60-atr*.35,low10-atr*.30,stop1-atr*.60);
}
else if(type==="HIGH_R"){
stop1=Math.min(entryLow-atr*.55,ma20-atr*.20);
stop2=Math.min(ma60-atr*.35,low10-atr*.25,stop1-atr*.65);
}
else{
stop1=Math.min(entryLow-atr*.65,low10-atr*.15);
stop2=Math.min(ma60-atr*.45,low10-atr*.40,stop1-atr*.65);
}

/* 強制 SL 在進場區下方 */
if(!Number.isFinite(stop1)||stop1>=entryLow){
stop1=entryLow-atr*.60
}
if(!Number.isFinite(stop2)||stop2>=stop1){
stop2=stop1-atr*.70
}

stop1=Math.max(0.01,stop1);
stop2=Math.max(0.01,Math.min(stop2,stop1-atr*.20));

var risk=Math.max(center-stop1,atr*.45);

/* TP 一定高於進場中心 */
var previousHigh=Math.max(resistance,center+atr*.20);
var tp1=Math.max(previousHigh,center+risk*1.20);
var tp2=Math.max(tp1+atr*.35,center+risk*2.00);
var tp3=Math.max(tp2+atr*.45,center+risk*3.00);

return{
entryLow,
entryHigh,
center,
stop1,
stop2,
previousHigh,
risk,
tp1,
tp2,
tp3
}
}

/* 妖股 */
function monsterMetrics(d,m,v){
var rows=m.rows||[];
var closes5=rows.slice(-5).map(x=>Number(x.close)).filter(Number.isFinite);
var closes10=rows.slice(-10).map(x=>Number(x.close)).filter(Number.isFinite);

var fiveReturn=closes5.length>=2?(closes5.at(-1)/closes5[0]-1)*100:0;
var tenReturn=closes10.length>=2?(closes10.at(-1)/closes10[0]-1)*100:0;

var score=0;
if(m.ma20>=m.ma60*.985&&m.price>=m.ma20*.98)score+=20;
if(m.macd>0&&m.rsi>=52)score+=20;
if(m.price>=m.resistance-m.atr*.7)score+=20;
if(v.ratio>=1.25)score+=15;
if(v.ratio>=1.6)score+=10;
if(fiveReturn>0)score+=10;
if(m.rsi<=78)score+=5;

score=Math.min(100,score);

var state=score>=85?"🔥 啟動確認":score>=75?"⚡ 啟動前兆":score>=65?"👀 異常增溫":"觀察中";

var atr=Math.max(m.atr,m.price*.008);
var entryHigh=m.price;
var entryLow=Math.max(0,m.price-atr*.30);
var sl1=Math.max(.01,entryLow-atr*.70);
var sl2=Math.max(.01,sl1-atr*.70);
var center=(entryLow+entryHigh)/2;
var risk=Math.max(center-sl1,atr*.6);

return{
score,state,fiveReturn,tenReturn,
entryLow,entryHigh,sl1,sl2,
tp1:center+risk*1.4,
tp2:center+risk*2.3,
tp3:center+risk*3.5
}
}

var t=strategyTargets(b.type,m);

}

var grade=
setup.score>=88?"高度符合":
setup.score>=75?"條件良好":
setup.score>=63?"接近形成":"尚待確認";

var t=strategyTargets(type,m);

function rr(target,stop){
var reward=target-t.center;
var risk=t.center-stop;
return reward<=0||risk<=0?"--":(reward/risk).toFixed(2)+"R"
}

/*
只有真正 qualified 才顯示進場、SL、TP。
這樣不會再出現「策略根本沒成立，卻硬給進場價」。
TP / SL 並沒有刪掉，成立時完整顯示。
*/
var targetBlock=setup.qualified?`
<div style="margin-top:14px;border-top:1px solid #202722;padding-top:13px">
<div class="section-title">🎯 策略目標規劃</div>

<div class="strategy-levels">

<div class="strategy-level level-entry" style="grid-column:1/-1">
<span>👀 觀察入場區間</span>
<strong>${fmt(t.entryLow)} ～ ${fmt(t.entryHigh)}</strong>
</div>

<div class="strategy-level level-stop">
<span>🛑 SL1｜第一停損</span>
<strong>${fmt(t.stop1)}</strong>
</div>

<div class="strategy-level level-stop">
<span>🛡 SL2｜第二停損</span>
<strong>${fmt(t.stop2)}</strong>
</div>

<div class="strategy-level level-pressure" style="grid-column:1/-1">
<span>🏔 前高／壓力</span>
<strong>${fmt(t.previousHigh)}</strong>
</div>

<div class="strategy-level level-tp">
<span>💰 TP1</span>
<strong>${fmt(t.tp1)}</strong>
<span class="rr-text">${rr(t.tp1,t.stop1)}</span>
</div>

<div class="strategy-level level-tp">
<span>💰 TP2</span>
<strong>${fmt(t.tp2)}</strong>
<span class="rr-text">${rr(t.tp2,t.stop1)}</span>
</div>

<div class="strategy-level level-tp3" style="grid-column:1/-1">
<span>🔥 TP3</span>
<strong>${fmt(t.tp3)}</strong>
<span class="rr-text">${rr(t.tp3,t.stop1)}</span>
</div>

</div>
</div>
`:`
<div style="margin-top:14px;border-top:1px solid #202722;padding-top:13px">
<div class="section-title">🎯 策略目標規劃</div>
<div class="section-sub" style="margin-top:8px">
尚未形成有效策略訊號，暫不顯示入場、停損與停利目標。
</div>
</div>
`;

return `
<div class="strategy-card">

<div class="strategy-head">
<div>
<div class="strategy-name">${emojis[type]} ${names[type]}</div>
<div class="strategy-grade">${grade}</div>
</div>

<div class="strategy-score">
${setup.score}
<small>${setup.passed}/${setup.total} 條</small>
</div>
</div>

<div class="strategy-market-price">
<span>目前市價</span>
<strong>${fmt(m.price)}</strong>
</div>

${targetBlock}

<div style="margin-top:18px;border-top:1px solid #202722;padding-top:14px">
<div class="section-title">📋 ${names[type]}策略條件</div>
<div class="section-sub" style="margin-top:5px;margin-bottom:8px">
目前符合 ${setup.passed} / ${setup.total} 項
</div>

${setup.conditions.map((x,i)=>`
<div class="condition-row ${x.pass?"good":"bad"}">
${x.pass?"✓":"✕"} ${i+1}. ${safe(x.title)}
<span class="condition-explain">${safe(x.explain)}</span>
</div>
`).join("")}
</div>

<div class="qualified-badge ${setup.qualified?"":"not-qualified"}">
${setup.qualified
?"✓ 目前技術條件符合此策略"
:"目前尚未完整符合此策略"}
</div>

<div class="strategy-quick-actions">
<button type="button" class="strategy-quick-btn" data-strategy-top="1">↑ 返回最上層</button>
<button type="button" class="strategy-quick-btn" data-strategy-home="1">⌂ 返回首頁</button>
</div>

</div>`
}

/* AI */
function aiHTML(){
return `
<div class="big-section-title">💬 即時詢問分析</div>
<div class="ai-card">
<div class="ai-title">幽冥 AI 分析助手</div>
<div class="ai-sub">直接詢問目前這檔股票。</div>
<div id="aiMessages" class="ai-messages"></div>
<div class="ai-row">
<textarea id="aiInput" class="ai-input" placeholder="例如：目前這個位置怎麼看？"></textarea>
<button id="aiSend" class="ai-send">詢問</button>
</div>
</div>`
}

function bindAI(){
var send=el("aiSend"),input=el("aiInput");
if(!send||!input)return;

send.onclick=async()=>{
var question=input.value.trim();
if(!question)return;

var messages=el("aiMessages");
messages.insertAdjacentHTML("beforeend",`<div class="ai-message user">${safe(question)}</div>`);
input.value="";
send.disabled=true;

var loading=document.createElement("div");
loading.className="ai-message bot";
loading.textContent="正在分析…";
messages.appendChild(loading);

try{
var b=bestSetup(currentSetups);
var t=strategyTargets(b.type,currentMarketMetrics);

var r=await fetch("/api/ai",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
question,
context:{
symbol:currentAnalysisData.symbol,
name:currentAnalysisData.name,
price:currentMarketMetrics.price,
ma20:currentMarketMetrics.ma20,
ma60:currentMarketMetrics.ma60,
rsi:currentMarketMetrics.rsi,
macd:currentMarketMetrics.macd,
strategy:b.name,
strategyScore:b.setup.score,
strategyQualified:b.setup.qualified,
entryLow:b.setup.qualified?t.entryLow:null,
entryHigh:b.setup.qualified?t.entryHigh:null,
sl1:b.setup.qualified?t.stop1:null,
sl2:b.setup.qualified?t.stop2:null,
tp1:b.setup.qualified?t.tp1:null,
tp2:b.setup.qualified?t.tp2:null,
tp3:b.setup.qualified?t.tp3:null
}
})
});

var d=await r.json();
if(!r.ok||!d.ok)throw Error(d.error||"AI 分析失敗");
loading.textContent=d.answer||"目前沒有回答。"
}catch(e){
loading.textContent="AI 分析暫時無法使用："+e.message
}finally{
send.disabled=false
}
}
}

/* API */
async function fetchStockData(symbol){
var r=await fetch("/api/stock?symbol="+encodeURIComponent(symbol)+"&t="+Date.now(),{cache:"no-store"});
var d=await r.json();
if(!r.ok||!d.ok)throw Error(d.error||"股票資料取得失敗");
return d
}

/* 防止切換股票時舊資料蓋掉新股票 */
async function analyze(symbol){
symbol=String(symbol||"").trim().toUpperCase();
if(!symbol)return;

var requestId=++analysisRequestSeq;

saveSearchHistory(symbol);

el("homeView").classList.add("hidden");
el("analysisView").classList.remove("hidden");
el("analysisResult").innerHTML='<div class="loading">正在分析 '+safe(symbol)+'…</div>';

currentAnalysisSymbol=symbol;
currentAnalysisData=null;
currentMarketMetrics=null;
currentSetups=null;

window.scrollTo({top:0,behavior:"auto"});

try{
var d=await fetchStockData(symbol);

if(requestId!==analysisRequestSeq)return;
if(currentAnalysisSymbol!==symbol)return;

currentAnalysisData=d;
buildAnalysis(d,symbol)
}catch(e){
if(requestId!==analysisRequestSeq)return;
if(currentAnalysisSymbol!==symbol)return;
el("analysisResult").innerHTML='<div class="error">'+safe(e.message)+'</div>'
}
}

async function refreshCurrentAnalysis(){
if(!currentAnalysisSymbol||document.hidden||analysisRefreshing)return;

analysisRefreshing=true;
var symbol=currentAnalysisSymbol;
var requestId=analysisRequestSeq;

try{
var d=await fetchStockData(symbol);

if(requestId!==analysisRequestSeq)return;
if(currentAnalysisSymbol!==symbol)return;

currentAnalysisData=d;
buildAnalysis(d,symbol);

var r=el("analysisRefresh");
if(r)r.textContent="剛剛更新 · "+currentTimeText()+" · 每 30 秒"
}catch(e){
if(currentAnalysisSymbol===symbol){
var r=el("analysisRefresh");
if(r)r.textContent="更新失敗 · 30 秒後重試"
}
}finally{
analysisRefreshing=false
}
}

function buildAnalysis(d,expectedSymbol){
if(expectedSymbol&&String(d.symbol).toUpperCase()!==String(expectedSymbol).toUpperCase())return;
if(currentAnalysisSymbol&&String(d.symbol).toUpperCase()!==String(currentAnalysisSymbol).toUpperCase())return;

var rows=d.rows||[];
if(rows.length<60)throw Error("歷史資料不足");

var m=marketOf(d);
var v=volumeMetrics(d,rows);
var setups=buildStrategySetups(d,m,v);
var monster=monsterMetrics(d,m,v);

currentMarketMetrics=m;
currentSetups=setups;
d.price=m.price;

checkEntryNotification(d,m,setups);

var change=Number(d.changePercent);

el("analysisResult").innerHTML=`
<div class="hero-card">
<div class="hero-top">
<div>
<div class="stock-title-line">
<div class="hero-symbol">${safe(d.symbol)}</div>
<div class="hero-name">${safe(d.name||"")}</div>
</div>
<div class="market-pill">${d.market==="US"?"🇺🇸 美股":"🇹🇼 台股"}</div>
</div>

<div>
<div class="hero-price">${fmt(m.price)}</div>
<div class="hero-change ${pclass(change)}">${pct(change)}</div>
</div>
</div>

<button id="favoriteButton" class="favorite-btn">☆ 加入自選</button>

<div class="indicator-strip">
<div class="indicator"><span>MA20</span><strong>${fmt(m.ma20)}</strong></div>
<div class="indicator"><span>MA60</span><strong>${fmt(m.ma60)}</strong></div>
<div class="indicator"><span>RSI 14</span><strong>${fmt(m.rsi,1)}</strong></div>
<div class="indicator"><span>MACD</span><strong>${fmt(m.macd)}</strong></div>
<div class="indicator"><span>ATR</span><strong>${fmt(m.atr)}</strong></div>
<div class="indicator"><span>20日壓力</span><strong>${fmt(m.resistance)}</strong></div>
</div>

<div class="volume-card">
<div class="section-title">📊 成交量分析 · ${safe(v.level)}</div>
<div class="volume-grid">
<div class="volume-box"><span>量比</span><strong>${fmt(v.ratio,2)}x</strong></div>
<div class="volume-box"><span>目前成交量</span><strong>${fmt(v.current,0)}</strong></div>
<div class="volume-box"><span>20日均量</span><strong>${fmt(v.average20,0)}</strong></div>
</div>
</div>
</div>

<div class="monster-section">
<div class="monster-section-head">
<div>
<div class="monster-title">🔥 妖股啟動分析</div>
<div class="monster-sub">量價、突破與動能綜合判斷。</div>
</div>
<div class="monster-score">
<strong>${monster.score}</strong>
<span>妖股分數</span>
</div>
</div>

<div class="monster-state">${safe(monster.state)}</div>

<div class="monster-meta">
<span class="monster-chip">5期動能 ${pct(monster.fiveReturn)}</span>
<span class="monster-chip">量比 ${fmt(v.ratio,2)}x</span>
<span class="monster-chip">觀察區 ${fmt(monster.entryLow)}～${fmt(monster.entryHigh)}</span>
<span class="monster-chip">SL1 ${fmt(monster.sl1)}</span>
<span class="monster-chip">TP1 ${fmt(monster.tp1)}</span>
</div>
</div>

${buildPositionAnalysis(d,m,setups)}

${aiHTML()}

${recommendationHTML(setups)}

<div id="pullbackStrategy">
<div class="big-section-title">🟢 支撐回踩策略</div>
${strategyHTML("PULLBACK",setups.PULLBACK,m)}
</div>

<div id="highRStrategy">
<div class="big-section-title">🟣 高 R 突破策略</div>
${strategyHTML("HIGH_R",setups.HIGH_R,m)}
</div>

<div id="surgeStrategy">
<div class="big-section-title">🔥 強勢續攻策略</div>
${strategyHTML("SURGE",setups.SURGE,m)}
</div>

<div style="height:30px"></div>
`;

bindPositionControls();
bindAI();

var f=el("favoriteButton");
if(f)f.onclick=toggleFavorite;
updateFavoriteButton();

document.querySelectorAll("[data-jump]").forEach(x=>{
x.onclick=()=>{
var t=el(x.dataset.jump);
if(t)t.scrollIntoView({behavior:"smooth",block:"start"})
}
});

document.querySelectorAll("[data-strategy-top]").forEach(x=>{
x.onclick=()=>window.scrollTo({top:0,behavior:"smooth"})
});

document.querySelectorAll("[data-strategy-home]").forEach(x=>{
x.onclick=goBackHome
})
}

/* 返回 */
function goBackHome(){
analysisRequestSeq++;
currentAnalysisSymbol="";
currentAnalysisData=null;
currentMarketMetrics=null;
currentSetups=null;

el("analysisView").classList.add("hidden");
el("homeView").classList.remove("hidden");

renderWatchlist();
renderHomeEntryAlerts();
window.scrollTo({top:0,behavior:"auto"})
}

/* 雷達 */
function renderStocks(id,a,showAll){
var r=el(id);
if(!showAll){r.innerHTML="";return}

if(!a.length){
r.innerHTML='<div class="card" style="padding:13px">目前沒有符合條件的股票</div>';
return
}

r.innerHTML=a.map(s=>`
<article class="stock-card" data-stock="${safe(s.symbol)}">
<div class="stock-title-line">
<div class="symbol">${safe(s.symbol)}</div>
<div class="stock-inline-name">${safe(s.name||"")}</div>
</div>

<div class="price-row">
<div class="price">${fmt(s.price)}</div>
<div class="${pclass(s.changePercent)}">${pct(s.changePercent)}</div>
</div>

<div class="chips">
<div class="chip green">量比 ${fmt(s.volumeRatio,1)}x</div>
</div>
</article>
`).join("");

r.querySelectorAll("[data-stock]").forEach(x=>x.onclick=()=>analyze(x.dataset.stock))
}

async function loadRadar(){
try{
var r=await fetch("/api/radar?t="+Date.now(),{cache:"no-store"});
var d=await r.json();
if(!r.ok||!d.ok)throw Error(d.error||"雷達取得失敗");

radarData=d;

el("scanCount").textContent=fmt(d.scanned,0);
el("strategyCount").textContent=fmt((d.strategyReady||[]).length,0);
el("radarCount").textContent=fmt((d.radar||[]).length,0);

el("updateText").textContent="最後更新 "+currentTimeText();

renderStocks("strategyGrid",d.strategyReady||[],expanded.strategy);
renderStocks("longGrid",d.longWatch||[],expanded.long);
renderStocks("radarGrid",d.radar||[],expanded.radar);

countdownSeconds=60
}catch(e){
el("updateText").textContent="雷達連線失敗："+e.message
}
}

/* 搜尋按鈕 */
document.querySelectorAll("[data-example]").forEach(b=>{
b.onclick=()=>{
el("searchInput").value=b.dataset.example;
analyze(b.dataset.example)
}
});

el("searchButton").onclick=()=>{
var q=el("searchInput").value.trim();
if(q)analyze(q)
};

el("searchInput").addEventListener("keydown",e=>{
if(e.key==="Enter")analyze(el("searchInput").value)
});

el("clearHistory").onclick=()=>{
localStorage.removeItem(HISTORY_KEY);
renderSearchHistory()
};

el("watchToggleButton").onclick=()=>{
expanded.watch=!expanded.watch;
renderWatchlist();
el("watchToggleButton").textContent=expanded.watch?"全部收起":"全部打開"
};

document.querySelectorAll("[data-more]").forEach(button=>{
button.onclick=()=>{
if(!radarData)return;
var type=button.dataset.more;
expanded[type]=!expanded[type];

if(type==="strategy")renderStocks("strategyGrid",radarData.strategyReady||[],expanded.strategy);
if(type==="long")renderStocks("longGrid",radarData.longWatch||[],expanded.long);
if(type==="radar")renderStocks("radarGrid",radarData.radar||[],expanded.radar);

button.textContent=expanded[type]?"全部收起":"全部打開"
}
});

el("refreshButton").onclick=loadRadar;

el("twTab").onclick=()=>{
el("twMarket").classList.remove("hidden");
el("usMarket").classList.add("hidden");
el("twTab").classList.add("active");
el("usTab").classList.remove("active")
};

el("usTab").onclick=()=>{
el("twMarket").classList.add("hidden");
el("usMarket").classList.remove("hidden");
el("twTab").classList.remove("active");
el("usTab").classList.add("active")
};

el("notifyButton").onclick=async()=>{
if(!("Notification" in window)){
showSimpleToast("此瀏覽器不支援系統通知");
return
}
if(Notification.permission==="granted"){
showSimpleToast("手機通知已開啟");
return
}
var p=await Notification.requestPermission();
showSimpleToast(p==="granted"?"手機通知已開啟":"尚未允許手機通知")
};

el("backButton").onclick=goBackHome;

/* 自動更新 */
setInterval(()=>{
countdownSeconds--;
if(countdownSeconds<=0){
countdownSeconds=60;
if(!document.hidden&&!currentAnalysisSymbol)loadRadar()
}
var m=Math.floor(countdownSeconds/60);
var s=countdownSeconds%60;
el("countdown").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")
},1000);

setInterval(()=>{
if(currentAnalysisSymbol&&!document.hidden)refreshCurrentAnalysis()
},30000);

setInterval(renderHomeEntryAlerts,60000);

document.addEventListener("visibilitychange",()=>{
if(document.hidden)return;
if(currentAnalysisSymbol)refreshCurrentAnalysis();
else loadRadar()
});

/* 啟動 */
renderSearchHistory();
renderWatchlist();
renderHomeEntryAlerts();
loadRadar();
</script>

</body>
</html>
