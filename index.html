<!-- ==================================================
把原本「我的自選」整段替換成這段
================================================== -->

<div id="watchSection">

<div class="section-head">
<div>
<div class="section-title">⭐ 我的自選</div>
<div class="section-sub">搜尋股票後可加入自選，點股票直接進入完整分析</div>
</div>

<button id="watchToggleButton" class="more-btn">
全部打開
</button>
</div>

<div id="watchList" class="watch-list"></div>

</div>


<!-- ==================================================
原本三個「查看更多」按鈕 HTML 保留這樣
================================================== -->

<button class="more-btn" data-more="strategy">
全部打開
</button>

<button class="more-btn" data-more="long">
全部打開
</button>

<button class="more-btn" data-more="radar">
全部打開
</button>


<script>

/* ==================================================
加入到原本全域變數區
================================================== */

var watchExpanded=false;

var expanded={
strategy:false,
long:false,
radar:false
};


/* ==================================================
把原本 renderWatchlist() 整個替換成這個版本
================================================== */

function renderWatchlist(){

var box=el("watchList");
var button=el("watchToggleButton");

if(!box)return;

var list=getWatchlist();

if(!list.length){

box.innerHTML=
'<div class="watch-empty">'+
'目前還沒有自選股票<br>'+
'搜尋股票進入分析後，點「☆ 加入自選」即可加入。'+
'</div>';

if(button){
button.classList.add("hidden");
}

return

}

if(button){
button.classList.remove("hidden");
button.textContent=
watchExpanded
?"全部收起"
:"全部打開";
}

var data=
watchExpanded
?list
:list.slice(0,3);

box.innerHTML=data.map(item=>{

var change=Number(item.changePercent);

var changeText=
Number.isFinite(change)
?pct(change)
:"";

var priceText=
Number.isFinite(Number(item.price))
?fmt(item.price)
:"";

return(

'<div class="watch-item">'+

'<div class="watch-main" data-watch-open="'+
safe(item.symbol)+
'">'+

'<div class="watch-symbol">'+
safe(item.symbol)+
'</div>'+

'<div class="watch-name">'+
safe(item.name||"")+
'</div>'+

(
priceText
?
'<div class="watch-price">'+
priceText+
(
changeText
?
' · <span class="'+
pclass(change)+
'">'+
changeText+
'</span>'
:""
)+
'</div>'
:""
)+

'</div>'+

'<button class="watch-remove" data-watch-remove="'+
safe(item.symbol)+
'">'+
'移除'+
'</button>'+

'</div>'

)

}).join("");

box
.querySelectorAll("[data-watch-open]")
.forEach(item=>{

item.onclick=()=>{

analyze(
item.dataset.watchOpen
)

}

});

box
.querySelectorAll("[data-watch-remove]")
.forEach(button=>{

button.onclick=e=>{

e.stopPropagation();

removeFavorite(
button.dataset.watchRemove
)

}

})

}


/* ==================================================
加入：我的自選 全部打開 / 全部收起
================================================== */

el("watchToggleButton").onclick=()=>{

watchExpanded=
!watchExpanded;

renderWatchlist();

};


/* ==================================================
把原本「查看更多」整段 JS 替換成這段
三區都可以：
第一次按＝全部打開
第二次按＝全部收起
================================================== */

document
.querySelectorAll("[data-more]")
.forEach(button=>{

button.onclick=()=>{

if(!radarData){
return
}

var type=
button.dataset.more;


/* ===== 符合策略 ===== */

if(type==="strategy"){

expanded.strategy=
!expanded.strategy;

renderStocks(
"strategyGrid",
radarData.strategyReady||[],
"strategy",
expanded.strategy
);

button.textContent=
expanded.strategy
?"全部收起"
:"全部打開";

}


/* ===== 做多觀察 ===== */

else if(type==="long"){

expanded.long=
!expanded.long;

renderStocks(
"longGrid",
radarData.longWatch||[],
"long",
expanded.long
);

button.textContent=
expanded.long
?"全部收起"
:"全部打開";

}


/* ===== 市場異動 ===== */

else if(type==="radar"){

expanded.radar=
!expanded.radar;

renderStocks(
"radarGrid",
radarData.radar||[],
"radar",
expanded.radar
);

button.textContent=
expanded.radar
?"全部收起"
:"全部打開";

}

}

});


/* ==================================================
把 loadRadar() 裡面的三個 renderStocks
確認維持這個版本
================================================== */

renderStocks(
"strategyGrid",
d.strategyReady||[],
"strategy",
expanded.strategy
);

renderStocks(
"longGrid",
d.longWatch||[],
"long",
expanded.long
);

renderStocks(
"radarGrid",
d.radar||[],
"radar",
expanded.radar
);


/* ==================================================
原本啟動區維持
================================================== */

renderSearchHistory();
renderWatchlist();
loadRadar();

</script>
