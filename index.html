<body>

<div class="app">

<header class="top">

<div class="brand">
波段分析
<small>台股即時策略</small>
</div>

<button id="notify" class="icon">🔔</button>

</header>

<main id="home">

<div class="search">

<div class="search-box">

<input
id="q"
inputmode="search"
autocomplete="off"
placeholder="輸入代號或名稱，例如 2330、台積、聯發"
>

<div id="suggestions" class="suggestions hidden"></div>

</div>

<button id="go" class="primary">分析</button>

</div>

<div class="tabs">

<button class="tab on" data-tab="signal">
策略成立
</button>

<button class="tab" data-tab="near">
接近形成
</button>

<button class="tab" data-tab="watch">
我的自選
</button>

</div>

<div id="homeList"></div>

<div class="note">
可直接搜尋股票代號或中文名稱，名稱不需要輸入完整。
正式策略需至少符合 7/8 條件；6/8 列為接近形成。
首頁雷達每 60 秒更新。
</div>

</main>

<main id="detail" class="hidden">

<button id="back" class="icon back">
← 返回
</button>

<div id="detailBody"></div>

</main>

</div>

<script>

const WATCH_KEY='swing_tw_watch_v1';

const DEFAULT=[
'2330',
'2317',
'2454',
'2308',
'2382',
'3231',
'2881',
'2882',
'2891',
'2886',
'2603',
'2615'
];

let tab='signal';
let cache={};
let current='';
let detailTimer=null;
let radarTimer=null;

let searchTimer=null;
let selectedSearchSymbol='';


const $=id=>
document.getElementById(id);


const fmt=(n,d=2)=>
Number.isFinite(+n)
?
(+n).toLocaleString(
'zh-TW',
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
:
'--';


const esc=s=>
String(s??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');


const watch=()=>{

try{

return JSON.parse(
localStorage.getItem(WATCH_KEY)||'[]'
);

}catch{

return [];

}

};


const saveWatch=a=>
localStorage.setItem(
WATCH_KEY,
JSON.stringify(
[...new Set(a)]
)
);


async function getStock(symbol){

const r=
await fetch(
'/api/stock?symbol='+
encodeURIComponent(symbol)+
'&t='+
Date.now(),
{
cache:'no-store'
}
);

const d=
await r.json();

if(
!r.ok||
!d.ok
){

throw Error(
d.error||
'資料取得失敗'
);

}

return d;

}


function avg(a){

return a.length
?
a.reduce(
(x,y)=>x+y,
0
)/a.length
:
0;

}


function sma(a,n){

return avg(
a.slice(-n)
);

}


function ema(a,n){

if(!a.length)
return 0;

let e=a[0];

let k=
2/(n+1);

for(
let i=1;
i<a.length;
i++
){

e=
a[i]*k+
e*(1-k);

}

return e;

}


function rsi(a,n=14){

if(
a.length<=n
)
return 50;

let g=0;
let l=0;

for(
let i=a.length-n;
i<a.length;
i++
){

let d=
a[i]-a[i-1];

if(d>0)
g+=d;
else
l-=d;

}

if(l===0)
return 100;

return 100-
100/
(
1+
(g/n)/(l/n)
);

}


function atr(rows,n=14){

let a=[];

for(
let i=Math.max(
1,
rows.length-n
);
i<rows.length;
i++
){

let x=
rows[i];

let p=
rows[i-1].close;

a.push(
Math.max(
x.high-x.low,
Math.abs(
x.high-p
),
Math.abs(
x.low-p
)
)
);

}

return avg(a);

}


function analyzeData(d){

let rows=
d.rows
.map(
x=>({
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0
})
)
.filter(
x=>x.close>0
);


let c=
rows.map(
x=>x.close
);


let p=
+d.price;


let m20=
sma(c,20);


let m60=
sma(c,60);


let A=
Math.max(
atr(rows),
p*.006
);


let R=
rsi(c);


let macd=
ema(
c.slice(-100),
12
)
-
ema(
c.slice(-100),
26
);


let r20=
rows.slice(-20);


let r60=
rows.slice(-60);


let support=
Math.min(
...r20.map(
x=>x.low
)
);


let res=
Math.max(
...r20.map(
x=>x.high
)
);


let high60=
Math.max(
...r60.map(
x=>x.high
)
);


let vol=
rows.at(-1).volume;


let volAvg=
avg(
rows
.slice(-21,-1)
.map(
x=>x.volume
)
);


let vr=
volAvg
?
vol/volAvg
:
0;


let cond=[

[
'MA20 高於 MA60',
m20>m60,
'中期趨勢維持多頭排列'
],

[
'現價守在 MA60 上方',
p>=m60*.985,
'避免在中期結構已轉弱時進場'
],

[
'價格沒有過度遠離 MA20',
Math.abs(
p-m20
)<=A*2.2,
'避免追在短線過熱的位置'
],

[
'近期支撐仍有效',
p>=support*.99,
'價格尚未明顯跌破 20 日支撐'
],

[
'RSI 位於健康區',
R>=45&&R<=72,
'動能足夠，同時避免過熱'
],

[
'MACD 動能未明顯轉空',
macd>=-A*.05,
'短線動能沒有明顯惡化'
],

[
'成交量正常或偏強',
vr>=.8,
'量能至少接近 20 日正常水準'
],

[
'上方仍有波段空間',
Math.max(
res,
high60
)>p*1.025,
'上方目標空間足以規劃波段'
]

];


let passed=
cond.filter(
x=>x[1]
).length;


let score=
Math.round(
passed/8*100
);


let qualified=
passed>=7;


let near=
passed===6;


let entryHigh=
Math.min(
p,
Math.max(
m20,
support+A*.35
)
);


let entryLow=
Math.min(
entryHigh,
Math.max(
support,
m20-A*.55
)
);


if(
entryLow>p
)
entryLow=p;


if(
entryHigh>p
)
entryHigh=p;


let center=
(
entryLow+
entryHigh
)/2;


let structural=
Math.min(
support-A*.35,
m20-A*.85
);


let maxRisk=
center*.055;


let minRisk=
Math.max(
A*.7,
center*.018
);


let sl=
Math.max(
structural,
center-maxRisk
);


if(
center-sl<
minRisk
)
sl=
center-minRisk;


if(
sl>=entryLow
)
sl=
entryLow-
Math.max(
A*.55,
entryLow*.012
);


let risk=
Math.max(
center-sl,
A*.55
);


let pressure=
Math.max(
res,
high60
);


let tp1=
Math.max(
center+risk*1.35,
Math.min(
pressure,
center+risk*1.8
)
);


let tp2=
Math.max(
tp1+A*.45,
center+risk*2.15
);


let tp3=
Math.max(
tp2+A*.65,
center+risk*3
);


return {

...d,

ma20:m20,
ma60:m60,
rsi:R,
macd,
atr:A,
support,
resistance:res,
high60,
volumeRatio:vr,
conditions:cond,
passed,
score,
qualified,
near,
entryLow,
entryHigh,
sl,
tp1,
tp2,
tp3

};

}


function status(a){

return a.qualified
?
[
'🟢 策略成立',
'green'
]
:
a.near
?
[
'🟡 接近形成',
'yellow'
]
:
[
'⚪ 等待',
'gray'
];

}


function stockCard(a){

let s=
status(a);

let chg=
+a.changePercent;

return `

<div
class="card stock-card"
data-symbol="${esc(a.symbol)}"
>

<div class="row">

<div>

<div class="symbol">

${esc(a.symbol)}

<span class="name">
${esc(a.name||'')}
</span>

</div>

<div class="status ${s[1]}">
${s[0]}
</div>

</div>

<div>

<div class="price">
$${fmt(a.price)}
</div>

<div class="change ${chg>=0?'up':'down'}">

${chg>=0?'+':''}${fmt(chg)}%

</div>

</div>

</div>

<div class="score">
波段條件 ${a.passed}/8 ・ ${a.score} 分
</div>

</div>

`;

}


function renderHome(){

let arr=
Object.values(cache);


let list=
tab==='signal'
?
arr.filter(
x=>x.qualified
)
:
tab==='near'
?
arr.filter(
x=>x.near
)
:
watch()
.map(
s=>cache[s]
)
.filter(Boolean);


list.sort(
(a,b)=>b.score-a.score
);


$('homeList').innerHTML=
list.length
?
list.map(
stockCard
).join('')
:
`<div class="empty">${
tab==='signal'
?
'目前沒有掃描到正式成立的波段策略。'
:
tab==='near'
?
'目前沒有接近形成的股票。'
:
'尚未加入自選股票。'
}</div>`;


document
.querySelectorAll(
'[data-symbol]'
)
.forEach(
x=>
x.onclick=
()=>
openDetail(
x.dataset.symbol
)
);

}


async function radar(){

let syms=
[
...new Set(
[
...DEFAULT,
...watch()
]
)
];


await Promise.allSettled(

syms.map(

async s=>{

try{

cache[s]=
analyzeData(
await getStock(s)
);

}catch(e){

console.error(
'Radar error',
s,
e
);

}

}

)

);


renderHome();

notifySignals();

}


function notifySignals(){

if(
!(
'Notification'
in window
)
||
Notification.permission!=='granted'
)
return;


let old=
JSON.parse(
localStorage.getItem(
'swing_tw_signal_state'
)
||
'{}'
);


for(
let a of
Object.values(cache)
){

if(
a.qualified
&&
!old[a.symbol]
){

new Notification(
'🟢 '+
a.symbol+
' 波段策略成立',
{
body:
(a.name||'')+
' 現價 '+
fmt(a.price)+
'，符合 '+
a.passed+
'/8 條件'
}
);


old[a.symbol]=
Date.now();

}

}


localStorage.setItem(
'swing_tw_signal_state',
JSON.stringify(old)
);

}


function detailHTML(a){

let s=
status(a);


let fav=
watch().includes(
a.symbol
);


let chg=
+a.changePercent;


let target=
a.qualified
?
`

<div class="levels">

<div class="level entry full">

<span>
👀 觀察進場區
</span>

<strong>
${fmt(a.entryLow)} ～ ${fmt(a.entryHigh)}
</strong>

</div>


<div class="level sl full">

<span>
🛑 SL｜結構失效停損
</span>

<strong>
${fmt(a.sl)}
</strong>

</div>


<div class="level tp">

<span>
💰 TP1
</span>

<strong>
${fmt(a.tp1)}
</strong>

</div>


<div class="level tp">

<span>
💰 TP2
</span>

<strong>
${fmt(a.tp2)}
</strong>

</div>


<div class="level tp full">

<span>
🔥 TP3
</span>

<strong>
${fmt(a.tp3)}
</strong>

</div>

</div>

`
:
`

<div
class="empty"
style="margin-top:14px"
>

${
a.near
?
'目前 6/8，接近形成，但尚未正式成立；暫不顯示可執行的 TP / SL。'
:
'目前條件不足，暫不顯示進場、TP 與 SL。'
}

</div>

`;


return `

<div class="card hero">

<div class="row">

<div>

<div class="symbol">
${esc(a.symbol)}
${esc(a.name||'')}
</div>

<div class="hero-price">
$${fmt(a.price)}
</div>

<div class="change ${chg>=0?'up':'down'}">

${chg>=0?'+':''}${fmt(chg)}%

</div>

<div class="live">

<span class="pulse"></span>

20 秒自動更新 ・
${new Date().toLocaleTimeString('zh-TW')}

</div>

</div>

<div class="status ${s[1]}">
${s[0]}
</div>

</div>


<button
id="fav"
class="fav"
>

${
fav
?
'★ 已加入自選'
:
'☆ 加入自選'
}

</button>

</div>


<div class="card strategy">

<div class="strategy-head">

<div>

<div class="strategy-title">
波段策略
</div>

<div
class="muted"
style="font-size:12px;margin-top:4px"
>
趨勢・支撐・動能・量能・波動
</div>

</div>

<div class="bigscore">
${a.passed}/8
</div>

</div>


${target}


<div class="conditions">

${

a.conditions.map(

(x,i)=>`

<div class="cond ${x[1]?'ok':'no'}">

${x[1]?'✓':'✕'}

${i+1}. ${esc(x[0])}

<small>
${esc(x[2])}
</small>

</div>

`

).join('')

}

</div>

</div>


<div class="note">

TP / SL 是依目前技術結構、支撐壓力與 ATR
計算的策略參考，不保證成交或報酬。
正式策略成立才顯示目標價位。

</div>

`;

}


async function openDetail(symbol){

if(!symbol)
return;


selectedSearchSymbol='';

hideSuggestions();


current=
String(symbol);


$('home')
.classList
.add('hidden');


$('detail')
.classList
.remove('hidden');


$('detailBody').innerHTML=
'<div class="card loader">正在分析 '+
esc(symbol)+
'…</div>';


await refreshDetail();


clearInterval(
detailTimer
);


detailTimer=
setInterval(
refreshDetail,
20000
);


window.scrollTo(
0,
0
);

}


async function refreshDetail(){

if(!current)
return;


let s=
current;


try{

let a=
analyzeData(
await getStock(s)
);


if(
current!==s
)
return;


cache[s]=a;


$('detailBody').innerHTML=
detailHTML(a);


const favButton=
$('fav');


if(favButton){

favButton.onclick=
()=>{

let w=
watch();


if(
w.includes(s)
){

w=
w.filter(
x=>x!==s
);

}else{

w=[
s,
...w
];

}


saveWatch(w);


$('detailBody').innerHTML=
detailHTML(a);


const newButton=
$('fav');


if(newButton){

newButton.onclick=
favButton.onclick;

}

};

}

}catch(e){

$('detailBody').innerHTML=
'<div class="empty">'+
esc(
e.message||
'資料取得失敗'
)+
'</div>';

}

}


$('back').onclick=
()=>{

current='';

clearInterval(
detailTimer
);

$('detail')
.classList
.add('hidden');

$('home')
.classList
.remove('hidden');

renderHome();

};


/* =========================================================
   中文 / 代號搜尋
========================================================= */

async function searchStocks(q){

const r=
await fetch(
'/api/search?q='+
encodeURIComponent(q)+
'&t='+
Date.now(),
{
cache:'no-store'
}
);


const d=
await r.json();


if(
!r.ok||
!d.ok
){

throw Error(
d.error||
'搜尋失敗'
);

}


return Array.isArray(
d.items
)
?
d.items
:
[];

}


function hideSuggestions(){

$('suggestions')
.classList
.add('hidden');

$('suggestions').innerHTML='';

}


function renderSuggestions(items){

const box=
$('suggestions');


if(
!items.length
){

hideSuggestions();
return;

}


box.innerHTML=
items.map(

x=>`

<button
class="suggestion"
type="button"
data-pick="${esc(x.symbol)}"
>

<div>

<div class="suggestion-main">
${esc(x.name||x.symbol)}
</div>

<div class="suggestion-code">
${esc(x.symbol)}
</div>

</div>

<div class="suggestion-market">

${
x.market==='TWO'
?
'上櫃'
:
'上市'
}

</div>

</button>

`

).join('');


box.classList
.remove('hidden');


box
.querySelectorAll(
'[data-pick]'
)
.forEach(

button=>{

button.onclick=
()=>{

const symbol=
button.dataset.pick;


const item=
items.find(
x=>x.symbol===symbol
);


selectedSearchSymbol=
symbol;


$('q').value=
item
?
item.name+
' '+
item.symbol
:
symbol;


hideSuggestions();


openDetail(
symbol
);

};

}

);

}


$('q')
.addEventListener(
'input',
()=>{

selectedSearchSymbol='';


clearTimeout(
searchTimer
);


const q=
$('q').value.trim();


if(!q){

hideSuggestions();
return;

}


searchTimer=
setTimeout(

async()=>{

try{

const items=
await searchStocks(q);


if(
$('q').value.trim()!==q
)
return;


renderSuggestions(
items
);

}catch(e){

console.error(
'Search error',
e
);

hideSuggestions();

}

},

220

);

}

);


$('go').onclick=
async()=>{

const raw=
$('q').value.trim();


if(
selectedSearchSymbol
){

return openDetail(
selectedSearchSymbol
);

}


const direct=
(
raw.match(
/\d{4,6}/
)
||
[]
)[0];


if(direct){

return openDetail(
direct
);

}


if(!raw){

return alert(
'請輸入股票代號或名稱'
);

}


try{

const items=
await searchStocks(
raw
);


if(
items.length===1
){

return openDetail(
items[0].symbol
);

}


if(
items.length>1
){

renderSuggestions(
items
);

return;

}


alert(
'找不到符合的台股'
);

}catch(e){

alert(
e.message||
'搜尋失敗'
);

}

};


$('q').onkeydown=
e=>{

if(
e.key==='Enter'
){

e.preventDefault();

$('go').click();

}

if(
e.key==='Escape'
){

hideSuggestions();

}

};


document
.addEventListener(
'click',
e=>{

if(
!e.target.closest(
'.search-box'
)
){

hideSuggestions();

}

}
);


/* =========================================================
   Tabs
========================================================= */

document
.querySelectorAll(
'.tab'
)
.forEach(

b=>{

b.onclick=
()=>{

document
.querySelectorAll(
'.tab'
)
.forEach(
x=>
x.classList.remove(
'on'
)
);


b.classList.add(
'on'
);


tab=
b.dataset.tab;


renderHome();

};

}

);


/* =========================================================
   Notification
========================================================= */

$('notify').onclick=
async()=>{

if(
!(
'Notification'
in window
)
){

return alert(
'目前瀏覽器不支援通知'
);

}


let p=
await Notification.requestPermission();


alert(
p==='granted'
?
'通知已開啟'
:
'尚未允許通知'
);

};


/* =========================================================
   Start
========================================================= */

radar();

radarTimer=
setInterval(
radar,
60000
);

</script>

</body>
</html>
