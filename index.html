<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="波段分析">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="/manifest.json">
<title>波段分析</title>

<style>
:root{
--bg:#07111f;
--card:#101d31;
--line:rgba(255,255,255,.075);
--text:#f5f8ff;
--muted:#8190a7;
--blue:#4d8dff;
--purple:#806cff;
--green:#35d98a;
--red:#ff6677;
--yellow:#ffc85c;
--shadow:0 16px 45px rgba(0,0,0,.25)
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html{
scroll-behavior:auto;
background:var(--bg)
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 15% -5%,rgba(68,125,255,.18),transparent 28%),
radial-gradient(circle at 100% 5%,rgba(128,92,255,.13),transparent 25%),
linear-gradient(180deg,#07111f,#081322 48%,#06101d);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
-webkit-font-smoothing:antialiased
}

button,input{
font:inherit
}

button{
cursor:pointer
}

.app{
max-width:760px;
margin:auto;
padding:
calc(env(safe-area-inset-top) + 16px)
max(16px,env(safe-area-inset-right))
calc(105px + env(safe-area-inset-bottom))
max(16px,env(safe-area-inset-left))
}

/* HEADER */

.top{
display:flex;
justify-content:space-between;
align-items:center;
min-height:58px;
margin-bottom:18px
}

.brand{
font-size:27px;
font-weight:950;
letter-spacing:-1px;
background:linear-gradient(100deg,#fff,#9cc5ff 55%,#9d8aff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.brand small{
display:block;
font-size:10px;
margin-top:6px;
letter-spacing:.8px;
color:#74849c;
-webkit-text-fill-color:#74849c
}

.icon{
min-width:42px;
height:42px;
border:1px solid var(--line);
background:rgba(255,255,255,.055);
color:#fff;
border-radius:14px;
padding:0 12px
}

.icon.push-on{
background:rgba(53,217,138,.12);
border-color:rgba(53,217,138,.28)
}

/* WELCOME */

.welcome{
margin:4px 2px 14px
}

.welcome h1{
font-size:21px;
margin:0 0 6px;
letter-spacing:-.4px
}

.welcome p{
margin:0;
color:var(--muted);
font-size:12px
}

/* SEARCH */

.search{
display:flex;
gap:9px;
position:relative;
margin-bottom:14px
}

.search-box{
flex:1;
position:relative
}

.search input{
width:100%;
height:52px;
border:1px solid var(--line);
background:rgba(17,31,51,.88);
color:#fff;
border-radius:17px;
padding:0 15px 0 43px;
font-size:15px;
outline:none
}

.search-box:before{
content:"⌕";
position:absolute;
left:16px;
top:50%;
transform:translateY(-53%);
font-size:23px;
color:#6f819c;
z-index:2
}

.primary{
height:52px;
border:0;
color:#fff;
border-radius:17px;
padding:0 19px;
font-weight:850;
background:linear-gradient(135deg,#397cff,#7166ff)
}

/* SEARCH SUGGESTIONS */

.suggestions{
position:absolute;
left:0;
right:0;
top:calc(100% + 8px);
z-index:100;
background:#0c192b;
border:1px solid var(--line);
border-radius:18px;
box-shadow:0 22px 55px #0008;
overflow:auto;
max-height:390px
}

.suggestion{
display:flex;
justify-content:space-between;
align-items:center;
width:100%;
border:0;
border-bottom:1px solid var(--line);
background:transparent;
padding:14px 15px;
text-align:left;
color:#fff
}

.suggestion-main{
font-weight:850
}

.suggestion-code,
.suggestion-market{
font-size:11px;
color:#7f90a8
}

.suggestion-code{
margin-top:4px
}

.history-head{
display:flex;
justify-content:space-between;
padding:12px 15px 9px;
border-bottom:1px solid var(--line)
}

.history-title{
font-size:11px;
font-weight:850;
color:#788aa4
}

.history-clear{
border:0;
background:transparent;
color:#72a5ff;
font-size:11px
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:4px 0 14px
}

.summary-box{
padding:13px 8px;
border:1px solid var(--line);
border-radius:16px;
background:rgba(255,255,255,.035);
text-align:center
}

.summary-box strong{
display:block;
font-size:20px
}

.summary-box span{
font-size:10px;
color:var(--muted)
}

/* TABS */

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
margin:0 0 15px;
padding:5px;
border:1px solid var(--line);
border-radius:17px;
background:rgba(255,255,255,.035)
}

.tab{
height:39px;
border:0;
background:transparent;
border-radius:12px;
font-size:13px;
font-weight:800;
color:#7d8da5
}

.tab.on{
color:#fff;
background:linear-gradient(135deg,#457cff,#6f5bf5)
}

/* GENERAL */

.card,
.empty{
background:
linear-gradient(
145deg,
rgba(19,35,58,.94),
rgba(12,25,43,.94)
);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.empty{
padding:22px;
color:#8392a8;
font-size:13px;
line-height:1.65
}

.empty-action{
margin-top:14px;
border:0;
border-radius:12px;
background:#ffffff0b;
color:#8eb8ff;
padding:10px 13px;
font-weight:800
}

.hidden{
display:none!important
}

.muted{
color:var(--muted)
}

.note{
font-size:10px;
line-height:1.65;
color:#64758e;
margin-top:20px
}

.loader{
padding:30px;
text-align:center;
color:#7f90a8
}

/* STOCK CARDS */

.stock-card{
padding:17px;
margin-bottom:10px;
cursor:pointer
}

.stock-card:active{
transform:scale(.985)
}

.row{
display:flex;
justify-content:space-between;
gap:12px;
align-items:flex-start
}

.symbol{
font-size:18px;
font-weight:950
}

.name{
font-size:12px;
color:#8191a8;
margin-top:4px
}

.price{
text-align:right;
font-size:21px;
font-weight:950
}

.change{
font-size:12px;
font-weight:850;
margin-top:4px
}

.up{
color:var(--red)
}

.down{
color:var(--green)
}

.status{
display:inline-flex;
border-radius:999px;
padding:6px 10px;
font-size:11px;
font-weight:850;
margin-top:11px;
border:1px solid transparent
}

.green{
background:#35d98a18;
color:#55e49c
}

.blue{
background:#4d8dff1c;
color:#7cacff
}

.yellow{
background:#ffc85c1a;
color:#ffd06d
}

.gray{
background:#ffffff0e;
color:#9aa6b8
}

.radar-reason{
margin-top:10px;
font-size:11px;
color:#a4b3c8
}

.radar-score-row{
display:flex;
align-items:center;
gap:9px;
margin-top:10px
}

.mini-bar{
height:4px;
flex:1;
border-radius:99px;
background:#ffffff10;
overflow:hidden
}

.mini-bar i{
display:block;
height:100%;
background:linear-gradient(90deg,#3f8cff,#7869ff)
}

.score-number{
font-size:11px;
color:#9cacbf;
font-weight:850
}

/* DETAIL TOP */

.detail-topbar{
position:sticky;
top:calc(env(safe-area-inset-top) + 6px);
z-index:50;
display:flex;
justify-content:space-between;
gap:8px;
margin-bottom:10px
}

.detail-topbar .icon{
background:#0d1b30ef
}

.top-fav.active{
color:#ffd76b
}

/* HERO */

.hero{
padding:21px;
background:
radial-gradient(circle at 100% 0%,rgba(99,93,255,.22),transparent 42%),
linear-gradient(145deg,#132541,#0d1b30)
}

.hero-top{
display:flex;
justify-content:space-between;
gap:12px
}

.hero-code{
font-size:12px;
color:#7fa8e8;
font-weight:800
}

.hero-name{
font-size:21px;
font-weight:950;
margin-top:4px
}

.hero-price{
font-size:42px;
font-weight:950;
letter-spacing:-1px;
margin-top:20px
}

.hero-change{
font-size:14px;
font-weight:900;
margin-top:7px
}

.live{
font-size:10px;
color:#788aa3;
margin-top:13px
}

.pulse{
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
background:#37db8a;
margin-right:6px
}

/* QUICK NAV */

.quicknav{
position:sticky;
top:calc(env(safe-area-inset-top) + 58px);
z-index:40;
display:flex;
gap:7px;
overflow:auto;
margin:12px 0;
padding:6px;
background:#091728ee;
border:1px solid var(--line);
border-radius:15px
}

.quicknav button{
flex:0 0 auto;
border:0;
border-radius:10px;
background:#ffffff09;
color:#9dadc2;
padding:9px 11px;
font-size:11px;
font-weight:800
}

/* STRATEGY */

.strategy{
padding:18px;
margin-top:12px
}

.strategy-head{
display:flex;
justify-content:space-between
}

.strategy-title{
font-size:21px;
font-weight:950
}

.bigscore{
font-size:34px;
font-weight:950;
background:linear-gradient(135deg,#73a8ff,#9b86ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.bigscore-label{
font-size:9px;
color:#6f819a
}

/* CONCLUSION */

.conclusion{
margin-top:14px;
padding:16px;
border-radius:18px;
background:
linear-gradient(
135deg,
#4d8dff12,
#806cff12
);
border:1px solid #6b8dff2b
}

.conclusion-title{
font-size:12px;
color:#91b5ff;
font-weight:900
}

.conclusion-text{
font-size:15px;
line-height:1.65;
font-weight:800;
margin-top:8px
}

.conclusion-tags{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:12px
}

.conclusion-tags span{
font-size:10px;
padding:6px 8px;
border-radius:999px;
background:#ffffff0c;
color:#b5c3d6
}

/* SECTIONS */

.section-title{
display:flex;
align-items:center;
gap:7px;
font-size:16px;
font-weight:900;
margin-top:24px;
margin-bottom:10px
}

.section-title:before{
content:"";
width:3px;
height:15px;
border-radius:99px;
background:
linear-gradient(
#4b91ff,
#806cff
)
}

/* SCORES */

.score-grid,
.levels,
.chip-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.score-box,
.level,
.chip-item{
padding:14px;
border-radius:16px;
background:#ffffff08;
border:1px solid var(--line)
}

.score-box:last-child:nth-child(odd),
.level.full{
grid-column:1/-1
}

.score-box-head{
display:flex;
justify-content:space-between
}

.score-box span,
.level span,
.chip-item span{
display:block;
font-size:10px;
color:#8796ab
}

.score-progress{
height:5px;
background:#ffffff0e;
border-radius:99px;
overflow:hidden;
margin-top:10px
}

.score-progress i{
display:block;
height:100%;
background:
linear-gradient(
90deg,
#438fff,
#796cff
)
}

.score-box small,
.level small{
display:block;
font-size:10px;
color:#708098;
line-height:1.5;
margin-top:7px
}

.level strong{
display:block;
font-size:18px;
margin-top:5px
}

.entry strong{
color:#80b0ff
}

.sl strong{
color:#ff8390
}

.tp strong{
color:#62e7a4
}

.support strong{
color:#62dbc4
}

.pressure strong{
color:#ffc277
}

/* CHIP */

.chip{
margin-top:12px;
padding:16px;
border:1px solid var(--line);
border-radius:18px;
background:#ffffff06
}

.chip-grid{
margin-top:12px
}

.chip-item strong{
display:block;
font-size:15px;
margin-top:4px
}

/* CONDITIONS */

.conditions{
margin-top:12px;
border-top:1px solid var(--line)
}

.cond{
padding:12px 1px;
border-bottom:1px solid var(--line);
font-size:13px;
font-weight:750
}

.ok{
color:#52dc98
}

.no{
color:#ff7d89
}

.cond small{
display:block;
color:#708098;
margin:5px 0 0 20px
}

/* NEWS */

.news-item{
padding:12px 0;
border-bottom:1px solid var(--line)
}

.news-title{
font-size:13px;
font-weight:800
}

.news-meta{
font-size:10px;
color:#6f8098;
margin-top:5px
}

/* QUICK LOADING */

.quick-loading{
margin-top:12px;
font-size:11px;
color:#6f8098
}

/* BOTTOM NAV */

.bottom-nav,
.detail-dock{
position:fixed;
z-index:80;
left:50%;
transform:translateX(-50%);
bottom:max(10px,env(safe-area-inset-bottom));
width:min(calc(100% - 24px),736px);
display:grid;
gap:7px;
padding:7px;
border:1px solid #ffffff12;
border-radius:20px;
background:#0a1728ee;
box-shadow:0 15px 45px #0008;
-webkit-backdrop-filter:blur(18px);
backdrop-filter:blur(18px)
}

.bottom-nav{
grid-template-columns:repeat(3,1fr)
}

.bottom-nav button,
.detail-dock button{
height:48px;
border:0;
border-radius:14px;
background:transparent;
color:#8191a8;
font-weight:850;
font-size:12px
}

.bottom-nav button.on{
background:#ffffff0b;
color:#fff
}

.detail-dock{
grid-template-columns:1fr 1.4fr
}

.detail-dock .dock-back{
background:#ffffff0a;
color:#dce7f6
}

.detail-dock .dock-fav{
background:
linear-gradient(
135deg,
#397cff,
#7166ff
);
color:#fff
}

.detail-dock .dock-fav.active{
background:
linear-gradient(
135deg,
#b78b2d,
#e2b746
)
}

@media(max-width:380px){

.app{
padding-left:13px;
padding-right:13px
}

.hero-price{
font-size:38px
}

.score-grid,
.levels,
.chip-grid{
gap:7px
}

}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="brand">
波段分析
<small>TW SWING ANALYTICS</small>
</div>

<button
id="notify"
class="icon"
aria-label="通知"
>
🔔
</button>

</header>

<main id="home">

<div class="welcome">

</h1>

<input
id="q"

>

分析
</button>

<div class="summary-box">

class="tab on"
data-tab="signal"
>

</button>

<button
class="tab"
data-tab="near"
>

</button>

<button
class="tab"
data-tab="watch"
>
我的自選
</button>

</div>

<div id="homeList">

<div class="card loader">
正在載入全市場雷達
</div>

</div>

<div class="note">
Radar 負責全市場快速篩選；點進個股後，再使用完整技術、量價、法人、基本面、新聞與交易規劃分析。

id="detail"

>

</div>

>

<script>
const WATCH_KEY='swing_tw_watch_v1';
const HISTORY_KEY='swing_tw_search_history_v1';
const PUSH_DEVICE_KEY='swing_tw_push_device_v1';

const DEFAULT=[
'2330','2317','2454','2308','2382','3231',
'2881','2882','2891','2886','2603','2615'
];

const HIGH_SCORE_LIMIT=20;
const WATCH_RADAR_LIMIT=50;
const DETAIL_CACHE_MS=90000;

let tab='signal';
let cache={};
let detailCache={};

let unified={
strategyReady:[],
radar:[],
longWatch:[],
generatedAt:0,
updatedAt:'',
cache:''
};

let current='';
let currentDetail=null;
let detailTimer=null;
let radarTimer=null;
let searchTimer=null;
let selectedSearchSymbol='';

const tabScroll={
signal:0,
near:0,
watch:0
};

let homeScrollY=0;

let touchStartX=0;
let touchStartY=0;
let touchTracking=false;

const $=id=>document.getElementById(id);

const esc=s=>
String(s??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');

const fmt=(n,d=2)=>
Number.isFinite(+n)
?
(+n).toLocaleString(
'zh-TW',
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
:
'--';

const avg=a=>
a.length
?
a.reduce((x,y)=>x+y,0)/a.length
:
0;

const sma=(a,n)=>
a.length>=n
?
avg(a.slice(-n))
:
avg(a);

function ema(a,n){

if(!a.length)return 0;

let e=a[0];

const k=2/(n+1);

for(let i=1;i<a.length;i++){

e=
a[i]*k+
e*(1-k);

}

return e;
}

function rsi(a,n=14){

if(a.length<=n)return 50;

let g=0;
let l=0;

for(
let i=a.length-n;
i<a.length;
i++
){

const d=
a[i]-
a[i-1];

if(d>0){
g+=d;
}else{
l-=d;
}

}

if(l===0)return 100;

return 100-
100/
(
1+
(g/n)/(l/n)
);

}

function atr(rows,n=14){

const v=[];

for(
let i=Math.max(1,rows.length-n);
i<rows.length;
i++
){

const x=
rows[i];

const p=
rows[i-1].close;

v.push(
Math.max(
x.high-x.low,
Math.abs(x.high-p),
Math.abs(x.low-p)
)
);

}

return avg(v);
}

function clamp(v,min,max){

return Math.min(
max,
Math.max(min,v)
);

}

/* DEVICE */

function getDeviceId(){

let id=
localStorage.getItem(
PUSH_DEVICE_KEY
);

if(!id){

id=
window.crypto&&
crypto.randomUUID
?
crypto.randomUUID()
:
'device-'+
Date.now()+
'-'+
Math.random()
.toString(36)
.slice(2);

localStorage.setItem(
PUSH_DEVICE_KEY,
id
);

}

return id;
}

/* WATCH */

function watch(){

try{

const x=
JSON.parse(
localStorage.getItem(
WATCH_KEY
)||
'[]'
);

return Array.isArray(x)
?
[
...new Set(
x
.map(String)
.filter(
v=>
/^\d{4,6}$/
.test(v)
)
)
]
:
[];

}catch{

return [];

}

}

function saveWatchLocal(a){

const clean=[
...new Set(
(a||[])
.map(String)
.filter(
v=>
/^\d{4,6}$/
.test(v)
)
)
];

localStorage.setItem(
WATCH_KEY,
JSON.stringify(clean)
);

return clean;
}

/* PIVOTS */

function pivots(
rows,
left=3,
right=3
){

const lows=[];
const highs=[];

for(
let i=left;
i<rows.length-right;
i++
){

let lo=true;
let hi=true;

for(
let j=1;
j<=left;
j++
){

if(
rows[i].low>
rows[i-j].low
){
lo=false;
}

if(
rows[i].high<
rows[i-j].high
){
hi=false;
}

}

for(
let j=1;
j<=right;
j++
){

if(
rows[i].low>
rows[i+j].low
){
lo=false;
}

if(
rows[i].high<
rows[i+j].high
){
hi=false;
}

}

if(lo){

lows.push({
i,
value:
rows[i].low
});

}

if(hi){

highs.push({
i,
value:
rows[i].high
});

}

}

return {
lows,
highs
};

}

function clusterLevels(
items,
distance
){

const sorted=
items
.filter(
x=>
Number.isFinite(
+x.value
)&&
+x.value>0
)
.sort(
(a,b)=>
a.value-
b.value
);

const groups=[];

for(
const item of sorted
){

const last=
groups[
groups.length-1
];

if(
last&&
Math.abs(
item.value-
last.value
)<=distance
){

last.values.push(
item.value
);

last.value=
avg(
last.values
);

last.count++;

last.latest=
Math.max(
last.latest,
item.i||0
);

}else{

groups.push({
value:
item.value,

values:[
item.value
],

count:1,

latest:
item.i||0
});

}

}

return groups;
}

/* TRADE PLAN */

function buildTradePlan(
rows,
price,
A,
m20,
m60
){

const recent=
rows.slice(-240);

const P=
pivots(
recent,
3,
3
);

const mergeDistance=
Math.max(
A*.45,
price*.005
);

const supportRaw=[];

for(
const x of P.lows
){

if(
x.value<=price*1.012&&
x.value>=price*.82
){

supportRaw.push({
value:x.value,
i:x.i
});

}

}

if(
Number.isFinite(m20)&&
m20<=price*1.012&&
m20>=price*.82
){

supportRaw.push({
value:m20,
i:recent.length+5
});

}

if(
Number.isFinite(m60)&&
m60<=price*1.012&&
m60>=price*.82
){

supportRaw.push({
value:m60,
i:recent.length+4
});

}

for(
const n of [10,20,60]
){

const part=
rows.slice(-n);

if(
!part.length
){
continue;
}

const low=
Math.min(
...part.map(
x=>x.low
)
);

if(
low<=price*1.012&&
low>=price*.82
){

supportRaw.push({
value:low,
i:recent.length+n
});

}

}

for(
const x of P.highs
){

if(
x.value>=price*.88&&
x.value<price
){

const after=
recent.slice(
x.i+1
);

const broken=
after.some(
r=>
r.close>
x.value*1.004
);

if(broken){

supportRaw.push({
value:x.value,
i:x.i
});

}

}

}

const supportGroups=
clusterLevels(
supportRaw,
mergeDistance
)
.filter(
x=>
x.value<=price*1.012&&
x.value>=price*.82
)
.sort(
(a,b)=>
b.value-a.value
);

const support1=
supportGroups[0]
?
supportGroups[0].value
:
null;

const support2=
support1
?
supportGroups.find(
x=>
x.value<
support1-
mergeDistance*.75
)?.value||
null
:
null;

const MAX_ENTRY_DISTANCE=.045;

const nearbySupports=
supportGroups.filter(x=>{

const distance=
(
price-
x.value
)/
price;

return (
distance>=-.012&&
distance<=
MAX_ENTRY_DISTANCE
);

});

let bestSupport=null;
let bestSupportScore=
-Infinity;

for(
const x of nearbySupports
){

const distance=
Math.max(
0,
(
price-
x.value
)/
price
);

const distanceScore=
Math.max(
0,
1-
distance/
MAX_ENTRY_DISTANCE
)*45;

const clusterScore=
Math.min(
x.count,
4
)*10;

const recentScore=
recent.length
?
(
x.latest/
recent.length
)*15
:
0;

const score=
distanceScore+
clusterScore+
recentScore;

if(
score>
bestSupportScore
){

bestSupportScore=
score;

bestSupport=
x;

}

}

/* PRESSURE */

const pressureRaw=[];

for(
const x of P.highs
){

if(
x.value>=price*.90&&
x.value<=price*1.35
){

pressureRaw.push({
value:x.value,
i:x.i
});

}

}

for(
let end=20;
end<=recent.length;
end+=10
){

const block=
recent.slice(
Math.max(
0,
end-20
),
end
);

if(
!block.length
){
continue;
}

const high=
Math.max(
...block.map(
x=>x.high
)
);

if(
high>=price*.90&&
high<=price*1.35
){

pressureRaw.push({
value:high,
i:end
});

}

}

const allPressureGroups=
clusterLevels(
pressureRaw,
mergeDistance
)
.filter(
x=>
x.value>=price*.90&&
x.value<=price*1.35
)
.sort(
(a,b)=>
a.value-
b.value
);

const abovePressures=
allPressureGroups
.filter(
x=>
x.value>
price+
mergeDistance*.15
);

const recentlyCrossed=
allPressureGroups
.filter(
x=>
x.value<=price&&
x.value>=price*.98
)
.sort(
(a,b)=>
b.value-
a.value
);

const nextResistance=
abovePressures[0]
?
abovePressures[0].value
:
null;

const crossedResistance=
recentlyCrossed[0]
?
recentlyCrossed[0].value
:
null;

let breakout=
nextResistance;

let breakoutState=
'BELOW';

if(
crossedResistance
){

const crossedDistance=
(
price-
crossedResistance
)/
price;

if(
crossedDistance<=.02
){

breakout=
crossedResistance;

breakoutState=
'BROKEN';

}

}

/* ENTRY */

let planType=
'WAIT';

let entryLow=null;
let entryHigh=null;
let entryMid=null;
let sl=null;
let entryReady=false;

if(
bestSupport
){

planType=
'LIMIT';

const base=
bestSupport.value;

entryLow=
base-
Math.max(
A*.18,
price*.002
);

entryHigh=
base+
Math.max(
A*.30,
price*.0035
);

entryHigh=
Math.min(
entryHigh,
price*1.006
);

entryMid=
(
entryLow+
entryHigh
)/2;

const lowerStructures=[
...P.lows.map(
x=>x.value
),
...supportGroups.map(
x=>x.value
)
]
.filter(
v=>
v<
base-
mergeDistance*.20&&
v>=base*.90
)
.sort(
(a,b)=>
b-a
);

const invalidation=
lowerStructures[0]
||
support2
||
(
base-
A*.80
);

sl=
invalidation-
Math.max(
A*.25,
price*.003
);

if(
sl>=entryLow
){

sl=
entryLow-
Math.max(
A*.45,
price*.005
);

}

const readyTolerance=
Math.max(
A*.25,
price*.0035
);

entryReady=
price>=
entryLow-
readyTolerance&&
price<=
entryHigh+
readyTolerance;

}

/* TP */

let tp1=null;
let tp2=null;
let tp3=null;
let tp3Source='';

if(
Number.isFinite(
entryMid
)&&
breakout
){

const targetPressures=
allPressureGroups
.map(
x=>x.value
)
.filter(
v=>
v>
breakout+
mergeDistance*.55
)
.sort(
(a,b)=>
a-b
);

const cleanTargets=[];

for(
const v of targetPressures
){

const last=
cleanTargets[
cleanTargets.length-1
];

if(
!last||
v-last>
mergeDistance*.75
){

cleanTargets.push(v);

}

}

tp1=
cleanTargets[0]
||
null;

tp2=
tp1
?
cleanTargets.find(
v=>
v>
tp1+
mergeDistance
)||
null
:
null;

tp3=
tp2
?
cleanTargets.find(
v=>
v>
tp2+
mergeDistance
)||
null
:
null;

if(tp3){

tp3Source=
'第三層歷史壓力';

}

if(
!tp3&&
tp1&&
tp2
){

const extensionBase=
support2||
support1||
entryMid;

tp3=
tp2+
Math.max(
tp2-
extensionBase,
A*3
)*.618;

tp3Source=
'歷史壓力不足，Fib 0.618 延伸';

}

}

/* RISK */

const risk=
Number.isFinite(
entryMid
)&&
Number.isFinite(
sl
)&&
entryMid>sl
?
entryMid-sl
:
null;

const riskPct=
risk
?
risk/
entryMid*
100
:
null;

function rr(target){

if(
!Number.isFinite(target)||
!risk||
risk<=0
){

return null;

}

return (
target-
entryMid
)/
risk;

}

const rr1=
rr(tp1);

const rr2=
rr(tp2);

const rr3=
rr(tp3);

const entryDistance=
bestSupport
?
(
price-
bestSupport.value
)/
price*
100
:
null;

const breakoutDistance=
breakout
?
(
breakout-
price
)/
price*
100
:
null;

const validPlan=
planType==='LIMIT'&&
Number.isFinite(entryLow)&&
Number.isFinite(entryHigh)&&
Number.isFinite(sl)&&
sl<entryLow&&
Number.isFinite(breakout)&&
Number.isFinite(tp1)&&
tp1>breakout;

return {
support1,
support2,

bestSupport:
bestSupport
?
bestSupport.value
:
null,

bestSupportStrength:
bestSupport
?
bestSupport.count
:
0,

breakout,
breakoutState,
nextResistance,
crossedResistance,
planType,
entryLow,
entryHigh,
entryMid,
sl,
risk,
riskPct,
tp1,
tp2,
tp3,
tp3Source,
rr1,
rr2,
rr3,
entryReady,
validPlan,

pressureCount:
allPressureGroups.length,

entryDistance,
breakoutDistance
};

}

/* FIVE CATEGORY ANALYSIS */

function analyzeData(
d,
newsData=null
){

if(
!Array.isArray(d.rows)||
d.rows.length<60
){

throw Error(
'歷史資料不足，無法分析'
);

}

const rows=
d.rows
.map(x=>({
date:x.date||'',
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0
}))
.filter(
x=>
Number.isFinite(
x.close
)&&
x.close>0
);

if(
rows.length<60
){

throw Error(
'有效 K 線不足'
);

}

const closes=
rows.map(
x=>x.close
);

let price=
+d.price;

if(
!Number.isFinite(price)||
price<=0
){

price=
rows.at(-1).close;

}

const m20=
sma(
closes,
20
);

const m60=
sma(
closes,
60
);

const m120=
sma(
closes,
120
);

const A=
Math.max(
atr(rows),
price*.006
);

const R=
rsi(closes);

const macd=
ema(
closes.slice(-120),
12
)
-
ema(
closes.slice(-120),
26
);

const signal=
ema(
closes
.slice(-120)
.map(
(_,i,a)=>
ema(
a.slice(
0,
i+1
),
12
)
-
ema(
a.slice(
0,
i+1
),
26
)
),
9
);

const volume=
rows.at(-1).volume;

const volumeAverage=
avg(
rows
.slice(
-21,
-1
)
.map(
x=>x.volume
)
);

const vr=
volumeAverage
?
volume/
volumeAverage
:
0;

const high20=
Math.max(
...rows
.slice(-20)
.map(
x=>x.high
)
);

let technical=0;
let volumeScore=0;
let chipScore=0;
let fundScore=null;
let newsScore=null;

const conditions=[];

function techCondition(
name,
ok,
points,
description
){

if(ok){

technical+=
points;

}

conditions.push([
name,
ok,
description
]);

}

techCondition(
'股價站上 MA20',
price>=m20,
4,
'短線趨勢維持在 20 日均線上方'
);

techCondition(
'MA20 高於 MA60',
m20>m60,
5,
'中期均線維持多頭排列'
);

techCondition(
'MA60 趨勢健康',
m60>=m120*.985,
3,
'中長期趨勢沒有明顯轉弱'
);

techCondition(
'RSI 位於健康區',
R>=45&&
R<=75,
3,
'動能足夠且尚未極端過熱'
);

techCondition(
'MACD 動能偏多',
macd>=signal,
3,
'短線動能高於訊號線'
);

techCondition(
'股價位於近期相對強勢區',
price>=high20*.96,
2,
'價格接近近期高點，波段結構仍有強度'
);

technical=
clamp(
technical,
0,
20
);

/* VOLUME */

if(
vr>=1
){

volumeScore+=6;

}else if(
vr>=.8
){

volumeScore+=4;

}else if(
vr>=.6
){

volumeScore+=2;

}

const changePercent=
+d.changePercent||
0;

if(
changePercent>0&&
vr>=1
){

volumeScore+=5;

}else if(
changePercent>=0
){

volumeScore+=3;

}

let upVolumeDays=0;

const last10=
rows.slice(-10);

for(
let i=1;
i<last10.length;
i++
){

if(
last10[i].close>
last10[i-1].close&&
last10[i].volume>=
volumeAverage*.8
){

upVolumeDays++;

}

}

volumeScore+=
clamp(
upVolumeDays,
0,
5
);

if(
price>=high20*.98&&
vr>=1.1
){

volumeScore+=4;

}

volumeScore=
clamp(
volumeScore,
0,
20
);

/* INSTITUTION */

const inst=
d.institutional||
{};

if(
+inst.total5>0
){

chipScore+=5;

}

if(
+inst.foreign5>0
){

chipScore+=4;

}

if(
+inst.trust5>0
){

chipScore+=4;

}

if(
+inst.total10>0
){

chipScore+=3;

}

if(
(+inst.totalBuyDays5||0)>=3
){

chipScore+=2;

}

if(
(+inst.foreignBuyDays5||0)>=3
){

chipScore+=2;

}

chipScore=
clamp(
chipScore,
0,
20
);

/* FUNDAMENTAL */

const fundamental=
d.fundamental||
{};

const revenue=
fundamental.revenue||
{};

const financial=
fundamental.financial||
{};

const fundAvailable=
!!(
revenue.available||
financial.available
);

if(
fundAvailable
){

fundScore=0;

if(
financial.profitable===
true
){

fundScore+=6;

}else if(
financial.profitable===
undefined||
financial.profitable===
null
){

fundScore+=3;

}

if(
Number.isFinite(
+financial.eps
)&&
+financial.eps>0
){

fundScore+=4;

}

if(
Number.isFinite(
+financial.epsGrowth
)&&
+financial.epsGrowth>0
){

fundScore+=3;

}

if(
Number.isFinite(
+revenue.yoy
)
){

if(
+revenue.yoy>10
){

fundScore+=4;

}else if(
+revenue.yoy>0
){

fundScore+=3;

}

}

if(
Number.isFinite(
+revenue.mom
)&&
+revenue.mom>0
){

fundScore+=3;

}

fundScore=
clamp(
fundScore,
0,
20
);

}

/* NEWS */

if(
newsData?.available
){

newsScore=
clamp(
Math.round(
10+
Number(
newsData.overallScore||
0
)
),
0,
20
);

}

/* TOTAL */

const availableScores=[
technical,
volumeScore,
chipScore,
fundScore,
newsScore
]

/* RADAR LIST */

function sortRadarList(list){

return [
...(list||[])
]
.sort(
(a,b)=>

Number(
b.fastScore??
b.score??
0
)
-
Number(
a.fastScore??
a.score??
0
)

||

Number(
b.tradingValue||
0
)
-
Number(
a.tradingValue||
0
)

||

Number(
b.radarRank||
0
)
-
Number(
a.radarRank||
0
)

||

String(
a.symbol
)
.localeCompare(
String(
b.symbol
)
)

);

}

function uniqueRadarList(list){

const seen=
new Set();

return (
list||
[]
)
.filter(x=>{

const symbol=
String(
x?.symbol||
''
);

if(
!symbol||
seen.has(symbol)
){

return false;

}

seen.add(
symbol
);

return true;

});

}

function getLists(){

const high=
uniqueRadarList(
sortRadarList(
unified.strategyReady
)
)
.slice(
0,
HIGH_SCORE_LIMIT
);

const highSymbols=
new Set(
high.map(
x=>
String(
x.symbol
)
)
);

let near=
uniqueRadarList(
sortRadarList(
unified.longWatch
)
)
.filter(
x=>
!highSymbols.has(
String(
x.symbol
)
)
);

if(
!near.length
){

near=
uniqueRadarList(
sortRadarList(
unified.strategyReady
)
)
.filter(
x=>
!highSymbols.has(
String(
x.symbol
)
)
);

}

if(
!near.length
){

near=
uniqueRadarList(
sortRadarList(
unified.radar
)
)
.filter(
x=>
!highSymbols.has(
String(
x.symbol
)
)
);

}

return {
high,

near:
near.slice(
0,
WATCH_RADAR_LIMIT
)
};

}

a.entryDistance!==null&&
a.entryDistance>3
){

text=
`${trend}、${volume}，但現價距最佳 Entry 仍有一段距離，不建議追價，等待回踩 ${fmt(a.entryLow)}～${fmt(a.entryHigh)} 再觀察。`;

}else{

text=
`${trend}、${volume}，目前可持續追蹤；等待價格靠近 ${fmt(a.entryLow)}～${fmt(a.entryHigh)} 的最佳進場區。`;

}

return {

tags:[
trend,
volume,
chip,
a.entryReady
?
'接近 Entry'

'等待位置'
]

};

}

function pushSymbols(){

return [

function urlBase64ToUint8Array(
base64String
){

const padding=
'='.repeat(
(
4-
base64String.length%4
)%4
);

const base64=
(
base64String+
padding
)
.replace(
/-/g,
'+'
)
.replace(
/_/g,
'/'
);

const rawData=
window.atob(
base64
);

const outputArray=
new Uint8Array(
rawData.length
);

for(
let i=0;
i<rawData.length;
++i
){

outputArray[i]=
rawData.charCodeAt(i);

}

return outputArray;

}

async function savePushSubscription(
subscription
){

const r=
await fetch(
'/api/push-subscribe',
{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:
JSON.stringify({

deviceId:
getDeviceId(),

subscription:
subscription.toJSON(),

symbols:
pushSymbols()

})
}
);

const d=
await r.json();

if(
!r.ok||
!d.ok
){

throw Error(
d.error||
'Push 訂閱儲存失敗'
);

}

}

async function syncPushSymbols(){

try{

if(
!('serviceWorker' in navigator)
){

return;

}

const registration=
await navigator
.serviceWorker
.getRegistration('/');

if(
!registration
){

return;

}

const subscription=
await registration
.pushManager
.getSubscription();

if(
!subscription
){

return;

}

await savePushSubscription(
subscription
);

}catch(e){

console.warn(
'Push 股票同步失敗',
e
);

}

}

async function enablePush(){

if(
!('Notification' in window)
){

throw Error(
'此瀏覽器不支援通知'
);

}

if(
!('PushManager' in window)
){

throw Error(
'此瀏覽器不支援背景 Push'
);

}

const permission=
await Notification
.requestPermission();

if(
permission!=='granted'
){

throw Error(
'通知權限沒有開啟'
);

}

const registration=
await navigator
.serviceWorker
.register(
'/sw.js',
{
scope:'/',
updateViaCache:'none'
}
);

try{

await registration.update();

}catch(e){

console.warn(
'Service Worker 更新檢查失敗',
e
);

}

await navigator
.serviceWorker
.ready;

const configResponse=
await fetch(
'/api/push-config?t='+
Date.now(),
{
cache:'no-store'
}
);

const config=
await configResponse
.json();

if(
!configResponse.ok||
!config.ok||
!config.publicKey
){

throw Error(
config.error||
'Push 公鑰取得失敗'
);

}

const oldSubscription=
await registration
.pushManager
.getSubscription();

if(
oldSubscription
){

try{

await oldSubscription
.unsubscribe();

}catch(e){

console.warn(
'取消舊 Push 失敗',
e
);

}

}

const subscription=
await registration
.pushManager
.subscribe({

userVisibleOnly:true,

applicationServerKey:
urlBase64ToUint8Array(
config.publicKey
)

});

await savePushSubscription(
subscription
);

$('notify')
.classList
.add(
'push-on'
);

}
