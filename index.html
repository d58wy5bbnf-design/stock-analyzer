<!-- 你這份程式主要要修正的是「策略追蹤的 TP / SL 會先跟著現價移動，
     導致價格明明碰到原本 TP，TP 卻先被往上調，永遠追不到」的問題。

     你不用動其他地方，只把原本的：
     function updateStrategyTracking(d,m,setups){ ... }

     整段覆蓋成下面這一段即可。 -->

<script>
function updateStrategyTracking(d,m,setups){
if(!d||!d.symbol||!m||!setups)return;

var symbol=String(d.symbol).toUpperCase();
var all=getStrategyTracks();
var list=Array.isArray(all[symbol])?all[symbol]:[];

if(!list.length)return;

var changed=false;
var price=Number(m.price)||0;

list.forEach(track=>{
if(!track||track.closedAt)return;

var old=track.currentLevels||track.originalLevels||{};

if(
!Number.isFinite(Number(old.entryLow))||
!Number.isFinite(Number(old.entryHigh))||
!Number.isFinite(Number(old.sl1))||
!Number.isFinite(Number(old.sl2))||
!Number.isFinite(Number(old.tp1))||
!Number.isFinite(Number(old.tp2))||
!Number.isFinite(Number(old.tp3))
)return;

var hit=track.hit||(track.hit={
entry:true,
tp1:false,
tp2:false,
tp3:false,
sl1:false,
sl2:false
});

/*
====================================================
① 先用「上一版策略價位」判斷有沒有碰到 TP / SL
====================================================

這裡非常重要。

不能先重新計算 TP，
不然股價漲到 TP1 時，
TP1 也可能跟著股價一起往上跑，
最後就會變成永遠碰不到 TP。
*/

function hitEvent(key,label,level,type){
if(hit[key])return;

hit[key]=true;

addTrackEvent(
track,
type,
price,
label+"｜現價 "+fmt(price)+"｜原策略目標 "+fmt(level)
);

sendSystemNotification(
"幽冥分析｜"+symbol+" "+label,
(track.name||"")+"｜現價 "+fmt(price)+"｜"+label+" "+fmt(level),
symbol,
"track-"+track.id+"-"+key
);

changed=true
}

/* 停損優先 */
if(price<=Number(old.sl2)){

if(!hit.sl1){
hitEvent("sl1","觸及 SL1",old.sl1,"SL")
}

if(!hit.sl2){
hitEvent("sl2","觸及 SL2",old.sl2,"SL")
}

track.status="SL2";
track.closedAt=Date.now();
changed=true;
return

}else if(price<=Number(old.sl1)){

if(!hit.sl1){
hitEvent("sl1","觸及 SL1",old.sl1,"SL")
}

track.status="SL1";
changed=true

}else{

/*
TP 必須按照原本已存在的目標判斷。

例如：
原本 TP1 = 105
目前價格 = 106

一定要先記錄 TP1 達成，
不能先把 TP1 改成 108。
*/

if(price>=Number(old.tp1)&&!hit.tp1){
hitEvent("tp1","達到 TP1",old.tp1,"TP")
}

if(price>=Number(old.tp2)&&!hit.tp2){

/* 如果直接跳過 TP1 到 TP2，TP1 一起算達成 */
if(!hit.tp1){
hitEvent("tp1","達到 TP1",old.tp1,"TP")
}

hitEvent("tp2","達到 TP2",old.tp2,"TP")
}

if(price>=Number(old.tp3)&&!hit.tp3){

/* 如果直接跳到 TP3，前面的 TP 一起補紀錄 */
if(!hit.tp1){
hitEvent("tp1","達到 TP1",old.tp1,"TP")
}

if(!hit.tp2){
hitEvent("tp2","達到 TP2",old.tp2,"TP")
}

hitEvent("tp3","達到 TP3",old.tp3,"TP");

track.status="TP3";
track.closedAt=Date.now();
changed=true;
return
}
}

/*
====================================================
② TP3 / SL2 已完成，不再修改策略
====================================================
*/

if(track.closedAt)return;


/*
====================================================
③ 再計算最新技術結構
====================================================
*/

var candidate=strategyTargets(track.strategyType,m);

var next={
entryLow:Number(old.entryLow),
entryHigh:Number(old.entryHigh),
sl1:Number(old.sl1),
sl2:Number(old.sl2),
tp1:Number(old.tp1),
tp2:Number(old.tp2),
tp3:Number(old.tp3),
updatedAt:Number(old.updatedAt)||Date.now()
};

var threshold=Math.max(
Number(m.atr||0)*0.35,
Number(m.price||0)*0.004
);


/*
====================================================
④ 進場區可以跟技術結構調整
====================================================
*/

if(
Number.isFinite(candidate.entryLow)&&
Math.abs(candidate.entryLow-next.entryLow)>=threshold
){
next.entryLow=candidate.entryLow
}

if(
Number.isFinite(candidate.entryHigh)&&
Math.abs(candidate.entryHigh-next.entryHigh)>=threshold
){
next.entryHigh=candidate.entryHigh
}


/*
避免出現：
進場下緣 > 進場上緣
*/

if(next.entryLow>next.entryHigh){
var middle=(next.entryLow+next.entryHigh)/2;
next.entryLow=middle-threshold*.25;
next.entryHigh=middle+threshold*.25
}


/*
====================================================
⑤ 停損只准往上收，不准往下放寬
====================================================

例如：

原 SL1 = 95
最新模型算 92

不改。

因為不能股票跌了之後，
系統又把停損偷偷往下移。
*/

if(
Number.isFinite(candidate.stop1)&&
candidate.stop1>next.sl1&&
candidate.stop1<price&&
candidate.stop1<next.entryLow&&
Math.abs(candidate.stop1-next.sl1)>=threshold
){
next.sl1=candidate.stop1
}

if(
Number.isFinite(candidate.stop2)&&
candidate.stop2>next.sl2&&
candidate.stop2<next.sl1&&
Math.abs(candidate.stop2-next.sl2)>=threshold
){
next.sl2=candidate.stop2
}


/*
保證 SL2 一定低於 SL1
*/

if(next.sl2>=next.sl1){
next.sl2=next.sl1-Math.max(
Number(m.atr||0)*.5,
price*.005
)
}


/*
====================================================
⑥ TP 不再追著現價一直跑
====================================================

只有「技術結構真的明顯變強」才允許上修。

而且：

已經碰過的 TP 不再修改。

未碰到的 TP 也不會因為價格下跌而往下改。

這樣才能保留原本交易計畫。
*/

var tpThreshold=Math.max(
Number(m.atr||0)*0.5,
price*.006
);

if(
!hit.tp1&&
Number.isFinite(candidate.tp1)&&
candidate.tp1>next.tp1&&
candidate.tp1-next.tp1>=tpThreshold&&
price<next.tp1
){
next.tp1=candidate.tp1
}

if(
!hit.tp2&&
Number.isFinite(candidate.tp2)&&
candidate.tp2>next.tp2&&
candidate.tp2-next.tp2>=tpThreshold&&
price<next.tp2
){
next.tp2=candidate.tp2
}

if(
!hit.tp3&&
Number.isFinite(candidate.tp3)&&
candidate.tp3>next.tp3&&
candidate.tp3-next.tp3>=tpThreshold&&
price<next.tp3
){
next.tp3=candidate.tp3
}


/*
====================================================
⑦ 保證 TP 順序正常
====================================================
*/

var minimumGap=Math.max(
Number(m.atr||0)*.25,
price*.003
);

if(next.tp2<=next.tp1){
next.tp2=next.tp1+minimumGap
}

if(next.tp3<=next.tp2){
next.tp3=next.tp2+minimumGap
}


/*
====================================================
⑧ 只有真的有變動才更新時間
====================================================
*/

var levelChanged=
next.entryLow!==Number(old.entryLow)||
next.entryHigh!==Number(old.entryHigh)||
next.sl1!==Number(old.sl1)||
next.sl2!==Number(old.sl2)||
next.tp1!==Number(old.tp1)||
next.tp2!==Number(old.tp2)||
next.tp3!==Number(old.tp3);

if(levelChanged){
next.updatedAt=Date.now();
changed=true
}

track.currentLevels=next;


/*
====================================================
⑨ 更新目前狀態
====================================================
*/

if(hit.sl2){
track.status="SL2"
}else if(hit.tp3){
track.status="TP3"
}else if(hit.sl1){
track.status="SL1"
}else if(hit.tp2){
track.status="TP2"
}else if(hit.tp1){
track.status="TP1"
}else{
track.status="TRACKING"
}

});

if(changed){
all[symbol]=list;
saveStrategyTracks(all)
}
}
</script>
