<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幽冥分析</title>
<meta name="theme-color" content="#030504">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="幽冥分析">

<style>
*{box-sizing:border-box}
:root{
--bg:#030504;--card:#0b0e0c;--border:#292e2b;--text:#f6f7f6;
--muted:#8c918e;--green:#45e0ad;--red:#ff6976;--yellow:#ffc85a;
--purple:#bd7cff;--orange:#ff9f43;--blue:#70b7ff
}
html{background:var(--bg);scroll-behavior:smooth}
body{
margin:0;background:radial-gradient(circle at top,rgba(43,111,84,.12),transparent 420px),var(--bg);
color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
-webkit-font-smoothing:antialiased
}
button,input{font:inherit}button{cursor:pointer}
.app{
width:min(100%,760px);margin:auto;
padding:max(18px,calc(env(safe-area-inset-top) + 12px))
max(14px,calc(env(safe-area-inset-right) + 11px))
max(80px,calc(env(safe-area-inset-bottom) + 24px))
max(14px,calc(env(safe-area-inset-left) + 11px))
}
.header,.section-head,.back-row,.hero-top,.stock-top,.recommend-top,.backtest-head{
display:flex;justify-content:space-between;align-items:center;gap:12px
}
.logo{font-size:24px;font-weight:950;letter-spacing:-1px}
.logo small{display:block;font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.4px;margin-top:3px}
.notify-btn,.refresh-btn,.more-btn,.favorite-btn,.position-save-btn,.return-recommend-btn{
border:1px solid var(--border);background:#101411;color:#e7eae8;
border-radius:12px;padding:10px 12px;font-size:13px;font-weight:850
}
.refresh-btn:active,.more-btn:active,.notify-btn:active,.favorite-btn:active,.position-save-btn:active,.return-recommend-btn:active{transform:scale(.98)}
.refresh-btn:disabled{opacity:.6;cursor:not-allowed}
.market-tabs{display:flex;gap:7px;background:#080b09;border:1px solid var(--border);padding:5px;border-radius:14px;margin-bottom:14px}
.market-tab{flex:1;border:0;background:transparent;color:#777d79;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:900}
.market-tab.active{background:#151a17;color:white}
.search-card,.card,.hero-card,.strategy-card,.recommend-card,.position-card,.backtest-card{
background:linear-gradient(180deg,#0d110f,#090c0a);
border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.2)
}
.search-card{padding:14px;margin-bottom:14px}
.search-row{display:flex;gap:8px}
.search-input{
flex:1;min-width:0;border:1px solid #303632;background:#060806;color:white;
border-radius:12px;padding:13px 12px;outline:none;font-size:16px;font-weight:800
}
.search-input:focus{border-color:#4c6559}
.search-button{border:0;border-radius:12px;padding:0 18px;background:#e8eee9;color:#111;font-weight:950}
.search-examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.example,.history-item{
border:1px solid #252a27;background:#101310;color:#a9aeab;
border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800
}
.search-history{margin-top:12px;padding-top:11px;border-top:1px solid #202522}
.search-history-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.search-history-title{font-size:11px;color:var(--muted);font-weight:900}
.search-history-clear{border:0;background:transparent;color:#777d79;font-size:10px;padding:4px}
.search-history-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.section-head{margin:18px 1px 10px}
.section-title{font-size:15px;font-weight:950}
.section-sub{font-size:11px;line-height:1.6;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#0a0d0b;border:1px solid var(--border);border-radius:14px;padding:12px 9px}
.stat span{display:block;font-size:10px;color:var(--muted)}
.stat strong{display:block;font-size:21px;margin-top:4px}
.update-line{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#858b87;margin:8px 2px 12px}
.stock-grid,.watch-list{display:grid;gap:9px}
.stock-card{
border:1px solid var(--border);background:linear-gradient(180deg,#0d100e,#080b09);
border-radius:16px;padding:13px;cursor:pointer
}
.stock-title-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.symbol{font-size:17px;font-weight:950}
.stock-inline-name{font-size:12px;color:#aeb3b0;font-weight:800}
.stock-strategy-line{font-size:11px;color:#b9bebc;margin-top:5px;font-weight:800}
.score{text-align:right}.score strong{display:block;font-size:19px}.score span{font-size:9px;color:var(--muted)}
.price-row{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.price{font-size:21px;font-weight:950}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:#b8bdb9}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:10px;font-weight:850;padding:5px 7px;border-radius:999px;border:1px solid #2a2f2c;color:#adb2af}
.chip.green{color:#a6ead3;border-color:#25483b}
.watch-open{font-size:10px;color:#707672;margin-top:11px}
.watch-empty{
border:1px dashed #282e2a;background:#080b09;border-radius:14px;padding:16px 12px;
color:#777d79;font-size:11px;line-height:1.7;text-align:center
}
.watch-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);background:#0b0e0c;padding:11px;border-radius:14px}
.watch-main{min-width:0;flex:1;cursor:pointer}
.watch-symbol{font-weight:950;font-size:14px}
.watch-name{font-size:10px;color:var(--muted);margin-top:2px}
.watch-price{font-size:11px;color:#b6bbb8;margin-top:5px}
.watch-remove{border:1px solid #4b252a;background:#1a0d0f;color:#ff8e98;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:850}
.loading{padding:28px 10px;text-align:center;color:#909692;font-size:13px}
.error{padding:14px;border:1px solid #4b252a;background:#1a0c0e;border-radius:14px;color:#ff9ba4;font-size:12px;line-height:1.7}
.hidden{display:none!important}
.back-row{margin-bottom:12px}
.back-button{border:1px solid var(--border);background:#0c100d;color:#ddd;padding:9px 11px;border-radius:11px;font-weight:850}
.analysis-refresh{font-size:11px;color:var(--muted)}
.hero-card{padding:16px;margin-bottom:14px}
.hero-top{align-items:flex-start}
.hero-symbol{font-size:25px;font-weight:950}
.hero-name{font-size:13px;font-weight:850;color:#aeb3b0}
.market-pill{display:inline-block;font-size:10px;color:#aeb4b0;border:1px solid #303531;padding:5px 7px;border-radius:999px;margin-top:7px}
.hero-price{text-align:right;font-size:29px;font-weight:950}
.hero-change{text-align:right;font-size:13px;font-weight:900;margin-top:4px}
.favorite-btn{width:100%;margin-top:14px}
.favorite-btn.active{color:#ffe394;border-color:#5c5127;background:#18160c}
.indicator-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.indicator{background:#080b09;border:1px solid #222724;border-radius:12px;padding:10px 8px}
.indicator span{display:block;font-size:9px;color:#777d79}
.indicator strong{display:block;font-size:13px;margin-top:3px}
.volume-card{margin-top:12px;border-top:1px solid #202522;padding-top:12px}
.volume-title{font-size:12px;font-weight:900}
.volume-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.volume-box{border:1px solid #232824;border-radius:10px;padding:8px}
.volume-box span{display:block;font-size:9px;color:#777d79}
.volume-box strong{display:block;font-size:12px;margin-top:3px}
.big-section-title{font-size:16px;font-weight:950;margin:20px 2px 10px}

.position-card{padding:15px;margin-bottom:14px}
.position-title,.backtest-title{font-size:18px;font-weight:950}
.position-desc,.backtest-sub{font-size:11px;color:var(--muted);line-height:1.7;margin-top:5px}
.position-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.position-field{background:#080b09;border:1px solid #252b27;border-radius:12px;padding:10px}
.position-field.full{grid-column:1/-1}
.position-field label{display:block;font-size:10px;font-weight:850;color:#8b918d;margin-bottom:7px}
.position-input{width:100%;border:0;outline:none;background:transparent;color:#fff;font-size:18px;font-weight:950;padding:0}
.position-unit{font-size:9px;color:#656b67;margin-top:5px}
.position-save-btn{width:100%;margin-top:10px;background:#141a16}
.position-summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}
.position-summary{border:1px solid #252b27;background:#080b09;border-radius:12px;padding:10px}
.position-summary span{display:block;font-size:9px;color:#777d79}
.position-summary strong{display:block;font-size:16px;margin-top:5px}
.position-risk{margin-top:12px;border:1px solid #292e2b;border-radius:13px;padding:12px;font-size:11px;line-height:1.75;color:#b4b9b6}
.position-risk.good{border-color:#24513f;background:#0b1712}
.position-risk.warn{border-color:#5b4822;background:#181307}
.position-risk.bad{border-color:#57282e;background:#190c0e}
.position-risk-title{font-size:14px;font-weight:950;margin-bottom:5px;color:#f5f7f6}
.add-plan{margin-top:12px;border-top:1px solid #202522;padding-top:12px}
.add-plan-title{font-size:13px;font-weight:950}
.add-plan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}
.add-plan-box{border:1px solid #294760;background:#081119;border-radius:12px;padding:10px}
.add-plan-box span{display:block;font-size:9px;color:#7f929f}
.add-plan-box strong{display:block;font-size:17px;color:#8bc9ff;margin-top:4px}
.add-plan-box.green{border-color:#28493c;background:#09140f}
.add-plan-box.green strong{color:#a6ead3}
.add-plan-box.yellow{border-color:#554a24;background:#151206}
.add-plan-box.yellow strong{color:#ffc85a}

.recommend-card{padding:15px;margin-bottom:14px;scroll-margin-top:12px}
.recommend-top{align-items:flex-start}
.recommend-name{font-size:21px;font-weight:950}
.recommend-score{text-align:right;min-width:72px}
.recommend-score strong{font-size:28px;line-height:1}
.recommend-score span{display:block;font-size:9px;color:var(--muted);margin-top:5px}
.recommend-note{font-size:11px;color:#a5aaa7;line-height:1.75;margin-top:10px}
.recommend-badge{display:inline-block;margin-top:7px;border:1px solid #29483c;color:#a6ead3;background:#0d1713;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}
.recommend-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.recommend-mini{border:1px solid #272c29;background:#080b09;border-radius:12px;padding:10px 7px;text-align:center;color:var(--text)}
.recommend-mini.best{border-color:#315c4b;background:#0d1713}
.recommend-mini span{display:block;font-size:9px;color:#929894}
.recommend-mini strong{display:block;font-size:15px;margin-top:4px}
.strategy-jump{cursor:pointer}

.backtest-card{padding:15px;margin-bottom:14px}
.backtest-head{align-items:flex-start}
.backtest-sub{font-size:10px}
.backtest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.backtest-item{border:1px solid #292e2b;background:#080b09;border-radius:14px;padding:11px}
.backtest-item.good{border-color:#28513f;background:#0a1510}
.backtest-item.bad{border-color:#5a292f;background:#180c0e}
.backtest-item.sample{border-color:#594a24;background:#161206}
.backtest-name{font-size:12px;font-weight:950}
.backtest-rate{font-size:25px;font-weight:950;margin-top:7px}
.backtest-label{font-size:9px;color:#777d79}
.backtest-stats{font-size:10px;color:#aeb3b0;line-height:1.8;margin-top:9px}
.backtest-warning,.backtest-ok{margin-top:12px;border-radius:13px;padding:12px;font-size:11px;line-height:1.75}
.backtest-warning{border:1px solid #692b32;background:#1d0b0e;color:#ff9ca5}
.backtest-warning strong{display:block;color:#ffd3d7;font-size:14px;margin-bottom:5px}
.backtest-ok{border:1px solid #28513f;background:#0a1611;color:#a8ead4}
.backtest-note{font-size:10px;color:#747a76;line-height:1.7;margin-top:10px}

.strategy-card{padding:15px;margin-bottom:10px}
.strategy-head{display:flex;justify-content:space-between;gap:10px}
.strategy-name{font-size:17px;font-weight:950}
.strategy-grade{font-size:10px;color:#999f9b;margin-top:3px}
.strategy-score{font-size:23px;font-weight:950;text-align:right}
.strategy-score small{display:block;font-size:9px;color:#777d79}
.condition-row{padding:11px 0;border-top:1px solid #202522;font-size:13px;font-weight:850;line-height:1.7}
.condition-row.good{color:#bdf2dc}.condition-row.bad{color:#ff8d97}
.condition-explain{display:block;color:#858b87;font-size:11px;font-weight:500;margin:3px 0 0 20px;line-height:1.65}
.strategy-levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.strategy-level{border:1px solid #242925;background:#080b09;border-radius:13px;padding:11px}
.strategy-level span{display:block;font-size:10px;font-weight:800;color:#7f8681}
.strategy-level strong{display:block;font-size:19px;font-weight:950;margin-top:5px}
.level-entry{border-color:#28493c}.level-entry strong{color:#a6ead3}
.level-stop{border-color:#512b30}.level-stop strong{color:#ff8d97}
.level-pressure,.level-tp{border-color:#554a24}.level-pressure strong,.level-tp strong{color:#ffc85a}
.level-tp3{border-color:#5d4125}.level-tp3 strong{color:#ff9f43}
.rr-text{font-size:11px!important;color:#d8bd70!important;margin-top:5px}
.qualified-badge{margin-top:10px;padding:8px;border-radius:10px;font-size:10px;font-weight:850;color:#a9ead4;background:#0d1c16;border:1px solid #224538}
.qualified-badge.not-qualified{color:#c3c6c4;background:#101311;border-color:#292e2b}
.return-recommend-wrap{margin:18px 0 4px}
.return-recommend-btn{width:100%;padding:13px;background:#141a16}
.data-note{font-size:10px;color:#6f7471;line-height:1.75;margin:16px 4px}

#analysisView{will-change:transform;touch-action:pan-y;transition:transform .24s cubic-bezier(.22,.61,.36,1),opacity .24s ease}
#analysisView.swiping-back{transition:none}
#analysisView.swipe-return{transition:transform .22s cubic-bezier(.22,.61,.36,1),opacity .22s ease}

/* 電腦版：只放寬介面，不改任何功能 */
@media(min-width:900px){
.app{
width:min(100%,1440px);
padding-left:28px;
padding-right:28px;
}
}

@media(max-width:430px){
.app{padding-left:max(11px,calc(env(safe-area-inset-left) + 11px));padding-right:max(11px,calc(env(safe-area-inset-right) + 11px));padding-top:max(22px,calc(env(safe-area-inset-top) + 14px))}
.logo{font-size:22px}
.indicator-strip{grid-template-columns:repeat(2,1fr)}
.backtest-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="app">

<div id="homeView">

<div class="header">
<div class="logo">幽冥分析<small>股票策略分析</small></div>
<button id="notifyButton" class="notify-btn">🔔 高勝率策略通知</button>
</div>

<div class="market-tabs">
<button id="twTab" class="market-tab active">🇹🇼 台股</button>
<button id="usTab" class="market-tab">🇺🇸 美股</button>
</div>

<div class="search-card">
<div class="search-row">
<input id="searchInput" class="search-input" placeholder="輸入股票代號，例如 2330 / NVDA">
<button id="searchButton" class="search-button">分析</button>
</div>

<div class="search-examples">
<button class="example" data-example="2330">2330</button>
<button class="example" data-example="2317">2317</button>
<button class="example" data-example="2454">2454</button>
<button class="example" data-example="NVDA">NVDA</button>
<button class="example" data-example="AAPL">AAPL</button>
<button class="example" data-example="TSLA">TSLA</button>
</div>

<div id="searchHistory" class="search-history hidden">
<div class="search-history-head">
<div class="search-history-title">🕘 最近搜尋</div>
<button id="clearHistory" class="search-history-clear">清除</button>
</div>
<div id="searchHistoryList" class="search-history-list"></div>
</div>
</div>

<div id="watchSection">
<div class="section-head">
<div>
<div class="section-title">⭐ 我的自選</div>
<div class="section-sub">搜尋股票後可加入自選，點股票直接進入完整分析</div>
</div>
<button id="watchToggleButton" class="more-btn">全部收起</button>
</div>
<div id="watchList" class="watch-list"></div>
</div>

<div id="twMarket">

<div class="section-head">
<div>
<div class="section-title">🇹🇼 台股市場掃描</div>
<div class="section-sub">使用母版本策略掃描條件</div>
</div>
<button id="refreshButton" class="refresh-btn">重新掃描</button>
</div>

<div class="stats">
<div class="stat"><span>掃描股票</span><strong id="scanCount">--</strong></div>
<div class="stat"><span>符合策略</span><strong id="strategyCount">--</strong></div>
<div class="stat"><span>異動股票</span><strong id="radarCount">--</strong></div>
</div>

<div class="update-line">
<span id="updateText">正在掃描市場…</span>
<span id="countdown">01:00</span>
</div>

<div class="section-head">
<div>
<div class="section-title">🎯 自動偵測符合策略股票</div>
<div class="section-sub">母版本策略掃描結果</div>
</div>
<button class="more-btn" data-more="strategy">全部收起</button>
</div>
<div id="strategyGrid" class="stock-grid"></div>

<div class="section-head">
<div>
<div class="section-title">🟢 做多觀察</div>
<div class="section-sub">趨勢與位置較適合持續觀察</div>
</div>
<button class="more-btn" data-more="long">全部收起</button>
</div>
<div id="longGrid" class="stock-grid"></div>

<div class="section-head">
<div>
<div class="section-title">⚡ 市場異動雷達</div>
<div class="section-sub">價格與成交量異動</div>
</div>
<button class="more-btn" data-more="radar">全部收起</button>
</div>
<div id="radarGrid" class="stock-grid"></div>

</div>

<div id="usMarket" class="hidden">
<div class="section-head">
<div>
<div class="section-title">🇺🇸 美股最近分析</div>
<div class="section-sub">搜尋過的美股會顯示在這裡</div>
</div>
</div>
<div id="usRecentGrid" class="stock-grid"></div>
</div>

</div>

<div id="analysisView" class="hidden">
<div class="back-row">
<button id="backButton" class="back-button">← 返回</button>
<div id="analysisRefresh" class="analysis-refresh">每 30 秒更新</div>
</div>
<div id="analysisResult"></div>
</div>

</div>

<script>
const WATCH_KEY="yaozi_watchlist";
const HISTORY_KEY="yaozi_search_history_v1";
const POSITION_KEY="yaozi_positions_v46";

const BACKTEST_DAYS=365;
const BACKTEST_OBSERVE_DAYS=30;
const BACKTEST_MIN_TRADES=8;
const BACKTEST_WARNING_RATE=70;
const BACKTEST_MAX_HOLD=20;

var currentAnalysisSymbol="";
var currentAnalysisData=null;
var radarData=null;
var currentMarketMetrics=null;
var currentSetups=null;

var expanded={
watch:true,
strategy:true,
long:true,
radar:true
};

var countdownSeconds=60;

function el(id){
return document.getElementById(id)
}

function safe(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;")
}

function fmt(v,d=2){
var n=Number(v);
if(!Number.isFinite(n))return"--";
return n.toLocaleString("zh-TW",{
minimumFractionDigits:d,
maximumFractionDigits:d
})
}

function pct(v){
var n=Number(v);
if(!Number.isFinite(n))return"--";
return(n>0?"+":"")+fmt(n,2)+"%"
}

function pclass(v){
var n=Number(v);
return n>0?"up":n<0?"down":"flat"
}

function currentTimeText(){
return new Date().toLocaleTimeString("zh-TW",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:false
})
}

function average(values){
var a=values.map(Number).filter(Number.isFinite);
return a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN
}

function ema(values,period){
var a=values.map(Number).filter(Number.isFinite);
if(!a.length)return NaN;
var k=2/(period+1);
var out=a[0];

for(var i=1;i<a.length;i++){
out=a[i]*k+out*(1-k)
}

return out
}

function isFavorite(symbol){
symbol=String(symbol||"").toUpperCase();

return getWatchlist().some(
x=>String(x.symbol||"").toUpperCase()===symbol
)
}

function addFavorite(d){
if(!d||!d.symbol)return;

var symbol=String(d.symbol).toUpperCase();

var list=getWatchlist().filter(
x=>String(x.symbol||"").toUpperCase()!==symbol
);

list.unshift({
symbol,
name:d.name||"",
price:Number.isFinite(Number(d.price))?Number(d.price):null,
changePercent:Number.isFinite(Number(d.changePercent))?Number(d.changePercent):null,
market:d.market||"",
addedAt:Date.now()
});

saveWatchlist(list)
}

function removeFavorite(symbol){
symbol=String(symbol||"").toUpperCase();

saveWatchlist(
getWatchlist().filter(
x=>String(x.symbol||"").toUpperCase()!==symbol
)
)
}

function historicalRSI(rows,period=14){
if(rows.length<period+1)return 50;

var a=rows.slice(-(period+1));
var gain=0;
var loss=0;

for(var i=1;i<a.length;i++){
var diff=
Number(a[i].close)-
Number(a[i-1].close);

if(diff>0){
gain+=diff
}else{
loss+=Math.abs(diff)
}
}

var ag=gain/period;
var al=loss/period;

if(al===0)return 100;

var rs=ag/al;

return 100-(100/(1+rs))
}

function historicalMACD(rows){
var c=rows.map(x=>Number(x.close)).filter(Number.isFinite);

if(c.length<26)return 0;

return ema(c.slice(-80),12)-ema(c.slice(-80),26)
}

function historicalATR(rows,period=14){
if(rows.length<2)return 0;

var a=rows.slice(-(period+1));
var trs=[];

for(var i=1;i<a.length;i++){
var h=Number(a[i].high);
var l=Number(a[i].low);
var pc=Number(a[i-1].close);

var tr=Math.max(
h-l,
Math.abs(h-pc),
Math.abs(l-pc)
);

if(Number.isFinite(tr)){
trs.push(tr)
}
}

return average(trs)||0
}

function marketOf(d){
var rows=d.rows||[];
var last=rows.at(-1)||{};

var price=
Number(d.price)||
Number(last.close)||
0;

var ma20=Number(d.ma20);
var ma60=Number(d.ma60);
var rsi=Number(d.rsi);
var macd=Number(d.macd);
var atr=Number(d.atr);

if(!Number.isFinite(ma20)){
ma20=average(
rows.slice(-20).map(x=>x.close)
)||price
}

if(!Number.isFinite(ma60)){
ma60=average(
rows.slice(-60).map(x=>x.close)
)||price
}

if(!Number.isFinite(rsi)){
rsi=50
}

if(!Number.isFinite(macd)){
macd=0
}

if(!Number.isFinite(atr)||atr<=0){
atr=historicalATR(rows,14)||price*.02
}

var recent20=rows.slice(-20);

var highs=
recent20.map(x=>Number(x.high))
.filter(Number.isFinite);

var lows=
recent20.map(x=>Number(x.low))
.filter(Number.isFinite);

var lows10=
rows.slice(-10)
.map(x=>Number(x.low))
.filter(Number.isFinite);

var resistance=Number(d.resistance);

if(!Number.isFinite(resistance)){
resistance=highs.length
?Math.max(...highs)
:price
}

var support=Number(d.support);

if(!Number.isFinite(support)){
support=lows.length
?Math.min(...lows)
:ma20
}

var low10=lows10.length
?Math.min(...lows10)
:support;

return{
price,
ma20,
ma60,
rsi,
macd,
atr,
resistance,
support,
low10,
rows
}
}

function volumeMetrics(d,rows){
var last=rows.at(-1)||{};

var current=Number(
d.volume??last.volume
);

if(!Number.isFinite(current)){
current=0
}

var vols=
rows.slice(-21,-1)
.map(x=>Number(x.volume))
.filter(Number.isFinite);

var average20=
vols.length
?average(vols)
:0;

var ratio=Number(d.volumeRatio);

if(!Number.isFinite(ratio)||ratio<=0){
ratio=average20>0
?current/average20
:1
}

var level="正常量";

if(ratio>=2){
level="明顯放量"
}else if(ratio>=1.5){
level="放量"
}else if(ratio>=1.2){
level="量能增溫"
}else if(ratio<.7){
level="量縮"
}

return{
current,
average20,
ratio,
level
}
}

function structureHealthy(m){
var rows=m.rows||[];

if(rows.length<10)return true;

var c=
rows.slice(-5)
.map(x=>Number(x.close))
.filter(Number.isFinite);

if(c.length<3)return true;

return c.at(-1)>=c[0]*.96&&
m.price>=m.ma60*.97
}

function strategyTargets(type,m){
var price=Number(m.price)||0;

var atr=Math.max(
Number(m.atr)||price*.02,
price*.005
);

var ma20=Number(m.ma20)||price;
var ma60=Number(m.ma60)||price;
var resistance=Number(m.resistance)||price;
var support=Number(m.support)||ma20;
var low10=Number(m.low10)||support;

var entryLow;
var entryHigh;
var stop1;
var stop2;

if(type==="PULLBACK"){
entryLow=Math.max(
ma20-atr*.25,
support
);

entryHigh=Math.min(
price+atr*.15,
ma20+atr*.45
);

if(entryHigh<entryLow){
entryHigh=entryLow+atr*.25
}

stop1=Math.min(
entryLow-atr*.55,
support-atr*.25
);

stop2=Math.min(
ma60-atr*.35,
low10-atr*.3,
stop1-atr*.6
)

}else if(type==="HIGH_R"){

entryLow=Math.max(
resistance-atr*.12,
price-atr*.1
);

entryHigh=Math.max(
resistance+atr*.18,
price+atr*.1
);

if(entryHigh<entryLow){
entryHigh=entryLow+atr*.3
}

stop1=Math.min(
resistance-atr*.55,
entryLow-atr*.45
);

stop2=Math.min(
ma20-atr*.35,
low10-atr*.25,
stop1-atr*.65
)

}else{

entryLow=Math.max(
price-atr*.18,
ma20
);

entryHigh=
price+atr*.28;

if(entryHigh<entryLow){
entryHigh=entryLow+atr*.3
}

stop1=Math.min(
price-atr*.9,
low10-atr*.15
);

stop2=Math.min(
ma20-atr*.45,
low10-atr*.4,
stop1-atr*.65
)
}

entryLow=Math.max(
entryLow,
price*.5
);

entryHigh=Math.max(
entryHigh,
entryLow
);

var center=
(entryLow+entryHigh)/2;

if(stop1>=center){
stop1=center-atr*.8
}

if(stop2>=stop1){
stop2=stop1-atr*.7
}

var risk=Math.max(
center-stop1,
atr*.45
);

var previousHigh=
Math.max(
resistance,
center
);

var tp1=Math.max(
previousHigh,
center+risk*1.2
);

var tp2=Math.max(
tp1+atr*.35,
center+risk*2
);

var tp3=Math.max(
tp2+atr*.45,
center+risk*3
);

return{
entryLow,
entryHigh,
center,
stop1,
stop2,
previousHigh,
risk,
tp1,
tp2,
tp3
}
}

function historicalMetrics(rows,index){
var history=
rows.slice(
Math.max(0,index-119),
index+1
);

var current=
history.at(-1)||{};

var price=
Number(current.close)||0;

var ma20=
average(
history.slice(-20)
.map(x=>x.close)
);

var ma60=
average(
history.slice(-60)
.map(x=>x.close)
);

if(!Number.isFinite(ma20)){
ma20=price
}

if(!Number.isFinite(ma60)){
ma60=price
}

var rsi=
historicalRSI(history,14);

var macd=
historicalMACD(history);

var atr=
historicalATR(history,14);

if(!Number.isFinite(atr)||atr<=0){
atr=price*.02
}

var prior20=
history.slice(-21,-1);

if(!prior20.length){
prior20=history.slice(-20)
}

var highs=
prior20.map(x=>Number(x.high))
.filter(Number.isFinite);

var lows=
prior20.map(x=>Number(x.low))
.filter(Number.isFinite);

var resistance=
highs.length
?Math.max(...highs)
:price;

var support=
lows.length
?Math.min(...lows)
:ma20;

var lows10=
history.slice(-10)
.map(x=>Number(x.low))
.filter(Number.isFinite);

var low10=
lows10.length
?Math.min(...lows10)
:support;

var currentVolume=
Number(current.volume)||0;

var previousVolumes=
history.slice(-21,-1)
.map(x=>Number(x.volume))
.filter(Number.isFinite);

var avgVolume=
previousVolumes.length
?average(previousVolumes)
:currentVolume;

var volumeRatio=
avgVolume>0
?currentVolume/avgVolume
:1;

var closes5=
history.slice(-5)
.map(x=>Number(x.close))
.filter(Number.isFinite);

var structure=true;

if(closes5.length>=3){
structure=
closes5.at(-1)>=closes5[0]*.96&&
price>=ma60*.97
}

return{
price,
ma20,
ma60,
rsi,
macd,
atr,
resistance,
support,
low10,
volumeRatio,
structure,
rows:history
}
}

var n=p>=b*.97;
var s=m.structure;

a>b,
p>=a-atr*.5,
p<=a+atr*1.3,
r>=42,
r<=68,
mac>=0,
n,
m.volumeRatio<=1.6
];

a>b,
p>a,
mac>0,
r>=52,
r<=72,

n&&s
];

var surge=[
a>b,
p>a,
mac>0,
r>=58,
r<=74,
p>=res-atr*.25,
m.volumeRatio>=1.5,
n&&s
];

x.filter(Boolean).length;

return{
passed,
score:Math.round(
passed/x.length*100
),
qualified:passed>=7
}
}

return{

}
}

function simulateTrade(rows,signalIndex,type,m){
var entryIndex=
signalIndex+1;

if(entryIndex>=rows.length){
return null
}

var entryRow=
rows[entryIndex];

var entry=
Number(entryRow.open);

if(!Number.isFinite(entry)||entry<=0){
entry=Number(entryRow.close)
}

if(!Number.isFinite(entry)||entry<=0){
return null
}

var t=
strategyTargets(type,m);

var stop=
Number(t.stop1);

if(!Number.isFinite(stop)||stop>=entry){
stop=
entry-Math.max(
m.atr*.8,
entry*.01
)
}

var risk=
entry-stop;

if(risk<=0){
return null
}

var tp1=Math.max(
Number(t.tp1)||0,
entry+risk*1.2
);

var tp2=Math.max(
Number(t.tp2)||0,
entry+risk*2
);

var tp3=Math.max(
Number(t.tp3)||0,
entry+risk*3
);

var end=
Math.min(
rows.length-1,
entryIndex+BACKTEST_MAX_HOLD
);

var maxR=0;
var exitR=null;
var result="TIME";
var exitIndex=end;

for(var j=entryIndex;j<=end;j++){
var bar=rows[j];

var high=Number(bar.high);
var low=Number(bar.low);
var close=Number(bar.close);

if(!Number.isFinite(high)||
!Number.isFinite(low)){
continue
}

if(low<=stop){
exitR=-1;
result="SL";
exitIndex=j;
break
}

if(high>=tp3){
exitR=(tp3-entry)/risk;
result="TP3";
exitIndex=j;
break
}

if(high>=tp2){
maxR=Math.max(
maxR,
(tp2-entry)/risk
)
}else if(high>=tp1){
maxR=Math.max(
maxR,
(tp1-entry)/risk
)
}

if(j===end){
exitR=
Number.isFinite(close)
?(close-entry)/risk
:0;

result=
exitR>=1
?"WIN"
:exitR<0
?"LOSS"
:"FLAT"
}
}

if(exitR===null){
exitR=maxR
}

return{
entryIndex,
exitIndex,
entry,
stop,
tp1,
tp2,
tp3,
r:exitR,
result,
win:exitR>0
}
}

function runOneBacktest(rows,type){
var result={
type,
trades:0,
wins:0,
losses:0,
winRate:null,
averageR:0,
totalR:0,
maxLossStreak:0,
tp3:0,
tp2:0,
tp1:0,
sl:0,
flat:0
};

if(!Array.isArray(rows)||
rows.length<61){
return result
}

var cutoff=
Date.now()-
BACKTEST_DAYS*86400000;

var startIndex=
Math.max(
60,
rows.length-365
);

for(var z=60;z<rows.length;z++){
var raw=
rows[z].date||
rows[z].datetime||
rows[z].time||
rows[z].timestamp;

if(raw){
var dt=new Date(raw);

if(!Number.isNaN(dt.getTime())&&
dt.getTime()<cutoff){
continue
}
}

startIndex=z;
break
}

var lossStreak=0;
var nextAllowed=startIndex;

for(var i=startIndex;i<rows.length-1;i++){

if(i<nextAllowed){
continue
}

var m=
historicalMetrics(rows,i);

var setups=
historicalSetup(m);

if(!setups[type].qualified){
continue
}

var trade=
simulateTrade(
rows,
i,
type,
m
);

if(!trade){
continue
}

result.trades++;
result.totalR+=trade.r;

if(trade.win){
result.wins++;
lossStreak=0
}else{
result.losses++;
lossStreak++;

result.maxLossStreak=
Math.max(
result.maxLossStreak,
lossStreak
)
}

if(trade.result==="TP3"){
result.tp3++
}else if(trade.result==="TP2"){
result.tp2++
}else if(trade.result==="TP1"){
result.tp1++
}else if(trade.result==="SL"){
result.sl++
}else{
result.flat++
}

nextAllowed=
trade.exitIndex+1
}

if(result.trades){
result.winRate=
result.wins/
result.trades*100;

result.averageR=
result.totalR/
result.trades
}

return result
}

function run365Backtest(rows){
return{
PULLBACK:runOneBacktest(
rows,
"PULLBACK"
),
HIGH_R:runOneBacktest(
rows,
"HIGH_R"
),
SURGE:runOneBacktest(
rows,
"SURGE"
)
}
}

function getRowDate(row){
var raw=
row&&(
row.date||
row.datetime||
row.time||
row.timestamp
);

if(!raw)return null;

var d=
new Date(raw);

return Number.isNaN(d.getTime())
?null
:d
}

function backtestObservation(rows){
if(!Array.isArray(rows)||!rows.length){
return{
ready:false,
days:0,
remaining:BACKTEST_OBSERVE_DAYS
}
}

var first=null;
var last=null;

for(var i=0;i<rows.length;i++){
var d=getRowDate(rows[i]);

if(d){
first=d;
break
}
}

for(var j=rows.length-1;j>=0;j--){
var d2=getRowDate(rows[j]);

if(d2){
last=d2;
break
}
}

if(first&&last){
var days=Math.max(
0,
Math.floor(
(last-first)/86400000
)
);

return{
ready:days>=BACKTEST_OBSERVE_DAYS,
days,
remaining:Math.max(
0,
BACKTEST_OBSERVE_DAYS-days
)
}
}

var tradingDays=
Math.max(
0,
rows.length-60
);

var estimated=
Math.floor(
tradingDays/22*30
);

return{
ready:tradingDays>=22,
days:estimated,
remaining:
tradingDays>=22
?0
:Math.max(
1,
Math.ceil(
(22-tradingDays)/22*30
)
)
}
}

function buildPositionAnalysis(d,m,setups){
var position=
getPosition(d.symbol);

var entry=
position
?Number(position.entry)||0
:0;

var lots=
position
?Number(position.lots)||0
:0;

var odd=
position
?Number(position.odd)||0
:0;

var shares=
positionShares(
position,
d.market
);

var price=
Number(m.price)||0;

var cost=
entry>0&&shares>0
?entry*shares
:0;

var marketValue=
price>0&&shares>0
?price*shares
:0;

var pnl=
marketValue-cost;

var pnlPct=
cost>0
?pnl/cost*100
:0;

var b=
bestSetup(setups);

var t=
strategyTargets(
b.type,
m
);

var riskLine=t.stop1;
var deepRisk=t.stop2;
var addPrice=t.entryLow;

var secondAdd=
Math.max(
deepRisk,
Math.min(
m.ma20,
t.entryHigh
)
);

var structureGood=
m.ma20>m.ma60&&
price>=m.ma60*.97;

var setupStrong=
b.setup.score>=75;

var aboveStop=
price>riskLine;

var decision="";
var riskClass="warn";

if(!entry||!shares){

decision=
"先輸入你的實際入場均價與持有數量，系統才會依目前價格、策略分數、MA20／MA60、SL1／SL2 與支撐區分析是否適合加碼或攤低均價。"

}else if(price<=deepRisk||!structureGood){

decision=
"目前不適合只為了降低均價而加買。價格已接近／跌破較深結構風險區，或 MA20／MA60 多頭結構不足。";

riskClass="bad"

}else if(
price<entry&&
aboveStop&&
structureGood&&
setupStrong
){

decision=
"目前屬於可以條件式觀察加碼的區域。若要降低均價，優先靠近策略入場／支撐區分批，不建議直接用現價一次補滿。";

riskClass="good"

}else if(
price<entry&&
aboveStop
){

decision=
"目前雖低於你的均價，但策略條件還不夠強。可等待價格靠近支撐區止穩或策略分數重新提高。"

}else if(price>=entry){

decision=
"目前不屬於攤低均價。若再買應視為順勢加碼，優先等待回踩支撐或突破確認。";

riskClass=
structureGood&&setupStrong
?"good"
:"warn"

}else{

decision=
"目前風險條件偏高，加碼前應先確認價格沒有跌破策略失效點。";

riskClass="bad"
}

var a25=
shares>0
?Math.max(
1,
Math.round(shares*.25)
)
:0;

var a50=
shares>0
?Math.max(
1,
Math.round(shares*.5)
)
:0;

function st(n){
n=Math.max(
0,
Math.round(n)
);

if(d.market==="US"){
return n+" 股"
}

var l=
Math.floor(n/1000);

var o=
n%1000;

if(l&&o){
return l+" 張 "+o+" 股"
}

if(l){
return l+" 張"
}

return o+" 股"
}

function na(p,s){
return !entry||
!shares||
!p||
!s
?null
:(
(entry*shares)+(p*s)
)/(shares+s)
}

var avg25=
na(addPrice,a25);

na(secondAdd,a50);

async function fetchStockData(symbol){
var r=
await fetch(
"/api/stock?symbol="+
encodeURIComponent(symbol)+
"&t="+
Date.now(),
{
cache:"no-store"
}
);

var d=
await r.json();

if(!r.ok||!d.ok){
throw Error(
d.error||
"股票資料取得失敗"
)
}

return d
}

(function(){
var view=el("analysisView");

var startX=0;
var startY=0;
var currentX=0;
var startTime=0;
var tracking=false;
var locked=false;

view.addEventListener(
"touchstart",
function(e){

if(
view.classList.contains("hidden")||
e.touches.length!==1
){
return
}

var t=e.touches[0];

if(t.clientX>32){
return
}

startX=t.clientX;
startY=t.clientY;
currentX=startX;
startTime=Date.now();
tracking=true;
locked=false;

view.classList.add(
"swiping-back"
)

},
{passive:true}
);

view.addEventListener(
"touchmove",
function(e){

if(
!tracking||
e.touches.length!==1
){
return
}

var t=e.touches[0];

var dx=
Math.max(
0,
t.clientX-startX
);

var dy=
Math.abs(
t.clientY-startY
);

if(!locked){

if(dy>10&&dy>dx){
tracking=false;

view.classList.remove(
"swiping-back"
);

return
}

if(dx>8){
locked=true
}
}

if(!locked)return;

currentX=t.clientX;

var width=
Math.max(
window.innerWidth,
1
);

var progress=
Math.min(
dx/width,
1
);

view.style.transform=
"translate3d("+dx+"px,0,0)";

view.style.opacity=
String(
1-progress*.18
);

if(e.cancelable){
e.preventDefault()
}

},
{passive:false}
);

function finish(){
if(!tracking)return;

tracking=false;

view.classList.remove(
"swiping-back"
);

var dx=
Math.max(
0,
currentX-startX
);

var elapsed=
Math.max(
Date.now()-startTime,
1
);

var velocity=
dx/elapsed;

var back=
dx>Math.min(
window.innerWidth*.28,
120
)||
velocity>.55;

view.classList.add(
"swipe-return"
);

if(back){

view.style.transform=
"translate3d(100vw,0,0)";

view.style.opacity=".82";

setTimeout(
goBackHome,
210
)

}else{

view.style.transform=
"translate3d(0,0,0)";

view.style.opacity="1";

setTimeout(()=>{
view.classList.remove(
"swipe-return"
);

view.style.transform="";
view.style.opacity=""
},230)

}
}

view.addEventListener(
"touchend",
finish,
{passive:true}
);

view.addEventListener(
"touchcancel",
finish,
{passive:true}
)
})();

}
});
