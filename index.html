<script>

const $=id=>document.getElementById(id);

const fmt=n=>{
  if(!Number.isFinite(Number(n)))return "--";
  return Number(n).toLocaleString(undefined,{
    maximumFractionDigits:2
  });
};

function avg(a){
  if(!a.length)return 0;
  return a.reduce((x,y)=>x+y,0)/a.length;
}

function sma(a,n){
  return avg(a.slice(-Math.min(n,a.length)));
}

function ema(a,n){
  if(!a.length)return 0;

  let k=2/(n+1);
  let v=a[0];

  for(let i=1;i<a.length;i++){
    v=a[i]*k+v*(1-k);
  }

  return v;
}

function rsi(a,n=14){

  if(a.length<n+1)return 50;

  let g=0,l=0;

  for(let i=a.length-n;i<a.length;i++){

    let d=a[i]-a[i-1];

    if(d>0)g+=d;
    else l-=d;
  }

  if(!l)return 100;

  let rs=(g/n)/(l/n);

  return 100-100/(1+rs);
}

function atr(rows,n=14){

  let d=rows.slice(-(n+1));
  let tr=[];

  for(let i=1;i<d.length;i++){

    tr.push(
      Math.max(
        d[i].high-d[i].low,
        Math.abs(d[i].high-d[i-1].close),
        Math.abs(d[i].low-d[i-1].close)
      )
    );
  }

  return avg(tr);
}

function clamp(x,min,max){
  return Math.max(min,Math.min(max,x));
}

function pct(x,b){
  if(!b)return 0;
  return (x/b-1)*100;
}

function absPct(a,b){
  return Math.abs(pct(a,b));
}

function dist(level,price){

  let p=pct(level,price);

  if(p>0)
    return `距現價上方 ${Math.abs(p).toFixed(1)}%`;

  if(p<0)
    return `距現價下方 ${Math.abs(p).toFixed(1)}%`;

  return "接近現價";
}

function recentSwingLow(rows){

  let data=rows.slice(-20);
  let candidates=[];

  for(let i=2;i<data.length-2;i++){

    if(
      data[i].low<=data[i-1].low &&
      data[i].low<=data[i-2].low &&
      data[i].low<=data[i+1].low &&
      data[i].low<=data[i+2].low
    ){
      candidates.push(data[i].low);
    }
  }

  if(!candidates.length){
    return Math.min(...data.map(x=>x.low));
  }

  return candidates.at(-1);
}

function recentSwingHigh(rows){

  let data=rows.slice(-30);
  let candidates=[];

  for(let i=2;i<data.length-2;i++){

    if(
      data[i].high>=data[i-1].high &&
      data[i].high>=data[i-2].high &&
      data[i].high>=data[i+1].high &&
      data[i].high>=data[i+2].high
    ){
      candidates.push(data[i].high);
    }
  }

  if(!candidates.length){
    return Math.max(...data.map(x=>x.high));
  }

  return candidates.at(-1);
}

async function run(){

  let symbol=$("symbol").value.trim();

  if(!symbol)return;

  $("status").style.display="block";
  $("status").textContent=
    "妖子平台2.0 正在分析市場結構與兩套波段策略…";

  $("hero").style.display="none";
  $("report").style.display="none";

  try{

    let response=await fetch(
      "/api/stock?symbol="+encodeURIComponent(symbol)
    );

    let d=await response.json();

    if(!response.ok){
      throw Error(d.error||"分析失敗");
    }

    let rows=(d.rows||[]).filter(x=>
      Number.isFinite(x.close)&&
      Number.isFinite(x.high)&&
      Number.isFinite(x.low)
    );

    if(rows.length<30){
      throw Error("歷史行情資料不足");
    }

    let closes=rows.map(x=>x.close);

    let price=closes.at(-1);

    let ma20=sma(closes,20);
    let ma60=sma(closes,60);

    let rv=rsi(closes);

    let macd=
      ema(closes.slice(-80),12)-
      ema(closes.slice(-80),26);

    let ATR=atr(rows);

    if(!Number.isFinite(ATR) || ATR<=0){
      throw Error("ATR 波動資料不足");
    }

    let ATRpct=ATR/price*100;

    let r10=rows.slice(-10);
    let r20=rows.slice(-20);
    let r60=rows.slice(-Math.min(60,rows.length));

    let low10=Math.min(...r10.map(x=>x.low));
    let low20=Math.min(...r20.map(x=>x.low));
    let low60=Math.min(...r60.map(x=>x.low));

    let high10=Math.max(...r10.map(x=>x.high));
    let high20=Math.max(...r20.map(x=>x.high));
    let high60=Math.max(...r60.map(x=>x.high));

    let swingLow=recentSwingLow(rows);
    let swingHigh=recentSwingHigh(rows);


    /* =========================
       整體趨勢
    ========================= */

    let trend="整理／轉折";
    let trendClass="amber";

    let trendExplanation=
      "目前價格、MA20、MA60 與 MACD 尚未形成完全一致的方向，市場比較接近整理或轉折階段。這種環境下，支撐與突破都需要更多確認。";

    if(price>ma20 && ma20>ma60 && macd>0){

      trend="偏多趨勢";
      trendClass="green";

      trendExplanation=
        "現價位於 MA20 上方、MA20 高於 MA60，而且 MACD 動能為正，短中期結構偏多。若價格已經離主要支撐很遠，仍要留意追價後的風險報酬會變差。";

    }else if(price<ma20 && ma20<ma60 && macd<0){

      trend="偏弱趨勢";
      trendClass="red";

      trendExplanation=
        "現價位於主要均線下方、MA20 低於 MA60，而且 MACD 動能偏弱。反彈時均線與前方套牢／前高區可能形成壓力，因此需要更嚴格等待止跌或重新轉強。";
    }


    /* =========================
       RSI 解讀
    ========================= */

    let rsiExplanation="";

    if(rv>=78){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 已位於非常偏高的動能區。這不代表一定立刻下跌，但代表短線漲幅已大，若同時遠離支撐，追價風險會提高。`;

    }else if(rv>=70){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 位於偏高區，多方動能仍強，但短線過熱與震盪風險也開始增加。`;

    }else if(rv>=55){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 位於中性偏強區，買方動能相對有利，而且尚未進入極端過熱區。`;

    }else if(rv>=45){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 接近中性區，目前沒有非常明顯的單邊動能，需要搭配均線、支撐與突破結構一起判斷。`;

    }else if(rv>=30){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 屬於偏弱區，短線賣壓較明顯。若要觀察反彈，需要確認價格是否真正停止創低。`;

    }else{

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 已進入較低區域。超賣不等於一定反彈，仍需確認支撐是否真正產生承接。`;
    }


    /* =================================================
       策略一｜支撐回踩波段
    ================================================= */

    let supports=[
      {name:"MA20",value:ma20},
      {name:"MA60",value:ma60},
      {name:"10日低點",value:low10},
      {name:"20日低點",value:low20},
      {name:"60日低點",value:low60},
      {name:"近期波段低點",value:swingLow}
    ]
    .filter(x=>
      Number.isFinite(x.value) &&
      x.value<=price*1.015
    )
    .sort((a,b)=>b.value-a.value);


    let support1=
      supports[0]?.value||low20;


    let support2=
      supports.find(
        x=>x.value<
        support1-Math.max(ATR*.45,price*.006)
      )?.value||low60;


    if(support2>support1){
      [support1,support2]=
      [support2,support1];
    }


    let reasons=[];

    if(absPct(ma20,support1)<1.5)
      reasons.push("MA20 共振");

    if(absPct(ma60,support1)<1.5)
      reasons.push("MA60 共振");

    if(absPct(low10,support1)<1.5)
      reasons.push("10日低點");

    if(absPct(low20,support1)<1.5)
      reasons.push("20日低點");

    if(absPct(swingLow,support1)<1.5)
      reasons.push("近期波段低點");

    if(!reasons.length)
      reasons.push("距現價最近的主要支撐");


    let width=
      clamp(
        ATR*.35,
        price*.004,
        price*.018
      );


    let entry1Low=
      support1-width;

    let entry1High=
      support1+width;


    if(entry1Low<=support2){
      entry1Low=
        support2+ATR*.15;
    }


    let entry1=
      (entry1Low+entry1High)/2;


    let stop1=
      Math.min(
        support2-ATR*.35,
        entry1-ATR*1.15
      );


    if(stop1>=entry1 || stop1<=0){
      stop1=
        entry1-ATR*1.25;
    }


    let risk1=
      entry1-stop1;


    let pressureCandidates=[
      high10,
      high20,
      high60,
      swingHigh
    ]
    .filter(x=>x>entry1)
    .sort((a,b)=>a-b);


    let pressure1=
      pressureCandidates[0]||
      entry1+risk1*1.5;


    let pressure2=
      pressureCandidates.find(
        x=>x>pressure1+ATR*.5
      )||
      entry1+risk1*3;


    let tp1=
      Math.min(
        entry1+risk1*1.5,
        pressure1
      );


    if(tp1<=entry1){
      tp1=
        entry1+risk1*1.5;
    }


    let tp2=
      Math.max(
        entry1+risk1*2.5,
        tp1+ATR*.7
      );


    let tp3=
      Math.max(
        entry1+risk1*4,
        tp2+ATR
      );


    let recentHighest=
      Math.max(
        ...rows.slice(-20).map(x=>x.high)
      );


    let trailing1=
      Math.max(
        recentHighest-ATR*2,
        stop1
      );


    let extension1=
      Math.max(
        tp3+ATR*1.5,
        entry1+risk1*5
      );


    let chaseDistance=
      (price-entry1High)/ATR;


    let strategy1Status="";
    let strategy1StatusClass="statusAmber";


    if(price<stop1){

      strategy1Status=
        "目前已跌破策略一的結構失效位置。原本支撐回踩的分析前提已受到破壞，這組價位需要重新計算。";

      strategy1StatusClass="statusRed";

    }else if(
      price>=entry1Low &&
      price<=entry1High
    ){

      strategy1Status=
        "目前已進入策略一觀察區。進入區間不等於確認反彈，接下來要看是否停止創低、收回支撐，以及動能是否改善。";

      strategy1StatusClass="statusGreen";

    }else if(
      price>entry1High &&
      chaseDistance>1.5
    ){

      strategy1Status=
        `目前距離策略一觀察區約 ${chaseDistance.toFixed(1)} ATR，距離偏遠。即使趨勢仍強，現價與原本支撐進場的風險報酬已經不同。`;

      strategy1StatusClass="statusAmber";

    }else if(price>entry1High){

      strategy1Status=
        "目前仍位於策略一觀察區上方。支撐回踩策略主要等待價格靠近支撐，而不是隨著價格上漲不斷把進場區往上移。";

    }else{

      strategy1Status=
        "目前已位於主要觀察區下方、但尚未跌破最終結構失效位置。第一支撐正在受到測試，需要觀察能否快速收回。";
    }


    /* =================================================
       策略二｜高 R 突破回測
    ================================================= */

    let priorRows=
      rows.slice(0,-1);

    let prior20=
      priorRows.slice(-20);


    let breakoutLevel=
      Math.max(
        ...prior20.map(x=>x.high)
      );


    let entry2Low=
      breakoutLevel-ATR*.20;

    let entry2High=
      breakoutLevel+ATR*.20;

    let entry2=
      (entry2Low+entry2High)/2;


    let stop2=
      Math.min(
        entry2-ATR*.75,
        swingLow-ATR*.10
      );


    let maxStopDistance=
      ATR*1.05;


    if(entry2-stop2>maxStopDistance){
      stop2=
        entry2-maxStopDistance;
    }


    if(stop2>=entry2){
      stop2=
        entry2-ATR*.75;
    }


    let risk2=
      entry2-stop2;


    let htp1=
      entry2+risk2*2;

    let htp2=
      entry2+risk2*3;

    let htp3=
      entry2+risk2*5;

    let extension2=
      entry2+risk2*7;


    let trailing2=
      Math.max(
        recentHighest-ATR*1.8,
        stop2
      );


    let latest=
      rows.at(-1);


    let breakoutConfirmed=
      latest.close>breakoutLevel &&

    </div>


    <div class="sectionTitle">
      🛑 策略二｜高 R 結構失效
    </div>

    <div class="card redCard">

      <div class="label">
        突破回測失效參考
      </div>

      <div class="big red">
        ${fmt(stop2)}
      </div>

      <div class="small">
        相對回測中心約
        ${Math.abs(pct(stop2,entry2)).toFixed(1)}%
      </div>

      <div class="reason">

        <strong>
          為什麼這條失效線比策略一靠近？
        </strong><br><br>

        策略二的前提是：
        原本的壓力已經突破，
        而且回測後應該轉成支撐。<br><br>

        如果價格重新明顯跌回突破結構下方，
        代表「壓力轉支撐」的假設開始失效。<br><br>

        因此這套策略不需要像策略一一樣，
        給價格非常大的回撤空間。

      </div>


      <div class="stopBox">

        <strong>
          🔴 高 R 失效原則
        </strong><br><br>

        回測觀察區：
        <strong>
          ${fmt(entry2Low)}～${fmt(entry2High)}
        </strong><br><br>

        結構失效：
        <strong>
          ${fmt(stop2)}
        </strong><br><br>

        若突破後重新有效跌破失效位置，
        就代表原本的突破回測假設需要重新評估。<br><br>

        不能因為 5R、7R 的上方空間很漂亮，
        就忽略下方原本已經定義好的失效條件。

      </div>

    </div>


    <div class="sectionTitle">
      🔥 趨勢續抱模式
    </div>

    <div class="card blueCard">

      <div class="label">
        近期 20 日最高價
      </div>

      <div class="big">
        ${fmt(recentHighest)}
      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="left">
          策略一 ATR 保護
        </div>
        <div class="right blue">
          ${fmt(trailing1)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          策略二 ATR 保護
        </div>
        <div class="right purple">
          ${fmt(trailing2)}
        </div>
      </div>

      <div class="reason">

        <strong>
          為什麼需要移動保護？
        </strong><br><br>

        固定 TP 的問題是，
        有時候真正的大趨勢才剛開始，
        價格就已經到達原本目標。<br><br>

        ATR 移動保護會隨著近期最高價提高。
        如果價格持續創高，
        保護位置也會逐步向上。<br><br>

        目的不是精準賣在最高點，
        而是讓強勢行情有延伸空間，
        同時避免已形成的趨勢最後完全回到原始風險區。

      </div>

    </div>


    <div class="sectionTitle">
      🧭 兩套策略怎麼分？
    </div>

    <div class="card">

      <div class="flow">

        <div class="flowBox">

          <div class="label">
            策略一
          </div>

          <div class="n green">
            支撐回踩
          </div>

          <div class="small">
            找支撐 → 等回踩 → 看止跌 → TP1／2／3 → 趨勢續抱
          </div>

        </div>


        <div class="flowBox">

          <div class="label">
            策略二
          </div>

          <div class="n purple">
            突破回測
          </div>

          <div class="small">
            等突破 → 等回測 → 確認支撐 → 2R／3R／5R → 趨勢續抱
          </div>

        </div>

      </div>


      <div class="divider"></div>


      <div class="reason">

        <strong class="green">
          策略一的特色
        </strong><br><br>

        入場區通常較低、範圍較寬，
        給正常波動比較大的空間。
        比較重視「主要支撐是否產生承接」。<br><br>


        <strong class="purple">
          策略二的特色
        </strong><br><br>

        不先猜底，
        而是要求價格先突破，
        再等原壓力轉成支撐。<br><br>

        因為失效距離通常比較窄，
        所以成功趨勢可能形成更高的 R 倍數；
        相對地，也更容易因正常震盪觸及失效位置。<br><br>


        <strong>
          兩套策略的進場區與失效線是獨立的。
        </strong><br><br>

        不要拿策略一比較寬的止損，
        去套策略二的高 R 進場；
        也不要拿策略二很緊的失效線，
        去套策略一的支撐回踩。

      </div>

    </div>


    <div class="sectionTitle">
      📋 本次分析快速總覽
    </div>

    <div class="card">

      <div class="row">
        <div class="left">
          市場趨勢
        </div>
        <div class="right ${trendClass}">
          ${trend}
        </div>
      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="left">
          🟢 策略一觀察區
        </div>
        <div class="right green">
          ${fmt(entry1Low)}～${fmt(entry1High)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          策略一失效
        </div>
        <div class="right red">
          ${fmt(stop1)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          策略一 TP1
        </div>
        <div class="right">
          ${fmt(tp1)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          策略一 TP2
        </div>
        <div class="right">
          ${fmt(tp2)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          策略一 TP3
        </div>
        <div class="right amber">
          ${fmt(tp3)}
        </div>
      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="left">
          🟣 關鍵突破位
        </div>
        <div class="right purple">
          ${fmt(breakoutLevel)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          策略二回測區
        </div>
        <div class="right purple">
          ${fmt(entry2Low)}～${fmt(entry2High)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          策略二失效
        </div>
        <div class="right red">
          ${fmt(stop2)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          2R
        </div>
        <div class="right">
          ${fmt(htp1)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          3R
        </div>
        <div class="right">
          ${fmt(htp2)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          5R
        </div>
        <div class="right amber">
          ${fmt(htp3)}
        </div>
      </div>

      <div class="row">
        <div class="left">
          7R 延伸
        </div>
        <div class="right amber">
          ${fmt(extension2)}
        </div>
      </div>

    </div>


    <div class="note">

      ⚠️ 妖子平台2.0 為規則式技術分析工具。
      支撐、壓力、入場觀察區、TP、R 倍數、
      ATR 移動保護與結構失效，
      均由歷史行情與預先設定的技術規則計算。<br><br>

      這些價位是策略分析與風險管理參考，
      不是未來價格保證。
      高 R 不代表較高勝率，
      實際市場亦可能出現跳空、滑價與流動性差異。

    </div>

    `;


    $("report").style.display="block";
    $("status").style.display="none";

  }

  catch(e){

    $("status").style.display="block";

    $("status").textContent=
      "❌ "+e.message+
      "。如果剛 Commit，請等待 Vercel 完成重新部署後再試。";

  }
}


$("go").onclick=run;


$("symbol").addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter")run();
  }
);

</script>

</body>
</html>
