<script>

/* =========================================================
   基本設定
========================================================= */

const WATCH_KEY='swing_tw_watch_v1';
const HISTORY_KEY='swing_tw_search_history_v1';
const PUSH_DEVICE_KEY='swing_tw_push_device_v1';

const DEFAULT=[
'2330',
'2317',
'2454',
'2308',
'2382',
'3231',
'2881',
'2882',
'2891',
'2886',
'2603',
'2615'
];

let tab='signal';
let cache={};
let current='';
let detailTimer=null;
let radarTimer=null;
let searchTimer=null;
let selectedSearchSymbol='';

const $=id=>document.getElementById(id);


/* =========================================================
   基本工具
========================================================= */

const fmt=(n,d=2)=>
Number.isFinite(+n)
?
(+n).toLocaleString(
'zh-TW',
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
:
'--';

const esc=s=>
String(s??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');

const avg=a=>
a.length
?
a.reduce((x,y)=>x+y,0)/a.length
:
0;

const sma=(a,n)=>
avg(a.slice(-n));

function ema(a,n){

if(!a.length)return 0;

let e=a[0];
const k=2/(n+1);

for(let i=1;i<a.length;i++){
e=a[i]*k+e*(1-k);
}

return e;
}

function rsi(a,n=14){

if(a.length<=n)return 50;

let g=0;
let l=0;

for(let i=a.length-n;i<a.length;i++){

const d=a[i]-a[i-1];

if(d>0){
g+=d;
}else{
l-=d;
}

}

if(l===0)return 100;

return 100-100/(1+(g/n)/(l/n));
}

function atr(rows,n=14){

const v=[];

for(let i=Math.max(1,rows.length-n);i<rows.length;i++){

const x=rows[i];
const p=rows[i-1].close;

v.push(
Math.max(
x.high-x.low,
Math.abs(x.high-p),
Math.abs(x.low-p)
)
);

}

return avg(v);
}


/* =========================================================
   自選
========================================================= */

const watch=()=>{

try{

const x=
JSON.parse(
localStorage.getItem(WATCH_KEY)||'[]'
);

return Array.isArray(x)?x:[];

function saveWatch(a){

localStorage.setItem(

syncPushSymbols();
}


/* =========================================================
   搜尋歷史
========================================================= */

const searchHistory=()=>{

try{

const x=
JSON.parse(
localStorage.getItem(HISTORY_KEY)||'[]'
);

return Array.isArray(x)?x:[];

}catch{

return [];

}

};

function saveSearchHistory(a){

if(!a?.symbol)return;

let h=
searchHistory()
.filter(x=>x.symbol!==a.symbol);

h.unshift({
symbol:String(a.symbol),
name:String(a.name||''),
time:Date.now()
});

localStorage.setItem(
HISTORY_KEY,
JSON.stringify(h.slice(0,10))
);

}


/* =========================================================
   股票 API
========================================================= */

async function getStock(symbol){

const r=
await fetch(
'/api/stock?symbol='+
encodeURIComponent(symbol)+
'&t='+
Date.now(),
{
cache:'no-store'
}
);

let d;

try{
d=await r.json();
}catch{
throw Error('股票資料格式錯誤');
}

if(!r.ok||!d.ok){
throw Error(d.error||'資料取得失敗');
}

return d;
}


/* =========================================================
   SMC Swing
========================================================= */

function swings(rows,left=2,right=2){

const lows=[];
const highs=[];

for(let i=left;i<rows.length-right;i++){

let lo=true;
let hi=true;

for(let j=1;j<=left;j++){

if(rows[i].low>rows[i-j].low){
lo=false;
}

if(rows[i].high<rows[i-j].high){
hi=false;
}

}

for(let j=1;j<=right;j++){

if(rows[i].low>rows[i+j].low){
lo=false;
}

if(rows[i].high<rows[i+j].high){
hi=false;
}

}

if(lo){
lows.push({
i,
value:rows[i].low,
row:rows[i]
});
}

if(hi){
highs.push({
i,
value:rows[i].high,
row:rows[i]
});
}

}

return {lows,highs};
}

function zoneValid(zone,rows,bullish=true){

const after=rows.slice(zone.i+1);

if(bullish){
return !after.some(x=>x.close<zone.low);
}

return !after.some(x=>x.close>zone.high);
}


/* =========================================================
   SMC 主分析
========================================================= */

function smcAnalysis(rows,price,A,inst){

const recent=rows.slice(-140);

const S=swings(recent,2,2);

const volBase=
avg(
recent
.slice(-21,-1)
.map(x=>x.volume)
);

const supports=[];
const pressures=[];


/* ---------- Bullish / Bearish OB ---------- */

for(let i=2;i<recent.length-2;i++){

const x=recent[i];
const n2=recent[i+2];

const displacementUp=
n2.close>
x.high+
Math.max(A*.35,price*.004);

const displacementDown=
n2.close<
x.low-
Math.max(A*.35,price*.004);

if(
x.close<x.open &&
displacementUp
){

const z={
type:'Bullish OB',
i,
low:x.low,
high:Math.max(x.open,x.close),
score:5
};

if(
zoneValid(z,recent,true) &&
z.low<price
){
supports.push(z);
}

}

if(
x.close>x.open &&
displacementDown
){

const z={
type:'Bearish OB',
i,
low:Math.min(x.open,x.close),
high:x.high,
score:5
};

if(
zoneValid(z,recent,false) &&
z.high>price
){
pressures.push(z);
}

}

}


/* ---------- FVG ---------- */

for(let i=1;i<recent.length-1;i++){

const a=recent[i-1];
const c=recent[i+1];

if(c.low>a.high){

const z={
type:'Bullish FVG',
i,
low:a.high,
high:c.low,
score:3.5
};

if(
zoneValid(z,recent,true) &&
z.low<price
){
supports.push(z);
}

}

if(c.high<a.low){

const z={
type:'Bearish FVG',
i,
low:c.high,
high:a.low,
score:3.5
};

if(
zoneValid(z,recent,false) &&
z.high>price
){
pressures.push(z);
}

}

}


/* ---------- BOS / Breaker ---------- */

for(const h of S.highs){

const later=recent.slice(h.i+1);

const broken=
later.some(
x=>
x.close>
h.value+
Math.max(A*.12,h.value*.0025)
);

if(
broken &&
h.value<price
){

supports.push({
type:'BOS / Breaker',
i:h.i,
low:h.value-A*.15,
high:h.value+A*.15,
score:6
});

}
else if(h.value>price){

pressures.push({
type:'Buy-side Liquidity',
i:h.i,
low:h.value-A*.08,
high:h.value+A*.08,
score:4.5
});

}

}

for(const l of S.lows){

if(l.value<price){

supports.push({
type:'Sell-side Liquidity / Demand',
i:l.i,
low:l.value-A*.10,
high:l.value+A*.12,
score:3.8
});

}

}


/* ---------- Liquidity Sweep ---------- */

for(let i=3;i<recent.length;i++){

const prevLow=
Math.min(
...recent
.slice(Math.max(0,i-8),i)
.map(x=>x.low)
);

const prevHigh=
Math.max(
...recent
.slice(Math.max(0,i-8),i)
.map(x=>x.high)
);

const x=recent[i];

if(
x.low<prevLow &&
x.close>prevLow
){

supports.push({
type:'Liquidity Sweep',
i,
low:x.low,
high:prevLow,
score:5.5
});

}

if(
x.high>prevHigh &&
x.close<prevHigh
){

pressures.push({
type:'Liquidity Sweep',
i,
low:prevHigh,
high:x.high,
score:5.5
});

}

}


/* ---------- 成交量確認 ---------- */

for(const z of [...supports,...pressures]){

const r=recent[z.i];

if(
r &&
volBase>0 &&
r.volume>=volBase*1.35
){
z.score+=1.5;
}

const dist=
Math.abs(
price-(z.low+z.high)/2
)/price;

z.score-=dist*12;

}


/* ---------- 法人籌碼確認 ---------- */

const chip=inst||{};
const chip5=Number(chip.total5||0);

if(chip5>0){
supports.forEach(z=>z.score+=.7);
}

if(chip5<0){
pressures.forEach(z=>z.score+=.7);
}

if(Number(chip.foreign5||0)>0){
supports.forEach(z=>z.score+=.3);
}

if(Number(chip.trust5||0)>0){
supports.forEach(z=>z.score+=.3);
}


/* ---------- 有效支撐 ---------- */

const validS=
supports
.filter(
z=>z.high<=price*1.012
)
.sort(
(a,b)=>{

const da=(price-a.high)/price;
const db=(price-b.high)/price;

return (db-da)*5+(b.score-a.score);

}
);


/* ---------- 有效壓力 ---------- */

const validP=
pressures
.filter(
z=>z.low>price*1.001
)
.sort(
(a,b)=>a.low-b.low
);


/* ---------- 第一支撐 ---------- */

const nearS=
validS.filter(
z=>(price-z.high)/price<=.10
);

let s1=
nearS.sort(
(a,b)=>{

const da=(price-a.high)/price;
const db=(price-b.high)/price;

return (
b.score-db*30
)-
(
a.score-da*30
);

}
)[0]
||
validS[0]
||
null;


/* ---------- 第二支撐 ---------- */

let s2=null;

if(s1){

s2=
validS
.filter(
z=>
z!==s1 &&
z.high<
s1.low-
Math.max(A*.25,price*.003)
)
.sort(
(a,b)=>b.high-a.high
)[0]
||
null;

}


/* ---------- 壓力 ---------- */

const p1=validP[0]||null;

let p2=null;
let p3=null;

if(p1){

p2=
validP.find(
z=>
z!==p1 &&
z.low>
p1.high+
Math.max(A*.2,price*.002)
)
||
null;

}

if(p2){

p3=
validP.find(
z=>
z!==p1 &&
z!==p2 &&
z.low>
p2.high+
Math.max(A*.2,price*.002)
)
||
null;

}


/* ---------- 進場與 SL ---------- */

let entryLow=null;
let entryHigh=null;
let sl=null;

if(s1){

entryLow=Math.max(0,s1.low);
entryHigh=s1.high;

sl=
s1.low-
Math.max(A*.45,price*.006);

if(sl>=entryLow){

sl=
entryLow-
Math.max(A*.35,price*.005);

}

}


/* ---------- 是否接近真正進場區 ---------- */

let entryReady=false;

if(
s1 &&
Number.isFinite(entryLow) &&
Number.isFinite(entryHigh)
){

const tolerance=
Math.max(A*.60,price*.012);

entryReady=
price>=
entryLow-
Math.max(A*.15,price*.003)
&&
price<=
entryHigh+
tolerance;

}


/* ---------- 回傳 ---------- */

return {

support1:s1,
support2:s2,

breakout:
p1?p1.low:null,

pressure1:p1,
pressure2:p2,
pressure3:p3,

entryLow,
entryHigh,
sl,

tp1:p1?p1.low:null,
tp2:p2?p2.low:null,
tp3:p3?p3.low:null,

entryReady,

hasRealStructure:!!s1,

chipBias:
chip5>0
?
'偏多'
:
chip5<0
?
'偏空'
:
'中性'

};

}


/* =========================================================
   8 條策略
========================================================= */

function analyzeData(d){

if(
!Array.isArray(d.rows) ||
d.rows.length<60
){
throw Error('歷史資料不足，無法分析');
}

const rows=
d.rows
.map(
x=>({
date:x.date||'',
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0
})
)
.filter(
x=>
Number.isFinite(x.close) &&
x.close>0
);

if(rows.length<60){
throw Error('有效 K 線不足');
}

const c=rows.map(x=>x.close);

let p=+d.price;

if(
!Number.isFinite(p) ||
p<=0
){
p=rows.at(-1).close;
}

const m20=sma(c,20);
const m60=sma(c,60);

const A=
Math.max(
atr(rows),
p*.006
);

const R=rsi(c);

const macd=
ema(c.slice(-100),12)
-
ema(c.slice(-100),26);

const r20=rows.slice(-20);
const r60=rows.slice(-60);

const support=
Math.min(
...r20.map(x=>x.low)
);

const res=
Math.max(
...r20.map(x=>x.high)
);

const high60=
Math.max(
...r60.map(x=>x.high)
);

const vol=rows.at(-1).volume;

const volAvg=
avg(
rows
.slice(-21,-1)
.map(x=>x.volume)
);

const vr=
volAvg
?
vol/volAvg
:
0;

const cond=[

[
'MA20 高於 MA60',
m20>m60,
'中期趨勢維持多頭排列'
],

[
'現價守在 MA60 上方',
p>=m60*.985,
'避免在中期結構已轉弱時進場'
],

[
'價格沒有過度遠離 MA20',
Math.abs(p-m20)<=A*2.2,
'避免追在短線過熱的位置'
],

[
'近期支撐仍有效',
p>=support*.99,
'價格尚未明顯跌破 20 日支撐'
],

[
'RSI 位於健康區',
R>=45&&R<=72,
'動能足夠，同時避免過熱'
],

[
'MACD 動能未明顯轉空',
macd>=-A*.05,
'短線動能沒有明顯惡化'
],

[
'成交量正常或偏強',
vr>=.8,
'量能至少接近 20 日正常水準'
],

[
'上方仍有波段空間',
Math.max(res,high60)>p*1.025,
'上方目標空間足以規劃波段'
]

];

const passed=
cond.filter(x=>x[1]).length;

const smc=
smcAnalysis(
rows,
p,
A,
d.institutional
);

return {

...d,

price:p,

conditions:cond,

passed,

score:
Math.round(
passed/8*100
),

qualified:
passed>=7,

near:
passed===6,

A,
vr,
R,

hasRealStructure:
smc.hasRealStructure,

entryReady:
smc.entryReady,

support1Low:
smc.support1
?
smc.support1.low
:
null,

support1High:
smc.support1
?
smc.support1.high
:
null,

support2Low:
smc.support2
?
smc.support2.low
:
null,

support2High:
smc.support2
?
smc.support2.high
:
null,

support1Type:
smc.support1
?
smc.support1.type
:
'無有效 SMC 結構',

support2Type:
smc.support2
?
smc.support2.type
:
'無第二有效結構',

entryLow:
smc.entryLow,

entryHigh:
smc.entryHigh,

sl:
smc.sl,

breakout:
smc.breakout,

pressure1:
smc.pressure1
?
smc.pressure1.low
:
null,

pressure2:
smc.pressure2
?
smc.pressure2.low
:
null,

tp1:smc.tp1,
tp2:smc.tp2,
tp3:smc.tp3,

pressure1Type:
smc.pressure1
?
smc.pressure1.type
:
'無有效壓力',

pressure2Type:
smc.pressure2
?
smc.pressure2.type
:
'無第二有效壓力',

chipBias:
smc.chipBias

};

}

function urlBase64ToUint8Array(base64String){

const padding=
'='.repeat(
(4-base64String.length%4)%4
);

const base64=
(
base64String+
padding
)
.replace(/-/g,'+')
.replace(/_/g,'/');

const rawData=
window.atob(base64);

const outputArray=
new Uint8Array(
rawData.length
);

for(
let i=0;
i<rawData.length;
++i
){

outputArray[i]=
rawData.charCodeAt(i);

}

return outputArray;

}

catch(e){

console.warn(
'Push 股票同步失敗',
e
);

}

}


async function updatePushButton(){

try{

if(
!(
'Notification'
in window
)
){

return;

}

if(
Notification.permission!==
'granted'
){

$('notify')
.classList
.remove('push-on');

$('notify').textContent='🔔';

return;

}

if(
!(
'serviceWorker'
in navigator
)
){

return;

}

const registration=
await navigator
.serviceWorker
.getRegistration('/');

if(!registration)return;

const subscription=
await registration
.pushManager
.getSubscription();

if(subscription){

$('notify')
.classList
.add('push-on');

$('notify').textContent='🔔';

}

}
catch{}

}


/* =========================================================
   開啟 Push
========================================================= */

async function enablePush(){

if(
!(
'Notification'
in window
)
){

throw Error(
'此瀏覽器不支援通知'
);

}

if(
!(
'PushManager'
in window
)
){

throw Error(
'此瀏覽器不支援背景 Push'
);

}

const permission=
await Notification
.requestPermission();

if(
permission!=='granted'
){

throw Error(
'通知權限沒有開啟'
);

}

const registration=
await getSWRegistration();

let subscription=
await registration
.pushManager
.getSubscription();

if(!subscription){

const publicKey=
await getPushPublicKey();

subscription=
await registration
.pushManager
.subscribe({

userVisibleOnly:true,

applicationServerKey:
urlBase64ToUint8Array(
publicKey
)

});

}

await savePushSubscription(
subscription
);

$('notify')
.classList
.add('push-on');

$('notify').textContent='🔔';

return true;

}


/* =========================================================
   通知按鈕
========================================================= */

$('notify').onclick=
async()=>{

hideSuggestions();

$('notify').disabled=true;

try{

await enablePush();

alert(
'進場通知已開啟。\n\n之後網站沒有開著，只要背景監控偵測到正式進場訊號，也可以推播通知你。'
);

}
catch(e){

const isiOS=
/iPad|iPhone|iPod/
.test(
navigator.userAgent
);

const standalone=
window.matchMedia(
'(display-mode: standalone)'
).matches
||
window.navigator.standalone===true;

if(
isiOS &&
!standalone
){

alert(
'請先把「波段分析」加入 iPhone 主畫面。\n\nSafari 下方分享 → 加入主畫面 → 從主畫面重新開啟「波段分析」→ 再按一次 🔔。'
);

}
else{

alert(
e.message||
'通知開啟失敗'
);

}

}
finally{

$('notify').disabled=false;

}

};


/* =========================================================
   從 Push 通知開啟指定股票
========================================================= */

async function openStockFromURL(){

try{

const params=
new URLSearchParams(
location.search
);

const symbol=
params.get('stock')
||
params.get('symbol');

if(
symbol &&
/^\d{4,6}$/.test(symbol)
){

await openStock(symbol);

history.replaceState(
{},
'',
location.pathname
);

}

}
catch{}

}


/* =========================================================
   啟動
========================================================= */

async function startApp(){

hideSuggestions();


/*
  第一次開啟時直接顯示掃描中。
  不需要先切換 Tab。
*/

$('homeList').innerHTML=
`
<div class="card loader">
正在掃描策略...
</div>
`;


/*
  註冊 Service Worker。
*/

if(
'serviceWorker'
in navigator
){

try{

await navigator
.serviceWorker
.register(
'/sw.js',
{
scope:'/'
}
);

}
catch(e){

console.warn(
'Service Worker 註冊失敗',
e
);

}

}


/*
  Push 按鈕狀態不阻塞首頁。
*/

updatePushButton();


/*
  關鍵修正：
  第一次開啟必須等待 radar 完成。
*/

try{

await radar();

}
catch(e){

console.warn(
'第一次雷達掃描失敗',
e
);

}


/*
  再強制依照目前預設的 signal Tab
  畫一次首頁。
*/

renderHome();


/*
  每 60 秒重新掃描。
*/

clearInterval(
radarTimer
);

radarTimer=
setInterval(
async()=>{

try{

await radar();

}
catch(e){

console.warn(
'雷達更新失敗',
e
);

}

},
60000
);


/*
  如果是從 Push 點進來，
  開啟指定股票。
*/

try{

await openStockFromURL();

}
catch(e){

console.warn(
'Push 股票開啟失敗',
e
);

}

}


/*
  確保整個 HTML 建立完成後才啟動。
*/

if(
document.readyState==='loading'
){

document.addEventListener(
'DOMContentLoaded',
startApp,
{
once:true
}
);

}
else{

startApp();

}

</script>

</body>
</html>
