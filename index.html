<script>
"use strict";

var radarData = null;
var countdownSeconds = 300;
var homeScroll = 0;

function el(id){
  return document.getElementById(id);
}

function safe(v){
  var d=document.createElement("div");
  d.textContent=v==null?"":String(v);
  return d.innerHTML;
}

function n(v){
  var x=Number(v);
  return Number.isFinite(x)?x:NaN;
}

function fmt(v,d){
  if(d===undefined)d=2;
  var x=Number(v);
  if(!Number.isFinite(x))return "--";
  return x.toLocaleString("zh-TW",{
    maximumFractionDigits:d
  });
}

function pct(v){
  var x=Number(v);
  if(!Number.isFinite(x))return "--";
  return (x>0?"+":"")+x.toFixed(2)+"%";
}

function pclass(v){
  var x=Number(v);
  if(x>0)return "up";
  if(x<0)return "down";
  return "flat";
}

function normalize(v){
  return String(v||"")
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9.\-]/g,"");
}

function SMA(values,period){
  if(values.length<period)return NaN;

  var a=values.slice(-period);
  var s=0;

  for(var i=0;i<a.length;i++){
    s+=Number(a[i]);
  }

  return s/period;
}

function EMA(values,period){
  if(values.length<period)return NaN;

  var s=0;

  for(var i=0;i<period;i++){
    s+=Number(values[i]);
  }

  var e=s/period;
  var k=2/(period+1);

  for(var j=period;j<values.length;j++){
    e=Number(values[j])*k+e*(1-k);
  }

  return e;
}

function RSI(values,period){
  period=period||14;

  if(values.length<=period)return NaN;

  var a=values.slice(-(period+1));
  var gains=0;
  var losses=0;

  for(var i=1;i<a.length;i++){

    var diff=
      Number(a[i])-
      Number(a[i-1]);

    if(diff>0){
      gains+=diff;
    }else{
      losses+=Math.abs(diff);
    }
  }

  var ag=gains/period;
  var al=losses/period;

  if(al===0)return 100;

  var rs=ag/al;

  return 100-(100/(1+rs));
}

function ATR(rows,period){
  period=period||14;

  if(rows.length<=period)return NaN;

  var tr=[];

  for(var i=1;i<rows.length;i++){

    var high=Number(rows[i].high);
    var low=Number(rows[i].low);
    var prev=Number(rows[i-1].close);

    tr.push(
      Math.max(
        high-low,
        Math.abs(high-prev),
        Math.abs(low-prev)
      )
    );
  }

  return SMA(tr,period);
}


/* 頁面切換 */

function openAnalysis(){
  homeScroll=window.scrollY||0;

  el("homePage").classList.add("hidden");
  el("analysisPage").classList.remove("hidden");

  window.scrollTo(0,0);
}

function backHome(){
  el("analysisPage").classList.add("hidden");
  el("homePage").classList.remove("hidden");

  setTimeout(function(){
    window.scrollTo(0,homeScroll);
  },10);
}

el("backTop").onclick=backHome;
el("backBottom").onclick=backHome;


/* 搜尋 */

el("stockSearchForm").addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    analyze(
      el("symbolInput").value
    );
  }
);

document.querySelectorAll(".example")
.forEach(function(btn){

  btn.addEventListener(
    "click",
    function(){

      var symbol=
        this.dataset.symbol;

      el("symbolInput").value=
        symbol;

      analyze(symbol);
    }
  );
});


async function analyze(symbolValue){

  var symbol=
    normalize(symbolValue);

  if(!symbol)return;

  el("symbolInput").value=symbol;

  openAnalysis();

  el("analysisResult").innerHTML=
    '<div class="loading">正在分析 '+safe(symbol)+'…</div>';

  try{

    var response=
      await fetch(
        "/api/stock?symbol="+
        encodeURIComponent(symbol)+
        "&t="+Date.now(),
        {cache:"no-store"}
      );

    var data=
      await response.json();

    if(!response.ok||!data.ok){
      throw new Error(
        data.error||
        "資料取得失敗"
      );
    }

    buildAnalysis(data);

  }catch(err){

    el("analysisResult").innerHTML=
      '<div class="error">分析失敗：'+
      safe(err.message)+
      '</div>';
  }
}


/* 分析 */

function buildAnalysis(data){

  var rows=
    Array.isArray(data.rows)
      ?data.rows
      :[];

  if(rows.length<60){
    throw new Error(
      "歷史資料不足"
    );
  }

  var closes=
    rows.map(function(x){
      return Number(x.close);
    });

  var symbol=
    String(data.symbol||"");

  var price=
    Number(data.livePrice);

  var live=null;

  if(
    data.market==="TW" &&
    radarData
  ){

    var groups=[
      radarData.radar||[],
      radarData.longWatch||[],
      radarData.volumeLeaders||[],
      radarData.momentumLeaders||[]
    ];

    for(var g=0;g<groups.length;g++){

      for(var z=0;z<groups[g].length;z++){

        if(
          String(groups[g][z].symbol)===
          symbol
        ){
          live=groups[g][z];
          break;
        }
      }

      if(live)break;
    }
  }

  if(
    live &&
    Number.isFinite(
      Number(live.price)
    )
  ){
    price=Number(live.price);
  }

  if(!Number.isFinite(price)){
    price=closes[closes.length-1];
  }

  var ma20=SMA(closes,20);
  var ma60=SMA(closes,60);
  var rsi=RSI(closes,14);

  var recent=closes.slice(-80);

  var macd=
    EMA(recent,12)-
    EMA(recent,26);

  var atr=ATR(rows,14);

  var prior20=
    rows.slice(-21,-1);

  var resistance=
    Math.max.apply(
      null,
      prior20.map(function(x){
        return Number(x.high);
      })
    );

  var last10=
    rows.slice(-10);

  var low10=
    Math.min.apply(
      null,
      last10.map(function(x){
        return Number(x.low);
      })
    );

  var low20=
    Math.min.apply(
      null,
      rows.slice(-20).map(function(x){
        return Number(x.low);
      })
    );

  var low60=
    Math.min.apply(
      null,
      rows.slice(-60).map(function(x){
        return Number(x.low);
      })
    );

  var support=
    Math.max(
      low10,
      Math.min(ma20,price)-
      atr*.5
    );

  var trend="整理";

  if(
    price>ma20 &&
    ma20>ma60
  ){
    trend="偏多趨勢";
  }
  else if(
    price<ma20 &&
    ma20<ma60
  ){
    trend="偏弱趨勢";
  }

  /* 回踩策略 */

  var entryLow=
    Math.max(
      support,
      ma20-atr*.5
    );

  var entryHigh=
    ma20+atr*.35;

  if(entryLow>entryHigh){
    var temp=entryLow;
    entryLow=entryHigh;
    entryHigh=temp;
  }

  var center=
    (entryLow+entryHigh)/2;

  var distanceEntry=
    ((price-center)/price)*100;

  var stop=
    Math.min(
      support-atr*.5,
      entryLow-atr
    );

  var setupRisk=
    Math.max(
      center-stop,
      atr*.5
    );

  /*
    TP 改用策略觀察區中心計算，
    不用現價直接往上加，
    避免現價離觀察區很遠時
    TP 被放得不合理。
  */

  var tp1=
    center+setupRisk*1.5;

  var tp2=
    center+setupRisk*2.5;

  var tp3=
    center+setupRisk*4;


  /* 突破策略 */

  var breakLow=
    resistance-atr*.25;

  var breakHigh=
    resistance+atr*.35;

  var breakStop=
    resistance-atr*.8;

  var breakRisk=
    Math.max(
      resistance-breakStop,
      atr*.5
    );

  var r2=
    resistance+breakRisk*2;

  var r3=
    resistance+breakRisk*3;

  var r5=
    resistance+breakRisk*5;

  var r7=
    resistance+breakRisk*7;

  var breakout=
    price>resistance &&
    price>ma20;

  var breakDistanceATR=
    (price-resistance)/atr;


  /* 狀態 */

  var swingStatus=
    "等待價格接近支撐";

  if(
    price>=entryLow &&
    price<=entryHigh
  ){
    swingStatus=
      "已進入回踩觀察區";
  }

  if(price<stop){
    swingStatus=
      "原結構失效";
  }


  var breakStatus=
    "等待突破壓力";

  if(breakout){
    breakStatus=
      "突破成立，等待回測";
  }

  if(
    breakout &&
    breakDistanceATR>1.5
  ){
    breakStatus=
      "突破後距離偏遠";
  }


  /* 綜合文字 */

  var overviewText="";

  if(price>entryHigh){

    overviewText=
      "目前價格位於入場觀察區上方，距策略中心價約 "+
      Math.abs(distanceEntry).toFixed(1)+
      "%。若採回踩型波段策略，目前主要是等待價格接近支撐，而不是把現價直接視為相同風險位置。";

  }else if(
    price>=entryLow &&
    price<=entryHigh
  ){

    overviewText=
      "目前價格已進入系統計算的回踩觀察區。這代表價格位置開始接近策略設定範圍，但仍需觀察支撐是否守住、是否出現止跌或重新轉強。";

  }else{

    overviewText=
      "目前價格已低於原本的回踩觀察區，需要重新確認支撐結構是否仍然有效；若進一步跌破結構失效位置，原策略假設需要重新評估。";
  }


  var reasons=[];

  if(
    Math.abs(ma20-center) <= atr
  ){
    reasons.push("MA20 接近");
  }

  if(
    Math.abs(ma60-center) <= atr*1.5
  ){
    reasons.push("MA60 接近");
  }

  if(
    Math.abs(low10-center) <= atr
  ){
    reasons.push("10日低點");
  }

  if(
    Math.abs(low20-center) <= atr*1.5
  ){
    reasons.push("20日低點");
  }

  if(
    Math.abs(low60-center) <= atr*2
  ){
    reasons.push("60日結構");
  }

  if(!reasons.length){
    reasons.push("ATR 支撐帶");
  }


  /* 回踩判讀 */

  var swingChecks=[];

  if(price>ma20){
    swingChecks.push([
      "good",
      "✓ 現價仍位於 MA20 上方，短期趨勢尚未破壞。"
    ]);
  }else{
    swingChecks.push([
      "warn",
      "△ 現價已位於 MA20 下方，需要觀察能否重新站回。"
    ]);
  }

  if(ma20>ma60){
    swingChecks.push([
      "good",
      "✓ MA20 高於 MA60，中期均線結構偏多。"
    ]);
  }else{
    swingChecks.push([
      "warn",
      "△ MA20 尚未高於 MA60，多頭排列尚未完整。"
    ]);
  }

  if(rsi>78){
    swingChecks.push([
      "warn",
      "⚠ RSI "+fmt(rsi,1)+"，短線動能偏熱，回踩策略不需要追高。"
    ]);
  }else if(rsi>=50){
    swingChecks.push([
      "good",
      "✓ RSI "+fmt(rsi,1)+"，目前仍維持偏強區。"
    ]);
  }else{
    swingChecks.push([
      "warn",
      "△ RSI "+fmt(rsi,1)+"，短線動能相對較弱。"
    ]);
  }

  if(price>entryHigh){
    swingChecks.push([
      "warn",
      "⚠ 現價高於回踩觀察區，主要等待價格重新靠近支撐結構。"
    ]);
  }else if(price>=entryLow){
    swingChecks.push([
      "good",
      "✓ 現價已接近策略回踩觀察範圍。"
    ]);
  }


  /* 突破判讀 */

  var breakChecks=[];

  if(price>ma20 && ma20>ma60){
    breakChecks.push([
      "good",
      "✓ 股價、MA20、MA60 維持較完整的多頭排列。"
    ]);
  }else{
    breakChecks.push([
      "warn",
      "△ 均線結構尚未完全符合強勢突破排列。"
    ]);
  }

  if(macd>0){
    breakChecks.push([
      "good",
      "✓ MACD "+fmt(macd,2)+"，目前位於正值區。"
    ]);
  }else{
    breakChecks.push([
      "warn",
      "△ MACD 目前位於負值區，突破動能需要進一步確認。"
    ]);
  }

  if(rsi>=50 && rsi<=78){
    breakChecks.push([
      "good",
      "✓ RSI 位於 50～78 的偏強區間。"
    ]);
  }else if(rsi>78){
    breakChecks.push([
      "warn",
      "⚠ RSI 已超過 78，即使突破也要注意是否離突破區過遠。"
    ]);
  }else{
    breakChecks.push([
      "warn",
      "△ RSI 尚未進入較強動能區。"
    ]);
  }

  if(breakout){

    breakChecks.push([
      "good",
      "✓ 現價已突破原 20 日壓力 "+fmt(resistance)+"。"
    ]);

    if(breakDistanceATR>1.5){
      breakChecks.push([
        "warn",
        "⚠ 現價已離突破位置約 "+fmt(breakDistanceATR,1)+" ATR，風險報酬可能因追價而下降。"
      ]);
    }else{
      breakChecks.push([
        "good",
        "✓ 現價與突破位置距離仍在約 1.5 ATR 內。"
      ]);
    }

  }else{

    breakChecks.push([
      "warn",
      "△ 尚未突破 20 日壓力 "+fmt(resistance)+"，目前仍屬等待階段。"
    ]);
  }


  /* 綜合判讀 */

  var brain=[];

  if(price>ma20 && ma20>ma60){
    brain.push([
      "good",
      "✓ 趨勢：目前維持偏多排列，價格位於 MA20、MA60 上方。"
    ]);
  }else{
    brain.push([
      "warn",
      "△ 趨勢：目前尚未形成完整多頭排列。"
    ]);
  }

  if(rsi>78){
    brain.push([
      "warn",
      "⚠ 動能：RSI 偏熱，代表短線強勢，但同時需要注意追價位置。"
    ]);
  }else if(rsi>=50){
    brain.push([
      "good",
      "✓ 動能：RSI 維持 50 以上，短線動能偏正向。"
    ]);
  }

  if(macd>0){
    brain.push([
      "good",
      "✓ MACD：目前維持正值，趨勢動能偏正向。"
    ]);
  }

  if(price>entryHigh){
    brain.push([
      "warn",
      "△ 回踩策略：目前尚未回到理想觀察區。"
    ]);
  }

  if(!breakout){
    brain.push([
      "warn",
      "△ 突破策略：目前仍需等待 20 日壓力被有效突破。"
    ]);
  }


  var brainSummary="";

  if(
    price>ma20 &&
    ma20>ma60 &&
    rsi>78
  ){

    brainSummary=
      "目前屬於偏多趨勢，但短線已有偏熱現象。回踩策略的重點是等待價格靠近支撐區；突破策略則等待 20 日壓力突破後，再觀察回測是否守住。";

  }else if(
    price>ma20 &&
    ma20>ma60
  ){

    brainSummary=
      "目前技術結構偏多。系統同時保留兩種劇本：價格回到支撐帶時觀察回踩結構，或突破主要壓力後等待回測確認。";

  }else{

    brainSummary=
      "目前趨勢尚未形成完整強勢排列，因此兩套策略都需要更多價格確認，尤其要注意 MA20、主要支撐與 20 日壓力。";
  }


  var change=
    live
      ?Number(live.changePercent)
      :Number(data.changePercent);

  var money=
    data.currency==="USD"
      ?"$"
      :"NT$";

  var market=
    data.market==="US"
      ?"🇺🇸 美股"
      :"🇹🇼 台股";


  var html=

  /* HERO */

  '<div class="hero-card">'+

    '<div class="hero-top">'+

      '<div>'+
        '<div class="hero-symbol">'+safe(symbol)+'</div>'+
        '<div class="hero-name">'+safe(data.name||"")+'</div>'+
        '<div class="market-pill">'+
          market+
          ' · '+
          safe(data.currency||"")+
          ' · '+
          safe(trend)+
        '</div>'+
      '</div>'+

      '<div>'+
        '<div class="hero-price">'+money+fmt(price)+'</div>'+
        '<div class="hero-change '+pclass(change)+'">'+pct(change)+'</div>'+
      '</div>'+

    '</div>'+

    '<div class="indicator-strip">'+
      indicator("MA20",fmt(ma20))+
      indicator("MA60",fmt(ma60))+
      indicator("RSI 14",fmt(rsi,1))+
      indicator("MACD",fmt(macd,2))+
      indicator("ATR",fmt(atr))+
      indicator("20日壓力",fmt(resistance))+
    '</div>'+

  '</div>'+


  /* 總覽 */

  '<div class="big-section-title">📋 波段策略總覽</div>'+

  '<div class="overview-card">'+

    overviewRow(
      "目前趨勢",
      trend,
      trend==="偏多趨勢"
        ?"green"
        :""
    )+

    overviewRow(
      "目前價格",
      fmt(price),
      ""
    )+

    overviewRow(
      "🎯 入場觀察區",
      fmt(entryLow)+" ～ "+fmt(entryHigh),
      "green"
    )+

    overviewRow(
      "💰 第一止盈 TP1",
      fmt(tp1),
      "green"
    )+

    overviewRow(
      "💰 第二止盈 TP2",
      fmt(tp2),
      "green"
    )+

    overviewRow(
      "🔥 第三止盈 TP3",
      fmt(tp3),
      "yellow"
    )+

    overviewRow(
      "🛑 結構失效",
      fmt(stop),
      "red"
    )+

    '<div class="divider"></div>'+

    '<div class="overview-text">'+
      safe(overviewText)+
    '</div>'+

  '</div>'+


  /* 入場區 */

  '<div class="big-section-title">🎯 入場觀察區</div>'+

  '<div class="entry-card">'+

    '<div class="entry-label">波段回踩觀察區</div>'+

    '<div class="entry-price">'+
      fmt(entryLow)+
      ' ～ '+
      fmt(entryHigh)+
    '</div>'+

    '<div class="entry-sub">'+
      '策略計算中心價 '+
      fmt(center)+
      ' · 距現價 '+
      Math.abs(distanceEntry).toFixed(1)+
      '%'+
    '</div>'+

    '<div class="divider"></div>'+

    '<div class="reason-title">為什麼抓這個位置？</div>'+

    '<div class="reason-tags">'+
      renderTags(reasons)+
    '</div>'+

    '<div class="detail-text">'+
      '系統先從 MA20、MA60、近期 10 / 20 / 60 日低點尋找距離現價較近的技術結構，再利用 ATR 衡量近期正常波動範圍。這個區域代表「值得重新觀察價格反應的位置」，不是價格碰到就自動成立。'+
    '</div>'+

  '</div>'+


  /* 支撐策略 */

  '<div class="big-section-title">🟢 支撐回踩波段</div>'+

  '<div class="strategy-card green">'+

    '<div class="strategy-name">支撐回踩策略</div>'+

    '<div class="strategy-status">'+
      '目前狀態：<strong>'+
      safe(swingStatus)+
      '</strong>'+
    '</div>'+

    '<div class="check-list">'+
      renderChecks(swingChecks)+
    '</div>'+

    '<div class="level-grid">'+
      level("觀察區",fmt(entryLow)+" ～ "+fmt(entryHigh))+
      level("結構失效",fmt(stop))+
      level("TP1 · 1.5R",fmt(tp1))+
      level("TP2 · 2.5R",fmt(tp2))+
      level("TP3 · 4R",fmt(tp3))+
    '</div>'+

    '<div class="explain-box">'+
      '策略邏輯：不因為股票處於多頭就直接追價，而是等待價格回到 MA20、近期低點或 ATR 支撐帶附近。進入觀察區後，再觀察是否出現止跌、低點不再下破、重新站回短期結構等確認。若跌破結構失效價，代表原本的回踩劇本需要重新評估。'+
    '</div>'+

  '</div>'+


  /* 突破策略 */

  '<div class="big-section-title">🟣 高 R 突破回測</div>'+

  '<div class="strategy-card purple">'+

    '<div class="strategy-name">突破 → 回測 → 確認</div>'+

    '<div class="strategy-status">'+
      '目前狀態：<strong>'+
      safe(breakStatus)+
      '</strong>'+
    '</div>'+

    '<div class="check-list">'+
      renderChecks(breakChecks)+
    '</div>'+

    '<div class="level-grid">'+
      level("突破壓力",fmt(resistance))+
      level("回測觀察區",fmt(breakLow)+" ～ "+fmt(breakHigh))+
      level("結構失效",fmt(breakStop))+
      level("2R",fmt(r2))+
      level("3R",fmt(r3))+
      level("5R",fmt(r5))+
      level("延伸 · 7R",fmt(r7))+
    '</div>'+

    '<div class="explain-box">'+
      '策略邏輯：先等待價格突破近 20 日主要壓力，再觀察原本的壓力區是否轉成支撐。突破本身不是完整訊號；如果突破後直接拉離突破區超過約 1.5 ATR，系統會提醒距離偏遠，避免把高 R 策略變成高位追價。'+
    '</div>'+

  '</div>'+


  /* 綜合 */

  '<div class="big-section-title">🧠 系統綜合判讀</div>'+

  '<div class="brain-card">'+

    '<div class="brain-summary">'+
      safe(brainSummary)+
    '</div>'+

    renderBrain(brain)+

  '</div>'+


  '<div class="data-note">'+
    '資料來源：'+
    safe(data.liveSource||"FinMind")+
    (
      data.latestDate
        ?' · 最新交易日 '+safe(data.latestDate)
        :''
    )+
    '<br>'+
    '所有價格區間皆為規則式技術分析計算結果，用於觀察市場結構，不代表未來價格一定到達目標。'+
  '</div>';


  el("analysisResult").innerHTML=
    html;
}


function indicator(name,value){
  return (
    '<div class="indicator">'+
      '<span>'+safe(name)+'</span>'+
      '<strong>'+safe(value)+'</strong>'+
    '</div>'
  );
}

function overviewRow(label,value,color){
  return (
    '<div class="overview-row">'+
      '<div class="overview-label">'+safe(label)+'</div>'+
      '<div class="overview-value '+safe(color||"")+'">'+safe(value)+'</div>'+
    '</div>'
  );
}

function level(name,value){
  return (
    '<div class="level-box">'+
      '<span>'+safe(name)+'</span>'+
      '<strong>'+safe(value)+'</strong>'+
    '</div>'
  );
}

function renderTags(tags){
  return tags.map(function(x){
    return '<div class="reason-tag">'+safe(x)+'</div>';
  }).join("");
}

function renderChecks(checks){
  return checks.map(function(x){
    return (
      '<div class="check '+safe(x[0])+'">'+
      safe(x[1])+
      '</div>'
    );
  }).join("");
}

function renderBrain(items){
  return items.map(function(x){
    return (
      '<div class="brain-item '+safe(x[0])+'">'+
      safe(x[1])+
      '</div>'
    );
  }).join("");
}


/* 雷達 */

el("refreshButton").onclick=
  loadRadar;

async function loadRadar(){

  try{

    var response=
      await fetch(
        "/api/radar?t="+Date.now(),
        {cache:"no-store"}
      );

    var data=
      await response.json();

    if(!response.ok||!data.ok){
      throw new Error("雷達失敗");
    }

    radarData=data;

    el("scanCount").textContent=
      fmt(data.scanned,0);

    el("radarCount").textContent=
      fmt(data.found,0);

    el("longCount").textContent=
      fmt(data.longWatchCount,0);

    el("updateText").textContent=
      "FinMind Sponsor 即時資料 · 更新 "+
      new Date().toLocaleTimeString("zh-TW");

    renderStocks(
      "longGrid",
      data.longWatch||[],
      true
    );

    renderStocks(
      "radarGrid",
      data.radar||[],
      false
    );

    countdownSeconds=300;

  }catch(err){

    el("updateText").textContent=
      "即時雷達連線失敗";
  }
}


function renderStocks(target,list,longMode){

  var root=el(target);

  if(!list.length){

    root.innerHTML=
      '<div class="card">目前沒有符合條件的股票</div>';

    return;
  }

  var html="";

  list.forEach(function(stock){

    html+=
      '<article class="stock-card '+
      (
        longMode &&
        stock.longStatus==="優先觀察"
          ?"priority"
          :""
      )+
      '" data-stock="'+safe(stock.symbol)+'">'+

        '<div class="stock-top">'+

          '<div>'+
            '<div class="symbol">'+
              safe(stock.symbol)+
            '</div>'+
            '<div class="name">'+
              safe(stock.name||"台股")+
              ' · '+
              safe(
                longMode
                  ?stock.longStatus
                  :stock.level
              )+
            '</div>'+
          '</div>'+

          '<div class="score">'+
            '<strong>'+safe(stock.score)+'</strong>'+
            '<span>異動分數</span>'+
          '</div>'+

        '</div>'+

        '<div class="price-row">'+
          '<div class="price">'+fmt(stock.price)+'</div>'+
          '<div class="'+pclass(stock.changePercent)+'">'+
            pct(stock.changePercent)+
          '</div>'+
        '</div>'+

        '<div class="chips">'+
          '<div class="chip green">量比 '+fmt(stock.volumeRatio,1)+'x</div>'+
          '<div class="chip">高點 '+fmt(stock.high)+'</div>'+
          '<div class="chip">位置 '+fmt(stock.dayPosition,0)+'%</div>'+
        '</div>'+

      '</article>';
  });

  root.innerHTML=html;

  root.querySelectorAll("[data-stock]")
  .forEach(function(card){

    card.onclick=function(){

      var symbol=
        this.dataset.stock;

      el("symbolInput").value=
        symbol;

      analyze(symbol);
    };
  });
}


/* 5 分鐘自動更新 */

setInterval(function(){

  countdownSeconds--;

  if(countdownSeconds<=0){
    countdownSeconds=300;
    loadRadar();
  }

  var m=
    Math.floor(
      countdownSeconds/60
    );

  var s=
    countdownSeconds%60;

  el("countdown").textContent=
    String(m).padStart(2,"0")+
    ":"+
    String(s).padStart(2,"0");

},1000);


/* 啟動 */

loadRadar();

</script>
