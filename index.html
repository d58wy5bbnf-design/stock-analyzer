<script>

/* =========================
   基本工具
========================= */

const $=id=>
  document.getElementById(id);


function num(v,d=2){

  const n=Number(v);

  if(!Number.isFinite(n))
    return "--";

  return n.toFixed(d);
}


function money(v){

  const n=Number(v);

  if(!Number.isFinite(n))
    return "--";

  if(n>=1000)
    return n.toFixed(0);

  return n.toFixed(2);
}


/* =========================
   雷達
========================= */

let nextRefresh=
  Date.now()+300000;

let radarLoading=false;


async function loadRadar(manual=false){

  if(radarLoading)
    return;

  radarLoading=true;


  $("radarStatus").textContent=
    manual
    ? "正在重新掃描…"
    : "正在取得異動雷達…";


  try{

    const response=
      await fetch(
        "/api/radar?t="+Date.now(),
        {
          cache:"no-store"
        }
      );


    const data=
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "雷達讀取失敗"
      );

    }


    renderRadar(data);


    nextRefresh=
      Date.now()+300000;


  }catch(error){


    $("radarList").innerHTML=

      `<div class="error">
        ⚠️ ${error.message}
      </div>`;


    $("radarStatus").textContent=
      "雷達暫時無法取得";


  }finally{

    radarLoading=false;

  }

}


/* =========================
   顯示雷達
========================= */

function renderRadar(data){

  const radar=
    Array.isArray(data.radar)
    ? data.radar
    : [];


  const now=
    new Date();


  $("radarStatus").textContent=

    `已掃描 ${data.scanned ?? "--"} 檔｜顯示 ${radar.length} 檔｜最後更新 ${
      now.toLocaleTimeString(
        "zh-TW",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )
    }`;


  if(!radar.length){

    $("radarList").innerHTML=

      `<div class="loading">
        今日暫無明顯異動訊號
      </div>`;

    return;

  }


  $("radarList").innerHTML=

    radar.map(x=>{


      let levelClass="green";


      if(x.level==="強異動")
        levelClass="red";

      else if(x.level==="異動")
        levelClass="orange";

      else if(x.level==="蓄勢")
        levelClass="yellow";


      const reasons=
        Array.isArray(x.reasons)
        ? x.reasons
        : [];


      const warnings=
        Array.isArray(x.warnings)
        ? x.warnings
        : [];


      const stockName=
        STOCK_NAMES[x.symbol] ||
        "";


      return `

      <div
        class="radarItem"
        onclick="openStock('${x.symbol}')">


        <div class="radarHead">


          <div>


            <div class="symbolLine">

              <span class="symbol">

                ${x.emoji || "📊"}
                ${x.symbol}

              </span>


              <span class="stockName">

                ${stockName}

              </span>

            </div>


            <div
              class="${levelClass}"
              style="
                margin-top:5px;
                font-weight:800;
              ">

              ${x.level || "觀察"}

            </div>


          </div>


          <div style="text-align:right">


            <div class="score">

              異動分數
              ${num(x.score,0)}

            </div>


            <div
              class="${
                Number(x.changePercent)>=0
                ? "green"
                : "red"
              }"
              style="margin-top:5px">

              ${
                Number(x.changePercent)>=0
                ? "+"
                : ""
              }

              ${num(x.changePercent)}%

            </div>


          </div>


        </div>


        <div class="metrics">


          <span class="tag">

            股價
            ${money(x.price)}

          </span>


          <span class="tag">

            量比
            ${num(x.volumeRatio,1)}x

          </span>


          <span class="tag">

            RSI
            ${num(x.rsi,0)}

          </span>


          <span class="tag">

            ${
              x.breakout
              ? "✓ 已突破20日高"
              : "距20日高 "+num(x.distanceToHigh,1)+"%"
            }

          </span>


        </div>


        <div class="reason">


          ${
            reasons.length
            ? "✓ "+reasons.join("<br>✓ ")
            : "目前為條件觀察"
          }


          ${
            warnings.length
            ?

            `<br>
             <span class="orange">
             ⚠ ${warnings.join("<br>⚠ ")}
             </span>`

            : ""
          }


        </div>


        <div
          class="small"
          style="margin-top:10px">

          點擊查看
          ${stockName || x.symbol}
          完整雙策略分析 →

        </div>


      </div>

      `;


    }).join("");

}


/* =========================
   五分鐘倒數
========================= */

setInterval(()=>{

  const remain=
    Math.max(
      0,
      nextRefresh-Date.now()
    );


  const totalSeconds=
    Math.floor(
      remain/1000
    );


  const min=
    Math.floor(
      totalSeconds/60
    );


  const sec=
    totalSeconds%60;


  $("countdown").textContent=

    `每 5 分鐘自動更新｜下次掃描 ${
      min
    }:${
      String(sec).padStart(2,"0")
    }`;

},1000);


/* =========================
   每五分鐘自動更新
========================= */

setInterval(()=>{

  loadRadar(false);

},300000);


/* =========================
   點擊雷達股票
========================= */

function openStock(symbol){

  $("symbol").value=
    symbol;


  analyzeStock();


  setTimeout(()=>{

    $("result")
      .scrollIntoView({
        behavior:"smooth"
      });

  },150);

}


/* =========================
   技術指標
========================= */

function SMA(arr,p){

  if(arr.length<p)
    return null;


  const a=
    arr.slice(-p);


  return a.reduce(
    (s,v)=>s+v,
    0
  )/p;

}


function EMA(arr,p){

  if(!arr.length)
    return null;


  const k=
    2/(p+1);


  let value=
    arr[0];


  for(
    let i=1;
    i<arr.length;
    i++
  ){

    value=
      arr[i]*k+
      value*(1-k);

  }


  return value;

}


function RSI(arr,p=14){

  if(arr.length<p+1)
    return null;


  let gains=0;
  let losses=0;


  for(
    let i=arr.length-p;
    i<arr.length;
    i++
  ){

    const diff=
      arr[i]-
      arr[i-1];


    if(diff>0)
      gains+=diff;

    else
      losses-=diff;

  }


  if(losses===0)
    return 100;


  const rs=
    (gains/p)/
    (losses/p);


  return 100-
    100/(1+rs);

}


function ATR(rows,p=14){

  if(rows.length<p+1)
    return null;


  let tr=[];


  for(
    let i=rows.length-p;
    i<rows.length;
    i++
  ){

    const current=
      rows[i];


    const prev=
      rows[i-1];


    tr.push(

      Math.max(

        current.high-
        current.low,

        Math.abs(
          current.high-
          prev.close
        ),

        Math.abs(
          current.low-
          prev.close
        )

      )

    );

  }


  return tr.reduce(
    (a,b)=>a+b,
    0
  )/tr.length;

}


/* =========================
   個股分析
========================= */

async function analyzeStock(){

  const symbol=
    $("symbol")
      .value
      .trim()
      .toUpperCase();


  if(!symbol)
    return;


  $("result").innerHTML=

    `<div class="card loading">

      正在分析
      ${symbol}
      ${STOCK_NAMES[symbol] || ""}
      …

    </div>`;


  try{


    const response=
      await fetch(

        `/api/stock?symbol=${
          encodeURIComponent(symbol)
        }&t=${
          Date.now()
        }`,

        {
          cache:"no-store"
        }

      );


    const d=
      await response.json();


    if(!response.ok){

      throw new Error(
        d.error ||
        "行情取得失敗"
      );

    }


    const rows=
      Array.isArray(d.rows)
      ? d.rows
      : [];


    if(rows.length<60){

      throw new Error(
        "歷史資料不足"
      );

    }


    const closes=
      rows.map(
        x=>Number(x.close)
      );


    const dailyClose=
      closes.at(-1);


    const price=

      Number.isFinite(
        Number(d.livePrice)
      )

      ? Number(d.livePrice)

      : dailyClose;


    const ma20=
      SMA(
        closes,
        20
      );


    const ma60=
      SMA(
        closes,
        60
      );


    const rsi=
      RSI(
        closes,
        14
      );


    const macd=

      EMA(
        closes.slice(-80),
        12
      )

      -

      EMA(
        closes.slice(-80),
        26
      );


    const atr=
      ATR(
        rows,
        14
      );


    /* 前20日壓力 */

    const prior20=
      rows.slice(
        -21,
        -1
      );


    const resistance=
      Math.max(
        ...prior20.map(
          x=>Number(x.high)
        )
      );


    /* 近期支撐 */

    const prior10=
      rows.slice(-10);


    const recentLow=
      Math.min(
        ...prior10.map(
          x=>Number(x.low)
        )
      );


    const maSupport=
      Math.min(
        ma20,
        price
      );


    const support=
      Math.max(
        recentLow,
        maSupport-
        atr*0.5
      );


    /* 趨勢 */

    let trend=
      "整理";


    if(
      price>ma20 &&
      ma20>ma60
    ){

      trend=
        "多頭";

    }

    else if(
      price<ma20 &&
      ma20<ma60
    ){

      trend=
        "偏弱";

    }


    /* 突破 */

    const breakoutConfirmed=

      price>
      resistance

      &&

      price>
      ma20;


    /* 支撐回踩 */

    const swingEntryLow=

      Math.max(
        support,
        ma20-
        atr*0.5
      );


    const swingEntryHigh=

      ma20+
      atr*0.35;


    const swingStop=

      Math.min(

        support-
        atr*0.5,

        swingEntryLow-
        atr

      );


    const swingRisk=

      Math.max(
        price-
        swingStop,
        atr
      );


    const swingTP1=

      price+
      swingRisk*1.5;


    const swingTP2=

      price+
      swingRisk*2.5;


    const swingTP3=

      price+
      swingRisk*4;


    /* 高R突破 */

    const breakEntryLow=

      resistance-
      atr*0.25;


    const breakEntryHigh=

      resistance+
      atr*0.35;


    const breakStop=

      resistance-
      atr*0.8;


    const breakRisk=

      Math.max(

        resistance-
        breakStop,

        atr*0.5

      );


    const breakTP1=

      resistance+
      breakRisk*2;


    const breakTP2=

      resistance+
      breakRisk*3;


    const breakTP3=

      resistance+
      breakRisk*5;


    const breakTP4=

      resistance+
      breakRisk*7;


    /* 高R狀態 */

    let breakoutStatus=
      "等待突破";


    let breakoutText=

      "目前尚未有效突破近期壓力，先觀察價格是否帶動能站上壓力區。";


    if(
      breakoutConfirmed
    ){

      breakoutStatus=
        "突破成立・等待回測";


      breakoutText=

        "價格已站上近期壓力。高 R 策略不追價，優先觀察是否回測突破區後仍能守住。";

    }


    if(

      breakoutConfirmed

      &&

      price>
      resistance+
      atr*1.5

    ){

      breakoutStatus=
        "距突破區偏遠";


      breakoutText=

        "價格已明顯離開突破區，風險報酬可能下降；等待新的結構或回測會更符合這套規則。";

    }


    /* 回踩狀態 */

    let swingStatus=
      "等待回踩";


    if(

      price>=
      swingEntryLow

      &&

      price<=
      swingEntryHigh

    ){

      swingStatus=
        "進入支撐觀察區";

    }


    const change=
      Number(d.change);


    const changePercent=
      Number(
        d.changePercent
      );


    const stockName=

      d.name &&
      d.name!==symbol

      ? d.name

      : (
          STOCK_NAMES[symbol] ||
          symbol
        );


    $("result").innerHTML=`

      <div class="card quote">

        <div class="small">

          ${stockName}
          ・
          ${d.symbol || symbol}

        </div>


        <div class="bigPrice">

          ${money(price)}

          <span
            style="
              font-size:16px;
              color:#777;
            ">

            ${d.currency || "TWD"}

          </span>

        </div>


        <div
          class="${
            change>=0
            ? "green"
            : "red"
          }"
          style="
            font-size:18px;
            font-weight:800;
          ">

          ${
            change>=0
            ? "+"
            : ""
          }

          ${num(change)}

          （

          ${
            changePercent>=0
            ? "+"
            : ""
          }

          ${num(changePercent)}%

          ）

        </div>


        <div class="grid">


          <div class="metric">

            <div class="metricLabel">
              前收
            </div>

            <div class="metricValue">
              ${money(d.previousClose)}
            </div>

          </div>


          <div class="metric">

            <div class="metricLabel">
              當日高點
            </div>

            <div class="metricValue">
              ${money(d.dayHigh)}
            </div>

          </div>


          <div class="metric">

            <div class="metricLabel">
              當日低點
            </div>

            <div class="metricValue">
              ${money(d.dayLow)}
            </div>

          </div>


          <div class="metric">

            <div class="metricLabel">
              趨勢結構
            </div>

            <div class="metricValue">
              ${trend}
            </div>

          </div>


        </div>


        <div
          class="small"
          style="margin-top:14px">

          資料來源：
          ${
            d.liveSource ||
            "市場行情資料"
          }

        </div>

      </div>


      <div class="card">

        <div class="sectionTitle">
          📊 技術指標
        </div>


        <div class="grid">


          <div class="metric">

            <div class="metricLabel">
              MA20
            </div>

            <div class="metricValue">
              ${money(ma20)}
            </div>

          </div>


          <div class="metric">

            <div class="metricLabel">
              MA60
            </div>

            <div class="metricValue">
              ${money(ma60)}
            </div>

          </div>


          <div class="metric">

            <div class="metricLabel">
              RSI 14
            </div>

            <div class="metricValue">
              ${num(rsi,1)}
            </div>

          </div>


          <div class="metric">

            <div class="metricLabel">
              MACD 動能
            </div>

            <div class="metricValue">
              ${num(macd,2)}
            </div>

          </div>


          <div class="metric">

            <div class="metricLabel">
              ATR
            </div>

            <div class="metricValue">
              ${money(atr)}
            </div>

          </div>


          <div class="metric">

            <div class="metricLabel">
              20日壓力
            </div>

            <div class="metricValue">
              ${money(resistance)}
            </div>

          </div>


        </div>

      </div>


      <div class="card">

        <div class="sectionTitle">
          🧭 市場結構
        </div>


        <div class="row">

          趨勢：
          <strong>
            ${trend}
          </strong>

        </div>


        <div class="row">

          近期支撐：

          <strong>
            ${money(support)}
          </strong>

        </div>


        <div class="row">

          近期壓力：

          <strong>
            ${money(resistance)}
          </strong>

        </div>


        <div class="row">

          突破狀態：

          <strong
            class="${
              breakoutConfirmed
              ? "green"
              : "yellow"
            }">

            ${
              breakoutConfirmed
              ? "已站上壓力"
              : "尚未突破"
            }

          </strong>

        </div>

      </div>


      <div class="card strategy">

        <div class="sectionTitle green">
          🟢 支撐回踩波段
        </div>


        <div
          class="small"
          style="margin:8px 0 12px">

          核心：順勢等待價格回到支撐附近，
          而不是在離支撐過遠的位置追價。

        </div>


        <div class="row">

          狀態：

          <strong>
            ${swingStatus}
          </strong>

        </div>


        <div class="row">

          入場觀察區：

          <strong>

            ${money(swingEntryLow)}
            ～
            ${money(swingEntryHigh)}

          </strong>

        </div>


        <div class="row">

          結構失效：

          <strong class="red">

            ${money(swingStop)}

          </strong>

        </div>


        <div class="row">
          TP1：
          ${money(swingTP1)}
        </div>


        <div class="row">
          TP2：
          ${money(swingTP2)}
        </div>


        <div class="row">
          TP3：
          ${money(swingTP3)}
        </div>


        <div class="row">

          趨勢延伸：

          若突破 TP3 後結構仍維持，
          可使用 ATR／前波低點追蹤，
          而不是固定猜最高點。

        </div>

      </div>


      <div
        class="card strategy purpleBorder">

        <div class="sectionTitle purple">
          🟣 高 R 突破回測
        </div>


        <div
          class="small"
          style="margin:8px 0 12px">

          核心：先等突破成立，
          再觀察突破區是否轉為支撐。
          高 R 不代表高勝率。

        </div>


        <div class="row">

          狀態：

          <strong>
            ${breakoutStatus}
          </strong>

        </div>


        <div class="row">

          ${breakoutText}

        </div>


        <div class="row">

          突破關鍵價：

          <strong>
            ${money(resistance)}
          </strong>

        </div>


        <div class="row">

          回測觀察區：

          <strong>

            ${money(breakEntryLow)}
            ～
            ${money(breakEntryHigh)}

          </strong>

        </div>


        <div class="row">

          結構失效：

          <strong class="red">

            ${money(breakStop)}

          </strong>

        </div>


        <div class="row">
          2R：
          ${money(breakTP1)}
        </div>


        <div class="row">
          3R：
          ${money(breakTP2)}
        </div>


        <div class="row">
          5R：
          ${money(breakTP3)}
        </div>


        <div class="row">
          7R 延伸：
          ${money(breakTP4)}
        </div>

      </div>

    `;


  }catch(error){


    $("result").innerHTML=

      `<div class="card error">

        ⚠️ ${error.message}

      </div>`;

  }

}


/* Enter 直接分析 */

$("symbol")
.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter")
      analyzeStock();

  }
);


/* 網站打開立即掃描 */

loadRadar(false);

</script>

</body>
</html>
