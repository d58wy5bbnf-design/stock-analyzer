<script>

const WATCH_KEY='swing_tw_watch_v1';
const HISTORY_KEY='swing_tw_search_history_v1';
const PUSH_DEVICE_KEY='swing_tw_push_device_v1';

const DEFAULT=[
'2330','2317','2454','2308',
'2382','3231','2881','2882',
'2891','2886','2603','2615'
];

let tab='signal';
let cache={};
let current='';
let detailTimer=null;
let radarTimer=null;
let searchTimer=null;
let selectedSearchSymbol='';

const $=id=>document.getElementById(id);

const esc=s=>
String(s??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');

const fmt=(n,d=2)=>
Number.isFinite(+n)
?
(+n).toLocaleString(
'zh-TW',
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
:
'--';

const avg=a=>
a.length
?
a.reduce((x,y)=>x+y,0)/a.length
:
0;

const sma=(a,n)=>
a.length>=n
?
avg(a.slice(-n))
:
avg(a);

function ema(a,n){

if(!a.length)return 0;

let e=a[0];

const k=2/(n+1);

for(let i=1;i<a.length;i++){

e=
a[i]*k+
e*(1-k);

}

return e;

}

function rsi(a,n=14){

if(a.length<=n)return 50;

let g=0;
let l=0;

for(let i=a.length-n;i<a.length;i++){

const d=a[i]-a[i-1];

if(d>0)g+=d;
else l-=d;

}

if(l===0)return 100;

return 100-100/(1+(g/n)/(l/n));

}

function atr(rows,n=14){

const v=[];

for(
let i=Math.max(1,rows.length-n);
i<rows.length;
i++
){

const x=rows[i];
const p=rows[i-1].close;

v.push(
Math.max(
x.high-x.low,
Math.abs(x.high-p),
Math.abs(x.low-p)
)
);

}

return avg(v);

}

function clamp(v,min,max){

return Math.min(
max,
Math.max(min,v)
);

}


/* =========================================================
   DEVICE
========================================================= */

function getDeviceId(){

let id=
localStorage.getItem(
PUSH_DEVICE_KEY
);

if(!id){

id=
window.crypto &&
crypto.randomUUID
?
crypto.randomUUID()
:
'device-'+
Date.now()+
'-'+
Math.random()
.toString(36)
.slice(2);

localStorage.setItem(
PUSH_DEVICE_KEY,
id
);

}

return id;

}


/* =========================================================
   WATCHLIST
========================================================= */

function watch(){

try{

const x=
JSON.parse(
localStorage.getItem(WATCH_KEY)||
'[]'
);

return Array.isArray(x)
?
[
...new Set(
x
.map(String)
.filter(
v=>/^\d{4,6}$/.test(v)
)
)
]
:
[];

}
catch{

return [];

}

}

function saveWatchLocal(a){

const clean=
[
...new Set(
(a||[])
.map(String)
.filter(
v=>/^\d{4,6}$/.test(v)
)
)
];

localStorage.setItem(
WATCH_KEY,
JSON.stringify(clean)
);

return clean;

}

async function getCloudWatch(){

const r=
await fetch(
'/api/watchlist?deviceId='+
encodeURIComponent(getDeviceId())+
'&t='+
Date.now(),
{
cache:'no-store'
}
);

const d=
await r.json();

if(!r.ok || !d.ok){

throw Error(
d.error||
'讀取雲端自選失敗'
);

}

return Array.isArray(d.symbols)
?
d.symbols
.map(String)
.filter(v=>/^\d{4,6}$/.test(v))
:
[];

}

async function saveCloudWatch(symbols){

const r=
await fetch(
'/api/watchlist',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
deviceId:getDeviceId(),
symbols
})
}
);

const d=
await r.json();

if(!r.ok || !d.ok){

throw Error(
d.error||
'雲端自選儲存失敗'
);

}

}

async function loadWatchlist(){

const local=watch();

try{

const cloud=
await getCloudWatch();

if(cloud.length){

saveWatchLocal(cloud);

}
else if(local.length){

await saveCloudWatch(local);

}

return watch();

}
catch(e){

console.warn(e);

return local;

}

}


/* =========================================================
   HISTORY
========================================================= */

function searchHistory(){

try{

const x=
JSON.parse(
localStorage.getItem(HISTORY_KEY)||
'[]'
);

return Array.isArray(x)?x:[];

}
catch{

return [];

}

}

function saveHistory(a){

if(!a?.symbol)return;

let h=
searchHistory()
.filter(
x=>x.symbol!==a.symbol
);

h.unshift({
symbol:a.symbol,
name:a.name||'',
time:Date.now()
});

localStorage.setItem(
HISTORY_KEY,
JSON.stringify(
h.slice(0,10)
)
);

}

/* =========================================================
   PIVOT
========================================================= */

function pivots(
rows,
left=3,
right=3
){

const lows=[];
const highs=[];

for(
let i=left;
i<rows.length-right;
i++
){

let lo=true;
let hi=true;

for(let j=1;j<=left;j++){

if(
rows[i].low>
rows[i-j].low
){
lo=false;
}

if(
rows[i].high<
rows[i-j].high
){
hi=false;
}

}

for(let j=1;j<=right;j++){

if(
rows[i].low>
rows[i+j].low
){
lo=false;
}

if(
rows[i].high<
rows[i+j].high
){
hi=false;
}

}

if(lo){

lows.push({
i,
value:rows[i].low
});

}

if(hi){

highs.push({
i,
value:rows[i].high
});

}

}

return {
lows,
highs
};

}


function clusterLevels(
items,
distance
){

const sorted=
items
.filter(
x=>
Number.isFinite(+x.value)
&&
+x.value>0
)
.sort(
(a,b)=>a.value-b.value
);

const groups=[];

for(const item of sorted){

const last=
groups[
groups.length-1
];

if(
last &&
Math.abs(
item.value-
last.value
)<=distance
){

last.values.push(
item.value
);

last.value=
avg(
last.values
);

last.count++;

last.latest=
Math.max(
last.latest,
item.i||0
);

}
else{

groups.push({
value:item.value,
values:[item.value],
count:1,
latest:item.i||0
});

}

}

return groups;

}


/* =========================================================
   TRADE PLAN 8.0

   現價附近最佳 Entry
   ↓
   結構失效 SL
   ↓
   關鍵突破位
   ↓
   TP1 = 突破後第一壓力
   ↓
   TP2
   ↓
   TP3
   ↓
   RR
========================================================= */

function buildTradePlan(
rows,
price,
A,
m20,
m60
){

const recent=
rows.slice(-240);

const P=
pivots(
recent,
3,
3
);

const mergeDistance=
Math.max(
A*.45,
price*.005
);


/* =========================================================
   支撐候選
========================================================= */

const supportRaw=[];


/* Pivot Low */

for(const x of P.lows){

if(
x.value<=price*1.012 &&
x.value>=price*.82
){

supportRaw.push({
value:x.value,
i:x.i
});

}

}


/* MA20 */

if(
Number.isFinite(m20) &&
m20<=price*1.012 &&
m20>=price*.82
){

supportRaw.push({
value:m20,
i:recent.length+5
});

}


/* MA60 */

if(
Number.isFinite(m60) &&
m60<=price*1.012 &&
m60>=price*.82
){

supportRaw.push({
value:m60,
i:recent.length+4
});

}


/* 10 / 20 / 60 日低點 */

for(const n of [10,20,60]){

const part=
rows.slice(-n);

if(!part.length)continue;

const low=
Math.min(
...part.map(x=>x.low)
);

if(
low<=price*1.012 &&
low>=price*.82
){

supportRaw.push({
value:low,
i:recent.length+n
});

}

}


/* =========================================================
   已突破前高 → 可能轉成支撐
========================================================= */

for(const x of P.highs){

if(
x.value>=price*.88 &&
x.value<price
){

const after=
recent.slice(
x.i+1
);

const broken=
after.some(
r=>
r.close>
x.value*1.004
);

if(broken){

supportRaw.push({
value:x.value,
i:x.i
});

}

}

}


/* =========================================================
   支撐群
========================================================= */

const supportGroups=
clusterLevels(
supportRaw,
mergeDistance
)
.filter(
x=>
x.value<=price*1.012 &&
x.value>=price*.82
)
.sort(
(a,b)=>
b.value-a.value
);


/* =========================================================
   第一、第二支撐
========================================================= */

const support1=
supportGroups[0]
?
supportGroups[0].value
:
null;

const support2=
support1
?
supportGroups.find(
x=>
x.value<
support1-
mergeDistance*.75
)?.value
||
null
:
null;


/* =========================================================
   找現價附近「最佳 Entry 支撐」
========================================================= */

const MAX_ENTRY_DISTANCE=
0.045;

const nearbySupports=
supportGroups
.filter(
x=>{

const distance=
(
price-
x.value
)/
price;

return (
distance>=-.012 &&
distance<=MAX_ENTRY_DISTANCE
);

}
);

let bestSupport=null;
let bestSupportScore=-Infinity;

for(const x of nearbySupports){

const distance=
Math.max(
0,
(
price-x.value
)/
price
);

const distanceScore=
Math.max(
0,
1-
distance/
MAX_ENTRY_DISTANCE
)*
45;

const clusterScore=
Math.min(
x.count,
4
)*
10;

const recentScore=
recent.length
?
(
x.latest/
recent.length
)*
15
:
0;

const score=
distanceScore+
clusterScore+
recentScore;

if(score>bestSupportScore){

bestSupportScore=score;
bestSupport=x;

}

}


/* =========================================================
   壓力資料
========================================================= */

const pressureRaw=[];

for(const x of P.highs){

if(
x.value>=price*.90 &&
x.value<=price*1.35
){

pressureRaw.push({
value:x.value,
i:x.i
});

}

}

for(
let end=20;
end<=recent.length;
end+=10
){

const block=
recent.slice(
Math.max(
0,
end-20
),
end
);

if(!block.length)continue;

const high=
Math.max(
...block.map(
x=>x.high
)
);

if(
high>=price*.90 &&
high<=price*1.35
){

pressureRaw.push({
value:high,
i:end
});

}

}

const allPressureGroups=
clusterLevels(
pressureRaw,
mergeDistance
)
.filter(
x=>
x.value>=price*.90 &&
x.value<=price*1.35
)
.sort(
(a,b)=>
a.value-b.value
);


/* =========================================================
   關鍵突破位
========================================================= */

const abovePressures=
allPressureGroups
.filter(
x=>
x.value>
price+
mergeDistance*.15
);

const recentlyCrossed=
allPressureGroups
.filter(
x=>
x.value<=price &&
x.value>=price*.98
)
.sort(
(a,b)=>
b.value-a.value
);

const nextResistance=
abovePressures[0]
?
abovePressures[0].value
:
null;

const crossedResistance=
recentlyCrossed[0]
?
recentlyCrossed[0].value
:
null;

let breakout=
nextResistance;

let breakoutState=
'BELOW';

if(
crossedResistance
){

const crossedDistance=
(
price-
crossedResistance
)/
price;

if(
crossedDistance<=.02
){

breakout=
crossedResistance;
breakoutState=
'BROKEN';

}

}


/* =========================================================
   Entry
========================================================= */

let planType='WAIT';

let entryLow=null;
let entryHigh=null;
let entryMid=null;

let sl=null;

let entryReady=false;

if(bestSupport){

planType='LIMIT';

const base=
bestSupport.value;

entryLow=
base-
Math.max(
A*.18,
price*.002
);

entryHigh=
base+
Math.max(
A*.30,
price*.0035
);

entryHigh=
Math.min(
entryHigh,
price*1.006
);

entryMid=
(
entryLow+
entryHigh
)/2;

const lowerStructures=
[
...P.lows
.map(x=>x.value),

...supportGroups
.map(x=>x.value)
]
.filter(
v=>
v<
base-
mergeDistance*.20
&&
v>=base*.90
)
.sort(
(a,b)=>b-a
);

const invalidation=
lowerStructures[0]
||
support2
||
(
base-
A*.80
);

sl=
invalidation-
Math.max(
A*.25,
price*.003
);

if(
sl>=entryLow
){

sl=
entryLow-
Math.max(
A*.45,
price*.005
);

}

const readyTolerance=
Math.max(
A*.25,
price*.0035
);

entryReady=
price>=
entryLow-
readyTolerance
&&
price<=
entryHigh+
readyTolerance;

}

else{

planType='WAIT';

}


/* =========================================================
   TP
========================================================= */

let tp1=null;
let tp2=null;
let tp3=null;

let tp3Source='';

if(
Number.isFinite(entryMid) &&
breakout
){

const targetPressures=
allPressureGroups
.map(
x=>x.value
)
.filter(
v=>
v>
breakout+
mergeDistance*.55
)
.sort(
(a,b)=>a-b
);

const cleanTargets=[];

for(const v of targetPressures){

const last=
cleanTargets[
cleanTargets.length-1
];

if(
!last ||
v-last>
mergeDistance*.75
){

cleanTargets.push(v);

}

}

tp1=
cleanTargets[0]
||
null;

tp2=
tp1
?
cleanTargets.find(
v=>
v>
tp1+
mergeDistance
)
||
null
:
null;

tp3=
tp2
?
cleanTargets.find(
v=>
v>
tp2+
mergeDistance
)
||
null
:
null;

if(tp3){

tp3Source=
'第三層歷史壓力';

}

if(
!tp3 &&
tp1 &&
tp2
){

const extensionBase=
support2||
support1||
entryMid;

tp3=
tp2+
Math.max(
tp2-extensionBase,
A*3
)*
.618;

tp3Source=
'歷史壓力不足，Fib 0.618 延伸';

}

}


/* =========================================================
   RR
========================================================= */

const risk=
Number.isFinite(entryMid) &&
Number.isFinite(sl) &&
entryMid>sl
?
entryMid-sl
:
null;

const riskPct=
risk
?
risk/
entryMid*
100
:
null;

function rr(target){

if(
!Number.isFinite(target) ||
!risk ||
risk<=0
){

return null;

}

return (
target-
entryMid
)/
risk;

}

const rr1=
rr(tp1);

const rr2=
rr(tp2);

const rr3=
rr(tp3);

const entryDistance=
bestSupport
?
(
price-
bestSupport.value
)/
price*
100
:
null;

const breakoutDistance=
breakout
?
(
breakout-price
)/
price*
100
:
null;

const validPlan=
planType==='LIMIT'
&&
Number.isFinite(entryLow)
&&
Number.isFinite(entryHigh)
&&
Number.isFinite(sl)
&&
sl<entryLow
&&
Number.isFinite(breakout)
&&
Number.isFinite(tp1)
&&
tp1>breakout;

return {

support1,
support2,

bestSupport:
bestSupport
?
bestSupport.value
:
null,

bestSupportStrength:
bestSupport
?
bestSupport.count
:
0,

breakout,

breakoutState,

nextResistance,

crossedResistance,

planType,

entryLow,
entryHigh,
entryMid,

sl,

risk,
riskPct,

tp1,
tp2,
tp3,
tp3Source,

rr1,
rr2,
rr3,

entryReady,

validPlan,

pressureCount:
allPressureGroups.length,

entryDistance,

breakoutDistance

};

}


/* =========================================================
   五大分析
========================================================= */

function analyzeData(
d,
newsData=null
){

if(
!Array.isArray(d.rows) ||
d.rows.length<60
){

throw Error(
'歷史資料不足，無法分析'
);

}

const rows=
d.rows
.map(
x=>({
date:x.date||'',
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0
})
)
.filter(
x=>
Number.isFinite(x.close)
&&
x.close>0
);

if(rows.length<60){

throw Error(
'有效 K 線不足'
);

}

const closes=
rows.map(
x=>x.close
);

let price=
+d.price;

if(
!Number.isFinite(price) ||
price<=0
){

price=
rows.at(-1).close;

}

const m20=
sma(
closes,
20
);

const m60=
sma(
closes,
60
);

const m120=
sma(
closes,
120
);

const A=
Math.max(
atr(rows),
price*.006
);

const R=
rsi(closes);

const macd=
ema(
closes.slice(-120),
12
)
-
ema(
closes.slice(-120),
26
);

const signal=
ema(
closes
.slice(-120)
.map(
(_,i,a)=>
ema(
a.slice(0,i+1),
12
)
-
ema(
a.slice(0,i+1),
26
)
),
9
);

const volume=
rows.at(-1).volume;

const volumeAverage=
avg(
rows
.slice(-21,-1)
.map(
x=>x.volume
)
);

const vr=
volumeAverage
?
volume/
volumeAverage
:
0;

const high20=
Math.max(
...rows
.slice(-20)
.map(
x=>x.high
)
);

let technical=0;
let volumeScore=0;
let chipScore=0;
let fundScore=null;
let newsScore=null;

const conditions=[];

function techCondition(
name,
ok,
points,
description
){

if(ok){

technical+=points;

}

conditions.push([
name,
ok,
description
]);

}

techCondition(
'股價站上 MA20',
price>=m20,
4,
'短線趨勢維持在 20 日均線上方'
);

techCondition(
'MA20 高於 MA60',
m20>m60,
5,
'中期均線維持多頭排列'
);

techCondition(
'MA60 趨勢健康',
m60>=m120*.985,
3,
'中長期趨勢沒有明顯轉弱'
);

techCondition(
'RSI 位於健康區',
R>=45 &&
R<=75,
3,
'動能足夠且尚未極端過熱'
);

techCondition(
'MACD 動能偏多',
macd>=signal,
3,
'短線動能高於訊號線'
);

techCondition(
'股價位於近期相對強勢區',
price>=high20*.96,
2,
'價格接近近期高點，波段結構仍有強度'
);

technical=
clamp(
technical,
0,
20
);


/* =========================================================
   量價
========================================================= */

if(vr>=1){

volumeScore+=6;

}
else if(vr>=.8){

volumeScore+=4;

}
else if(vr>=.6){

volumeScore+=2;

}

const changePercent=
+d.changePercent||
0;

if(
changePercent>0 &&
vr>=1
){

volumeScore+=5;

}
else if(
changePercent>=0
){

volumeScore+=3;

}

let upVolumeDays=0;

const last10=
rows.slice(-10);

for(
let i=1;
i<last10.length;
i++
){

if(
last10[i].close>
last10[i-1].close
&&
last10[i].volume>=
volumeAverage*.8
){

upVolumeDays++;

}

}

volumeScore+=
clamp(
upVolumeDays,
0,
5
);

if(
price>=high20*.98 &&
vr>=1.1
){

volumeScore+=4;

}

volumeScore=
clamp(
volumeScore,
0,
20
);


/* =========================================================
   法人
========================================================= */

const inst=
d.institutional||
{};

if(+inst.total5>0){
chipScore+=5;
}

if(+inst.foreign5>0){
chipScore+=4;
}

if(+inst.trust5>0){
chipScore+=4;
}

if(+inst.total10>0){
chipScore+=3;
}

if(
(+inst.totalBuyDays5||0)>=3
){
chipScore+=2;
}

if(
(+inst.foreignBuyDays5||0)>=3
){
chipScore+=2;
}

chipScore=
clamp(
chipScore,
0,
20
);


/* =========================================================
   基本面
========================================================= */

const fundamental=
d.fundamental||
{};

const revenue=
fundamental.revenue||
{};

const financial=
fundamental.financial||
{};

const fundAvailable=
!!(
revenue.available ||
financial.available
);

if(fundAvailable){

fundScore=0;

if(
financial.profitable===true
){

fundScore+=6;

}
else if(
financial.profitable===undefined ||
financial.profitable===null
){

fundScore+=3;

}

if(
Number.isFinite(
+financial.eps
)
&&
+financial.eps>0
){

fundScore+=4;

}

if(
Number.isFinite(
+financial.epsGrowth
)
&&
+financial.epsGrowth>0
){

fundScore+=3;

}

if(
Number.isFinite(
+revenue.yoy
)
){

if(+revenue.yoy>10){

fundScore+=4;

}
else if(+revenue.yoy>0){

fundScore+=3;

}

}

if(
Number.isFinite(
+revenue.mom
)
&&
+revenue.mom>0
){

fundScore+=3;

}

fundScore=
clamp(
fundScore,
0,
20
);

}


/* =========================================================
   新聞
========================================================= */

if(
newsData?.available
){

newsScore=
clamp(
Math.round(
10+
Number(
newsData.overallScore||
0
)
),
0,
20
);

}


/* =========================================================
   綜合分數
========================================================= */

const availableScores=
[
technical,
volumeScore,
chipScore,
fundScore,
newsScore
]
.filter(
x=>
x!==null &&
Number.isFinite(+x)
);

const normalized=
availableScores.length
?
availableScores.reduce(
(a,b)=>a+b,
0
)/
(
availableScores.length*
20
)*
100
:
0;

const score=
clamp(
Math.round(
normalized
),
0,
100
);

const completeness=
availableScores.length/
5*
100;

const plan=
buildTradePlan(
rows,
price,
A,
m20,
m60
);

return {

...d,

newsData,

price,

m20,
m60,
m120,

A,
R,
vr,

technical,
volumeScore,
chipScore,
fundScore,
newsScore,

score,
completeness,

conditions,

...plan

};

}

function pushSymbols(){

[

...watch()
]
)
];

function urlBase64ToUint8Array(
base64String
){

const padding=
'='.repeat(
(
4-
base64String.length%4
)%4
);

const base64=
(
base64String+
padding
)
.replace(
/-/g,
'+'
)
.replace(
/_/g,
'/'
);

const rawData=
window.atob(
base64
);

const outputArray=
new Uint8Array(
rawData.length
);

for(
let i=0;
i<rawData.length;
++i
){

outputArray[i]=
rawData.charCodeAt(i);

}

return outputArray;

}

async function savePushSubscription(
subscription
){

const r=
await fetch(
'/api/push-subscribe',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:
JSON.stringify({
deviceId:getDeviceId(),
subscription:
subscription.toJSON(),
symbols:
pushSymbols()
})
}
);

const d=
await r.json();

if(!r.ok || !d.ok){

throw Error(
d.error||
'Push 訂閱儲存失敗'
);

}

}

async function syncPushSymbols(){

try{

if(
!(
'serviceWorker'
in navigator
)
){

return;

}

const registration=
await navigator
.serviceWorker
.getRegistration('/');

if(!registration)return;

const subscription=
await registration
.pushManager
.getSubscription();

if(!subscription)return;

await savePushSubscription(
subscription
);

}
catch(e){

console.warn(
'Push 股票同步失敗',
e
);

}

}

async function enablePush(){

if(
!(
'Notification'
in window
)
){

throw Error(
'此瀏覽器不支援通知'
);

}

if(
!(
'PushManager'
in window
)
){

throw Error(
'此瀏覽器不支援背景 Push'
);

}

const permission=
await Notification
.requestPermission();

if(
permission!==
'granted'
){

throw Error(
'通知權限沒有開啟'
);

}

const registration=
await navigator
.serviceWorker
.register(
'/sw.js',
{
scope:'/'
}
);

await navigator
.serviceWorker
.ready;

const configResponse=
await fetch(
'/api/push-config?t='+
Date.now(),
{
cache:'no-store'
}
);

const config=
await configResponse
.json();

if(
!configResponse.ok ||
!config.ok ||
!config.publicKey
){

throw Error(
config.error||
'Push 公鑰取得失敗'
);

}

const oldSubscription=
await registration
.pushManager
.getSubscription();

if(oldSubscription){

try{

await oldSubscription
.unsubscribe();

}
catch(e){

console.warn(
'取消舊 Push 失敗',
e
);

}

}

const subscription=
await registration
.pushManager
.subscribe({
userVisibleOnly:true,
applicationServerKey:
urlBase64ToUint8Array(
config.publicKey
)
});

await savePushSubscription(
subscription
);

$('notify')
.classList
.add(
'push-on'
);

}

$('notify').onclick=
async()=>{

$('notify').disabled=true;

try{

alert(

);

}
catch(e){

const isiOS=
/iPad|iPhone|iPod/

);

const standalone=
window.matchMedia(
'(display-mode: standalone)'
).matches
||

alert(
'請先把「波段分析」加入 iPhone／iPad 主畫面，再從主畫面開啟後按 🔔。'
);

}
else{

alert(
e.message||
'通知開啟失敗'
);

}

}
finally{

$('notify').disabled=false;

}

};
