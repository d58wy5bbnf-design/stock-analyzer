<script>

const WATCH_KEY='swing_tw_watch_v1';
const HISTORY_KEY='swing_tw_search_history_v1';
const PUSH_DEVICE_KEY='swing_tw_push_device_v1';

const DEFAULT=[
'2330','2317','2454','2308',
'2382','3231','2881','2882',
'2891','2886','2603','2615'
];

let tab='signal';
let cache={};
let current='';
let detailTimer=null;
let radarTimer=null;
let searchTimer=null;
let selectedSearchSymbol='';

const $=id=>document.getElementById(id);

const esc=s=>
String(s??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');

const fmt=(n,d=2)=>
Number.isFinite(+n)
?
(+n).toLocaleString(
'zh-TW',
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
:
'--';

const avg=a=>
a.length
?
a.reduce((x,y)=>x+y,0)/a.length
:
0;

const sma=(a,n)=>
a.length>=n
?
avg(a.slice(-n))
:
avg(a);

function ema(a,n){

if(!a.length){
return 0;
}

let e=a[0];

const k=2/(n+1);

for(let i=1;i<a.length;i++){

e=
a[i]*k+
e*(1-k);

}

return e;

}

function rsi(a,n=14){

if(a.length<=n){
return 50;
}

let g=0;
let l=0;

for(let i=a.length-n;i<a.length;i++){

const d=
a[i]-
a[i-1];

if(d>0){
g+=d;
}
else{
l-=d;
}

}

if(l===0){
return 100;
}

return (
100-
100/
(
1+
(g/n)/(l/n)
)
);

}

function atr(rows,n=14){

const v=[];

for(
let i=Math.max(1,rows.length-n);
i<rows.length;
i++
){

const x=rows[i];
const p=rows[i-1].close;

v.push(
Math.max(
x.high-x.low,
Math.abs(x.high-p),
Math.abs(x.low-p)
)
);

}

return avg(v);

}

function clamp(v,min,max){

return Math.min(
max,
Math.max(min,v)
);

}

/* =========================================================
   DEVICE ID
========================================================= */

function getDeviceId(){

let id=
localStorage.getItem(
PUSH_DEVICE_KEY
);

if(!id){

if(
window.crypto &&
crypto.randomUUID
){

id=
crypto.randomUUID();

}
else{

id=
'device-'+
Date.now()+
'-'+
Math.random()
.toString(36)
.slice(2);

}

localStorage.setItem(
PUSH_DEVICE_KEY,
id
);

}

return id;

}

/* =========================================================
   自選
========================================================= */

function watch(){

try{

const x=
JSON.parse(
localStorage.getItem(WATCH_KEY)||
'[]'
);

return Array.isArray(x)
?
[
...new Set(
x
.map(String)
.filter(
v=>
/^\d{4,6}$/.test(v)
)
)
]
:
[];

}
catch{

return [];

}

}

function saveWatchLocal(a){

const clean=
[
...new Set(
(a||[])
.map(String)
.filter(
v=>
/^\d{4,6}$/.test(v)
)
)
];

localStorage.setItem(
WATCH_KEY,
JSON.stringify(clean)
);

return clean;

}

async function getCloudWatch(){

const r=
await fetch(
'/api/watchlist?deviceId='+
encodeURIComponent(
getDeviceId()
)+
'&t='+
Date.now(),
{
cache:'no-store'
}
);

let d;

try{
d=await r.json();
}
catch{
throw Error('雲端自選資料格式錯誤');
}

if(
!r.ok ||
!d.ok
){

throw Error(
d.error||
'讀取雲端自選失敗'
);

}

return Array.isArray(d.symbols)
?
d.symbols
.map(String)
.filter(
v=>
/^\d{4,6}$/.test(v)
)
:
[];

}

async function saveCloudWatch(symbols){

const r=
await fetch(
'/api/watchlist',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:
JSON.stringify({
deviceId:getDeviceId(),
symbols
})
}
);

let d;

try{
d=await r.json();
}
catch{
throw Error('雲端自選儲存格式錯誤');
}

if(
!r.ok ||
!d.ok
){

throw Error(
d.error||
'雲端自選儲存失敗'
);

}

}

async function loadWatchlist(){

const local=
watch();

try{

const cloud=
await getCloudWatch();

if(cloud.length){

saveWatchLocal(cloud);

}
else if(local.length){

await saveCloudWatch(local);

}

return watch();

}
catch(e){

console.warn(
'雲端自選讀取失敗',
e
);

return local;

}

}

/* =========================================================
   搜尋歷史
========================================================= */

function searchHistory(){

try{

const x=
JSON.parse(
localStorage.getItem(HISTORY_KEY)||
'[]'
);

return Array.isArray(x)
?
x
:
[];

}
catch{

return [];

}

}

function saveHistory(a){

if(!a?.symbol){
return;
}

let h=
searchHistory()
.filter(
x=>
x.symbol!==a.symbol
);

h.unshift({
symbol:a.symbol,
name:a.name||'',
time:Date.now()
});

localStorage.setItem(
HISTORY_KEY,
JSON.stringify(
h.slice(0,10)
)
);

}

/* =========================================================
   PIVOT
========================================================= */

function pivots(
rows,
left=3,
right=3
){

const lows=[];
const highs=[];

for(
let i=left;
i<rows.length-right;
i++
){

let lo=true;
let hi=true;

for(let j=1;j<=left;j++){

if(
rows[i].low>
rows[i-j].low
){
lo=false;
}

if(
rows[i].high<
rows[i-j].high
){
hi=false;
}

}

for(let j=1;j<=right;j++){

if(
rows[i].low>
rows[i+j].low
){
lo=false;
}

if(
rows[i].high<
rows[i+j].high
){
hi=false;
}

}

if(lo){

lows.push({
i,
value:rows[i].low
});

}

if(hi){

highs.push({
i,
value:rows[i].high
});

}

}

return {
lows,
highs
};

}

function clusterLevels(
items,
distance
){

const sorted=
items
.filter(
x=>
Number.isFinite(+x.value)
&&
+x.value>0
)
.sort(
(a,b)=>
a.value-b.value
);

const groups=[];

for(const item of sorted){

const last=
groups[
groups.length-1
];

if(
last &&
Math.abs(
item.value-
last.value
)<=distance
){

last.values.push(
item.value
);

last.value=
avg(
last.values
);

last.count++;

last.latest=
Math.max(
last.latest,
item.i||0
);

}
else{

groups.push({
value:item.value,
values:[item.value],
count:1,
latest:item.i||0
});

}

}

return groups;

}

/* =========================================================
   交易規劃 7.0
   回檔 / 突破 / 等待
========================================================= */

function buildTradePlan(
rows,
price,
A,
m20,
m60
){

const recent=
rows.slice(-240);

const P=
pivots(
recent,
3,
3
);

const mergeDistance=
Math.max(
A*.45,
price*.005
);

/* ========================
   支撐
======================== */

const supportRaw=[];

for(const x of P.lows){

if(
x.value<=price*1.01 &&
x.value>=price*.75
){

supportRaw.push({
value:x.value,
i:x.i
});

}

}

if(
Number.isFinite(m20) &&
m20<=price*1.01 &&
m20>=price*.75
){

supportRaw.push({
value:m20,
i:recent.length+1
});

}

if(
Number.isFinite(m60) &&
m60<=price*1.01 &&
m60>=price*.75
){

supportRaw.push({
value:m60,
i:recent.length
});

}

const low20=
Math.min(
...rows
.slice(-20)
.map(
x=>x.low
)
);

const low60=
Math.min(
...rows
.slice(-60)
.map(
x=>x.low
)
);

supportRaw.push({
value:low20,
i:recent.length+2
});

supportRaw.push({
value:low60,
i:recent.length-1
});

const supportGroups=
clusterLevels(
supportRaw,
mergeDistance
)
.filter(
x=>
x.value<=price*1.01 &&
x.value>=price*.75
)
.sort(
(a,b)=>
b.value-a.value
);

const support1=
supportGroups[0]
?
supportGroups[0].value
:
(
Number.isFinite(m20)
?
Math.min(price,m20)
:
price-A
);

const support2=
supportGroups.find(
x=>
x.value<
support1-
mergeDistance
)?.value
||
(
Number.isFinite(m60) &&
m60<support1
?
m60
:
null
);

/* ========================
   壓力
======================== */

const pressureRaw=[];

for(const x of P.highs){

if(
x.value>
price+
mergeDistance*.20
){

pressureRaw.push({
value:x.value,
i:x.i
});

}

}

for(
let i=20;
i<recent.length;
i+=10
){

const block=
recent.slice(
Math.max(
0,
i-20
),
i+1
);

if(!block.length){
continue;
}

const high=
Math.max(
...block.map(
x=>x.high
)
);

if(
high>
price+
mergeDistance*.20
){

pressureRaw.push({
value:high,
i
});

}

}

const pressureGroups=
clusterLevels(
pressureRaw,
mergeDistance
)
.filter(
x=>
x.value>
price+
mergeDistance*.20
)
.sort(
(a,b)=>
a.value-b.value
);

const breakout=
pressureGroups[0]
?
pressureGroups[0].value
:
null;

/* ========================
   判斷策略
======================== */

const supportDistance=
support1>0
?
(
price-support1
)/
price
:
999;

const breakoutDistance=
breakout
?
(
breakout-price
)/
price
:
999;

let planType=
'WAIT';

/*
離有效支撐 5% 內：
回檔型
*/

if(
supportDistance>=-.01 &&
supportDistance<=.05
){

planType=
'PULLBACK';

}

/*
離支撐超過 5%，
但距離上方突破位 3.5% 內：
改成突破型。
*/

else if(
breakout &&
breakoutDistance>=0 &&
breakoutDistance<=.035 &&
supportDistance>.05
){

planType=
'BREAKOUT';

}

/* ========================
   ENTRY / SL
======================== */

let entryLow=null;
let entryHigh=null;
let entryMid=null;
let sl=null;

/* 回檔型 */

if(
planType===
'PULLBACK'
){

entryLow=
support1-
Math.max(
A*.20,
price*.0025
);

entryHigh=
support1+
Math.max(
A*.35,
price*.004
);

entryMid=
(
entryLow+
entryHigh
)/2;

const structuralLows=
P.lows
.map(
x=>x.value
)
.filter(
x=>
x<
support1-
mergeDistance*.20
&&
x>=entryMid*.90
)
.sort(
(a,b)=>
b-a
);

const invalidation=
structuralLows[0]
||
support2
||
(
support1-
A*.8
);

sl=
invalidation-
Math.max(
A*.25,
price*.003
);

if(
sl>=entryLow
){

sl=
entryLow-
Math.max(
A*.40,
price*.0045
);

}

}

/* 突破型 */

else if(
planType===
'BREAKOUT'
){

/*
Entry 改放在突破位附近。

不是叫使用者現在追價，
而是等待突破確認。
*/

entryLow=
breakout-
Math.max(
A*.18,
breakout*.002
);

entryHigh=
breakout+
Math.max(
A*.35,
breakout*.004
);

entryMid=
(
entryLow+
entryHigh
)/2;

/*
突破失敗停損。

不再使用很遠的舊支撐當 SL。
*/

sl=
breakout-
Math.max(
A*.75,
breakout*.012
);

if(
sl>=entryLow
){

sl=
entryLow-
Math.max(
A*.40,
price*.005
);

}

}

const risk=
Number.isFinite(entryMid) &&
Number.isFinite(sl) &&
entryMid>sl
?
entryMid-sl
:
null;

const riskPct=
risk
?
risk/
entryMid*
100
:
null;

/* ========================
   TP
======================== */

/*
TP 必須高於實際 Entry。

突破型時，
breakout 本身是 Entry 依據，
不能又拿 breakout 當 TP1。
*/

const targetBase=
Number.isFinite(entryHigh)
?
entryHigh
:
price;

const targets=
pressureGroups
.map(
x=>x.value
)
.filter(
v=>
v>
targetBase+
mergeDistance*.25
);

const tp1=
targets[0]
||
null;

const tp2=
tp1
?
targets.find(
v=>
v>
tp1+
mergeDistance
)
||
null
:
null;

let tp3=
tp2
?
targets.find(
v=>
v>
tp2+
mergeDistance
)
||
null
:
null;

let tp3Source=
tp3
?
'更高一層歷史壓力'
:
'';

if(
!tp3 &&
tp2 &&
tp1
){

const base=
support2||
support1;

tp3=
tp2+
Math.max(
tp2-base,
A*3
)*.618;

tp3Source=
'歷史壓力不足，Fib 0.618 延伸';

}

/* ========================
   R:R
======================== */

function rr(target){

if(
!Number.isFinite(target) ||
!risk ||
risk<=0
){

return null;

}

return (
target-
entryMid
)/
risk;

}

const rr1=
rr(tp1);

const rr2=
rr(tp2);

const rr3=
rr(tp3);

/* ========================
   是否真正進場
======================== */

let entryReady=
false;

/*
回檔型：
價格真的進入支撐 Entry 區附近。
*/

if(
planType===
'PULLBACK'
){

entryReady=
price>=
entryLow-
Math.max(
A*.25,
price*.004
)
&&
price<=
entryHigh+
Math.max(
A*.35,
price*.006
);

}

/*
突破型：
一定要真的突破 breakout。

只是靠近壓力，
不算 entryReady。
*/

if(
planType===
'BREAKOUT'
){

entryReady=
price>=breakout
&&
price<=
entryHigh+
Math.max(
A*.20,
price*.003
);

}

return {

support1,
support2,

breakout,

planType,

entryLow,
entryHigh,
entryMid,

sl,

risk,
riskPct,

tp1,
tp2,
tp3,
tp3Source,

rr1,
rr2,
rr3,

entryReady,

pressureCount:
pressureGroups.length,

supportDistance:
supportDistance*100,

breakoutDistance:
breakoutDistance===999
?
null
:
breakoutDistance*100

};

}

/* =========================================================
   五大分析
========================================================= */

function analyzeData(
d,
newsData=null
){

if(
!Array.isArray(d.rows) ||
d.rows.length<60
){

throw Error(
'歷史資料不足，無法分析'
);

}

const rows=
d.rows
.map(
x=>({
date:x.date||'',
open:+x.open,
high:+x.high,
low:+x.low,
close:+x.close,
volume:+x.volume||0
})
)
.filter(
x=>
Number.isFinite(x.close)
&&
x.close>0
);

if(rows.length<60){

throw Error(
'有效 K 線不足'
);

}

const closes=
rows.map(
x=>x.close
);

let price=
+d.price;

if(
!Number.isFinite(price) ||
price<=0
){

price=
rows.at(-1).close;

}

const m20=
sma(
closes,
20
);

const m60=
sma(
closes,
60
);

const m120=
sma(
closes,
120
);

const A=
Math.max(
atr(rows),
price*.006
);

const R=
rsi(closes);

const macd=
ema(
closes.slice(-120),
12
)
-
ema(
closes.slice(-120),
26
);

const signal=
ema(
closes
.slice(-120)
.map(
(_,i,a)=>
ema(
a.slice(0,i+1),
12
)
-
ema(
a.slice(0,i+1),
26
)
),
9
);

const volume=
rows.at(-1).volume;

const volumeAverage=
avg(
rows
.slice(-21,-1)
.map(
x=>x.volume
)
);

const vr=
volumeAverage
?
volume/
volumeAverage
:
0;

const high20=
Math.max(
...rows
.slice(-20)
.map(
x=>x.high
)
);

let technical=0;
let volumeScore=0;
let chipScore=0;
let fundScore=null;
let newsScore=null;

const conditions=[];

function techCondition(
name,
ok,
points,
description
){

if(ok){
technical+=points;
}

conditions.push([
name,
ok,
description
]);

}

techCondition(
'股價站上 MA20',
price>=m20,
4,
'短線趨勢維持在 20 日均線上方'
);

techCondition(
'MA20 高於 MA60',
m20>m60,
5,
'中期均線維持多頭排列'
);

techCondition(
'MA60 趨勢健康',
m60>=m120*.985,
3,
'中長期趨勢沒有明顯轉弱'
);

techCondition(
'RSI 位於健康區',
R>=45 &&
R<=75,
3,
'動能足夠且尚未極端過熱'
);

techCondition(
'MACD 動能偏多',
macd>=signal,
3,
'短線動能高於訊號線'
);

techCondition(
'股價位於近期相對強勢區',
price>=high20*.96,
2,
'價格接近近期高點，波段結構仍有強度'
);

technical=
clamp(
technical,
0,
20
);

/* 量價 */

if(vr>=1){
volumeScore+=6;
}
else if(vr>=.8){
volumeScore+=4;
}
else if(vr>=.6){
volumeScore+=2;
}

const changePercent=
+d.changePercent||
0;

if(
changePercent>0 &&
vr>=1
){

volumeScore+=5;

}
else if(
changePercent>=0
){

volumeScore+=3;

}

let upVolumeDays=0;

const last10=
rows.slice(-10);

for(
let i=1;
i<last10.length;
i++
){

if(
last10[i].close>
last10[i-1].close
&&
last10[i].volume>=
volumeAverage*.8
){

upVolumeDays++;

}

}

volumeScore+=
clamp(
upVolumeDays,
0,
5
);

if(
price>=high20*.98 &&
vr>=1.1
){

volumeScore+=4;

}

volumeScore=
clamp(
volumeScore,
0,
20
);

/* 法人 */

const inst=
d.institutional||
{};

if(+inst.total5>0){
chipScore+=5;
}

if(+inst.foreign5>0){
chipScore+=4;
}

if(+inst.trust5>0){
chipScore+=4;
}

if(+inst.total10>0){
chipScore+=3;
}

if((+inst.totalBuyDays5||0)>=3){
chipScore+=2;
}

if((+inst.foreignBuyDays5||0)>=3){
chipScore+=2;
}

chipScore=
clamp(
chipScore,
0,
20
);

/* 基本面 */

const fundamental=
d.fundamental||
{};

const revenue=
fundamental.revenue||
{};

const financial=
fundamental.financial||
{};

const fundAvailable=
!!(
revenue.available ||
financial.available
);

if(fundAvailable){

fundScore=0;

if(
financial.profitable===true
){

fundScore+=6;

}
else if(
financial.profitable===undefined ||
financial.profitable===null
){

fundScore+=3;

}

if(
Number.isFinite(
+financial.eps
)
&&
+financial.eps>0
){

fundScore+=4;

}

if(
Number.isFinite(
+financial.epsGrowth
)
&&
+financial.epsGrowth>0
){

fundScore+=3;

}

if(
Number.isFinite(
+revenue.yoy
)
){

if(+revenue.yoy>10){

fundScore+=4;

}
else if(+revenue.yoy>0){

fundScore+=3;

}

}

if(
Number.isFinite(
+revenue.mom
)
&&
+revenue.mom>0
){

fundScore+=3;

}

fundScore=
clamp(
fundScore,
0,
20
);

}

/* 新聞 */

if(
newsData?.available
){

newsScore=
clamp(
Math.round(
10+
Number(
newsData.overallScore||
0
)
),
0,
20
);

}

/* 綜合 */

const availableScores=
[
technical,
volumeScore,
chipScore,
fundScore,
newsScore
]
.filter(
x=>
x!==null &&
Number.isFinite(+x)
);

const normalized=
availableScores.length
?
availableScores.reduce(
(a,b)=>a+b,
0
)/
(
availableScores.length*
20
)*
100
:
0;

const score=
clamp(
Math.round(
normalized
),
0,
100
);

const plan=
buildTradePlan(
rows,
price,
A,
m20,
m60
);

return {

...d,

newsData,

price,

m20,
m60,
m120,

A,
R,
vr,

technical,
volumeScore,
chipScore,
fundScore,
newsScore,

score,

conditions,

...plan

};

}

let i=0;
i<symbols.length;
i+=BATCH_SIZE
){

const batch=
symbols.slice(
i,
i+BATCH_SIZE
);

const results=
await Promise.allSettled(

batch.map(
async symbol=>{

const a=
await analyzeStock(
symbol,
false
);

return {
symbol,
a
};

}
)

);

result.status===
'fulfilled'

cache[

result.value.a;

function pushSymbols(){

return [
...new Set(
[
...DEFAULT,
...watch()
]
)
];

}

function urlBase64ToUint8Array(
base64String
){

const padding=
'='.repeat(
(
4-
base64String.length%4
)%4
);

const base64=
(
base64String+
padding
)
.replace(
/-/g,
'+'
)
.replace(
/_/g,
'/'
);

const rawData=
window.atob(
base64
);

const outputArray=
new Uint8Array(
rawData.length
);

for(
let i=0;
i<rawData.length;
++i
){

outputArray[i]=
rawData.charCodeAt(i);

}

return outputArray;

}

async function savePushSubscription(
subscription
){

const r=
await fetch(
'/api/push-subscribe',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:
JSON.stringify({
deviceId:getDeviceId(),
subscription:
subscription.toJSON(),
symbols:
pushSymbols()
})
}
);

const d=
await r.json();

if(
!r.ok ||
!d.ok
){

throw Error(
d.error||
'Push 訂閱儲存失敗'
);

}

}

async function syncPushSymbols(){

try{

if(
!(
'serviceWorker'
in navigator
)
){

return;

}

const registration=
await navigator
.serviceWorker
.getRegistration('/');

if(!registration){
return;
}

const subscription=
await registration
.pushManager
.getSubscription();

if(!subscription){
return;
}

await savePushSubscription(
subscription
);

}
catch(e){

console.warn(
'Push 股票同步失敗',
e
);

}

}

async function enablePush(){

if(
!(
'Notification'
in window
)
){

throw Error(
'此瀏覽器不支援通知'
);

}

if(
!(
'PushManager'
in window
)
){

throw Error(
'此瀏覽器不支援背景 Push'
);

}

const permission=
await Notification
.requestPermission();

if(
permission!==
'granted'
){

throw Error(
'通知權限沒有開啟'
);

}

const registration=
await navigator
.serviceWorker
.register(
'/sw.js',
{
scope:'/'
}
);

await navigator
.serviceWorker
.ready;

const configResponse=
await fetch(
'/api/push-config?t='+
Date.now(),
{
cache:'no-store'
}
);

const config=
await configResponse
.json();

if(
!configResponse.ok ||
!config.ok ||
!config.publicKey
){

throw Error(
config.error||
'Push 公鑰取得失敗'
);

}

const oldSubscription=
await registration
.pushManager
.getSubscription();

if(oldSubscription){

try{

await oldSubscription
.unsubscribe();

}
catch(e){

console.warn(
'取消舊 Push 失敗',
e
);

}

}

const subscription=
await registration
.pushManager
.subscribe({
userVisibleOnly:true,
applicationServerKey:
urlBase64ToUint8Array(
config.publicKey
)
});

await savePushSubscription(
subscription
);

$('notify')
.classList
.add(
'push-on'
);

}

$('notify').onclick=
async()=>{

$('notify').disabled=
true;

try{

await enablePush();

alert(
'通知已重新設定完成。'
);

}
catch(e){

const isiOS=
/iPad|iPhone|iPod/
.test(
navigator.userAgent
);

const standalone=
window.matchMedia(
'(display-mode: standalone)'
).matches
||
window.navigator.standalone===true;

if(
isiOS &&
!standalone
){

alert(
'請先把「波段分析」加入 iPhone／iPad 主畫面，再從主畫面開啟後按 🔔。'
);

}
else{

alert(
e.message||
'通知開啟失敗'
);

}

}
finally{

$('notify').disabled=
false;

}

};
