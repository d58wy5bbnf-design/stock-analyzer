<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幽冥分析</title>
<meta name="theme-color" content="#050706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="幽冥分析">

<style>
*{box-sizing:border-box}
:root{
--bg:#050706;
--bg2:#080b09;
--card:#0d110f;
--card2:#101512;
--border:#27302b;
--border2:#344139;
--text:#f7faf8;
--muted:#89938d;
--green:#49e6ad;
--green2:#9cf3d1;
--red:#ff6675;
--red2:#ff9ca5;
--yellow:#ffd166;
--orange:#ff9f43;
--purple:#bd7cff;
--purple2:#e3c5ff;
--blue:#70b7ff;
--cyan:#6ee7f2;
--shadow:0 16px 42px rgba(0,0,0,.28)
}

html{background:var(--bg);scroll-behavior:smooth}

body{
margin:0;
background:
radial-gradient(circle at 15% 0%,rgba(73,230,173,.10),transparent 360px),
radial-gradient(circle at 90% 12%,rgba(112,183,255,.07),transparent 380px),
linear-gradient(180deg,#050706,#030504 55%,#050706);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
-webkit-font-smoothing:antialiased
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
width:min(100%,760px);
margin:auto;
padding:
max(18px,calc(env(safe-area-inset-top) + 12px))
max(14px,calc(env(safe-area-inset-right) + 11px))
max(80px,calc(env(safe-area-inset-bottom) + 24px))
max(14px,calc(env(safe-area-inset-left) + 11px))
}

.header,.section-head,.back-row,.hero-top,.stock-top,.recommend-top,.backtest-head{
display:flex;justify-content:space-between;align-items:center;gap:12px
}

.header{margin-bottom:14px}

.logo{
font-size:26px;
font-weight:950;
letter-spacing:-1.2px;
background:linear-gradient(90deg,#fff,#b9c8c0);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}
.logo small{
display:block;
font-size:11px;
font-weight:700;
color:var(--muted);
-webkit-text-fill-color:var(--muted);
letter-spacing:.5px;
margin-top:3px
}

.notify-btn,.refresh-btn,.more-btn,.favorite-btn,.position-save-btn,.return-recommend-btn,.strategy-quick-btn{
border:1px solid var(--border);
background:linear-gradient(180deg,#121814,#0c100e);
color:#e9efeb;
border-radius:12px;
padding:10px 12px;
font-size:13px;
font-weight:850;
box-shadow:0 5px 14px rgba(0,0,0,.15)
}
.notify-btn:active,.refresh-btn:active,.more-btn:active,.strategy-quick-btn:active{transform:scale(.98)}

.market-tabs{
display:flex;
gap:7px;
background:rgba(8,11,9,.85);
border:1px solid var(--border);
padding:5px;
border-radius:15px;
margin-bottom:14px;
box-shadow:0 8px 24px rgba(0,0,0,.18)
}
.market-tab{
flex:1;border:0;background:transparent;color:#737d77;
padding:11px 6px;border-radius:11px;font-size:13px;font-weight:900
}
.market-tab.active{
background:linear-gradient(180deg,#1a211d,#121713);
color:white;
box-shadow:0 4px 12px rgba(0,0,0,.2)
}

.search-card,.card,.hero-card,.strategy-card,.recommend-card,.position-card,.backtest-card,.ai-card,.track-card,.monster-card{
background:linear-gradient(160deg,rgba(15,20,17,.98),rgba(8,11,9,.98));
border:1px solid var(--border);
border-radius:19px;
box-shadow:var(--shadow)
}

.search-card{padding:14px;margin-bottom:14px;position:relative}
.search-row{display:flex;gap:8px}
.search-input{
flex:1;min-width:0;
border:1px solid #303a34;
background:#060907;
color:white;
border-radius:13px;
padding:14px 12px;
outline:none;
font-size:16px;
font-weight:800
}
.search-input:focus{border-color:#4d7563;box-shadow:0 0 0 3px rgba(73,230,173,.07)}
.search-button{
border:0;border-radius:13px;padding:0 19px;
background:linear-gradient(135deg,#eff8f3,#bfe7d4);
color:#07100b;font-weight:950
}

.search-suggest{
position:absolute;left:14px;right:14px;top:69px;z-index:100;
border:1px solid #303a34;background:rgba(8,11,9,.98);
backdrop-filter:blur(18px);border-radius:14px;overflow:hidden;
box-shadow:0 18px 45px rgba(0,0,0,.55)
}
.search-suggest-item{
width:100%;border:0;border-bottom:1px solid #202722;background:transparent;
color:white;text-align:left;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px
}
.search-suggest-item:last-child{border-bottom:0}
.search-suggest-item:active{background:#151c18}
.suggest-symbol{font-weight:950;font-size:14px}
.suggest-name{font-size:11px;color:#aeb7b2;margin-top:2px}
.suggest-market{font-size:9px;color:#89928d;border:1px solid #303833;border-radius:999px;padding:4px 7px}

.search-examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.example,.history-item{
border:1px solid #27302b;background:#101512;color:#b4bdb8;
border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800
}
.search-history{margin-top:12px;padding-top:11px;border-top:1px solid #202722}
.search-history-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.search-history-title{font-size:11px;color:var(--muted);font-weight:900}
.search-history-clear{border:0;background:transparent;color:#777f7a;font-size:10px;padding:4px}
.search-history-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}

.home-entry-section{
margin:0 0 15px;padding:12px;
border:1px solid rgba(73,230,173,.24);
border-radius:17px;
background:linear-gradient(135deg,rgba(73,230,173,.08),transparent 55%),linear-gradient(180deg,#0d1410,#090d0b);
box-shadow:0 12px 30px rgba(0,0,0,.20)
}
.home-entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 9px}
.home-entry-head-title{font-size:13px;font-weight:950;color:#dff9ee}
.home-entry-head-note{font-size:9px;color:#8fb9a7;border:1px solid #2a493c;background:#0c1812;padding:4px 7px;border-radius:999px}
.home-entry-list{display:grid;gap:7px}
.home-entry-alert{
width:100%;display:flex;align-items:center;gap:9px;padding:10px;min-height:48px;
border:1px solid #2a463b;background:linear-gradient(90deg,#0e1a14,#0a0f0c);
border-radius:13px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer
}
.home-entry-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(73,230,173,.65);flex:0 0 8px}
.home-entry-info{min-width:0;flex:1}
.home-entry-top{display:flex;align-items:center;gap:6px;min-width:0}
.home-entry-symbol{font-size:13px;font-weight:950;white-space:nowrap}
.home-entry-name{font-size:11px;font-weight:800;color:#aeb9b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-entry-bottom{font-size:10px;color:#8fc8af;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-entry-price{text-align:right;white-space:nowrap;flex:0 0 auto}
.home-entry-price strong{display:block;font-size:15px;font-weight:950;color:#fff}
.home-entry-price span{display:block;font-size:9px;color:#7e8a83;margin-top:2px}
.home-entry-close{border:0;background:transparent;color:#69746e;font-size:14px;line-height:1;padding:6px 3px;flex:0 0 auto}

.monster-section{
margin:16px 0 4px;padding:13px;border-radius:19px;
border:1px solid rgba(189,124,255,.28);
background:radial-gradient(circle at top right,rgba(255,159,67,.08),transparent 45%),linear-gradient(150deg,rgba(189,124,255,.08),rgba(10,12,11,.95));
box-shadow:0 15px 36px rgba(0,0,0,.22)
}
.monster-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.monster-title{font-size:16px;font-weight:950}
.monster-sub{font-size:10px;color:#a796b7;line-height:1.65;margin-top:4px}
.monster-list{display:grid;gap:8px}
.monster-item{border:1px solid #43334f;background:linear-gradient(135deg,#160f1d,#0b0c0b);border-radius:14px;padding:12px;cursor:pointer}
.monster-top{display:flex;justify-content:space-between;gap:10px}
.monster-symbol{font-size:16px;font-weight:950}
.monster-name{font-size:10px;color:#b8abbf;margin-left:6px}
.monster-score{text-align:right}
.monster-score strong{font-size:21px;font-weight:950;background:linear-gradient(90deg,#e3c5ff,#ffba70);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.monster-score span{display:block;font-size:8px;color:#8e7c99}
.monster-state{font-size:11px;font-weight:900;color:#e2c5ff;margin-top:6px}
.monster-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.monster-chip{font-size:9px;font-weight:850;padding:5px 7px;border-radius:999px;border:1px solid #493653;color:#cdb6d8;background:#120d16}
.monster-chip.hot{border-color:#654321;color:#ffc887;background:#191107}
.monster-empty{border:1px dashed #43334f;border-radius:13px;padding:14px;font-size:10px;line-height:1.7;color:#998ba1;text-align:center}

.section-head{margin:19px 1px 10px}
.section-title{font-size:15px;font-weight:950}
.section-sub{font-size:11px;line-height:1.6;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:linear-gradient(180deg,#0c110e,#080b09);border:1px solid var(--border);border-radius:15px;padding:12px 9px}
.stat span{display:block;font-size:10px;color:var(--muted)}
.stat strong{display:block;font-size:22px;margin-top:4px}
.update-line{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#858f89;margin:8px 2px 12px}
.stock-grid,.watch-list{display:grid;gap:9px}
.stock-card{border:1px solid var(--border);background:linear-gradient(160deg,#0e1310,#080b09);border-radius:17px;padding:14px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.16)}
.stock-card:active{transform:scale(.995)}
.stock-title-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.symbol{font-size:17px;font-weight:950}
.stock-inline-name{font-size:12px;color:#aeb7b2;font-weight:800}
.stock-strategy-line{font-size:11px;color:#c0c8c3;margin-top:5px;font-weight:800}
.score{text-align:right}.score strong{display:block;font-size:19px}.score span{font-size:9px;color:var(--muted)}
.price-row{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.price{font-size:22px;font-weight:950}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:#b8bdb9}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:10px;font-weight:850;padding:5px 7px;border-radius:999px;border:1px solid #2a332e;color:#adb7b1}
.chip.green{color:#a6ead3;border-color:#28503f}
.watch-open{font-size:10px;color:#727c76;margin-top:11px}
.watch-empty{border:1px dashed #29312c;background:#080b09;border-radius:15px;padding:16px 12px;color:#7b857f;font-size:11px;line-height:1.7;text-align:center}
.watch-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);background:linear-gradient(180deg,#0d120f,#090c0a);padding:12px;border-radius:15px}
.watch-main{min-width:0;flex:1;cursor:pointer}
.watch-symbol{font-weight:950;font-size:14px}
.watch-name{font-size:10px;color:var(--muted);margin-top:2px}
.watch-price{font-size:11px;color:#b6c0ba;margin-top:5px}
.watch-remove{border:1px solid #4b252a;background:#1a0d0f;color:#ff8e98;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:850}

.loading{padding:28px 10px;text-align:center;color:#909a94;font-size:13px}
.error{padding:14px;border:1px solid #4b252a;background:#1a0c0e;border-radius:14px;color:#ff9ba4;font-size:12px;line-height:1.7}
.hidden{display:none!important}

.back-row{margin-bottom:12px}
.back-button{border:1px solid var(--border);background:#0c110e;color:#e1e6e3;padding:10px 12px;border-radius:12px;font-weight:850}
.analysis-refresh{font-size:11px;color:var(--muted)}

.hero-card{
padding:17px;margin-bottom:14px;
background:radial-gradient(circle at top right,rgba(73,230,173,.07),transparent 45%),linear-gradient(160deg,#101612,#090c0a)
}
.hero-top{align-items:flex-start}
.hero-symbol{font-size:27px;font-weight:950}
.hero-name{font-size:13px;font-weight:850;color:#b2bbb6}
.market-pill{display:inline-block;font-size:10px;color:#aeb8b2;border:1px solid #303a34;padding:5px 8px;border-radius:999px;margin-top:7px}
.hero-price{text-align:right;font-size:32px;font-weight:950;letter-spacing:-1px}
.hero-change{text-align:right;font-size:14px;font-weight:900;margin-top:4px}
.favorite-btn{width:100%;margin-top:14px}
.favorite-btn.active{color:#ffe394;border-color:#5c5127;background:#18160c}

.indicator-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.indicator{background:#080b09;border:1px solid #242c27;border-radius:13px;padding:10px 8px}
.indicator span{display:block;font-size:9px;color:#7d8781}
.indicator strong{display:block;font-size:14px;margin-top:3px}
.volume-card{margin-top:12px;border-top:1px solid #202722;padding-top:12px}
.volume-title{font-size:12px;font-weight:900}
.volume-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.volume-box{border:1px solid #252d28;border-radius:11px;padding:8px;background:#080b09}
.volume-box span{display:block;font-size:9px;color:#7d8781}
.volume-box strong{display:block;font-size:12px;margin-top:3px}

.big-section-title{font-size:17px;font-weight:950;margin:21px 2px 10px}

.position-card{padding:16px;margin-bottom:14px}
.position-title,.backtest-title{font-size:18px;font-weight:950}
.position-desc,.backtest-sub{font-size:11px;color:var(--muted);line-height:1.7;margin-top:5px}
.position-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.position-field{background:#080b09;border:1px solid #27302b;border-radius:13px;padding:10px}
.position-field.full{grid-column:1/-1}
.position-field label{display:block;font-size:10px;font-weight:850;color:#929c96;margin-bottom:7px}
.position-input{width:100%;border:0;outline:none;background:transparent;color:#fff;font-size:18px;font-weight:950;padding:0}
.position-unit{font-size:9px;color:#68726c;margin-top:5px}
.position-save-btn{width:100%;margin-top:10px;background:linear-gradient(180deg,#17201a,#101511)}
.position-summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}
.position-summary{border:1px solid #27302b;background:#080b09;border-radius:13px;padding:10px}
.position-summary span{display:block;font-size:9px;color:#7d8781}
.position-summary strong{display:block;font-size:16px;margin-top:5px}

.position-risk{margin-top:12px;border:1px solid #292e2b;border-radius:14px;padding:12px;font-size:11px;line-height:1.75;color:#b4bdb8}
.position-risk.good{border-color:#24513f;background:#0b1712}
.position-risk.warn{border-color:#5b4822;background:#181307}
.position-risk.bad{border-color:#57282e;background:#190c0e}
.position-risk-title{font-size:14px;font-weight:950;margin-bottom:5px;color:#f5f7f6}

.add-plan{margin-top:12px;border-top:1px solid #202722;padding-top:12px}
.add-plan-title{font-size:13px;font-weight:950}
.add-plan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}
.add-plan-box{border:1px solid #294760;background:#081119;border-radius:13px;padding:10px}
.add-plan-box span{display:block;font-size:9px;color:#7f929f}
.add-plan-box strong{display:block;font-size:17px;color:#8bc9ff;margin-top:4px}
.add-plan-box.green{border-color:#28493c;background:#09140f}
.add-plan-box.green strong{color:#a6ead3}
.add-plan-box.yellow{border-color:#554a24;background:#151206}
.add-plan-box.yellow strong{color:#ffc85a}

.capital-card{margin-top:12px;border:1px solid #493c62;background:linear-gradient(180deg,#120d19,#0c0910);border-radius:14px;padding:12px}
.capital-title{font-size:13px;font-weight:950;color:#d7b8ff}
.capital-note{font-size:10px;color:#a99ab7;line-height:1.7;margin-top:5px}

.entry-analysis{margin-top:15px;padding-top:14px;border-top:1px solid #202722}
.entry-analysis-title{font-size:15px;font-weight:950}
.entry-analysis-sub{font-size:11px;color:var(--muted);line-height:1.7;margin-top:4px}
.entry-analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.entry-analysis-box{border:1px solid #27302b;background:#080b09;border-radius:13px;padding:10px}
.entry-analysis-box span{display:block;font-size:9px;color:#7d8781}
.entry-analysis-box strong{display:block;font-size:16px;margin-top:5px}
.entry-status{margin-top:10px;border:1px solid #292e2b;background:#0b0e0c;border-radius:13px;padding:12px;font-size:11px;line-height:1.8;color:#b9bebb}
.entry-status.good{border-color:#28513f;background:#0a1611}
.entry-status.warn{border-color:#594a24;background:#161206}
.entry-status.bad{border-color:#5a292f;background:#180c0e}
.entry-status-title{font-size:14px;font-weight:950;color:#fff;margin-bottom:6px}
.entry-road{margin-top:10px;border:1px solid #294760;background:#081119;border-radius:13px;padding:12px}
.entry-road-title{font-size:13px;font-weight:950;color:#9fd2ff}
.entry-road-text{font-size:11px;line-height:1.8;color:#aebbc5;margin-top:5px}

.track-card{padding:15px;margin-bottom:14px}
.track-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.track-title{font-size:17px;font-weight:950}
.track-sub{font-size:10px;color:#8f9993;line-height:1.7;margin-top:4px}
.track-status{font-size:9px;font-weight:950;padding:6px 8px;border-radius:999px;border:1px solid #2e4b3f;color:#a6ead3;background:#0c1712;white-space:nowrap}
.track-current-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}
.track-level{border:1px solid #27302b;background:#080b09;border-radius:12px;padding:9px}
.track-level span{display:block;font-size:9px;color:#7d8781}
.track-level strong{display:block;font-size:14px;margin-top:4px}
.track-timeline{margin-top:13px;border-top:1px solid #202722}
.track-event{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid #1e2420}
.track-event-dot{width:8px;height:8px;border-radius:50%;background:#49e6ad;margin-top:5px;flex:0 0 8px}
.track-event-dot.tp{background:#ffd166}
.track-event-dot.sl{background:#ff6675}
.track-event-text{font-size:11px;line-height:1.65;color:#c3cbc6}
.track-event-time{font-size:9px;color:#747e78;margin-top:2px}

.recommend-card{padding:15px;margin-bottom:14px;scroll-margin-top:12px}
.recommend-top{align-items:flex-start}
.recommend-name{font-size:21px;font-weight:950}
.recommend-score{text-align:right;min-width:72px}
.recommend-score strong{font-size:28px;line-height:1}
.recommend-score span{display:block;font-size:9px;color:var(--muted);margin-top:5px}
.recommend-note{font-size:11px;color:#a5aea8;line-height:1.75;margin-top:10px}
.recommend-badge{display:inline-block;margin-top:7px;border:1px solid #29483c;color:#a6ead3;background:#0d1713;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}
.recommend-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.recommend-mini{border:1px solid #272f2a;background:#080b09;border-radius:12px;padding:10px 7px;text-align:center;color:var(--text)}
.recommend-mini.best{border-color:#315c4b;background:#0d1713}
.recommend-mini span{display:block;font-size:9px;color:#929c96}
.recommend-mini strong{display:block;font-size:15px;margin-top:4px}
.strategy-jump{cursor:pointer}

.backtest-card{padding:15px;margin-bottom:14px}
.backtest-head{align-items:flex-start}
.backtest-sub{font-size:10px}
.backtest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.backtest-item{border:1px solid #292e2b;background:#080b09;border-radius:14px;padding:11px}
.backtest-item.good{border-color:#28513f;background:#0a1510}
.backtest-item.bad{border-color:#5a292f;background:#180c0e}

<script>
const WATCH_KEY="yaozi_watchlist";
const HISTORY_KEY="yaozi_search_history_v1";
const POSITION_KEY="yaozi_positions_v46";
const NOTIFY_COOLDOWN_KEY="yaozi_entry_notify_cooldown_v1";
const HOME_ENTRY_KEY="yaozi_home_entry_alerts_v1";
const STRATEGY_TRACK_KEY="yaozi_strategy_tracking_v1";
const POSITION_SL_KEY="yaozi_position_sl_notify_v1";
const MONSTER_NOTIFY_KEY="yaozi_monster_notify_v1";

const BACKTEST_DAYS=365;
const BACKTEST_OBSERVE_DAYS=30;
const BACKTEST_MIN_TRADES=8;
const BACKTEST_WARNING_RATE=70;
const BACKTEST_MAX_HOLD=20;

const ENTRY_NOTIFY_COOLDOWN=30*60*1000;
const HOME_ENTRY_LIFETIME=30*60*1000;

var currentAnalysisSymbol="";
var currentAnalysisData=null;
var radarData=null;
var currentMarketMetrics=null;
var currentSetups=null;
var currentBacktests=null;
var analysisRefreshing=false;
var searchTimer=null;
var monsterStocks=[];
var analysisRequestSeq=0;

var expanded={watch:true,strategy:true,long:true,radar:true};
var countdownSeconds=60;

function el(id){return document.getElementById(id)}

function safe(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;")
}

function fmt(v,d=2){
var n=Number(v);
if(!Number.isFinite(n))return"--";
return n.toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d})
}

function pct(v){
var n=Number(v);
if(!Number.isFinite(n))return"--";
return(n>0?"+":"")+fmt(n,2)+"%"
}

function pclass(v){
var n=Number(v);
return n>0?"up":n<0?"down":"flat"
}

function currentTimeText(){
return new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})
}

function dateTimeText(t){
return new Date(t||Date.now()).toLocaleString("zh-TW",{
month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false
})
}

function average(values){
var a=values.map(Number).filter(Number.isFinite);
return a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN
}

function ema(values,period){
var a=values.map(Number).filter(Number.isFinite);
if(!a.length)return NaN;
var k=2/(period+1);
var out=a[0];
for(var i=1;i<a.length;i++)out=a[i]*k+out*(1-k);
return out
}

function sendSystemNotification(title,body,symbol,tag){
if(!("Notification" in window)||Notification.permission!=="granted")return;
try{
var n=new Notification(title,{body:body,tag:tag||("yaozi-"+String(symbol||"")+"-"+Date.now())});
n.onclick=()=>{
try{window.focus()}catch(e){}
if(symbol)analyze(symbol);
try{n.close()}catch(e){}
}
}catch(e){}
}

function showSimpleToast(text){
var stack=el("toastStack");
if(!stack)return;
var n=document.createElement("div");
n.className="entry-toast";
n.innerHTML='<div class="entry-toast-badge">幽冥分析</div><div class="entry-toast-title">'+safe(text)+'</div>';
stack.prepend(n);
setTimeout(()=>n.remove(),3000)
}

function getSearchHistory(){
try{
var d=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
return Array.isArray(d)?d:[]
}catch(e){return[]}
}

function saveSearchHistory(symbol){
symbol=String(symbol||"").trim().toUpperCase();
if(!symbol)return;
var h=getSearchHistory().filter(x=>x!==symbol);
h.unshift(symbol);
localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,10)));
renderSearchHistory()
}

function renderSearchHistory(){
var box=el("searchHistory"),list=el("searchHistoryList");
if(!box||!list)return;
var h=getSearchHistory();

if(!h.length){
box.classList.add("hidden");
list.innerHTML="";
return
}

box.classList.remove("hidden");
list.innerHTML=h.map(s=>'<button class="history-item" data-history="'+safe(s)+'">'+safe(s)+'</button>').join("");

list.querySelectorAll("[data-history]").forEach(b=>{
b.onclick=()=>{
el("searchInput").value=b.dataset.history;
analyze(b.dataset.history)
}
})
}

function localSearchCandidates(q){
q=String(q||"").trim().toLowerCase();
if(!q)return[];
var map=new Map();

function add(x){
if(!x||!x.symbol)return;
var key=String(x.symbol).toUpperCase();
if(!map.has(key))map.set(key,{symbol:key,name:x.name||"",market:x.market||(/^\d+$/.test(key)?"TW":"US")})
}

getWatchlist().forEach(add);
monsterStocks.forEach(add);

if(radarData){
["strategyReady","longWatch","radar"].forEach(k=>(radarData[k]||[]).forEach(add))
}

[
{symbol:"2330",name:"台積電",market:"TW"},
{symbol:"2317",name:"鴻海",market:"TW"},
{symbol:"2454",name:"聯發科",market:"TW"},
{symbol:"2308",name:"台達電",market:"TW"},
{symbol:"6116",name:"彩晶",market:"TW"},
{symbol:"NVDA",name:"NVIDIA 輝達",market:"US"},
{symbol:"AAPL",name:"Apple 蘋果",market:"US"},
{symbol:"TSLA",name:"Tesla 特斯拉",market:"US"},
{symbol:"MSFT",name:"Microsoft 微軟",market:"US"},
{symbol:"AMD",name:"AMD",market:"US"}
].forEach(add);

return[...map.values()].filter(x=>(x.symbol+" "+x.name).toLowerCase().includes(q)).slice(0,10)
}

async function searchStocks(q){
q=String(q||"").trim();
if(!q)return[];
try{
var r=await fetch("/api/search?q="+encodeURIComponent(q)+"&t="+Date.now(),{cache:"no-store"});
if(r.ok){
var d=await r.json();
var a=d.results||d.data||[];
if(Array.isArray(a)&&a.length)return a.slice(0,10)
}
}catch(e){}
return localSearchCandidates(q)
}

function renderSearchSuggestions(items){
var box=el("searchSuggest");
if(!items.length){
box.classList.add("hidden");
box.innerHTML="";
return
}

box.innerHTML=items.map(x=>`
<button class="search-suggest-item" data-suggest="${safe(x.symbol)}">
<div>
<div class="suggest-symbol">${safe(x.symbol)}</div>
<div class="suggest-name">${safe(x.name||"")}</div>
</div>
<div class="suggest-market">${x.market==="US"?"🇺🇸 美股":"🇹🇼 台股"}</div>
</button>`).join("");

box.classList.remove("hidden");

box.querySelectorAll("[data-suggest]").forEach(b=>{
b.onclick=()=>{
var s=b.dataset.suggest;
el("searchInput").value=s;
box.classList.add("hidden");
analyze(s)
}
})
}

el("searchInput").addEventListener("input",()=>{
clearTimeout(searchTimer);
var q=el("searchInput").value.trim();
if(!q){renderSearchSuggestions([]);return}
searchTimer=setTimeout(async()=>{
var a=await searchStocks(q);
if(el("searchInput").value.trim()===q)renderSearchSuggestions(a)
},180)
});

function getWatchlist(){
try{
var d=JSON.parse(localStorage.getItem(WATCH_KEY)||"[]");
if(!Array.isArray(d))return[];
return d.map(x=>typeof x==="string"?{symbol:x,name:"",price:null,changePercent:null}:x).filter(x=>x&&x.symbol)
}catch(e){return[]}
}

function saveWatchlist(list){
localStorage.setItem(WATCH_KEY,JSON.stringify(list));
renderWatchlist()
}

function isFavorite(symbol){
symbol=String(symbol||"").toUpperCase();
return getWatchlist().some(x=>String(x.symbol||"").toUpperCase()===symbol)
}

function addFavorite(d){
if(!d||!d.symbol)return;
var symbol=String(d.symbol).toUpperCase();
var list=getWatchlist().filter(x=>String(x.symbol||"").toUpperCase()!==symbol);
list.unshift({
symbol,
name:d.name||"",
price:Number.isFinite(Number(d.price))?Number(d.price):null,
changePercent:Number.isFinite(Number(d.changePercent))?Number(d.changePercent):null,
market:d.market||"",
addedAt:Date.now()
});
saveWatchlist(list)
}

function removeFavorite(symbol){
symbol=String(symbol||"").toUpperCase();
saveWatchlist(getWatchlist().filter(x=>String(x.symbol||"").toUpperCase()!==symbol))
}

function toggleFavorite(){
if(!currentAnalysisData||!currentAnalysisData.symbol)return;
var s=String(currentAnalysisData.symbol).toUpperCase();
if(isFavorite(s))removeFavorite(s);
else addFavorite(currentAnalysisData);
updateFavoriteButton()
}

function updateFavoriteButton(){
var b=el("favoriteButton");
if(!b)return;
var active=currentAnalysisData&&currentAnalysisData.symbol&&isFavorite(currentAnalysisData.symbol);
b.classList.toggle("active",!!active);
b.textContent=active?"★ 已加入自選｜點擊移除":"☆ 加入自選"
}

function renderWatchlist(){
var box=el("watchList");
var button=el("watchToggleButton");
if(!box)return;

var list=getWatchlist();

if(button){
if(list.length){
button.classList.remove("hidden");
button.textContent=expanded.watch?"全部收起":"全部打開"
}else button.classList.add("hidden")
}

if(!list.length){
box.innerHTML='<div class="watch-empty">目前還沒有自選股票<br>搜尋股票進入分析後，點「☆ 加入自選」即可加入。</div>';
return
}

if(!expanded.watch){box.innerHTML="";return}

box.innerHTML=list.map(item=>{
var c=Number(item.changePercent);
var p=Number.isFinite(Number(item.price))?fmt(item.price):"";
return `
<div class="watch-item">
<div class="watch-main" data-watch-open="${safe(item.symbol)}">
<div class="watch-symbol">${safe(item.symbol)}</div>
<div class="watch-name">${safe(item.name||"")}</div>
${p?`<div class="watch-price">${p}${Number.isFinite(c)?` · <span class="${pclass(c)}">${pct(c)}</span>`:""}</div>`:""}
</div>
<button class="watch-remove" data-watch-remove="${safe(item.symbol)}">移除</button>
</div>`
}).join("");

box.querySelectorAll("[data-watch-open]").forEach(x=>x.onclick=()=>analyze(x.dataset.watchOpen));
box.querySelectorAll("[data-watch-remove]").forEach(b=>{
b.onclick=e=>{e.stopPropagation();removeFavorite(b.dataset.watchRemove)}
})
}

function getPositions(){
try{
var d=JSON.parse(localStorage.getItem(POSITION_KEY)||"{}");
return d&&typeof d==="object"?d:{}
}catch(e){return{}}
}

function getPosition(symbol){
return getPositions()[String(symbol||"").toUpperCase()]||null
}

function savePosition(symbol,data){
var all=getPositions();
symbol=String(symbol||"").toUpperCase();
if(!symbol)return;
all[symbol]={
entry:Number(data.entry)||0,
lots:Math.max(0,Math.floor(Number(data.lots)||0)),
odd:Math.max(0,Math.floor(Number(data.odd)||0)),
capitalReduction:Math.max(0,Math.min(99.99,Number(data.capitalReduction)||0)),
updatedAt:Date.now()
};
localStorage.setItem(POSITION_KEY,JSON.stringify(all))
}

function positionShares(p,market){
if(!p)return 0;
if(market==="US")return Math.max(0,Number(p.lots)||0)+Math.max(0,Number(p.odd)||0);
return Math.max(0,Number(p.lots)||0)*1000+Math.max(0,Number(p.odd)||0)
}

function adjustedPosition(position,market){
var originalShares=positionShares(position,market);
var originalEntry=Number(position?.entry)||0;
var reduction=Math.max(0,Math.min(99.99,Number(position?.capitalReduction)||0));
var remainRatio=1-reduction/100;

if(!originalShares||!originalEntry||remainRatio<=0){
return{originalShares,originalEntry,reduction,shares:originalShares,entry:originalEntry}
}

return{
originalShares,
originalEntry,
reduction,
shares:originalShares*remainRatio,
entry:originalEntry/remainRatio
}
}

function historicalRSI(rows,period=14){
if(rows.length<period+1)return 50;
var a=rows.slice(-(period+1)),gain=0,loss=0;
for(var i=1;i<a.length;i++){
var diff=Number(a[i].close)-Number(a[i-1].close);
if(diff>0)gain+=diff;else loss+=Math.abs(diff)
}
var ag=gain/period,al=loss/period;
if(al===0)return 100;
return 100-(100/(1+ag/al))
}

function historicalMACD(rows){
var c=rows.map(x=>Number(x.close)).filter(Number.isFinite);
if(c.length<26)return 0;
return ema(c.slice(-80),12)-ema(c.slice(-80),26)
}

function historicalATR(rows,period=14){
if(rows.length<2)return 0;
var a=rows.slice(-(period+1)),trs=[];
for(var i=1;i<a.length;i++){
var h=Number(a[i].high),l=Number(a[i].low),pc=Number(a[i-1].close);
var tr=Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc));
if(Number.isFinite(tr))trs.push(tr)
}
return average(trs)||0
}

function marketOf(d){
var rows=d.rows||[];
var last=rows.at(-1)||{};
var price=Number(d.price)||Number(last.close)||0;
var ma20=Number(d.ma20),ma60=Number(d.ma60),rsi=Number(d.rsi),macd=Number(d.macd),atr=Number(d.atr);

if(!Number.isFinite(ma20))ma20=average(rows.slice(-20).map(x=>x.close))||price;
if(!Number.isFinite(ma60))ma60=average(rows.slice(-60).map(x=>x.close))||price;
if(!Number.isFinite(rsi))rsi=50;
if(!Number.isFinite(macd))macd=0;
if(!Number.isFinite(atr)||atr<=0)atr=historicalATR(rows,14)||price*.02;

var recent20=rows.slice(-20);
var highs=recent20.map(x=>Number(x.high)).filter(Number.isFinite);
var lows=recent20.map(x=>Number(x.low)).filter(Number.isFinite);
var lows10=rows.slice(-10).map(x=>Number(x.low)).filter(Number.isFinite);

var resistance=Number(d.resistance);
if(!Number.isFinite(resistance))resistance=highs.length?Math.max(...highs):price;

var support=Number(d.support);
if(!Number.isFinite(support))support=lows.length?Math.min(...lows):ma20;

var low10=lows10.length?Math.min(...lows10):support;

return{price,ma20,ma60,rsi,macd,atr,resistance,support,low10,rows}
}

function volumeMetrics(d,rows){
var last=rows.at(-1)||{};
var current=Number(d.volume??last.volume);
if(!Number.isFinite(current))current=0;
var vols=rows.slice(-21,-1).map(x=>Number(x.volume)).filter(Number.isFinite);
var average20=vols.length?average(vols):0;
var ratio=Number(d.volumeRatio);
if(!Number.isFinite(ratio)||ratio<=0)ratio=average20>0?current/average20:1;

var level="正常量";
if(ratio>=2)level="明顯放量";
else if(ratio>=1.5)level="放量";
else if(ratio>=1.2)level="量能增溫";
else if(ratio<.7)level="量縮";

return{current,average20,ratio,level}
}

function structureHealthy(m){
var rows=m.rows||[];
if(rows.length<10)return true;
var c=rows.slice(-5).map(x=>Number(x.close)).filter(Number.isFinite);
if(c.length<3)return true;
return c.at(-1)>=c[0]*.96&&m.price>=m.ma60*.97
}

];

function pack(a){
var passed=a.filter(x=>x.pass).length;
return{conditions:a,passed,total:a.length,score:Math.round(passed/a.length*100),qualified:passed>=7}
}

return{PULLBACK:pack(pull),HIGH_R:pack(high),SURGE:pack(surge)}
}

function bestSetup(setups){
var a=[
{type:"PULLBACK",name:"支撐回踩",setup:setups.PULLBACK},
{type:"HIGH_R",name:"高 R 突破",setup:setups.HIGH_R},
{type:"SURGE",name:"強勢續攻",setup:setups.SURGE}
];
a.sort((x,y)=>y.setup.score-x.setup.score||y.setup.passed-x.setup.passed);
return a[0]
}

/*
核心修正：
1. 進場區永遠不能整段高於目前市價。
2. entryLow <= entryHigh <= current price。
3. 停損一定低於進場區。
4. TP 一定高於進場中心。
*/
function strategyTargets(type,m){
var price=Number(m.price)||0;
if(!price)return{
entryLow:0,entryHigh:0,center:0,
stop1:0,stop2:0,previousHigh:0,
risk:0,tp1:0,tp2:0,tp3:0
};

var atr=Math.max(Number(m.atr)||price*.02,price*.005);
var ma20=Number(m.ma20)||price;
var ma60=Number(m.ma60)||price;
var resistance=Number(m.resistance)||price;
var support=Number(m.support)||ma20;
var low10=Number(m.low10)||support;

var entryLow,entryHigh,stop1,stop2;

if(type==="PULLBACK"){
entryHigh=Math.min(
price,
ma20+atr*.20
);

entryLow=Math.min(
entryHigh,
Math.max(
Math.min(ma20,support),
price-atr*.55
)
);

entryLow=Math.max(entryLow,price-atr*1.25);

stop1=Math.min(
entryLow-atr*.45,
support-atr*.20
);

stop2=Math.min(
stop1-atr*.55,
ma60-atr*.30,
low10-atr*.25
);

}else if(type==="HIGH_R"){

entryHigh=price;

entryLow=Math.max(
price-atr*.45,
Math.min(resistance-atr*.10,price)
);

entryLow=Math.min(entryLow,entryHigh);

stop1=Math.min(
entryLow-atr*.50,
price-atr*.75
);

stop2=Math.min(
stop1-atr*.60,
ma20-atr*.35,
low10-atr*.25
);

}else{

entryHigh=price;

entryLow=Math.max(
price-atr*.40,
Math.min(ma20,price)
);

entryLow=Math.min(entryLow,entryHigh);

stop1=Math.min(
entryLow-atr*.50,
price-atr*.85
);

stop2=Math.min(
stop1-atr*.60,
ma20-atr*.45,
low10-atr*.35
);
}

/* 最後安全鎖：任何股票、任何價格都不能出現進場價高於現價 */
entryHigh=Math.min(entryHigh,price);
entryLow=Math.min(entryLow,entryHigh);

if(entryLow<=0)entryLow=Math.max(price-atr,price*.50);
if(entryHigh<=0)entryHigh=price;

entryHigh=Math.min(entryHigh,price);
entryLow=Math.min(entryLow,entryHigh);

var center=(entryLow+entryHigh)/2;

/* SL 必須低於進場 */
if(!Number.isFinite(stop1)||stop1>=entryLow){
stop1=entryLow-Math.max(atr*.55,price*.005)
}

if(!Number.isFinite(stop2)||stop2>=stop1){
stop2=stop1-Math.max(atr*.65,price*.006)
}

stop1=Math.max(0.000001,stop1);
stop2=Math.max(0.000001,Math.min(stop2,stop1-Math.max(atr*.1,price*.001)));

var risk=Math.max(center-stop1,atr*.45);

/* 前高可以低於現價，但 TP 不會低於進場中心 */
var previousHigh=Math.max(resistance,center);

var tp1=Math.max(
previousHigh,
center+risk*1.2,
price+atr*.20
);

var tp2=Math.max(
tp1+atr*.35,
center+risk*2
);

var tp3=Math.max(
tp2+atr*.45,
center+risk*3
);

return{
entryLow,
entryHigh,
center,
stop1,
stop2,
previousHigh,
risk,
tp1,
tp2,
tp3
}
}

function monsterMetrics(d,m,v){
var rows=m.rows||[];
var last5=rows.slice(-5);
var last10=rows.slice(-10);
var closes5=last5.map(x=>Number(x.close)).filter(Number.isFinite);
var closes10=last10.map(x=>Number(x.close)).filter(Number.isFinite);

var fiveReturn=closes5.length>=2?(closes5.at(-1)/closes5[0]-1)*100:0;
var tenReturn=closes10.length>=2?(closes10.at(-1)/closes10[0]-1)*100:0;

var greenCount=0,strongClose=0;
last5.forEach(r=>{
var o=Number(r.open),c=Number(r.close),h=Number(r.high),l=Number(r.low);
if(c>o)greenCount++;
if(Number.isFinite(h)&&Number.isFinite(l)&&h>l&&c>=l+(h-l)*.72)strongClose++
});

var atrPct=m.price?m.atr/m.price*100:0;
var nearHigh=m.price>=m.resistance-m.atr*.7;
var trend=m.ma20>=m.ma60*.985&&m.price>=m.ma20*.98;
var momentum=m.macd>0&&m.rsi>=52;
var notTooHot=m.rsi<=78;
var volumeWarm=v.ratio>=1.25;
var volumeHot=v.ratio>=1.6;
var accelerating=fiveReturn>0&&fiveReturn>=tenReturn*.35;
var priceStrength=greenCount>=3||strongClose>=3;

var score=0;
if(trend)score+=16;
if(momentum)score+=16;
if(nearHigh)score+=15;
if(volumeWarm)score+=13;
if(volumeHot)score+=7;
if(priceStrength)score+=12;
if(accelerating)score+=10;
if(atrPct>=1.5)score+=6;
if(notTooHot)score+=5;

score=Math.min(100,score);

var alreadyExploded=fiveReturn>=18||tenReturn>=30||m.rsi>82;

var state="觀察中";
if(alreadyExploded)state="已明顯噴出｜避免追高";
else if(score>=85)state="🔥 啟動確認";
else if(score>=75)state="⚡ 啟動前兆";
else if(score>=65)state="👀 異常增溫";

var atr=Math.max(m.atr,m.price*.008);

/* 妖股進場區同樣禁止高於現價 */
var entryHigh=m.price;
var entryLow=Math.max(m.price-atr*.40,Math.min(m.ma20,m.price));
entryLow=Math.min(entryLow,entryHigh);

var sl1=Math.min(entryLow-atr*.55,m.ma20-atr*.35);
var sl2=Math.min(sl1-atr*.65,m.ma60-atr*.35);

if(sl1>=entryLow)sl1=entryLow-atr*.55;
if(sl2>=sl1)sl2=sl1-atr*.65;

var center=(entryLow+entryHigh)/2;
var risk=Math.max(center-sl1,atr*.6);
var tp1=Math.max(m.resistance,center+risk*1.4,m.price+atr*.2);
var tp2=Math.max(tp1+atr*.5,center+risk*2.3);
var tp3=Math.max(tp2+atr*.7,center+risk*3.5);

return{
score,state,alreadyExploded,
fiveReturn,tenReturn,atrPct,greenCount,strongClose,
entryLow,entryHigh,sl1,sl2,tp1,tp2,tp3
}
}

function getMonsterNotify(){

}

function checkMonsterNotification(d,m,v,monster){
if(!monster||monster.alreadyExploded||monster.score<85)return;
var price=Number(m.price)||0;
if(price<monster.entryLow||price>monster.entryHigh)return;

var key=String(d.symbol).toUpperCase();
var store=getMonsterNotify();

if(store[key]&&Date.now()-store[key]<6*60*60*1000)return;

store[key]=Date.now();
localStorage.setItem(MONSTER_NOTIFY_KEY,JSON.stringify(store));

sendSystemNotification(
"🔥 幽冥分析｜妖股啟動提醒",
String(d.symbol)+" "+(d.name||"")+"｜妖股分數 "+monster.score+"｜現價 "+fmt(price)+"｜啟動區 "+fmt(monster.entryLow)+"～"+fmt(monster.entryHigh),
d.symbol,
"monster-"+key
);

showSimpleToast(d.symbol+" 妖股啟動分數 "+monster.score)
}

function getStrategyTracks(){
try{
var d=JSON.parse(localStorage.getItem(STRATEGY_TRACK_KEY)||"{}");
return d&&typeof d==="object"?d:{}
}catch(e){return{}}
}

function saveStrategyTracks(all){
localStorage.setItem(STRATEGY_TRACK_KEY,JSON.stringify(all))
}

function getStockTracks(symbol){
var all=getStrategyTracks();
var a=all[String(symbol||"").toUpperCase()];
return Array.isArray(a)?a:[]
}

function addTrackEvent(track,type,price,text){
track.events=Array.isArray(track.events)?track.events:[];
track.events.unshift({type:type,price:Number(price)||0,text:text,at:Date.now()});
track.events=track.events.slice(0,80)
}

function findActiveTrack(symbol,type){
return getStockTracks(symbol).find(x=>x&&x.strategyType===type&&!x.closedAt)
}

function createTrack(d,b,t,price){
var all=getStrategyTracks();
var symbol=String(d.symbol||"").toUpperCase();
var list=Array.isArray(all[symbol])?all[symbol]:[];

var existing=list.find(x=>x.strategyType===b.type&&!x.closedAt);
if(existing)return existing;

var now=Date.now();
var track={
id:symbol+"_"+b.type+"_"+now,
symbol:symbol,
name:d.name||"",
market:d.market||"",
strategyType:b.type,
strategyName:b.name,
createdAt:now,
enteredAt:now,
entryPrice:price,
originalLevels:{
entryLow:t.entryLow,entryHigh:t.entryHigh,
sl1:t.stop1,sl2:t.stop2,tp1:t.tp1,tp2:t.tp2,tp3:t.tp3
},
currentLevels:{
entryLow:t.entryLow,entryHigh:t.entryHigh,
sl1:t.stop1,sl2:t.stop2,tp1:t.tp1,tp2:t.tp2,tp3:t.tp3,
updatedAt:now
},
hit:{entry:true,tp1:false,tp2:false,tp3:false,sl1:false,sl2:false},
events:[]
};

addTrackEvent(track,"ENTRY",price,"進入 "+b.name+" 進場區 "+fmt(t.entryLow)+"～"+fmt(t.entryHigh)+"，當時現價 "+fmt(price));
list.unshift(track);
all[symbol]=list.slice(0,20);
saveStrategyTracks(all);
return track
}

function materiallyDifferent(oldValue,newValue,m){
var o=Number(oldValue),n=Number(newValue);
if(!Number.isFinite(o)||!Number.isFinite(n))return true;
var threshold=Math.max(Number(m.atr||0)*.25,Number(m.price||0)*.003);
return Math.abs(o-n)>=threshold
}

function updateStrategyTracking(d,m,setups){
if(!d||!d.symbol||!m||!setups)return;

var symbol=String(d.symbol).toUpperCase();
var all=getStrategyTracks();
var list=Array.isArray(all[symbol])?all[symbol]:[];
if(!list.length)return;

var changed=false;
var price=Number(m.price)||0;

list.forEach(track=>{
if(!track||track.closedAt)return;

var candidate=strategyTargets(track.strategyType,m);
var old=track.currentLevels||track.originalLevels||{};
var next={...old};

/* 即時價位重新計算 */
["entryLow","entryHigh","tp1","tp2","tp3"].forEach(k=>{
var candidateKey=k;
var value=candidate[candidateKey];
if(materiallyDifferent(old[k],value,m))next[k]=value
});

/* 再加安全鎖，追蹤中的進場區也不能高於目前市價 */
next.entryHigh=Math.min(Number(next.entryHigh)||price,price);
next.entryLow=Math.min(Number(next.entryLow)||next.entryHigh,next.entryHigh);

if(materiallyDifferent(old.sl1,candidate.stop1,m)){
next.sl1=Math.max(Number(old.sl1)||candidate.stop1,candidate.stop1)
}
if(materiallyDifferent(old.sl2,candidate.stop2,m)){
next.sl2=Math.max(Number(old.sl2)||candidate.stop2,candidate.stop2)
}

next.updatedAt=Date.now();
track.currentLevels=next;

var hit=track.hit||(track.hit={entry:true,tp1:false,tp2:false,tp3:false,sl1:false,sl2:false});

function hitEvent(key,label,level,type){
if(hit[key])return;
hit[key]=true;
addTrackEvent(track,type,price,label+"｜現價 "+fmt(price)+"｜目標 "+fmt(level));
sendSystemNotification(
"幽冥分析｜"+symbol+" "+label,
(track.name||"")+"｜現價 "+fmt(price)+"｜"+label+" "+fmt(level),
symbol,
"track-"+track.id+"-"+key
);
changed=true
}

if(price<=Number(next.sl2)){
hitEvent("sl1","觸及 SL1",next.sl1,"SL");
hitEvent("sl2","觸及 SL2",next.sl2,"SL");
track.closedAt=Date.now();
track.status="SL2"
}else if(price<=Number(next.sl1)){
hitEvent("sl1","觸及 SL1",next.sl1,"SL");
track.status="SL1"
}else{
if(price>=Number(next.tp1))hitEvent("tp1","達到 TP1",next.tp1,"TP");
if(price>=Number(next.tp2))hitEvent("tp2","達到 TP2",next.tp2,"TP");
if(price>=Number(next.tp3)){
hitEvent("tp3","達到 TP3",next.tp3,"TP");
track.closedAt=Date.now();
track.status="TP3"
}
}

changed=true
});

if(changed){
all[symbol]=list;
saveStrategyTracks(all)
}
}

function getNotifyCooldown(){
try{return JSON.parse(localStorage.getItem(NOTIFY_COOLDOWN_KEY)||"{}")||{}}
catch(e){return{}}
}

function canNotify(key){
var d=getNotifyCooldown();
return !d[key]||Date.now()-d[key]>ENTRY_NOTIFY_COOLDOWN
}

function markNotified(key){
var d=getNotifyCooldown();
d[key]=Date.now();
Object.keys(d).forEach(k=>{if(Date.now()-d[k]>86400000)delete d[k]});
localStorage.setItem(NOTIFY_COOLDOWN_KEY,JSON.stringify(d))
}

function getHomeEntryAlerts(){
try{
var d=JSON.parse(localStorage.getItem(HOME_ENTRY_KEY)||"[]");
return Array.isArray(d)?d:[]
}catch(e){return[]}
}

function cleanHomeEntryAlerts(){
var now=Date.now();
var list=getHomeEntryAlerts().filter(x=>x&&x.symbol&&Number(x.expiresAt)>now);
localStorage.setItem(HOME_ENTRY_KEY,JSON.stringify(list));
return list
}

function saveHomeEntryAlerts(list){
localStorage.setItem(HOME_ENTRY_KEY,JSON.stringify(list));
renderHomeEntryAlerts()
}

function removeHomeEntryAlert(id){
saveHomeEntryAlerts(getHomeEntryAlerts().filter(x=>x.id!==id))
}

function renderHomeEntryAlerts(){
var section=el("homeEntrySection"),box=el("homeEntryList");
if(!section||!box)return;

var list=cleanHomeEntryAlerts();
if(!list.length){
section.classList.add("hidden");
box.innerHTML="";
return
}

section.classList.remove("hidden");
list.sort((a,b)=>Number(b.createdAt)-Number(a.createdAt));

box.innerHTML=list.map(x=>`

box.querySelectorAll("[data-entry-open]").forEach(x=>x.onclick=()=>analyze(x.dataset.entryOpen));
box.querySelectorAll("[data-entry-close]").forEach(x=>{

})

function addHomeEntryAlert(d,b,t,price){
var now=Date.now();
var symbol=String(d.symbol||"").toUpperCase();
var id=symbol+"_"+b.type;
var list=cleanHomeEntryAlerts();
var existing=list.find(x=>x.id===id);

if(existing){
existing.name=d.name||existing.name||"";
existing.price=price;
existing.entryLow=t.entryLow;
existing.entryHigh=Math.min(t.entryHigh,price);
existing.strategyName=b.name;
localStorage.setItem(HOME_ENTRY_KEY,JSON.stringify(list));
renderHomeEntryAlerts();
return false
}

list.unshift({
id,symbol,
name:d.name||"",
market:d.market||"",
type:b.type,
strategyName:b.name,
price,
entryLow:t.entryLow,
entryHigh:Math.min(t.entryHigh,price),
createdAt:now,
expiresAt:now+HOME_ENTRY_LIFETIME
});

localStorage.setItem(HOME_ENTRY_KEY,JSON.stringify(list));
renderHomeEntryAlerts();
return true
}

function checkEntryNotification(d,m,setups){
if(!d||!d.symbol||!m||!setups)return;

var b=bestSetup(setups);

/* 必須真的符合策略，不能只靠分數顯示進場 */
if(!b.setup.qualified)return;

var t=strategyTargets(b.type,m);
var price=Number(m.price)||Number(d.price)||0;

if(!price||price<t.entryLow||price>t.entryHigh)return;
if(b.setup.score<75)return;

var key=String(d.symbol).toUpperCase()+"_"+b.type;
var active=findActiveTrack(d.symbol,b.type);

if(!active)createTrack(d,b,t,price);

var existing=getHomeEntryAlerts().find(x=>x.id===key&&Number(x.expiresAt)>Date.now());

if(existing){
addHomeEntryAlert(d,b,t,price);
return
}

if(!canNotify(key))return;

markNotified(key);
addHomeEntryAlert(d,b,t,price);

sendSystemNotification(
"🎯 幽冥分析｜進入高品質進場區",
String(d.symbol)+" "+(d.name||"")+"｜"+b.name+" "+b.setup.score+"分｜現價 "+fmt(price)+"｜進場 "+fmt(t.entryLow)+"～"+fmt(t.entryHigh),
d.symbol,
"entry-"+key
)
}

}

function checkPositionSLNotification(d,m,setups){
var p=getPosition(d.symbol);
if(!p)return;

var adj=adjustedPosition(p,d.market);
if(!adj.entry||!adj.shares)return;

var b=bestSetup(setups);
var t=strategyTargets(b.type,m);
var price=Number(m.price)||0;
var symbol=String(d.symbol).toUpperCase();
var state=getPositionSLState();
var item=state[symbol]||{sl1:false,sl2:false};

if(price<=t.stop2&&!item.sl2){
item.sl1=true;
item.sl2=true;
sendSystemNotification(
"🔴 幽冥分析｜"+symbol+" 持倉觸及 SL2",
(d.name||"")+"｜現價 "+fmt(price)+"｜策略 "+b.name+"｜SL2 "+fmt(t.stop2),
symbol,
"position-sl2-"+symbol
);
showSimpleToast(symbol+" 持倉已觸及策略 SL2")
}else if(price<=t.stop1&&!item.sl1){
item.sl1=true;
sendSystemNotification(
"🛑 幽冥分析｜"+symbol+" 持倉觸及 SL1",
(d.name||"")+"｜現價 "+fmt(price)+"｜策略 "+b.name+"｜SL1 "+fmt(t.stop1),
symbol,

);

}

if(price>t.stop1+m.atr*.25){
item.sl1=false;
item.sl2=false
}

state[symbol]=item;
localStorage.setItem(POSITION_SL_KEY,JSON.stringify(state))
}

function buildEntryStatusAnalysis(entry,shares,price,m,b,t,addPrice,secondAdd,a25,a50){
if(!entry||!shares||!price)return"";

var costDiff=(price-entry)/entry*100;
var recoverPct=price>0?(entry-price)/price*100:0;
var trendBull=m.ma20>m.ma60;
var aboveMA20=price>=m.ma20;
var aboveMA60=price>=m.ma60;
var aboveSL1=price>t.stop1;
var aboveSL2=price>t.stop2;
var distanceSL1=(price-t.stop1)/price*100;
var distanceSL2=(price-t.stop2)/price*100;
var avg25=((entry*shares)+(addPrice*a25))/(shares+a25);
var avg50=((entry*shares)+(secondAdd*a50))/(shares+a50);

var statusClass="warn",statusTitle="",statusText="";

if(price>=entry&&trendBull&&aboveMA20&&aboveMA60){
statusClass="good";
statusTitle="🟢 目前在成本之上，多頭結構仍完整";
statusText="目前股價高於你的平均進場價，同時 MA20 高於 MA60，價格也維持在主要均線之上。目前不屬於攤平狀態；若增加部位屬於順勢加碼觀察。"
}else if(price>=entry){
statusTitle="🟡 目前仍在成本之上，但結構需要觀察";
statusText="目前股價仍高於你的平均進場價，但短中期均線結構沒有同時維持在最強狀態。"
}else if(price<entry&&aboveSL1&&trendBull&&aboveMA60){
statusClass=b.setup.score>=75?"good":"warn";
statusTitle=b.setup.score>=75?"🟢 目前低於成本，但多頭結構尚未失效":"🟡 目前套牢，結構尚在但策略強度普通";
statusText="目前股價低於平均成本，但仍高於 SL1，且 MA20 仍高於 MA60。原本多頭結構尚未明顯失效。"
}else if(price<entry&&aboveSL2){
statusTitle="🟡 已接近風險區，暫停積極攤平";
statusText="目前價格已低於成本且接近或跌破第一停損區，結構風險提高。"
}else{
statusClass="bad";
statusTitle="🔴 已進入結構失效區，不適合繼續攤平";
statusText="目前價格已接近或跌破第二停損／結構失效區。"
}

return `
<div class="entry-analysis">
<div class="entry-analysis-title">📊 我的進場現況分析</div>
<div class="entry-analysis-sub">依照你的實際平均進場價、目前股價、均線、策略與停損結構即時計算。</div>

<div class="entry-analysis-grid">
<div class="entry-analysis-box"><span>調整後進場均價</span><strong>${fmt(entry)}</strong></div>
<div class="entry-analysis-box"><span>目前股價</span><strong>${fmt(price)}</strong></div>
<div class="entry-analysis-box"><span>距離我的成本</span><strong class="${pclass(costDiff)}">${pct(costDiff)}</strong></div>
<div class="entry-analysis-box"><span>${price<entry?"回本需要上漲":"高於成本"}</span><strong>${price<entry?fmt(Math.max(0,recoverPct),2)+"%":fmt(Math.max(0,costDiff),2)+"%"}</strong></div>
<div class="entry-analysis-box"><span>目前最佳策略</span><strong>${safe(b.name)}</strong></div>
<div class="entry-analysis-box"><span>策略符合度</span><strong>${b.setup.score} 分</strong></div>
<div class="entry-analysis-box"><span>距離 SL1</span><strong>${fmt(distanceSL1,2)}%</strong></div>
<div class="entry-analysis-box"><span>距離 SL2</span><strong>${fmt(distanceSL2,2)}%</strong></div>
</div>

<div class="entry-status ${statusClass}">
<div class="entry-status-title">${statusTitle}</div>${statusText}
</div>

<div class="entry-road">
<div class="entry-road-title">🧮 加碼後均價變化</div>
<div class="entry-road-text">
第一加碼觀察價 ${fmt(addPrice)}，加約 25% 原持股後，新均價約 ${fmt(avg25)}。<br>
第二加碼觀察價 ${fmt(secondAdd)}，加約 50% 原持股後，新均價約 ${fmt(avg50)}。<br><br>
以上為技術位置與均價試算，不代表應執行買賣。
</div>
</div>
</div>`
}

function buildPositionAnalysis(d,m,setups){
var position=getPosition(d.symbol);
var rawEntry=position?Number(position.entry)||0:0;
var lots=position?Number(position.lots)||0:0;
var odd=position?Number(position.odd)||0:0;
var reduction=position?Number(position.capitalReduction)||0:0;

var adjusted=adjustedPosition(position,d.market);
var entry=adjusted.entry,shares=adjusted.shares,originalShares=adjusted.originalShares;
var price=Number(m.price)||0;
var cost=entry>0&&shares>0?entry*shares:0;
var marketValue=price>0&&shares>0?price*shares:0;
var pnl=marketValue-cost;
var pnlPct=cost>0?pnl/cost*100:0;

var b=bestSetup(setups);
var t=strategyTargets(b.type,m);
var riskLine=t.stop1,deepRisk=t.stop2;

/* 加碼觀察價也不得高於現價 */
var addPrice=Math.min(t.entryLow,price);
var secondAdd=Math.min(price,Math.max(deepRisk,Math.min(m.ma20,t.entryHigh)));

var structureGood=m.ma20>m.ma60&&price>=m.ma60*.97;
var setupStrong=b.setup.score>=75;
var aboveStop=price>riskLine;

var decision="",riskClass="warn";

if(!entry||!shares){
decision="先輸入你的實際入場均價與持有數量，系統才會依目前價格、策略分數、MA20／MA60、SL1／SL2 與支撐區分析。"
}else if(price<=deepRisk||!structureGood){
decision="目前不適合只為了降低均價而加買。價格已接近／跌破較深結構風險區，或 MA20／MA60 多頭結構不足。";
riskClass="bad"
}else if(price<entry&&aboveStop&&structureGood&&setupStrong){
decision="目前屬於可以條件式觀察加碼的區域。若要降低均價，優先靠近策略入場／支撐區分批觀察。";
riskClass="good"
}else if(price<entry&&aboveStop){
decision="目前雖低於你的均價，但策略條件還不夠強。可等待價格靠近支撐區止穩或策略分數重新提高。"
}else if(price>=entry){
decision="目前不屬於攤低均價。若再買屬於順勢加碼觀察，優先等待回踩支撐或突破確認。";
riskClass=structureGood&&setupStrong?"good":"warn"
}else{
decision="目前風險條件偏高，加碼前應先確認價格沒有跌破策略失效點。";
riskClass="bad"
}

var a25=shares>0?Math.max(1,Math.round(shares*.25)):0;
var a50=shares>0?Math.max(1,Math.round(shares*.5)):0;

function st(n){
n=Math.max(0,Math.round(n));
if(d.market==="US")return n+" 股";
var l=Math.floor(n/1000),o=n%1000;
if(l&&o)return l+" 張 "+o+" 股";
if(l)return l+" 張";
return o+" 股"
}

function na(p,s){
return !entry||!shares||!p||!s?null:((entry*shares)+(p*s))/(shares+s)
}

var avg25=na(addPrice,a25),avg50=na(secondAdd,a50);

return `
<div class="big-section-title">💼 我的持倉與加碼分析</div>
<div class="position-card">
<div class="position-title">設定我的入場</div>
<div class="position-desc">輸入你的實際平均入場價、持有數量與減資比例。設定後若價格觸及目前策略 SL，系統會進行提醒。資料只儲存在這台裝置。</div>

<div class="position-form">
<div class="position-field full">
<label>我的原始平均入場價</label>
<input id="myEntryPrice" class="position-input" inputmode="decimal" type="number" step="0.01" min="0" value="${rawEntry||""}">
<div class="position-unit">減資前的實際成交平均成本</div>
</div>

<div class="position-field">
<label>${d.market==="US"?"整股":"張數"}</label>
<input id="myLots" class="position-input" type="number" min="0" step="1" value="${lots||""}">
</div>

<div class="position-field">
<label>${d.market==="US"?"其他股數":"零股"}</label>
<input id="myOddShares" class="position-input" type="number" min="0" step="1" value="${odd||""}">
</div>

<div class="position-field full">
<label>減資比例 %</label>
<input id="myCapitalReduction" class="position-input" inputmode="decimal" type="number" min="0" max="99.99" step="0.01" value="${reduction||""}" placeholder="沒有減資就留 0">
<div class="position-unit">例如減資 50%，輸入 50。系統會自動調整股數與每股成本。</div>
</div>
</div>

<button id="savePositionButton" class="position-save-btn">儲存並重新分析持倉</button>

${rawEntry&&originalShares&&reduction>0?`
<div class="capital-card">
<div class="capital-title">📉 減資調整已套用</div>
<div class="capital-note">減資 ${fmt(reduction,2)}% 已納入持股、成本、損益、回本幅度與加碼均價計算。</div>
<div class="position-summary-grid">
<div class="position-summary"><span>減資前持股</span><strong>${st(originalShares)}</strong></div>
<div class="position-summary"><span>減資後持股</span><strong>${st(shares)}</strong></div>
<div class="position-summary"><span>原始成本</span><strong>${fmt(rawEntry)}</strong></div>
<div class="position-summary"><span>調整後成本</span><strong>${fmt(entry)}</strong></div>
</div>
</div>`:""}

${entry&&shares?`
<div class="position-summary-grid">
<div class="position-summary"><span>目前計算持股</span><strong>${st(shares)}</strong></div>
<div class="position-summary"><span>目前計算成本</span><strong>${fmt(entry)}</strong></div>
<div class="position-summary"><span>目前股價</span><strong>${fmt(price)}</strong></div>
<div class="position-summary"><span>目前損益</span><strong class="${pclass(pnl)}">${pnl>=0?"+":""}${fmt(pnl,0)}</strong></div>
<div class="position-summary"><span>報酬率</span><strong class="${pclass(pnlPct)}">${pct(pnlPct)}</strong></div>
<div class="position-summary"><span>目前最佳策略</span><strong>${safe(b.name)} ${b.setup.score}分</strong></div>
</div>`:""}

<div class="position-risk ${riskClass}">
<div class="position-risk-title">${riskClass==="good"?"🟢 加碼條件尚可":riskClass==="bad"?"🔴 目前不宜攤平":"🟡 等待更好條件"}</div>
${safe(decision)}
</div>

${entry&&shares?`
<div class="add-plan">
<div class="add-plan-title">📍 可以再加買的位置</div>
<div class="add-plan-grid">
<div class="add-plan-box green"><span>第一加碼觀察價</span><strong>${fmt(addPrice)}</strong></div>
<div class="add-plan-box"><span>第二加碼觀察價</span><strong>${fmt(secondAdd)}</strong></div>
<div class="add-plan-box yellow"><span>SL1｜停止攤平</span><strong>${fmt(riskLine)}</strong></div>
<div class="add-plan-box yellow"><span>SL2｜結構失效</span><strong>${fmt(deepRisk)}</strong></div>
</div>

<div class="position-summary-grid">
<div class="position-summary"><span>第一批參考數量｜25%</span><strong>${st(a25)}</strong></div>
<div class="position-summary"><span>第一批買後新均價</span><strong>${avg25!==null?fmt(avg25):"--"}</strong></div>
<div class="position-summary"><span>第二批參考數量｜50%</span><strong>${st(a50)}</strong></div>
<div class="position-summary"><span>第二批買後新均價</span><strong>${avg50!==null?fmt(avg50):"--"}</strong></div>
</div>

${buildEntryStatusAnalysis(entry,shares,price,m,b,t,addPrice,secondAdd,a25,a50)}
</div>`:""}
</div>`
}

function bindPositionControls(){
var b=el("savePositionButton");
if(!b)return;

b.onclick=()=>{
if(!currentAnalysisData||!currentAnalysisData.symbol)return;

var entry=Number(el("myEntryPrice").value);
var lots=Number(el("myLots").value);
var odd=Number(el("myOddShares").value);
var capitalReduction=Number(el("myCapitalReduction").value)||0;

if(!Number.isFinite(entry)||entry<=0){alert("請輸入正確的平均入場價。");return}

function historicalMetrics(rows,index){
var history=rows.slice(Math.max(0,index-119),index+1);
var current=history.at(-1)||{};
var price=Number(current.close)||0;
var ma20=average(history.slice(-20).map(x=>x.close));
var ma60=average(history.slice(-60).map(x=>x.close));
if(!Number.isFinite(ma20))ma20=price;
if(!Number.isFinite(ma60))ma60=price;
var rsi=historicalRSI(history,14);
var macd=historicalMACD(history);
var atr=historicalATR(history,14);
if(!Number.isFinite(atr)||atr<=0)atr=price*.02;
var prior20=history.slice(-21,-1);
if(!prior20.length)prior20=history.slice(-20);
var highs=prior20.map(x=>Number(x.high)).filter(Number.isFinite);
var lows=prior20.map(x=>Number(x.low)).filter(Number.isFinite);
var resistance=highs.length?Math.max(...highs):price;
var support=lows.length?Math.min(...lows):ma20;
var lows10=history.slice(-10).map(x=>Number(x.low)).filter(Number.isFinite);
var low10=lows10.length?Math.min(...lows10):support;
var currentVolume=Number(current.volume)||0;
var previousVolumes=history.slice(-21,-1).map(x=>Number(x.volume)).filter(Number.isFinite);
var avgVolume=previousVolumes.length?average(previousVolumes):currentVolume;
var volumeRatio=avgVolume>0?currentVolume/avgVolume:1;
var closes5=history.slice(-5).map(x=>Number(x.close)).filter(Number.isFinite);
var structure=true;
if(closes5.length>=3)structure=closes5.at(-1)>=closes5[0]*.96&&price>=ma60*.97;
return{price,ma20,ma60,rsi,macd,atr,resistance,support,low10,volumeRatio,structure,rows:history}
}

function historicalSetup(m){
var p=m.price,a=m.ma20,b=m.ma60,r=m.rsi,mac=m.macd,atr=m.atr,res=m.resistance;
var n=p>=b*.97,s=m.structure;
var pull=[a>b,p>=a-atr*.5,p<=a+atr*1.3,r>=42,r<=68,mac>=0,n,m.volumeRatio<=1.6];
var high=[a>b,p>a,mac>0,r>=52,r<=72,p>=res-atr*.5,m.volumeRatio>=1.2,n&&s];
var surge=[a>b,p>a,mac>0,r>=58,r<=74,p>=res-atr*.25,m.volumeRatio>=1.5,n&&s];

function result(x){
var passed=x.filter(Boolean).length;
return{passed,score:Math.round(passed/x.length*100),qualified:passed>=7}
}
return{PULLBACK:result(pull),HIGH_R:result(high),SURGE:result(surge)}
}

function simulateTrade(rows,signalIndex,type,m){
var entryIndex=signalIndex+1;
if(entryIndex>=rows.length)return null;

var entryRow=rows[entryIndex];
var entry=Number(entryRow.open);
if(!Number.isFinite(entry)||entry<=0)entry=Number(entryRow.close);
if(!Number.isFinite(entry)||entry<=0)return null;

var t=strategyTargets(type,m);
var stop=Number(t.stop1);
if(!Number.isFinite(stop)||stop>=entry)stop=entry-Math.max(m.atr*.8,entry*.01);

var risk=entry-stop;
if(risk<=0)return null;

var tp1=Math.max(Number(t.tp1)||0,entry+risk*1.2);
var tp2=Math.max(Number(t.tp2)||0,entry+risk*2);
var tp3=Math.max(Number(t.tp3)||0,entry+risk*3);

var end=Math.min(rows.length-1,entryIndex+BACKTEST_MAX_HOLD);
var maxR=0,exitR=null,result="TIME",exitIndex=end;

for(var j=entryIndex;j<=end;j++){
var bar=rows[j];
var high=Number(bar.high),low=Number(bar.low),close=Number(bar.close);
if(!Number.isFinite(high)||!Number.isFinite(low))continue;

if(low<=stop){exitR=-1;result="SL";exitIndex=j;break}
if(high>=tp3){exitR=(tp3-entry)/risk;result="TP3";exitIndex=j;break}
if(high>=tp2)maxR=Math.max(maxR,(tp2-entry)/risk);
else if(high>=tp1)maxR=Math.max(maxR,(tp1-entry)/risk);

if(j===end){
exitR=Number.isFinite(close)?(close-entry)/risk:0;
result=exitR>=1?"WIN":exitR<0?"LOSS":"FLAT"
}
}

if(exitR===null)exitR=maxR;
return{entryIndex,exitIndex,entry,stop,tp1,tp2,tp3,r:exitR,result,win:exitR>0}
}

function runOneBacktest(rows,type){
var result={type,trades:0,wins:0,losses:0,winRate:null,averageR:0,totalR:0,maxLossStreak:0,tp3:0,tp2:0,tp1:0,sl:0,flat:0};
if(!Array.isArray(rows)||rows.length<61)return result;

var cutoff=Date.now()-BACKTEST_DAYS*86400000;
var startIndex=Math.max(60,rows.length-365);

for(var z=60;z<rows.length;z++){
var raw=rows[z].date||rows[z].datetime||rows[z].time||rows[z].timestamp;
if(raw){
var dt=new Date(raw);
if(!Number.isNaN(dt.getTime())&&dt.getTime()<cutoff)continue
}
startIndex=z;break
}

var lossStreak=0,nextAllowed=startIndex;

for(var i=startIndex;i<rows.length-1;i++){
if(i<nextAllowed)continue;
var m=historicalMetrics(rows,i);
var setups=historicalSetup(m);
if(!setups[type].qualified)continue;

var trade=simulateTrade(rows,i,type,m);
if(!trade)continue;

result.trades++;
result.totalR+=trade.r;

if(trade.win){result.wins++;lossStreak=0}
else{
result.losses++;lossStreak++;
result.maxLossStreak=Math.max(result.maxLossStreak,lossStreak)
}

if(trade.result==="TP3")result.tp3++;
else if(trade.result==="TP2")result.tp2++;
else if(trade.result==="TP1")result.tp1++;
else if(trade.result==="SL")result.sl++;
else result.flat++;

nextAllowed=trade.exitIndex+1
}

if(result.trades){
result.winRate=result.wins/result.trades*100;
result.averageR=result.totalR/result.trades
}
return result
}

function run365Backtest(rows){
return{
PULLBACK:runOneBacktest(rows,"PULLBACK"),
HIGH_R:runOneBacktest(rows,"HIGH_R"),
SURGE:runOneBacktest(rows,"SURGE")
}
}

function getRowDate(row){
var raw=row&&(row.date||row.datetime||row.time||row.timestamp);
if(!raw)return null;
var d=new Date(raw);
return Number.isNaN(d.getTime())?null:d
}

function backtestObservation(rows){
if(!Array.isArray(rows)||!rows.length)return{ready:false,days:0,remaining:BACKTEST_OBSERVE_DAYS};

var first=null,last=null;
for(var i=0;i<rows.length;i++){var d=getRowDate(rows[i]);if(d){first=d;break}}
for(var j=rows.length-1;j>=0;j--){var d2=getRowDate(rows[j]);if(d2){last=d2;break}}

if(first&&last){
var days=Math.max(0,Math.floor((last-first)/86400000));
return{ready:days>=BACKTEST_OBSERVE_DAYS,days,remaining:Math.max(0,BACKTEST_OBSERVE_DAYS-days)}
}

var tradingDays=Math.max(0,rows.length-60);
var estimated=Math.floor(tradingDays/22*30);
return{ready:tradingDays>=22,days:estimated,remaining:tradingDays>=22?0:Math.max(1,Math.ceil((22-tradingDays)/22*30))}
}

loading.className="ai-message bot";
loading.textContent="AI 分析暫時無法使用："+e.message
}finally{
send.disabled=false
}
}

send.onclick=ask;
input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}
})
}

async function fetchStockData(symbol){
var r=await fetch("/api/stock?symbol="+encodeURIComponent(symbol)+"&t="+Date.now(),{cache:"no-store"});
var d=await r.json();
if(!r.ok||!d.ok)throw Error(d.error||"股票資料取得失敗");
return d
}

function goBackHome(){
analysisRequestSeq++;
currentAnalysisSymbol="";
currentAnalysisData=null;
currentMarketMetrics=null;
currentSetups=null;
currentBacktests=null;

var view=el("analysisView");
view.classList.remove("swiping-back","swipe-return");

view.style.opacity="";

renderHomeEntryAlerts();
renderWatchlist();
renderMonsterStocks();
window.scrollTo({top:0,behavior:"auto"})
}

(function(){
var view=el("analysisView");
var startX=0,startY=0,currentX=0,startTime=0,tracking=false,locked=false;

view.addEventListener("touchstart",function(e){
if(view.classList.contains("hidden")||e.touches.length!==1)return;
var t=e.touches[0];
if(t.clientX>32)return;
startX=t.clientX;startY=t.clientY;currentX=startX;startTime=Date.now();
tracking=true;locked=false;view.classList.add("swiping-back")
},{passive:true});

view.addEventListener("touchmove",function(e){
if(!tracking||e.touches.length!==1)return;
var t=e.touches[0];
var dx=Math.max(0,t.clientX-startX);
var dy=Math.abs(t.clientY-startY);

if(!locked){
if(dy>10&&dy>dx){
tracking=false;view.classList.remove("swiping-back");return
}
if(dx>8)locked=true
}

if(!locked)return;
currentX=t.clientX;
var width=Math.max(window.innerWidth,1);
var progress=Math.min(dx/width,1);
view.style.transform="translate3d("+dx+"px,0,0)";
view.style.opacity=String(1-progress*.18);
if(e.cancelable)e.preventDefault()
},{passive:false});

function finish(){
if(!tracking)return;
tracking=false;
view.classList.remove("swiping-back");

var dx=Math.max(0,currentX-startX);
var elapsed=Math.max(Date.now()-startTime,1);
var velocity=dx/elapsed;
var back=dx>Math.min(window.innerWidth*.28,120)||velocity>.55;

view.classList.add("swipe-return");

if(back){
view.style.transform="translate3d(100vw,0,0)";
view.style.opacity=".82";
setTimeout(goBackHome,210)
}else{
view.style.transform="translate3d(0,0,0)";
view.style.opacity="1";
setTimeout(()=>{
view.classList.remove("swipe-return");
view.style.transform="";
view.style.opacity=""
},230)
}
}

view.addEventListener("touchend",finish,{passive:true});
view.addEventListener("touchcancel",finish,{passive:true})
})();

async function refreshWatchlistPrices(){
var list=getWatchlist();
if(!list.length)return;

var changed=false;

for(var i=0;i<list.length;i++){
try{
var d=await fetchStockData(list[i].symbol);
var m=marketOf(d);
var v=volumeMetrics(d,d.rows||[]);
var setups=buildStrategySetups(d,m,v);
var monster=monsterMetrics(d,m,v);

list[i].price=m.price;
list[i].name=d.name||list[i].name;
list[i].market=d.market||list[i].market;
if(Number.isFinite(Number(d.changePercent)))list[i].changePercent=Number(d.changePercent);
changed=true;

checkEntryNotification(d,m,setups);
updateStrategyTracking(d,m,setups);
checkPositionSLNotification(d,m,setups);
checkMonsterNotification(d,m,v,monster)
}catch(e){}
}

if(changed){
localStorage.setItem(WATCH_KEY,JSON.stringify(list));
renderWatchlist()
}
}

async function loadRadar(){
try{
var r=await fetch("/api/radar?t="+Date.now(),{cache:"no-store"});
var d=await r.json();
if(!r.ok||!d.ok)throw Error(d.error||"雷達取得失敗");

radarData=d;

el("scanCount").textContent=fmt(d.scanned,0);
el("strategyCount").textContent=fmt((d.strategyReady||[]).length,0);
el("radarCount").textContent=fmt((d.radar||[]).length,0);

el("updateText").textContent="FinMind · 最後更新 "+currentTimeText()+" · 每 60 秒重新掃描";

renderStocks("strategyGrid",d.strategyReady||[],expanded.strategy);
renderStocks("longGrid",d.longWatch||[],expanded.long);
renderStocks("radarGrid",d.radar||[],expanded.radar);

await checkRadarEntries(d);

syncMoreButtons();
countdownSeconds=60

}catch(e){
el("updateText").textContent="雷達連線失敗："+e.message
}
}

async function checkRadarEntries(d){
var map=new Map();

["strategyReady","longWatch","radar"].forEach(k=>{
(d[k]||[]).forEach(x=>{
if(x&&x.symbol&&!map.has(x.symbol))map.set(x.symbol,x)
})
});

getWatchlist().forEach(x=>{
if(x&&x.symbol&&!map.has(x.symbol))map.set(x.symbol,x)
});

var candidates=[...map.values()].slice(0,30);
var monsters=[];

for(var i=0;i<candidates.length;i++){
try{
var stock=await fetchStockData(candidates[i].symbol);
var m=marketOf(stock);
var v=volumeMetrics(stock,stock.rows||[]);
var setups=buildStrategySetups(stock,m,v);
var monster=monsterMetrics(stock,m,v);

checkEntryNotification(stock,m,setups);
updateStrategyTracking(stock,m,setups);
checkPositionSLNotification(stock,m,setups);
checkMonsterNotification(stock,m,v,monster);

monsters.push({
symbol:stock.symbol,
name:stock.name||"",
market:stock.market||"",
price:m.price,
changePercent:Number(stock.changePercent),
volumeRatio:v.ratio,
monster:monster
})
}catch(e){}
}

monsterStocks=monsters;
renderMonsterStocks()
}

r.innerHTML=a.map(s=>`

<div class="stock-top">
<div>
<div class="stock-title-line">

`).join("");

}

document.querySelectorAll("[data-more]").forEach(button=>{

button.textContent=expanded[type]?"全部收起":"全部打開"
});

el("watchToggleButton").onclick=()=>{

syncMoreButtons()
};

document.querySelectorAll("[data-more]").forEach(button=>{

}

}catch(e){

el("backButton").onclick=goBackHome;

setInterval(()=>{
countdownSeconds--;

if(countdownSeconds<=0){
countdownSeconds=60;
if(!document.hidden){

refreshWatchlistPrices()
}

var m=Math.floor(countdownSeconds/60);

setInterval(()=>{

setInterval(()=>{

if(currentAnalysisSymbol){

refreshWatchlistPrices()

renderSearchHistory();
renderWatchlist();
renderHomeEntryAlerts();
renderMonsterStocks();

refreshWatchlistPrices();
