<script>
const WATCH_KEY="yaozi_watchlist";
const HISTORY_KEY="yaozi_search_history_v1";
const POSITION_KEY="yaozi_positions_v46";
const SWING_NOTIFY_KEY="yaozi_swing_notify_v1";

const BACKTEST_DAYS=365;
const BACKTEST_MIN_TRADES=8;
const BACKTEST_MAX_HOLD=20;
const NOTIFY_COOLDOWN=30*60*1000;

var currentAnalysisSymbol="";
var currentAnalysisData=null;
var currentMarketMetrics=null;
var currentSwingSetup=null;
var radarData=null;
var analysisRefreshing=false;

function el(id){return document.getElementById(id)}

function safe(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
}

function fmt(n,d=2){
n=Number(n);
if(!Number.isFinite(n))return"--";
return n.toLocaleString("zh-TW",{
minimumFractionDigits:d,
maximumFractionDigits:d
})
}

function pct(n){
n=Number(n);
if(!Number.isFinite(n))return"--";
return(n>=0?"+":"")+fmt(n,2)+"%"
}

function pclass(n){
return Number(n)>=0?"up":"down"
}

function currentTimeText(){
return new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})
}

function average(a){
var x=a.filter(Number.isFinite);
return x.length?x.reduce((s,n)=>s+n,0)/x.length:0
}

function sma(values,p){
if(values.length<p)return average(values);
return average(values.slice(-p))
}

function ema(values,p){
if(!values.length)return 0;
var k=2/(p+1);
var e=values[0];
for(var i=1;i<values.length;i++)e=values[i]*k+e*(1-k);
return e
}

function calcRSI(closes,p=14){
if(closes.length<=p)return 50;
var gains=0,losses=0;
for(var i=closes.length-p;i<closes.length;i++){
var diff=closes[i]-closes[i-1];
if(diff>0)gains+=diff;
else losses-=diff
}
if(losses===0)return 100;
var rs=(gains/p)/(losses/p);
return 100-(100/(1+rs))
}

function calcATR(rows,p=14){
if(rows.length<2)return 0;
var trs=[];
for(var i=Math.max(1,rows.length-p);i<rows.length;i++){
var h=Number(rows[i].high);
var l=Number(rows[i].low);
var pc=Number(rows[i-1].close);
trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)))
}
return average(trs)
}

function getRows(d){
return(d.rows||[]).map(r=>({
open:Number(r.open),
high:Number(r.high),
low:Number(r.low),
close:Number(r.close),
volume:Number(r.volume||0),
date:r.date
})).filter(r=>Number.isFinite(r.close)&&r.close>0)
}

function marketOf(d){
var rows=getRows(d);
var closes=rows.map(x=>x.close);
var price=Number(d.price||closes.at(-1));
var ma20=sma(closes,20);
var ma60=sma(closes,60);
var ma120=sma(closes,120);

var e12=ema(closes.slice(-100),12);
var e26=ema(closes.slice(-100),26);
var macd=e12-e26;

var atr=calcATR(rows,14);
var recent20=rows.slice(-20);
var recent60=rows.slice(-60);

var resistance=Math.max(...recent20.map(x=>x.high));
var support=Math.min(...recent20.map(x=>x.low));
var swingLow=Math.min(...recent60.slice(-15).map(x=>x.low));
var high60=Math.max(...recent60.map(x=>x.high));

return{
price,
ma20,
ma60,
ma120,
rsi:calcRSI(closes),
macd,
atr,
resistance,
support,
swingLow,
high60
}
}

function volumeMetrics(d,rows){
rows=rows||getRows(d);
var vols=rows.map(x=>Number(x.volume)||0);
var current=vols.at(-1)||0;
var average20=average(vols.slice(-21,-1));
var ratio=average20?current/average20:0;

var level=
ratio>=2?"明顯放量":
ratio>=1.3?"量能偏強":
ratio>=.8?"量能正常":"量能偏低";

return{current,average20,ratio,level}
}

/* =========================================================
   幽冥分析：唯一策略
   波段策略
   ========================================================= */

function buildSwingSetup(d,m,v){
var rows=getRows(d);
var price=m.price;
var atr=Math.max(m.atr,price*.005);

var ma20Slope=0;
if(rows.length>=25){
var old=sma(rows.slice(0,-5).map(x=>x.close),20);
ma20Slope=old?(m.ma20-old)/old*100:0
}

var distanceMA20=(price-m.ma20)/m.ma20*100;
var distanceHigh=(m.high60-price)/price*100;

var conditions=[
{
title:"中期趨勢維持多頭",
pass:m.ma20>m.ma60,
explain:"MA20 高於 MA60，波段方向優先站在多方。"
},
{
title:"股價沒有跌破中期結構",
pass:price>=m.ma60*.98,
explain:"價格需維持在 MA60 附近之上，避免在明顯弱勢結構中硬接。"
},
{
title:"MA20 趨勢沒有明顯轉弱",
pass:ma20Slope>=-.3,
explain:"短中期均線至少維持走平或向上。"
},
{
title:"價格位置適合波段進場",
pass:distanceMA20>=-2.5&&distanceMA20<=5.5,
explain:"距離 MA20 不宜過遠，避免追在短線過熱位置。"
},
{
title:"RSI 位於健康區",
pass:m.rsi>=45&&m.rsi<=72,
explain:"避免動能太弱，也避免 RSI 過熱後才追價。"
},
{
title:"MACD 動能沒有明顯轉空",
pass:m.macd>=-atr*.08,
explain:"允許短線整理，但不接受明顯空方動能。"
},
{
title:"成交量結構正常",
pass:v.ratio>=.75,
explain:"量能至少接近近期平均，避免流動性與動能明顯萎縮。"
},
{
title:"上方仍有波段空間",
pass:distanceHigh>=2||price>=m.high60*.985,
explain:"確認價格不是卡在沒有空間的位置；接近突破時也可成立。"
}
];

var passed=conditions.filter(x=>x.pass).length;
var score=Math.round(passed/conditions.length*100);

/*
正式波段訊號維持嚴格：
7/8 或 8/8 才成立。
6/8 只視為接近形成。
*/
var qualified=passed>=7;

return{
conditions,
passed,
total:conditions.length,
score,
qualified
}
}

/* =========================================================
   波段進場、單一 SL、TP
   SL 使用結構失效 + ATR 緩衝
   不貼著進場價
   ========================================================= */

function swingTargets(m){
var price=m.price;
var atr=Math.max(m.atr,price*.006);

/*
進場區：
MA20、近期支撐與現價共同限制。
避免計算出高於目前股價很多的入場區。
*/
var structureBase=Math.max(
m.ma20-atr*.45,
m.support
);

var entryLow=Math.min(price,structureBase);
var entryHigh=Math.min(
price,
Math.max(entryLow,m.ma20+atr*.25)
);

if(entryHigh<entryLow){
var z=entryHigh;
entryHigh=entryLow;
entryLow=z
}

var center=(entryLow+entryHigh)/2;

/*
單一 SL：
近期波段低點 / 支撐 / MA60 選擇真正代表結構失效的位置，
再留 ATR 緩衝。

同時要求 SL 與中心進場價至少保留約 0.9 ATR，
避免正常震盪就被洗掉。
*/
var structureStop=Math.min(
m.swingLow,
m.support,
m.ma60
);

var stop=structureStop-atr*.35;
var minimumStop=center-atr*.9;

/*
如果結構停損太靠近進場價，就放寬到至少 0.9 ATR。
*/
stop=Math.min(stop,minimumStop);

/*
避免 SL 遠到失去實際風控意義。
最高風險距離限制約 8%。
*/
var maxRiskStop=center*.92;
stop=Math.max(stop,maxRiskStop);

if(stop>=entryLow){
stop=entryLow-atr*.9
}

var risk=Math.max(center-stop,atr*.8);

/*
TP 不單純固定倍數。
TP1 優先參考近期壓力；
TP2 / TP3 再依風險距離與突破空間延伸。
*/
var pressure=Math.max(m.resistance,m.high60);

var tp1=Math.max(
center+risk*1.25,
Math.min(pressure,center+risk*1.8)
);

var tp2=Math.max(
tp1+atr*.5,
center+risk*2.0,
pressure+atr*.35
);

var tp3=Math.max(
tp2+atr*.7,
center+risk*3.0,
pressure+atr*1.1
);

return{
entryLow,
entryHigh,
center,
stop,
previousHigh:pressure,
tp1,
tp2,
tp3
}
}

function rr(target,center,stop){
var reward=target-center;
var risk=center-stop;
if(reward<=0||risk<=0)return"--";
return(reward/risk).toFixed(2)+"R"
}

function historicalMetrics(rows,index){
var slice=rows.slice(0,index+1);
if(slice.length<60)return null;

var d={rows:slice,price:slice.at(-1).close};
var m=marketOf(d);
var v=volumeMetrics(d,slice);
var setup=buildSwingSetup(d,m,v);

return{m,v,setup}
}

function runSwingBacktest(rows){
var start=Math.max(60,rows.length-BACKTEST_DAYS);
var wins=0;
var losses=0;
var trades=0;
var totalR=0;

for(var i=start;i<rows.length-2;i++){
var h=historicalMetrics(rows,i);
if(!h||!h.setup.qualified)continue;

var t=swingTargets(h.m);

var next=rows[i+1];
var entry=Number(next.open)||Number(next.close);

if(entry<t.entryLow*.97||entry>t.entryHigh*1.03)continue;

var risk=Math.max(entry-t.stop,h.m.atr*.5);
if(risk<=0)continue;

var target=Math.max(t.tp1,entry+risk*1.2);

trades++;

var result=null;

for(var j=i+1;j<=Math.min(rows.length-1,i+BACKTEST_MAX_HOLD);j++){
var bar=rows[j];

var hitStop=bar.low<=t.stop;
var hitTarget=bar.high>=target;

/*
同一根 K 同時碰到停損與停利，
採保守方式先算停損。
*/
if(hitStop){
result=-1;
break
}

if(hitTarget){
result=(target-entry)/risk;
break
}
}

if(result===null){
var end=rows[Math.min(rows.length-1,i+BACKTEST_MAX_HOLD)].close;
result=(end-entry)/risk
}

totalR+=result;

if(result>0)wins++;
else losses++;

i+=3
}

return{
trades,
wins,
losses,
winRate:trades?wins/trades*100:0,
avgR:trades?totalR/trades:0
}
}

return`

)

var position=getPosition(symbol);

if(position){
if(price<=t.stop){
notifyOnce(
"🛑 "+symbol+" 到達波段 SL",
"目前價格 "+fmt(price)+"，波段結構失效價 "+fmt(t.stop)+"。",
"sl_"+symbol
)
}

if(price>=t.tp3){
notifyOnce(
"🔥 "+symbol+" 到達 TP3",
"目前價格 "+fmt(price)+"，TP3 "+fmt(t.tp3)+"。",
"tp3_"+symbol
)
}else if(price>=t.tp2){
notifyOnce(
"💰 "+symbol+" 到達 TP2",
"目前價格 "+fmt(price)+"，TP2 "+fmt(t.tp2)+"。",
"tp2_"+symbol
)
}else if(price>=t.tp1){
notifyOnce(
"💰 "+symbol+" 到達 TP1",
"目前價格 "+fmt(price)+"，TP1 "+fmt(t.tp1)+"。",
"tp1_"+symbol
)
}
}
}

var r=el(id);
if(!r)return;

if(!a||!a.length){
r.innerHTML='<div class="card" style="padding:13px;margin-top:8px;color:#929c95">目前沒有符合條件的股票</div>';
return
}

r.innerHTML=a.map(s=>`
<article class="stock-card" data-stock="${safe(s.symbol)}">

<div class="stock-top">

<div>
<div class="stock-title-line">
<div class="symbol">${safe(s.symbol)}</div>
<div class="stock-inline-name">${safe(s.name||"")}</div>
</div>

<div class="stock-strategy-line">
🌊 波段策略
</div>
</div>

<div class="score">
<strong>${safe(s.entryScore??s.score??"--")}</strong>
<span>條件分數</span>
</div>

</div>

<div class="${pclass(s.changePercent)}">
${pct(s.changePercent)}
</div>
</div>

<div class="chips">
<div class="chip green">
量比 ${fmt(s.volumeRatio,1)}x
</div>
</div>

<div class="watch-open">
查看完整波段分析 →
</div>

</article>
`).join("");

r.querySelectorAll("[data-stock]").forEach(x=>{
x.onclick=()=>analyze(x.dataset.stock)
})
}

async function loadRadar(){
try{
var r=await fetch("/api/radar?t="+Date.now(),{cache:"no-store"});
var d=await r.json();

if(!r.ok||!d.ok)throw Error(d.error||"雷達取得失敗");

radarData=d;

var formal=[];
var observe=[];

/*
後端目前即使仍回傳舊策略欄位，
前端只拿股票本身重新呈現成單一波段雷達。
*/
var source=[
...(d.strategyReady||[]),
...(d.longWatch||[]),
...(d.radar||[])
];

var seen={};

source.forEach(s=>{
var symbol=String(s.symbol||"").toUpperCase();
if(!symbol||seen[symbol])return;
seen[symbol]=1;

var score=Number(s.entryScore??s.score??0);

if(score>=88)formal.push(s);
else if(score>=75)observe.push(s)
});

el("scanCount").textContent=fmt(d.scanned||source.length,0);
el("strategyCount").textContent=fmt(formal.length,0);
el("radarCount").textContent=fmt(observe.length,0);

el("updateText").textContent=
"最後更新 "+currentTimeText()+" · 每 60 秒重新掃描";

renderStocks("strategyGrid",formal);
renderStocks("radarGrid",observe)

}catch(e){
el("updateText").textContent="雷達連線失敗："+e.message
}
}

/* =========================================================
   30 秒個股更新
   ========================================================= */

async function refreshCurrentAnalysis(){
if(!currentAnalysisSymbol||analysisRefreshing)return;

analysisRefreshing=true;

var symbol=currentAnalysisSymbol;

try{
var d=await fetchStockData(symbol);

if(currentAnalysisSymbol!==symbol)return;

currentAnalysisData=d;

var m=marketOf(d);
var v=volumeMetrics(d,getRows(d));
var setup=buildSwingSetup(d,m,v);

checkCurrentSwingNotification(d,m,setup);
buildAnalysis(d)

}catch(e){
console.log(e)
}finally{
analysisRefreshing=false
}
}

   AI 助手 API 保留

async function askAI(question){
if(!question)return null;

try{
var r=await fetch("/api/ai",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
question,
symbol:currentAnalysisSymbol,
stock:currentAnalysisData,
metrics:currentMarketMetrics,
strategy:currentSwingSetup
})
});

var d=await r.json();
return d
}catch(e){
return null
}
}

}

if(p==="granted"){
alert("通知已開啟")
}else{

}
};

/* =========================================================
   iPhone 左滑返回
   ========================================================= */

(function(){
var view=el("analysisView");

var sx=0;
var sy=0;
var active=false;

view.addEventListener("touchstart",e=>{
if(e.touches.length!==1)return;

var t=e.touches[0];

if(t.clientX>30)return;

sx=t.clientX;
sy=t.clientY;
active=true
},{passive:true});

view.addEventListener("touchend",e=>{
if(!active)return;
active=false;

var t=e.changedTouches[0];
var dx=t.clientX-sx;
var dy=Math.abs(t.clientY-sy);

if(dx>90&&dy<80){
goBackHome()
}
},{passive:true})
})();
