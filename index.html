<script>
"use strict";

var radarData = null;
var refreshSeconds = 300;
var countdownSeconds = 300;
var homeScrollPosition = 0;


/* =========================
   基本工具
========================= */

function el(id){
  return document.getElementById(id);
}

function safe(value){
  var div = document.createElement("div");

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;
}

function formatNumber(value,digits){
  if(digits === undefined){
    digits = 2;
  }

  var n = Number(value);

  if(!Number.isFinite(n)){
    return "--";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:digits
    }
  );
}

function percent(value){
  var n = Number(value);

  if(!Number.isFinite(n)){
    return "--";
  }

  return (
    (n > 0 ? "+" : "") +
    n.toFixed(2) +
    "%"
  );
}

function priceClass(value){
  var n = Number(value);

  if(n > 0) return "up";
  if(n < 0) return "down";

  return "flat";
}

function normalizeSymbol(value){
  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9.\-]/g,"");
}


/* =========================

/* =========================
   技術指標
========================= */

function SMA(values,period){

  if(
    !Array.isArray(values) ||
    values.length < period
  ){
    return NaN;
  }

  var part =
    values.slice(-period);

  var total = 0;

  for(var i=0;i<part.length;i++){
    total += Number(part[i]);
  }

  return total / period;
}


function EMA(values,period){

  if(
    !Array.isArray(values) ||
    values.length < period
  ){
    return NaN;
  }

  var total = 0;

  for(var i=0;i<period;i++){
    total += Number(values[i]);
  }

  var ema =
    total / period;

  var k =
    2 / (period + 1);

  for(
    var j=period;
    j<values.length;
    j++
  ){

    ema =
      Number(values[j]) * k +
      ema * (1-k);
  }

  return ema;
}


function RSI(values,period){

  period =
    period || 14;

  if(
    !Array.isArray(values) ||
    values.length <= period
  ){
    return NaN;
  }

  var part =
    values.slice(
      -(period+1)
    );

  var gains = 0;
  var losses = 0;

  for(
    var i=1;
    i<part.length;
    i++
  ){

    var diff =
      Number(part[i]) -
      Number(part[i-1]);

    if(diff > 0){
      gains += diff;
    }else{
      losses += Math.abs(diff);
    }
  }

  var avgGain =
    gains / period;

  var avgLoss =
    losses / period;

  if(avgLoss === 0){
    return 100;
  }

  var rs =
    avgGain / avgLoss;

  return (
    100 -
    100 / (1+rs)
  );
}


function ATR(rows,period){

  period =
    period || 14;

  if(
    !Array.isArray(rows) ||
    rows.length <= period
  ){
    return NaN;
  }

  var trs = [];

  for(
    var i=1;
    i<rows.length;
    i++
  ){

    var high =
      Number(rows[i].high);

    var low =
      Number(rows[i].low);

    var previousClose =
      Number(
        rows[i-1].close
      );

    var tr =
      Math.max(
        high-low,
        Math.abs(
          high-previousClose
        ),
        Math.abs(
          low-previousClose
        )
      );

    trs.push(tr);
  }

  return SMA(
    trs,
    period
  );
}

  );

for(
  var e=0;
  e<examples.length;
  e++
){

  examples[e]
    .addEventListener(
      "click",
      function(){

        var symbol =
          this.getAttribute(
            "data-symbol"
          );

        el("symbolInput").value =
          symbol;

        analyzeStock(symbol);
      }
    );
}


async function analyzeStock(symbolValue){

  var symbol =
    normalizeSymbol(
      symbolValue
    );

  if(!symbol){
    return;
  }

  el("symbolInput").value =
    symbol;

  showAnalysisPage();

  el("analysisResult")
    .innerHTML =
      '<div class="loading">' +
      '正在分析 ' +
      safe(symbol) +
      '…' +
      '</div>';

  try{

    var response =
      await fetch(
        "/api/stock?symbol=" +
        encodeURIComponent(symbol) +
        "&t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    var data =
      await response.json();

    if(
      !response.ok ||
      data.ok === false
    ){
      throw new Error(
        data.error ||
        "股票資料取得失敗"
      );
    }

    buildAnalysis(data);

  }catch(error){

    el("analysisResult")
      .innerHTML =
        '<div class="error">' +
        '分析失敗：' +
        safe(error.message) +
        '</div>';
  }
}


/* =========================
   詳細分析
========================= */

function buildAnalysis(data){

  var rows =
    Array.isArray(data.rows)
      ? data.rows
      : [];

  if(rows.length < 60){
    throw new Error(
      "歷史資料不足，無法計算完整技術分析。"
    );
  }

  var closes =
    rows.map(function(x){
      return Number(x.close);
    });

  var symbol =
    String(data.symbol || "");

  var price =
    Number(data.livePrice);

  var liveStock = null;

  if(
    data.market === "TW" &&
    radarData
  ){

    var groups = [
      radarData.radar || [],
      radarData.longWatch || [],
      radarData.volumeLeaders || [],
      radarData.momentumLeaders || []
    ];

    for(
      var g=0;
      g<groups.length;
      g++
    ){

      for(
        var x=0;
        x<groups[g].length;
        x++
      ){

        if(
          String(
            groups[g][x].symbol
          ) === symbol
        ){

          liveStock =
            groups[g][x];

          break;
        }
      }

      if(liveStock){
        break;
      }
    }
  }

  if(
    liveStock &&
    Number.isFinite(
      Number(liveStock.price)
    )
  ){
    price =
      Number(liveStock.price);
  }

  if(!Number.isFinite(price)){
    price =
      closes[
        closes.length-1
      ];
  }


  var ma20 =
    SMA(closes,20);

  var ma60 =
    SMA(closes,60);

  var rsi =
    RSI(closes,14);

  var recent =
    closes.slice(-80);

  var macd =
    EMA(recent,12) -
    EMA(recent,26);

  var atr =
    ATR(rows,14);


  var prior20 =
    rows.slice(-21,-1);

  var resistance =
    Math.max.apply(
      null,
      prior20.map(function(x){
        return Number(x.high);
      })
    );


  var prior10 =
    rows.slice(-10);

  var recentLow =
    Math.min.apply(
      null,
      prior10.map(function(x){
        return Number(x.low);
      })
    );


  var support =
    Math.max(
      recentLow,
      Math.min(
        ma20,
        price
      ) -
      atr * .5
    );


  var trend =
    "整理";

  if(
    price > ma20 &&
    ma20 > ma60
  ){
    trend =
      "多頭";
  }
  else if(
    price < ma20 &&
    ma20 < ma60
  ){
    trend =
      "偏弱";
  }


  var distanceMA20 =
    (
      (price-ma20) /
      ma20
    ) * 100;

  var distanceResistance =
    (
      (resistance-price) /
      price
    ) * 100;


  /* =========================
     綜合判讀
  ========================= */

  var judgements = [];

  if(
    price > ma20 &&
    ma20 > ma60
  ){

    judgements.push({
      type:"good",
      text:
        "✓ 股價站上 MA20，且 MA20 高於 MA60，中期均線維持多頭排列。"
    });

  }else if(
    price > ma20
  ){

    judgements.push({
      type:"warn",
      text:
        "△ 股價位於 MA20 上方，但中期均線尚未形成完整多頭排列。"
    });

  }else{

    judgements.push({
      type:"bad",
      text:
        "⚠ 股價位於 MA20 下方，短線結構相對偏弱。"
    });
  }


  if(macd > 0){

    judgements.push({
      type:"good",
      text:
        "✓ MACD 位於正值區，價格動能目前偏正向。"
    });

  }else{

    judgements.push({
      type:"warn",
      text:
        "△ MACD 位於負值區，動能尚未明顯轉強。"
    });
  }


  if(rsi >= 78){

    judgements.push({
      type:"warn",
      text:
        "⚠ RSI " +
        formatNumber(rsi,1) +
        "，短線已進入明顯偏熱區，追價風險提高。"
    });

  }else if(rsi >= 55){

    judgements.push({
      type:"good",
      text:
        "✓ RSI " +
        formatNumber(rsi,1) +
        "，目前維持偏強動能。"
    });

  }else if(rsi <= 35){

    judgements.push({
      type:"warn",
      text:
        "△ RSI " +
        formatNumber(rsi,1) +
        "，目前位於相對弱勢區。"
    });

  }else{

    judgements.push({
      type:"warn",
      text:
        "△ RSI " +
        formatNumber(rsi,1) +
        "，目前屬中性區域。"
    });
  }


  if(
    distanceResistance >= 0 &&
    distanceResistance <= 3
  ){

    judgements.push({
      type:"good",
      text:
        "✓ 現價距離 20 日壓力僅約 " +
        formatNumber(
          distanceResistance,
          1
        ) +
        "%，已接近突破觀察區。"
    });

  }else if(
    price > resistance
  ){

    judgements.push({
      type:"good",
      text:
        "✓ 現價已高於原 20 日壓力，需觀察突破後能否守住壓力轉支撐區。"
    });

  }else{

    judgements.push({
      type:"warn",
      text:
        "△ 現價距離 20 日壓力約 " +
        formatNumber(
          distanceResistance,
          1
        ) +
        "%，目前仍在壓力下方。"
    });
  }


  if(
    distanceMA20 > 8
  ){

    judgements.push({
      type:"warn",
      text:
        "⚠ 現價高於 MA20 約 " +
        formatNumber(
          distanceMA20,
          1
        ) +
        "%，與短期均線距離偏大，等待回踩的風險報酬通常較容易控制。"
    });
  }


  var summary = "";

  if(
    trend === "多頭" &&
    rsi >= 78
  ){

    summary =
      "目前中期結構維持多頭，但短線動能已偏熱。支撐回踩策略重點是等待價格重新靠近 MA20／近期支撐；突破策略則觀察壓力突破後能否完成有效回測。";

  }else if(
    trend === "多頭"
  ){

    summary =
      "目前均線結構偏多，技術面仍具有正向動能。接下來可分別觀察支撐回踩是否止跌，以及壓力突破後是否能守住突破區。";

  }else if(
    trend === "偏弱"
  ){

    summary =
      "目前技術結構相對偏弱，支撐策略需要先看到止跌與重新站回短期均線；突破策略則需要更明確的價格轉強確認。";

  }else{

    summary =
      "目前價格較偏整理結構，方向尚未完全明確。可等待價格接近關鍵支撐或突破主要壓力後，再觀察後續確認訊號。";
  }


  /* =========================
     策略一
  ========================= */

  var swingEntryLow =
    Math.max(
      support,
      ma20 -
      atr * .5
    );

  var swingEntryHigh =
    ma20 +
    atr * .35;

  var swingStop =
    Math.min(
      support -
      atr * .5,
      swingEntryLow -
      atr
    );

  var swingRisk =
    Math.max(
      price -
      swingStop,
      atr
    );

  var swingTP1 =
    price +
    swingRisk * 1.5;

  var swingTP2 =
    price +
    swingRisk * 2.5;

  var swingTP3 =
    price +
    swingRisk * 4;


  var swingStatus =
    "等待回踩";

  if(
    price >= swingEntryLow &&
    price <= swingEntryHigh
  ){
    swingStatus =
      "進入支撐觀察區";
  }

  if(price < swingStop){
    swingStatus =
      "結構已失效";
  }


  var swingLines = [];

  if(price > ma20){

    swingLines.push(
      "✓ 現價位於 MA20 上方。"
    );

  }else{

    swingLines.push(
      "⚠ 現價位於 MA20 下方，需觀察能否重新站回。"
    );
  }

  if(ma20 > ma60){

    swingLines.push(
      "✓ MA20 高於 MA60，中期結構偏多。"
    );

  }else{

    swingLines.push(
      "△ MA20 尚未高於 MA60，中期趨勢確認度較低。"
    );
  }

  if(rsi >= 78){

    swingLines.push(
      "⚠ RSI 偏熱，不屬於理想的低風險追價位置。"
    );

  }else{

    swingLines.push(
      "✓ RSI 尚未進入極端過熱區。"
    );
  }

  if(
    price >
    swingEntryHigh +
    atr
  ){

    swingLines.push(
      "⚠ 現價距離回踩觀察區較遠，目前主要等待價格靠近支撐。"
    );

  }else{

    swingLines.push(
      "✓ 現價與回踩觀察區距離相對可控。"
    );
  }


  var swingExplain =
    "這套策略不是看到多頭就直接追價，而是等待價格回到 MA20／近期支撐附近。進入觀察區後，仍需留意是否出現止跌、低點不再下破或重新轉強；若跌破結構失效價，代表原本的回踩假設需要重新評估。";


  /* =========================
     策略二
  ========================= */

  var breakEntryLow =
    resistance -
    atr * .25;

  var breakEntryHigh =
    resistance +
    atr * .35;

  var breakStop =
    resistance -
    atr * .8;

  var breakRisk =
    Math.max(
      resistance -
      breakStop,
      atr * .5
    );

  var target2R =
    resistance +
    breakRisk * 2;

  var target3R =
    resistance +
    breakRisk * 3;

  var target5R =
    resistance +
    breakRisk * 5;

  var target7R =
    resistance +
    breakRisk * 7;


  var breakoutConfirmed =
    price > resistance &&
    price > ma20;


  var breakStatus =
    "等待突破";

  if(breakoutConfirmed){
    breakStatus =
      "突破成立・等待回測";
  }

  if(
    price >
    resistance +
    atr * 1.5
  ){
    breakStatus =
      "距突破區偏遠・避免追價";
  }


  var breakLines = [];

  if(price > ma20){

    breakLines.push(
      "✓ 股價目前位於 MA20 上方。"
    );

  }else{

    breakLines.push(
      "⚠ 股價尚未站上 MA20。"
    );
  }

  if(ma20 > ma60){

    breakLines.push(
      "✓ MA20 > MA60，符合較強的趨勢結構。"
    );

  }else{

    breakLines.push(
      "△ MA20 尚未高於 MA60。"
    );
  }

  if(macd > 0){

    breakLines.push(
      "✓ MACD > 0，動能條件偏正向。"
    );

  }else{

    breakLines.push(
      "△ MACD 尚未進入正值區。"
    );
  }

  if(
    rsi >= 50 &&
    rsi <= 78
  ){

    breakLines.push(
      "✓ RSI 位於突破策略較理想的強勢區間。"
    );

  }else if(rsi > 78){

    breakLines.push(
      "⚠ RSI 已偏熱，即使突破也要留意追價距離。"
    );

  }else{

    breakLines.push(
      "△ RSI 動能目前不足 50。"
    );
  }

  if(breakoutConfirmed){

    breakLines.push(
      "✓ 價格已突破原 20 日壓力，下一步觀察回測能否守住。"
    );

  }else{

    breakLines.push(
      "△ 尚未正式突破 20 日壓力 " +
      formatNumber(resistance) +
      "。"
    );
  }


  var breakExplain =
    "這套策略先等價格突破 20 日壓力，再觀察是否回測突破區並守住。單純瞬間突破不等於確認；若突破後已離壓力區超過約 1.5 ATR，系統會視為距離偏遠，避免因追價而使風險報酬惡化。";


  /* =========================
     顯示
  ========================= */

  var changePercent =
    liveStock
      ? Number(
          liveStock.changePercent
        )
      : Number(
          data.changePercent
        );


  var currency =
    data.currency === "USD"
      ? "USD"
      : "TWD";

  var money =
    currency === "USD"
      ? "$"
      : "NT$";

  var marketText =
    data.market === "US"
      ? "🇺🇸 美股"
      : "🇹🇼 台股";

  var marketClass =
    data.market === "US"
      ? "us"
      : "tw";


  var html =

    '<div class="analysis-head">' +

      '<div>' +

        '<div class="analysis-symbol">' +
          safe(symbol) +
        '</div>' +

        '<div class="analysis-name">' +
          safe(data.name || "") +
        '</div>' +

        '<div class="market ' +
          marketClass +
        '">' +
          marketText +
          ' · ' +
          safe(currency) +
          ' · ' +
          safe(trend) +
        '</div>' +

      '</div>' +


      '<div>' +

        '<div class="analysis-price">' +
          money +
          formatNumber(price) +
        '</div>' +

        '<div class="analysis-change ' +
          priceClass(changePercent) +
        '">' +
          percent(changePercent) +
        '</div>' +

      '</div>' +

    '</div>' +


    '<div class="metrics">' +

      metric("MA20",formatNumber(ma20)) +
      metric("MA60",formatNumber(ma60)) +
      metric("RSI 14",formatNumber(rsi,1)) +
      metric("MACD",formatNumber(macd)) +
      metric("ATR",formatNumber(atr)) +
      metric("支撐",formatNumber(support)) +
      metric("20日壓力",formatNumber(resistance)) +
      metric("趨勢",trend) +

    '</div>' +


    '<div class="brain-card">' +

      '<div class="brain-title">' +
        '🧠 綜合技術判讀' +
      '</div>' +

      '<div class="brain-summary">' +
        safe(summary) +
      '</div>' +

      '<div class="judgements">' +
        renderJudgements(
          judgements
        ) +
      '</div>' +

    '</div>' +


    strategyHTML(
      "green",
      "🟢 策略一｜支撐回踩波段",
      swingStatus,
      [
        [
          "入場觀察區",
          formatNumber(
            swingEntryLow
          ) +
          " ～ " +
          formatNumber(
            swingEntryHigh
          )
        ],

          formatNumber(

          )

            swingTP2
          )
        ],
        [
          "TP3 · 4R",
          formatNumber(
            swingTP3
          )
        ]
      ],
      swingLines,
      swingExplain
    ) +


    strategyHTML(
      "purple",
      "🟣 策略二｜高 R 突破回測",
      breakStatus,
      [
        [
          "20日突破壓力",
          formatNumber(
            resistance
          )
        ],
        [
          "突破觀察區",
          formatNumber(
            breakEntryLow
          ) +
          " ～ " +
          formatNumber(
            breakEntryHigh
          )
        ],
        [
          "結構失效",
          formatNumber(
            breakStop
          )
        ],
        [
          "2R",
          formatNumber(
            target2R
          )
        ],
        [
          "3R",
          formatNumber(
            target3R
          )
        ],
        [
          "5R",
          formatNumber(
            target5R
          )
        ],
        [

          formatNumber(
            target7R
          )
        ]
      ],
      breakLines,
      breakExplain
    ) +


    '<div class="data-note">' +

      '資料來源：' +
      safe(
        data.liveSource ||
        "FinMind"
      ) +

      (
        data.latestDate
          ? ' · 最新交易日 ' +
            safe(data.latestDate)
          : ''
      ) +

      '<br>' +

      (
        data.market === "US"
          ? "美股目前以 FinMind 日行情計算技術指標，並非盤中即時報價。"

      ) +

    '</div>';


  el("analysisResult")
    .innerHTML =
      html;
}


function metric(name,value){

  return (
    '<div class="metric">' +
      '<span>' +
        safe(name) +
      '</span>' +
      '<strong>' +
        safe(value) +
      '</strong>' +
    '</div>'
  );
}


function renderJudgements(list){

  var html = "";

  for(
    var i=0;
    i<list.length;
    i++
  ){

    html +=
      '<div class="judgement ' +
      safe(list[i].type) +
      '">' +
        safe(list[i].text) +
      '</div>';
  }

  return html;
}


function strategyHTML(
  color,
  title,
  status,
  items,
  lines,
  explain
){

  var html =

    '<div class="strategy ' +
      color +
    '">' +

      '<div class="strategy-title">' +
        safe(title) +
      '</div>' +

      '<div class="strategy-status">' +
        '目前狀態：' +
        safe(status) +
      '</div>' +

      '<div class="strategy-grid">';


  for(
    var i=0;
    i<items.length;
    i++
  ){

    html +=

      '<div class="strategy-item">' +

        '<span>' +
          safe(items[i][0]) +
        '</span>' +

        '<strong>' +
          safe(items[i][1]) +
        '</strong>' +

      '</div>';
  }


  html +=

      '</div>' +

      '<div class="strategy-analysis">' +

        '<div class="strategy-analysis-title">' +
          '系統判讀' +
        '</div>';


  for(
    var x=0;
    x<lines.length;
    x++
  ){

    html +=
      '<div class="analysis-line">' +
        safe(lines[x]) +
      '</div>';
  }


  html +=

      '</div>' +

      '<div class="strategy-explain">' +
        safe(explain) +
      '</div>' +

    '</div>';


  return html;
}


/* =========================
   雷達
========================= */

el("refreshButton")
  .addEventListener(
    "click",
    loadRadar
  );


async function loadRadar(){

  var button =
    el("refreshButton");

  button.disabled = true;
  button.textContent =
    "掃描中…";

  try{

    var response =
      await fetch(
        "/api/radar?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    var data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){
      throw new Error(
        data.error ||
        "雷達資料取得失敗"
      );
    }

    radarData =
      data;

    el("scanCount")
      .textContent =
        formatNumber(
          data.scanned,
          0
        );

    el("radarCount")
      .textContent =
        formatNumber(
          data.found,
          0
        );

    el("longCount")
      .textContent =
        formatNumber(
          data.longWatchCount,
          0
        );

    el("updateText")
      .textContent =
        "FinMind Sponsor 即時資料 · 更新 " +
        new Date()
          .toLocaleTimeString(
            "zh-TW",
            {
              hour:"2-digit",
              minute:"2-digit",
              second:"2-digit"
            }
          );

    renderStocks(
      "longGrid",
      data.longWatch || [],
      true
    );

    renderStocks(
      "radarGrid",
      data.radar || [],
      false
    );

    countdownSeconds =
      refreshSeconds;

  }catch(error){

    el("updateText")
      .textContent =
        "即時雷達連線失敗";

  }finally{

    button.disabled =
      false;

    button.textContent =
      "↻ 立即掃描";
  }
}


function renderStocks(
  target,
  list,
  longMode
){

  var root =
    el(target);

  if(
    !Array.isArray(list) ||
    list.length === 0
  ){

    root.innerHTML =
      '<div class="card">' +
        '<div class="loading">' +
          '目前沒有符合條件的股票。' +
        '</div>' +
      '</div>';

    return;
  }

  var html = "";

  for(
    var i=0;
    i<list.length;
    i++
  ){

    var stock =
      list[i];

    var priority =
      longMode &&
      stock.longStatus ===
      "優先觀察";

    html +=

      '<article class="stock-card ' +
      (
        priority
          ? "priority"
          : ""
      ) +
      '" data-stock="' +
      safe(stock.symbol) +
      '">' +


        '<div class="stock-top">' +

          '<div>' +

            '<div class="symbol">' +

              safe(
                longMode
                  ? stock.longEmoji || "🚀"
                  : stock.emoji || "🔥"
              ) +

              ' ' +

              safe(stock.symbol) +

            '</div>' +

            '<div class="name">' +

              safe(
                stock.name ||
                "台股"
              ) +

              ' · ' +

              safe(
                longMode
                  ? stock.longStatus
                  : stock.level
              ) +

            '</div>' +

          '</div>' +


          '<div class="score">' +

            '<strong>' +
              safe(stock.score) +
            '</strong>' +

            '<span>異動分數</span>' +

          '</div>' +

        '</div>' +


        '<div class="price-row">' +

          '<div class="price">' +
            formatNumber(
              stock.price
            ) +
          '</div>' +

          '<div class="' +
            priceClass(
              stock.changePercent
            ) +
          '">' +

            percent(
              stock.changePercent
            ) +

          '</div>' +

        '</div>' +


        '<div class="chips">' +

          '<div class="chip green">' +
            '量比 ' +
            formatNumber(
              stock.volumeRatio,
              1
            ) +
            'x' +
          '</div>' +

          '<div class="chip">' +
            '高點 ' +
            formatNumber(
              stock.high
            ) +
          '</div>' +

          '<div class="chip">' +
            '位置 ' +
            formatNumber(
              stock.dayPosition,
              0
            ) +
            '%' +
          '</div>' +

          '<div class="chip">' +
            '總量 ' +
            formatNumber(
              stock.totalVolume,
              0
            ) +
          '</div>' +

        '</div>';


    if(
      Array.isArray(
        stock.reasons
      ) &&
      stock.reasons.length
    ){

      html +=
        '<div class="reasons">';

      var max =
        Math.min(
          stock.reasons.length,
          4
        );

      for(
        var r=0;
        r<max;
        r++
      ){

        html +=
          '✓ ' +
          safe(
            stock.reasons[r]
          );

        if(r < max-1){
          html += "<br>";
        }
      }

      html +=
        '</div>';
    }


    if(longMode){

      html +=

        '<div class="levels">' +

          '<div class="level">' +
            '觀察區 ' +
            formatNumber(
              stock.observationLow
            ) +
            ' ～ ' +
            formatNumber(
              stock.observationHigh
            ) +
          '</div>' +

          '<div class="level">' +
            '失效 ' +
            formatNumber(
              stock.invalidation
            ) +
          '</div>' +

          '<div class="level">' +
            'TP1 ' +
            formatNumber(
              stock.target1
            ) +
          '</div>' +

        '</div>';
    }


    html +=
      '</article>';
  }


  root.innerHTML =
    html;


  var cards =
    root.querySelectorAll(
      "[data-stock]"
    );


  for(
    var c=0;
    c<cards.length;
    c++
  ){

    cards[c]
      .addEventListener(
        "click",
        function(){

          var symbol =
            this.getAttribute(
              "data-stock"
            );

          el("symbolInput").value =
            symbol;

          analyzeStock(symbol);
        }
      );
  }
}


/* =========================
   五分鐘更新
========================= */

setInterval(
  function(){

    countdownSeconds--;

    if(
      countdownSeconds <= 0
    ){

      countdownSeconds =
        refreshSeconds;

      loadRadar();
    }

    var minutes =
      Math.floor(
        countdownSeconds /
        60
      );

    var seconds =
      countdownSeconds %
      60;

    el("countdown")
      .textContent =
        String(minutes)
          .padStart(2,"0") +
        ":" +
        String(seconds)
          .padStart(2,"0");

  },
  1000
);


/* =========================
   啟動
========================= */

loadRadar();

</script>

</body>
</html>
