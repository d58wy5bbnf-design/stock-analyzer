<script>
"use strict";

var WATCH_KEY="yaozi_watchlist";
var POSITION_KEY="yaozi_positions_v31";
var STRICT_TARGET_WINRATE=70,STRICT_MIN_SAMPLE=20;

var countdownSeconds=300,homeScroll=0,currentStock=null,currentAnalysisSymbol="",currentAnalysisData=null,currentMarketState=null;
var analysisCountdownTimer=null,analysisCountdown=30,analysisRefreshing=false;
var KBAR_TF="5m",KBAR_DATA=[],KBAR_LOADING=false,KBAR_VIEW_COUNT=45,KBAR_END_INDEX=0,KBAR_SELECTED_INDEX=null,KBAR_TIMER=null;
var KBAR_DRAGGING=false,KBAR_DRAG_START_X=0,KBAR_DRAG_START_END=0,KBAR_PINCH_START_DISTANCE=0,KBAR_PINCH_START_COUNT=45;

function el(x){return document.getElementById(x)}
function safe(v){var d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}
function fmt(v,d){if(d===undefined)d=2;v=Number(v);return Number.isFinite(v)?v.toLocaleString("zh-TW",{maximumFractionDigits:d}):"--"}
function pct(v){v=Number(v);return Number.isFinite(v)?(v>0?"+":"")+v.toFixed(2)+"%":"--"}
function pclass(v){v=Number(v);return v>0?"up":v<0?"down":"flat"}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function currentTimeText(){return new Date().toLocaleTimeString("zh-TW",{hour12:false})}
function SMA(a,p){if(a.length<p)return NaN;return a.slice(-p).reduce((x,y)=>x+Number(y),0)/p}
function EMA(a,p){if(a.length<p)return NaN;var e=a.slice(0,p).reduce((x,y)=>x+Number(y),0)/p,k=2/(p+1);for(var i=p;i<a.length;i++)e=Number(a[i])*k+e*(1-k);return e}
function RSI(a,p){p=p||14;if(a.length<=p)return NaN;var r=a.slice(-(p+1)),g=0,l=0;for(var i=1;i<r.length;i++){var d=Number(r[i])-Number(r[i-1]);d>0?g+=d:l+=Math.abs(d)}g/=p;l/=p;return l===0?100:100-(100/(1+g/l))}
function ATR(r,p){p=p||14;if(r.length<=p)return NaN;var a=[];for(var i=1;i<r.length;i++){var h=+r[i].high,l=+r[i].low,c=+r[i-1].close;a.push(Math.max(h-l,Math.abs(h-c),Math.abs(l-c)))}return SMA(a,p)}

function findHTFSwingStructure(rows){
var data=rows.slice(-120),p=[];
if(data.length<30)return{low:NaN,type:"NONE"};
for(var i=3;i<data.length-3;i++){
var l=+data[i].low;
if(l<+data[i-1].low&&l<+data[i-2].low&&l<+data[i-3].low&&l<=+data[i+1].low&&l<=+data[i+2].low&&l<=+data[i+3].low){
var before=data.slice(Math.max(0,i-20),i),after=data.slice(i+1,Math.min(data.length,i+25));
if(!before.length||!after.length)continue;
var ph=Math.max(...before.map(x=>+x.high)),ah=Math.max(...after.map(x=>+x.high));
p.push({low:l,confirmed:ah>ph,date:data[i].date||""});
}}
var c=p.filter(x=>x.confirmed);
if(c.length){var z=c[c.length-1],pr=c.length>1?c[c.length-2]:null;return{low:z.low,type:pr&&z.low>pr.low?"HL":"SWING_LOW",date:z.date}}
if(p.length){z=p[p.length-1];return{low:z.low,type:"SWING_LOW",date:z.date}}
return{low:Math.min(...data.slice(-20).map(x=>+x.low)),type:"FALLBACK"};
}

function getHTFStructureState(rows,l,a){var c=+rows[rows.length-1].close,b=l-a*.15;return{broken:Number.isFinite(l)&&c<b,warning:Number.isFinite(l)&&c>=b&&c<l+a*.5,buffer:b}}

function getWatchlist(){try{return JSON.parse(localStorage.getItem(WATCH_KEY)||"[]")||[]}catch(e){return[]}}
function saveWatchlist(x){localStorage.setItem(WATCH_KEY,JSON.stringify(x));renderWatchlist()}
function isFavorite(s){return getWatchlist().some(x=>String(x.symbol)===String(s))}
function toggleFavorite(s){var a=getWatchlist(),i=a.findIndex(x=>String(x.symbol)===String(s.symbol));i>=0?a.splice(i,1):a.unshift({symbol:String(s.symbol),name:s.name||"",market:s.market||""});saveWatchlist(a);updateFavoriteButton()}
function removeFavorite(s){saveWatchlist(getWatchlist().filter(x=>String(x.symbol)!==String(s)))}

function updatePositionProtection(p,m){

var R=+p.initialR||m.atr,g=(h-p.entry)/R,c=protect;
if(g>=1)c=Math.max(c,p.entry);if(g>=1.5)c=Math.max(c,p.entry+R*.25);if(g>=2)c=Math.max(c,p.entry+R*.75);if(g>=3)c=Math.max(c,p.entry+R*1.5);
if(g>=1)c=Math.max(c,Math.min(Math.max(m.ma20-m.atr*.5,m.recent3Low-m.atr*.25),m.price-m.atr*.35));
c=Math.max(protect,c);p.highWater=h;p.protectPrice=c;var a=getPositions();a[p.symbol]=p;savePositions(a);return p
}

function intradayAverageSignal(){

if(l.close>=s){score+=30;r.push("✓ 站上分 K SMA5")}else r.push("△ 尚未站上分 K SMA5");

}

/* ===== 4.4 BACKTEST ===== */

function backtestIndicators(rows,index){
var p=rows.slice(0,index+1);if(p.length<90)return null;
var c=p.map(x=>+x.close),ma20=SMA(c,20),ma60=SMA(c,60),old20=SMA(c.slice(0,-5),20),old60=SMA(c.slice(0,-10),60),rsi=RSI(c,14),macd=EMA(c.slice(-100),12)-EMA(c.slice(-100),26),atr=ATR(p,14);
if(!(atr>0))return null;
var prior=p.slice(-21,-1);if(prior.length<20)return null;
var res=Math.max(...prior.map(x=>+x.high)),st=findHTFSwingStructure(p),sl=+st.low,b=rows[index],o=+b.open,h=+b.high,l=+b.low,cl=+b.close,range=Math.max(h-l,.000001);
return{close:cl,open:o,ma20,ma60,ma20Rising:Number.isFinite(old20)&&ma20>old20,ma60Rising:Number.isFinite(old60)&&ma60>old60,rsi,macd,atr,resistance:res,structureLow:sl,bodyRatio:Math.abs(cl-o)/range,closeLocation:(cl-l)/range,breakoutATR:(cl-res)/atr,aboveMA20:(cl-ma20)/atr,structureGood:Number.isFinite(sl)&&cl>sl-atr*.15}
}

function strictHighRSignal(rows,i){
var x=backtestIndicators(rows,i);if(!x)return null;
var ok=x.close>x.ma20&&x.ma20>x.ma60&&x.ma20Rising&&x.macd>0&&x.rsi>=54&&x.rsi<=70&&x.close>x.resistance&&x.breakoutATR>=0&&x.breakoutATR<=.8&&x.aboveMA20<=2.5&&x.close>=x.open&&x.closeLocation>=.65&&x.bodyRatio>=.3&&x.structureGood;
return ok?{strategy:"HIGH_R",signalDate:rows[i].date,atr:x.atr,structureLow:x.structureLow}:null
}

function strictSurgeSignal(rows,i){
var x=backtestIndicators(rows,i);if(!x)return null;
var ok=x.close>x.ma20&&x.ma20>x.ma60&&x.ma20Rising&&x.ma60Rising&&x.macd>0&&x.rsi>=58&&x.rsi<=73&&x.close>x.resistance&&x.breakoutATR>=.1&&x.breakoutATR<=.9&&x.aboveMA20<=2.6&&x.close>x.open&&x.closeLocation>=.7&&x.bodyRatio>=.35&&x.structureGood;
return ok?{strategy:"SURGE",signalDate:rows[i].date,atr:x.atr,structureLow:x.structureLow}:null
}

function buildBacktestTrade(rows,i,s){
var ei=i+1;if(ei>=rows.length)return null;var e=+rows[ei].open,stop=s.structureLow-s.atr*.15;if(!(e>stop))return null;
var R=e-stop,ra=R/s.atr,rp=R/e;if(ra<.8||ra>(s.strategy==="HIGH_R"?6:5.5)||rp>(s.strategy==="HIGH_R"?.16:.14))return null;
var a=s.strategy==="HIGH_R"?2:1.5,b=s.strategy==="HIGH_R"?3:2.5,c=s.strategy==="HIGH_R"?5:4;
return{strategy:s.strategy,entryIndex:ei,entry:e,stop,risk:R,tp1:e+R*a,tp2:e+R*b,tp3:e+R*c,m1:a,m2:b,m3:c,signalDate:s.signalDate}
}

function simulateTrade(rows,t){
var end=Math.min(rows.length-1,t.entryIndex+80),p1=false,p2=false,p3=false;
for(var i=t.entryIndex;i<=end;i++){
var l=+rows[i].low,h=+rows[i].high;
if(l<=t.stop)return{result:"LOSS",r:-1,tp1:p1,tp2:p2,tp3:p3,exitIndex:i};
if(h>=t.tp1){p1=true;p2=h>=t.tp2;p3=h>=t.tp3;for(var j=i;j<=end;j++){if(+rows[j].high>=t.tp2)p2=true;if(+rows[j].high>=t.tp3){p3=true;break}}return{result:"WIN",r:t.m1,tp1:true,tp2:p2,tp3:p3,exitIndex:i}}
}
return{result:"LOSS",r:(+rows[end].close-t.entry)/t.risk,tp1:false,tp2:false,tp3:false,exitIndex:end}
}

function runStrategyBacktest(rows,type){
var tr=[],next=90;
for(var i=90;i<rows.length-2;i++){if(i<next)continue;var s=type==="HIGH_R"?strictHighRSignal(rows,i):strictSurgeSignal(rows,i);if(!s)continue;var t=buildBacktestTrade(rows,i,s);if(!t)continue;var r=simulateTrade(rows,t);tr.push({result:r.result,r:r.r,tp1:r.tp1,tp2:r.tp2,tp3:r.tp3});next=r.exitIndex+1}
var n=tr.length;if(!n)return{total:0};
var w=tr.filter(x=>x.result==="WIN").length,wr=w/n*100,rate=k=>tr.filter(x=>x[k]).length/n*100,avg=tr.reduce((a,x)=>a+x.r,0)/n,st=0,mx=0;
tr.forEach(x=>{if(x.result==="LOSS"){st++;mx=Math.max(mx,st)}else st=0});
return{total:n,wins:w,losses:n-w,winRate:wr,tp1Rate:rate("tp1"),tp2Rate:rate("tp2"),tp3Rate:rate("tp3"),slRate:(n-w)/n*100,averageR:avg,maxLosingStreak:mx,sampleEnough:n>=20,targetReached:n>=20&&wr>=70}
}

function backtestHTML(title,r){
if(!r.total)return'<div class="backtest-card"><div class="backtest-title">'+title+'</div><div class="backtest-result warn">目前沒有符合 4.4 嚴格條件的完整樣本。</div></div>';
var msg=!r.sampleEnough?"樣本不足 20 筆，暫不判定 70% 門檻。":r.targetReached?"✓ 此歷史樣本達到 ≥70% 門檻。":"目前歷史勝率尚未達到 70% 門檻。";
return'<div class="backtest-card"><div class="backtest-head"><div><div class="backtest-title">'+title+'</div><div class="section-sub">下一交易日進場 · TP1 定義主要勝負</div></div><div class="backtest-target">'+(r.targetReached?"✓ ≥70% 達標":"目標 ≥70%")+'</div></div><div class="backtest-grid">'+backtestStat("交易樣本",r.total)+backtestStat("歷史勝率",fmt(r.winRate,1)+"%",r.targetReached?"good":"warn")+backtestStat("勝 / 敗",r.wins+" / "+r.losses)+backtestStat("SL 比率",fmt(r.slRate,1)+"%")+backtestStat("TP1",fmt(r.tp1Rate,1)+"%")+backtestStat("TP2",fmt(r.tp2Rate,1)+"%")+backtestStat("TP3",fmt(r.tp3Rate,1)+"%")+backtestStat("平均 R",fmt(r.averageR,2)+"R",r.averageR>0?"good":"bad")+'</div><div class="backtest-result '+(r.targetReached?"good":"warn")+'">'+msg+' 歷史結果不代表未來勝率。</div></div>'
}

'<div class="big-section-title">🔥 強勢續攻波段</div><div class="overview-card surge-card">'+overviewRow("嚴格模式",strictSurge?"條件符合":"等待確認",strictSurge?"green":"")+overviewRow("日 K 結構低點",fmt(structureLow),"")+targetBox("📍 續攻觀察區",fmt(price-atr*.2)+" ～ "+fmt(price+atr*.15),"orange")+targetBox("💰 TP1 · 1.5R",fmt(sCenter+sR*1.5),"tp")+targetBox("💰 TP2 · 2.5R",fmt(sCenter+sR*2.5),"tp")+targetBox("🔥 TP3 · 4R",fmt(sCenter+sR*4),"tp3")+targetBox("🛑 日 K 波段結構失效位",fmt(bstop),"stop")+'</div>'+
'<div class="data-note">4.4：高 R 以先到 2R 為主要歷史勝利；強勢續攻以先到 1.5R 為主要歷史勝利。同一根日 K 同時碰 TP 與 SL 時保守採 SL 優先。至少 20 筆樣本且實際勝率 ≥70% 才標示歷史門檻達成。</div>';

el("favoriteButton").onclick=()=>toggleFavorite(currentStock);updateFavoriteButton();bindPositionControls();setupKBarControls();loadKBar()
}

function bindPositionControls(){
if(el("positionSave"))el("positionSave").onclick=createPositionFromForm;
if(el("positionReset"))el("positionReset").onclick=()=>{deletePosition(currentMarketState.symbol);buildAnalysis(currentAnalysisData)};
if(el("positionDelete"))el("positionDelete").onclick=()=>{deletePosition(currentMarketState.symbol);buildAnalysis(currentAnalysisData)}
}
function refreshAveragePanel(){if(el("averagePanel")&&currentMarketState)el("averagePanel").innerHTML=averageHTML(currentMarketState)}

function isHistoricalTF(t){return["1d","1w","1mo","1y"].includes(t)}
function kbarHTML(m){
var p=m==="US"?[["1d","日"],["1w","週"],["1mo","月"],["1y","年"]]:[["1m","1分"],["3m","3分"],["5m","5分"],["10m","10分"],["15m","15分"],["30m","30分"],["60m","1H"],["2h","2H"],["4h","4H"],["6h","6H"],["12h","12H"],["1d","日"],["1w","週"],["1mo","月"],["1y","年"]];
if(m==="US"&&!isHistoricalTF(KBAR_TF))KBAR_TF="1d";
return'<div class="kbar-card"><div class="kbar-head"><div><div class="kbar-title">K 線走勢</div><div class="kbar-sub">左右滑動 · 雙指縮放 · 點 K 棒查看 OHLCV</div></div><div id="kbarLive" class="kbar-live">資料連線中</div></div><div id="kbarPeriods" class="kbar-periods">'+p.map(x=>'<button class="kbar-period '+(KBAR_TF===x[0]?"active":"")+'" data-kbar-tf="'+x[0]+'">'+x[1]+'</button>').join("")+'</div><div id="kbarInfo" class="kbar-info">選擇 K 棒查看資料</div><div class="kbar-wrap"><canvas id="kbarCanvas"></canvas><div id="kbarLoading" class="kbar-loading">正在載入 K 線…</div></div><div class="kbar-bottom"><div class="kbar-help">← 左右拖曳歷史 · 雙指縮放</div><button id="kbarLatest" class="latest-btn">回到最新</button></div></div>'
}

function normalizeDailyRows(r){return r.map(x=>{var raw=x.date??x.time??x.datetime??x.timestamp,ts=typeof raw==="number"?raw:new Date(raw).getTime();if(ts<1e12)ts*=1000;return{timestamp:ts,open:+x.open,high:+x.high,low:+x.low,close:+x.close,volume:+(x.volume??x.Trading_Volume??0)}}).filter(x=>Number.isFinite(x.timestamp)&&Number.isFinite(x.close)).sort((a,b)=>a.timestamp-b.timestamp)}
function aggregateCandles(d,t){if(t==="1d")return d;var m=new Map;d.forEach(c=>{var x=new Date(c.timestamp),k=t==="1mo"?x.getFullYear()+"-"+(x.getMonth()+1):t==="1y"?String(x.getFullYear()):(()=>{var q=new Date(x);q.setDate(q.getDate()-((q.getDay()+6)%7));return q.toDateString()})();if(!m.has(k))m.set(k,{...c});else{var z=m.get(k);z.high=Math.max(z.high,c.high);z.low=Math.min(z.low,c.low);z.close=c.close;z.volume+=c.volume}});return Array.from(m.values())}

async function loadKBar(){
if(KBAR_LOADING)return;KBAR_LOADING=true;var load=el("kbarLoading");
try{
var c;
if(isHistoricalTF(KBAR_TF)){c=aggregateCandles(normalizeDailyRows(currentAnalysisData.rows||[]),KBAR_TF);el("kbarLive").textContent="歷史 K 線"}
else{var r=await fetch("/api/kbar?symbol="+encodeURIComponent(currentAnalysisSymbol)+"&timeframe="+KBAR_TF+"&t="+Date.now(),{cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"K 線取得失敗");c=(d.candles||[]).map(x=>({timestamp:(+x.timestamp<1e12?+x.timestamp*1000:+x.timestamp)||new Date(x.time).getTime(),open:+x.open,high:+x.high,low:+x.low,close:+x.close,volume:+x.volume||0}));el("kbarLive").textContent="🟢 Fugle 分 K"}
KBAR_DATA=c;KBAR_END_INDEX=c.length;KBAR_SELECTED_INDEX=null;drawKBar();updateKBarInfo();refreshAveragePanel();if(!isHistoricalTF(KBAR_TF))startKBarTimer();if(load)load.classList.add("hidden")
}catch(e){if(load)load.textContent=e.message}finally{KBAR_LOADING=false}
}

function setupKBarControls(){
var p=el("kbarPeriods");if(p)p.querySelectorAll("[data-kbar-tf]").forEach(b=>b.onclick=function(){KBAR_TF=this.dataset.kbarTf;p.querySelectorAll(".kbar-period").forEach(x=>x.classList.remove("active"));this.classList.add("active");stopKBarTimer();KBAR_DATA=[];refreshAveragePanel();loadKBar()});
if(el("kbarLatest"))el("kbarLatest").onclick=()=>{KBAR_END_INDEX=KBAR_DATA.length;drawKBar();updateKBarInfo()};
var c=el("kbarCanvas");if(!c)return;
c.ontouchstart=e=>{if(e.touches.length===1){KBAR_DRAGGING=true;KBAR_DRAG_START_X=e.touches[0].clientX;KBAR_DRAG_START_END=KBAR_END_INDEX}else if(e.touches.length===2){KBAR_PINCH_START_DISTANCE=touchDistance(e.touches);KBAR_PINCH_START_COUNT=KBAR_VIEW_COUNT}};
c.ontouchmove=e=>{if(e.touches.length===2){e.preventDefault();var d=touchDistance(e.touches);KBAR_VIEW_COUNT=clamp(Math.round(KBAR_PINCH_START_COUNT*KBAR_PINCH_START_DISTANCE/d),15,120);drawKBar()}else if(KBAR_DRAGGING){var px=c.clientWidth/KBAR_VIEW_COUNT,dif=Math.round((KBAR_DRAG_START_X-e.touches[0].clientX)/px);KBAR_END_INDEX=clamp(KBAR_DRAG_START_END+dif,Math.min(KBAR_VIEW_COUNT,KBAR_DATA.length),KBAR_DATA.length);drawKBar()}};
c.ontouchend=()=>KBAR_DRAGGING=false;c.onclick=e=>selectCandleAt(e.clientX)
}
function touchDistance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
function selectCandleAt(x){var c=el("kbarCanvas"),r=c.getBoundingClientRect(),s=Math.max(0,KBAR_END_INDEX-KBAR_VIEW_COUNT),v=KBAR_DATA.slice(s,KBAR_END_INDEX),slot=(r.width-62)/v.length,i=Math.floor((x-r.left-8)/slot);KBAR_SELECTED_INDEX=s+clamp(i,0,v.length-1);drawKBar();updateKBarInfo()}
function updateKBarInfo(){if(!KBAR_DATA.length)return;var c=KBAR_DATA[KBAR_SELECTED_INDEX??KBAR_DATA.length-1];el("kbarInfo").innerHTML='<strong>'+new Date(c.timestamp).toLocaleString("zh-TW",{hour12:false})+'</strong>　O '+fmt(c.open)+'　H '+fmt(c.high)+'　L '+fmt(c.low)+'　C '+fmt(c.close)+'　V '+fmt(c.volume,0)}
function drawKBar(){
var cv=el("kbarCanvas");if(!cv||!KBAR_DATA.length)return;var w=cv.clientWidth,h=370,dpr=devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;var x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
var s=Math.max(0,KBAR_END_INDEX-KBAR_VIEW_COUNT),d=KBAR_DATA.slice(s,KBAR_END_INDEX),L=8,R=55,T=14,B=285,cw=w-L-R,ch=B-T,max=Math.max(...d.map(z=>z.high)),min=Math.min(...d.map(z=>z.low)),rg=max-min||1;max+=rg*.08;min-=rg*.08;rg=max-min;var y=v=>T+(max-v)/rg*ch,slot=cw/d.length,body=Math.max(1,Math.min(12,slot*.62));
d.forEach((c,i)=>{var xx=L+slot*i+slot/2,up=c.close>=c.open;x.strokeStyle=x.fillStyle=up?"#45e0ad":"#ff6976";x.beginPath();x.moveTo(xx,y(c.high));x.lineTo(xx,y(c.low));x.stroke();x.fillRect(xx-body/2,Math.min(y(c.open),y(c.close)),body,Math.max(1.5,Math.abs(y(c.close)-y(c.open))))})
}
function startKBarTimer(){stopKBarTimer();KBAR_TIMER=setInterval(()=>{if(!document.hidden)loadKBar()},30000)}
function stopKBarTimer(){if(KBAR_TIMER)clearInterval(KBAR_TIMER);KBAR_TIMER=null}

function startAnalysisTracker(){stopAnalysisTracker();analysisCountdown=30;analysisCountdownTimer=setInterval(()=>{analysisCountdown--;if(analysisCountdown<=0){analysisCountdown=30;refreshCurrentAnalysis()}if(el("analysisLiveCountdown"))el("analysisLiveCountdown").textContent=analysisRefreshing?"更新中":analysisCountdown+"s"},1000)}
function stopAnalysisTracker(){if(analysisCountdownTimer)clearInterval(analysisCountdownTimer);analysisCountdownTimer=null}
async function refreshCurrentAnalysis(){if(!currentAnalysisSymbol||analysisRefreshing||document.hidden)return;analysisRefreshing=true;try{var y=scrollY,d=await fetchStockData(currentAnalysisSymbol);currentAnalysisData=d;buildAnalysis(d);scrollTo(0,y);updateTrackerSuccess(d)}catch(e){}finally{analysisRefreshing=false}}
function updateTrackerSuccess(d){el("analysisLiveStatus").textContent=d.market==="TW"&&d.isRealtime?"🟢 台股盤中即時追蹤":"🟢 行情自動追蹤";el("analysisLiveTime").textContent="最後更新 "+currentTimeText()+" · 每 30 秒重新分析"}

async function loadRadar(){
try{var r=await fetch("/api/radar?t="+Date.now(),{cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error();el("scanCount").textContent=fmt(d.scanned,0);el("radarCount").textContent=fmt(d.found,0);el("longCount").textContent=fmt(d.longWatchCount,0);el("updateText").textContent="FinMind Sponsor 即時資料 · 更新 "+currentTimeText();renderStocks("longGrid",d.longWatch||[],true);renderStocks("radarGrid",d.radar||[],false);countdownSeconds=300}catch(e){el("updateText").textContent="即時雷達連線失敗"}
}
function renderStocks(id,a,l){var r=el(id);if(!a.length){r.innerHTML='<div class="card">目前沒有符合條件的股票</div>';return}r.innerHTML=a.map(s=>'<article class="stock-card '+(l&&s.longStatus==="優先觀察"?"priority":"")+'" data-stock="'+safe(s.symbol)+'"><div class="stock-top"><div><div class="symbol">'+safe(s.symbol)+'</div><div class="name">'+safe(s.name||"台股")+'</div></div><div class="score"><strong>'+safe(s.score)+'</strong><span>異動分數</span></div></div><div class="price-row"><div class="price">'+fmt(s.price)+'</div><div class="'+pclass(s.changePercent)+'">'+pct(s.changePercent)+'</div></div><div class="chips"><div class="chip green">量比 '+fmt(s.volumeRatio,1)+'x</div></div></article>').join("");r.querySelectorAll("[data-stock]").forEach(x=>x.onclick=function(){analyze(this.dataset.stock)})}

function backHome(){stopAnalysisTracker();stopKBarTimer();el("analysisPage").classList.add("hidden");el("homePage").classList.remove("hidden");setTimeout(()=>scrollTo(0,homeScroll),10)}
el("backTop").onclick=backHome;el("backBottom").onclick=backHome;
el("stockSearchForm").onsubmit=e=>{e.preventDefault();analyze(el("symbolInput").value)};
document.querySelectorAll(".example").forEach(b=>b.onclick=()=>analyze(b.dataset.symbol));
el("refreshButton").onclick=loadRadar;

setInterval(()=>{countdownSeconds--;if(countdownSeconds<=0){countdownSeconds=300;loadRadar()}var m=Math.floor(countdownSeconds/60),s=countdownSeconds%60;el("countdown").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")},1000);

window.addEventListener("resize",()=>{if(KBAR_DATA.length)drawKBar()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&currentAnalysisSymbol&&!el("analysisPage").classList.contains("hidden"))refreshCurrentAnalysis()});

renderWatchlist();
loadRadar();
</script>
