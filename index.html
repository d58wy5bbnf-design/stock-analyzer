<script>

const $=id=>document.getElementById(id);

const fmt=n=>{
  if(!Number.isFinite(Number(n)))return "--";
  return Number(n).toLocaleString(undefined,{
    maximumFractionDigits:2
  });
};

function avg(a){
  if(!a.length)return 0;
  return a.reduce((x,y)=>x+y,0)/a.length;
}

function sma(a,n){
  return avg(a.slice(-Math.min(n,a.length)));
}

function ema(a,n){
  if(!a.length)return 0;
  let k=2/(n+1);
  let v=a[0];

  for(let i=1;i<a.length;i++){
    v=a[i]*k+v*(1-k);
  }

  return v;
}

function rsi(a,n=14){

  if(a.length<n+1)return 50;

  let g=0,l=0;

  for(let i=a.length-n;i<a.length;i++){

    let d=a[i]-a[i-1];

    if(d>0)g+=d;
    else l-=d;
  }

  if(!l)return 100;

  let rs=(g/n)/(l/n);

  return 100-100/(1+rs);
}

function atr(rows,n=14){

  let d=rows.slice(-(n+1));
  let tr=[];

  for(let i=1;i<d.length;i++){

    tr.push(
      Math.max(
        d[i].high-d[i].low,
        Math.abs(d[i].high-d[i-1].close),
        Math.abs(d[i].low-d[i-1].close)
      )
    );
  }

  return avg(tr);
}

function clamp(x,min,max){
  return Math.max(min,Math.min(max,x));
}

function pct(x,b){
  if(!b)return 0;
  return (x/b-1)*100;
}

function absPct(a,b){
  return Math.abs(pct(a,b));
}

function dist(level,price){

  let p=pct(level,price);

  if(p>0)
    return `距最新行情上方 ${Math.abs(p).toFixed(1)}%`;

  if(p<0)
    return `距最新行情下方 ${Math.abs(p).toFixed(1)}%`;

  return "接近最新行情";
}

function recentSwingLow(rows){

  let data=rows.slice(-20);
  let candidates=[];

  for(let i=2;i<data.length-2;i++){

    if(
      data[i].low<=data[i-1].low &&
      data[i].low<=data[i-2].low &&
      data[i].low<=data[i+1].low &&
      data[i].low<=data[i+2].low
    ){
      candidates.push(data[i].low);
    }
  }

  if(!candidates.length){
    return Math.min(...data.map(x=>x.low));
  }

  return candidates.at(-1);
}

function recentSwingHigh(rows){

  let data=rows.slice(-30);
  let candidates=[];

  for(let i=2;i<data.length-2;i++){

    if(
      data[i].high>=data[i-1].high &&
      data[i].high>=data[i-2].high &&
      data[i].high>=data[i+1].high &&
      data[i].high>=data[i+2].high
    ){
      candidates.push(data[i].high);
    }
  }

  if(!candidates.length){
    return Math.max(...data.map(x=>x.high));
  }

  return candidates.at(-1);
}

function formatMarketTime(timestamp){

  if(!Number.isFinite(Number(timestamp)))
    return "更新時間：--";

  try{

    return "行情時間："+new Date(
      Number(timestamp)*1000
    ).toLocaleString("zh-TW",{
      timeZone:"Asia/Taipei",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    });

  }catch{
    return "行情時間：--";
  }
}

async function run(){

  let symbol=$("symbol").value.trim();

  if(!symbol)return;

  $("status").style.display="block";
  $("status").textContent=
    "妖子平台2.0 正在取得最新行情並分析市場結構…";

  $("hero").style.display="none";
  $("report").style.display="none";

  try{

    let response=await fetch(
      "/api/stock?symbol="+encodeURIComponent(symbol),
      {cache:"no-store"}
    );

    let d=await response.json();

    if(!response.ok){
      throw Error(d.error||"分析失敗");
    }

    let rows=(d.rows||[]).filter(x=>
      Number.isFinite(Number(x.close)) &&
      Number.isFinite(Number(x.high)) &&
      Number.isFinite(Number(x.low))
    ).map(x=>({
      ...x,
      close:Number(x.close),
      high:Number(x.high),
      low:Number(x.low),
      open:Number(x.open),
      volume:Number(x.volume)
    }));

    if(rows.length<30){
      throw Error("歷史行情資料不足");
    }

    let closes=rows.map(x=>x.close);

    /*
      dailyClose = 技術分析歷史日K的最後收盤
      price = 最新行情
    */

    let dailyClose=closes.at(-1);

    let price=
      Number.isFinite(Number(d.livePrice))
      ? Number(d.livePrice)
      : dailyClose;

    let previousClose=
      Number.isFinite(Number(d.previousClose))
      ? Number(d.previousClose)
      : null;

    let change=
      Number.isFinite(Number(d.change))
      ? Number(d.change)
      : (
          previousClose
          ? price-previousClose
          : null
        );

    let changePercent=
      Number.isFinite(Number(d.changePercent))
      ? Number(d.changePercent)
      : (
          previousClose
          ? (price/previousClose-1)*100
          : null
        );

    let dayHigh=
      Number.isFinite(Number(d.dayHigh))
      ? Number(d.dayHigh)
      : null;

    let dayLow=
      Number.isFinite(Number(d.dayLow))
      ? Number(d.dayLow)
      : null;


    /*
      技術指標：
      繼續使用歷史日K
    */

    let ma20=sma(closes,20);
    let ma60=sma(closes,60);

    let rv=rsi(closes);

    let macd=
      ema(closes.slice(-80),12)-
      ema(closes.slice(-80),26);

    let ATR=atr(rows);

    if(!Number.isFinite(ATR)||ATR<=0){
      throw Error("ATR 波動資料不足");
    }

    let ATRpct=ATR/price*100;

    let r10=rows.slice(-10);
    let r20=rows.slice(-20);
    let r60=rows.slice(-Math.min(60,rows.length));

    let low10=Math.min(...r10.map(x=>x.low));
    let low20=Math.min(...r20.map(x=>x.low));
    let low60=Math.min(...r60.map(x=>x.low));

    let high10=Math.max(...r10.map(x=>x.high));
    let high20=Math.max(...r20.map(x=>x.high));
    let high60=Math.max(...r60.map(x=>x.high));

    let swingLow=recentSwingLow(rows);
    let swingHigh=recentSwingHigh(rows);


    /* =========================
       趨勢
    ========================= */

    let trend="整理／轉折";
    let trendClass="amber";

    let trendExplanation=
      "目前最新價格、MA20、MA60 與 MACD 尚未形成完全一致的方向，市場比較接近整理或轉折階段。";

    if(price>ma20 && ma20>ma60 && macd>0){

      trend="偏多趨勢";
      trendClass="green";

      trendExplanation=
        "最新行情位於 MA20 上方、MA20 高於 MA60，而且 MACD 動能為正，短中期技術結構偏多。若最新價格已經離支撐過遠，仍需注意追價後風險報酬下降。";

    }else if(price<ma20 && ma20<ma60 && macd<0){

      trend="偏弱趨勢";
      trendClass="red";

      trendExplanation=
        "最新行情位於主要均線下方、MA20 低於 MA60，而且 MACD 動能偏弱。反彈時均線與前方壓力區可能形成阻力。";
    }


    let rsiExplanation="";

    if(rv>=78){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 位於非常偏高的動能區。這不代表一定立即下跌，但代表短線漲幅較大，若同時遠離主要支撐，追價風險會提高。`;

    }else if(rv>=70){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 位於偏高區，多方動能仍強，但短線過熱與震盪風險增加。`;

    }else if(rv>=55){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 位於中性偏強區，買方動能相對有利，尚未進入極端過熱區。`;

    }else if(rv>=45){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 接近中性區，需要搭配均線、支撐與突破結構判斷。`;

    }else if(rv>=30){

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 屬於偏弱區，短線賣壓較明顯。`;

    }else{

      rsiExplanation=
        `RSI ${rv.toFixed(1)} 已進入較低區域。超賣不代表一定反彈，仍需確認支撐是否真正產生承接。`;
    }


    /* =========================
       策略一
    ========================= */

    let supports=[
      {name:"MA20",value:ma20},
      {name:"MA60",value:ma60},
      {name:"10日低點",value:low10},
      {name:"20日低點",value:low20},
      {name:"60日低點",value:low60},
      {name:"近期波段低點",value:swingLow}
    ]
    .filter(x=>
      Number.isFinite(x.value)&&
      x.value<=price*1.015
    )
    .sort((a,b)=>b.value-a.value);


    let support1=
      supports[0]?.value||low20;


    let support2=
      supports.find(
        x=>x.value<
        support1-Math.max(ATR*.45,price*.006)
      )?.value||low60;


    if(support2>support1){
      [support1,support2]=[support2,support1];
    }


    let reasons=[];

    if(absPct(ma20,support1)<1.5)
      reasons.push("MA20 共振");

    if(absPct(ma60,support1)<1.5)
      reasons.push("MA60 共振");

    if(absPct(low10,support1)<1.5)
      reasons.push("10日低點");

    if(absPct(low20,support1)<1.5)
      reasons.push("20日低點");

    if(absPct(swingLow,support1)<1.5)
      reasons.push("近期波段低點");

    if(!reasons.length)
      reasons.push("距最新行情最近的主要支撐");


    let width=
      clamp(
        ATR*.35,
        price*.004,
        price*.018
      );


    let entry1Low=
      support1-width;

    let entry1High=
      support1+width;


    if(entry1Low<=support2){
      entry1Low=
        support2+ATR*.15;
    }


    let entry1=
      (entry1Low+entry1High)/2;


    let stop1=
      Math.min(
        support2-ATR*.35,
        entry1-ATR*1.15
      );


    if(stop1>=entry1||stop1<=0){
      stop1=
        entry1-ATR*1.25;
    }


    let risk1=
      entry1-stop1;


    let pressureCandidates=[
      high10,
      high20,
      high60,
      swingHigh
    ]
    .filter(x=>x>entry1)
    .sort((a,b)=>a-b);


    let pressure1=
      pressureCandidates[0]||
      entry1+risk1*1.5;


    let pressure2=
      pressureCandidates.find(
        x=>x>pressure1+ATR*.5
      )||
      entry1+risk1*3;


    let tp1=
      Math.min(
        entry1+risk1*1.5,
        pressure1
      );


    if(tp1<=entry1){
      tp1=
        entry1+risk1*1.5;
    }


    let tp2=
      Math.max(
        entry1+risk1*2.5,
        tp1+ATR*.7
      );


    let tp3=
      Math.max(
        entry1+risk1*4,
        tp2+ATR
      );


    let recentHighest=
      Math.max(
        ...rows.slice(-20).map(x=>x.high)
      );


    let trailing1=
      Math.max(
        recentHighest-ATR*2,
        stop1
      );


    let extension1=
      Math.max(
        tp3+ATR*1.5,
        entry1+risk1*5
      );

        並維持更高高點與更高低點，
        代表突破行情正在進一步延伸。

      </div>


      <div class="explainBox">

        <strong class="amber">
          5R｜${fmt(htp3)}
        </strong><br><br>

        5R 屬於強趨勢延伸目標，
        並不是每一次突破都一定會到達。<br><br>

        高 R 的概念是在失效距離相對明確的情況下，
        讓成功趨勢保留更大的延伸空間。

      </div>


      <div class="divider"></div>

      <div class="row">
        <div class="left">7R 延伸參考</div>
        <div class="right amber">
          ${fmt(extension2)}
        </div>
      </div>

      <div class="row">
        <div class="left">ATR 移動保護</div>
        <div class="right blue">
          ${fmt(trailing2)}
        </div>
      </div>


      <div class="warningBox">

        <strong>⚠️ 高 R 不等於高勝率</strong><br><br>

        因為策略二使用較緊的結構失效，
        正常震盪也可能更容易碰到失效位置。<br><br>

        它追求的是較小風險對較大潛在趨勢，
        不是保證每一筆都比策略一容易成功。

      </div>

    </div>


    <div class="sectionTitle">
      🛑 策略二｜高 R 結構失效
    </div>

    <div class="card redCard">

      <div class="label">
        突破回測失效參考
      </div>

      <div class="big red">
        ${fmt(stop2)}
      </div>

      <div class="small">
        相對回測中心約
        ${Math.abs(pct(stop2,entry2)).toFixed(1)}%
      </div>

      <div class="reason">

        策略二的前提是原本壓力已突破，
        而且回測後應轉成支撐。<br><br>

        如果價格重新明顯跌回突破結構下方，
        代表「壓力轉支撐」的假設開始失效，
        所以它的失效線通常比策略一靠近。

      </div>

      <div class="stopBox">

        <strong>🔴 高 R 失效原則</strong><br><br>

        回測觀察區：
        <strong>
          ${fmt(entry2Low)}～${fmt(entry2High)}
        </strong><br><br>

        結構失效：
        <strong>${fmt(stop2)}</strong><br><br>

        若突破後重新有效跌破失效位置，
        原本的突破回測假設需要重新評估。

      </div>

    </div>


    <div class="sectionTitle">
      🔥 趨勢續抱模式
    </div>

    <div class="card blueCard">

      <div class="label">
        近期 20 日最高價
      </div>

      <div class="big">
        ${fmt(recentHighest)}
      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="left">策略一 ATR 保護</div>
        <div class="right blue">
          ${fmt(trailing1)}
        </div>
      </div>

      <div class="row">
        <div class="left">策略二 ATR 保護</div>
        <div class="right purple">
          ${fmt(trailing2)}
        </div>
      </div>

      <div class="reason">

        ATR 移動保護會隨近期高點提高。
        目的不是精準抓到最高點，
        而是在趨勢仍完整時保留延伸空間，
        同時提供動態風險參考。

      </div>

    </div>


    <div class="sectionTitle">
      🧭 兩套策略怎麼分？
    </div>

    <div class="card">

      <div class="flow">

        <div class="flowBox">

          <div class="label">策略一</div>

          <div class="n green">
            支撐回踩
          </div>

          <div class="small">
            找支撐 → 等回踩 → 看止跌 → TP1／2／3 → 趨勢續抱
          </div>

        </div>


        <div class="flowBox">

          <div class="label">策略二</div>

          <div class="n purple">
            突破回測
          </div>

          <div class="small">
            等突破 → 等回測 → 確認支撐 → 2R／3R／5R → 趨勢續抱
          </div>

        </div>

      </div>

      <div class="divider"></div>

      <div class="reason">

        <strong class="green">
          策略一
        </strong>
        使用較寬的支撐區與失效空間，
        主要觀察支撐是否出現承接。<br><br>

        <strong class="purple">
          策略二
        </strong>
        要求市場先突破，再等回測確認。
        失效距離通常較窄，因此潛在 R 倍數較高，
        但也可能更容易因震盪觸及失效位置。<br><br>

        <strong>
          兩套策略的觀察區與失效線是獨立的。
        </strong>

      </div>

    </div>


    <div class="sectionTitle">
      📋 快速總覽
    </div>

    <div class="card">

      <div class="row">
        <div class="left">最新行情</div>
        <div class="right">
          ${fmt(price)}
        </div>
      </div>

      <div class="row">
        <div class="left">市場趨勢</div>
        <div class="right ${trendClass}">
          ${trend}
        </div>
      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="left">🟢 策略一觀察區</div>
        <div class="right green">
          ${fmt(entry1Low)}～${fmt(entry1High)}
        </div>
      </div>

      <div class="row">
        <div class="left">策略一失效</div>
        <div class="right red">
          ${fmt(stop1)}
        </div>
      </div>

      <div class="row">
        <div class="left">TP1</div>
        <div class="right">${fmt(tp1)}</div>
      </div>

      <div class="row">
        <div class="left">TP2</div>
        <div class="right">${fmt(tp2)}</div>
      </div>

      <div class="row">
        <div class="left">TP3</div>
        <div class="right amber">${fmt(tp3)}</div>
      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="left">🟣 關鍵突破位</div>
        <div class="right purple">
          ${fmt(breakoutLevel)}
        </div>
      </div>

      <div class="row">
        <div class="left">策略二回測區</div>
        <div class="right purple">
          ${fmt(entry2Low)}～${fmt(entry2High)}
        </div>
      </div>

      <div class="row">
        <div class="left">策略二失效</div>
        <div class="right red">
          ${fmt(stop2)}
        </div>
      </div>

      <div class="row">
        <div class="left">2R</div>
        <div class="right">${fmt(htp1)}</div>
      </div>

      <div class="row">
        <div class="left">3R</div>
        <div class="right">${fmt(htp2)}</div>
      </div>

      <div class="row">
        <div class="left">5R</div>
        <div class="right amber">${fmt(htp3)}</div>
      </div>

      <div class="row">
        <div class="left">7R 延伸</div>
        <div class="right amber">
          ${fmt(extension2)}
        </div>
      </div>

    </div>


    <div class="note">

      ⚠️ 妖子平台2.0 為規則式技術分析工具。<br><br>

      「最新行情」與歷史日 K 技術指標採不同用途：
      最新行情用於目前價格、漲跌與即時位置判斷；
      MA、RSI、MACD、ATR、支撐壓力則以歷史日 K 計算。<br><br>

      Yahoo 免費行情可能存在延遲，
      不等同券商交易所逐筆 Tick 報價。支撐、壓力、
      TP、R 倍數與結構失效皆為技術分析參考，
      並非未來價格保證。

    </div>

    `;


    $("report").style.display="block";
    $("status").style.display="none";

  }catch(e){

    $("status").style.display="block";

    $("status").textContent=
      "❌ "+e.message+
      "。如果剛剛才 Commit，請等待 Vercel 完成部署後再重新整理。";

  }
}


$("go").onclick=run;


$("symbol").addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter")run();
  }
);

</script>

</body>
</html>
