<script>

const WATCH_KEY='swing_tw_watch_v1';
const HISTORY_KEY='swing_tw_search_history_v1';
const PUSH_DEVICE_KEY='swing_tw_push_device_v1';

const DEFAULT=[
'2330','2317','2454','2308',
'2382','3231','2881','2882',
'2891','2886','2603','2615'
];

let tab='signal';
let cache={};
let current='';
let detailTimer=null;
let radarTimer=null;
let searchTimer=null;
let selectedSearchSymbol='';

const $=id=>document.getElementById(id);

const esc=s=>
String(s??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;');

const fmt=(n,d=2)=>
Number.isFinite(+n)
?
(+n).toLocaleString(
'zh-TW',
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
:
'--';

const avg=a=>
a.length
?
a.reduce((x,y)=>x+y,0)/a.length
:
0;

const sma=(a,n)=>
a.length>=n
?
avg(a.slice(-n))
:
avg(a);

function ema(a,n){

if(!a.length)return 0;

let e=a[0];

const k=2/(n+1);

for(let i=1;i<a.length;i++){

e=
a[i]*k+
e*(1-k);

}

return e;

}

function rsi(a,n=14){

if(a.length<=n)return 50;

let g=0;
let l=0;

for(let i=a.length-n;i<a.length;i++){

const d=a[i]-a[i-1];

if(d>0)g+=d;
else l-=d;

}

if(l===0)return 100;

return 100-100/(1+(g/n)/(l/n));

}

function atr(rows,n=14){

const v=[];

for(
let i=Math.max(1,rows.length-n);
i<rows.length;
i++
){

const x=rows[i];
const p=rows[i-1].close;

v.push(
Math.max(
x.high-x.low,
Math.abs(x.high-p),
Math.abs(x.low-p)
)
);

}

return avg(v);

}

function clamp(v,min,max){

return Math.min(
max,
Math.max(min,v)
);

}


/* =========================================================
   DEVICE
========================================================= */

function getDeviceId(){

let id=
localStorage.getItem(
PUSH_DEVICE_KEY
);

if(!id){

id=
window.crypto &&
crypto.randomUUID
?
crypto.randomUUID()
:
'device-'+
Date.now()+
'-'+
Math.random()
.toString(36)
.slice(2);

localStorage.setItem(
PUSH_DEVICE_KEY,
id
);

}

return id;

}


/* =========================================================
   WATCHLIST
========================================================= */

function watch(){

try{

const x=
JSON.parse(
localStorage.getItem(WATCH_KEY)||
'[]'
);

return Array.isArray(x)
?
[
...new Set(
x
.map(String)
.filter(
v=>/^\d{4,6}$/.test(v)
)
)
]
:
[];

}
catch{

return [];

}

}

function saveWatchLocal(a){

const clean=
[
...new Set(
(a||[])
.map(String)
.filter(
v=>/^\d{4,6}$/.test(v)
)
)
];

localStorage.setItem(
WATCH_KEY,
JSON.stringify(clean)
);

return clean;

}

async function getCloudWatch(){

const r=
await fetch(
'/api/watchlist?deviceId='+
encodeURIComponent(getDeviceId())+
'&t='+
Date.now(),
{
cache:'no-store'
}
);

const d=
await r.json();

if(!r.ok || !d.ok){

throw Error(
d.error||
'讀取雲端自選失敗'
);

}

return Array.isArray(d.symbols)
?
d.symbols
.map(String)
.filter(v=>/^\d{4,6}$/.test(v))
:
[];

}

async function saveCloudWatch(symbols){

const r=
await fetch(
'/api/watchlist',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
deviceId:getDeviceId(),
symbols
})
}
);

const d=
await r.json();

if(!r.ok || !d.ok){

throw Error(
d.error||
'雲端自選儲存失敗'
);

}

}

async function loadWatchlist(){

const local=watch();

try{

const cloud=
await getCloudWatch();

if(cloud.length){

saveWatchLocal(cloud);

}
else if(local.length){

await saveCloudWatch(local);

}

return watch();

}
catch(e){

console.warn(e);

return local;

}

}


/* =========================================================
   HISTORY
========================================================= */

function searchHistory(){

try{

const x=
JSON.parse(
localStorage.getItem(HISTORY_KEY)||
'[]'
);

return Array.isArray(x)?x:[];

}
catch{

return [];

}

}

function saveHistory(a){

if(!a?.symbol)return;

let h=
searchHistory()
.filter(
x=>x.symbol!==a.symbol
);

h.unshift({
symbol:a.symbol,
name:a.name||'',
time:Date.now()
});

localStorage.setItem(
HISTORY_KEY,
JSON.stringify(
h.slice(0,10)
)
);

}

/* =========================================================
   PIVOT
========================================================= */

function pivots(
rows,
left=3,
right=3
){

const lows=[];
const highs=[];

for(
let i=left;
i<rows.length-right;
i++
){

let lo=true;
let hi=true;

for(let j=1;j<=left;j++){

if(
rows[i].low>
rows[i-j].low
){
lo=false;
}

if(
rows[i].high<
rows[i-j].high
){
hi=false;
}

}

for(let j=1;j<=right;j++){

if(
rows[i].low>
rows[i+j].low
){
lo=false;
}

if(
rows[i].high<
rows[i+j].high
){
hi=false;
}

}

if(lo){

lows.push({
i,
value:rows[i].low
});

}

if(hi){

highs.push({
i,
value:rows[i].high
});

}

}

return {
lows,
highs
};

}


function clusterLevels(
items,
distance
){

const sorted=
items
.filter(
x=>
Number.isFinite(+x.value)
&&
+x.value>0
)
.sort(
(a,b)=>a.value-b.value
);

const groups=[];

for(const item of sorted){

const last=
groups[
groups.length-1
];

if(
last &&
Math.abs(
item.value-
last.value
)<=distance
){

last.values.push(
item.value
);

last.value=
avg(
last.values
);

last.count++;

last.latest=
Math.max(
last.latest,
item.i||0
);

}
else{

groups.push({
value:item.value,
values:[item.value],
count:1,
latest:item.i||0
});

}

}

return groups;

}


/* =========================================================
   TRADE PLAN 8.0
========================================================= */

function buildTradePlan(
rows,
price,
A,
m20,
m60
){

const recent=
rows.slice(-240);

const P=
pivots(
recent,
3,
3
);

const mergeDistance=
Math.max(
A*.45,
price*.005
);

const supportRaw=[];

for(const x of P.lows){

if(
x.value<=price*1.012 &&
x.value>=price*.82
){

supportRaw.push({
value:x.value,
i:x.i
});

}

}

if(
Number.isFinite(m20) &&
m20<=price*1.012 &&
m20>=price*.82
){

supportRaw.push({
value:m20,
i:recent.length+5
});

}

if(
Number.isFinite(m60) &&
m60<=price*1.012 &&
m60>=price*.82
){

supportRaw.push({
value:m60,
i:recent.length+4
});

}

for(const n of [10,20,60]){

const part=
rows.slice(-n);

if(!part.length)continue;

const low=
Math.min(
...part.map(x=>x.low)
);

if(
low<=price*1.012 &&
low>=price*.82
){

supportRaw.push({
value:low,
i:recent.length+n
});

}

}

for(const x of P.highs){

if(
x.value>=price*.88 &&
x.value<price
){

const after=
recent.slice(
x.i+1
);

const broken=
after.some(
r=>
r.close>
x.value*1.004
);

if(broken){

supportRaw.push({
value:x.value,
i:x.i
});

}

}

}

const supportGroups=
clusterLevels(
supportRaw,
mergeDistance
)
.filter(
x=>
x.value<=price*1.012 &&
x.value>=price*.82
)
.sort(
(a,b)=>
b.value-a.value
);

const support1=
supportGroups[0]
?
supportGroups[0].value
:
null;

const support2=
support1
?
supportGroups.find(
x=>
x.value<
support1-
mergeDistance*.75
)?.value
||
null
:
null;

const MAX_ENTRY_DISTANCE=
0.045;

const nearbySupports=
supportGroups
.filter(
x=>{

const distance=
(
price-
x.value
)/
price;

return (
distance>=-.012 &&
distance<=MAX_ENTRY_DISTANCE
);

}
);

let bestSupport=null;
let bestSupportScore=-Infinity;

for(const x of nearbySupports){

const distance=
Math.max(
0,
(
price-x.value
)/
price
);

const distanceScore=
Math.max(
0,
1-
distance/
MAX_ENTRY_DISTANCE
)*
45;

const clusterScore=
Math.min(
x.count,
4
)*
10;

const recentScore=
recent.length
?
(
x.latest/
recent.length
)*
15
:
0;

const score=
distanceScore+
clusterScore+
recentScore;

if(score>bestSupportScore){

bestSupportScore=score;
bestSupport=x;

}

}

const pressureRaw=[];

for(const x of P.highs){

if(
x.value>=price*.90 &&
x.value<=price*1.35
){

pressureRaw.push({
value:x.value,
i:x.i
});

}

}

for(
let end=20;
end<=recent.length;
end+=10
){

const block=
recent.slice(
Math.max(
0,
end-20
),
end
);

if(!block.length)continue;

const high=
Math.max(
...block.map(
x=>x.high
)
);

if(
high>=price*.90 &&
high<=price*1.35
){

pressureRaw.push({
value:high,
i:end
});

}

}

const allPressureGroups=
clusterLevels(
pressureRaw,
mergeDistance
)
.filter(
x=>
x.value>=price*.90 &&
x.value<=price*1.35
)
.sort(
(a,b)=>
a.value-b.value
);

const abovePressures=
allPressureGroups
.filter(
x=>
x.value>
price+
mergeDistance*.15
);

const recentlyCrossed=
allPressureGroups
.filter(
x=>
x.value<=price &&
x.value>=price*.98
)
.sort(
(a,b)=>
b.value-a.value
);

const nextResistance=
abovePressures[0]
?
abovePressures[0].value
:
null;

const crossedResistance=
recentlyCrossed[0]
?
recentlyCrossed[0].value
:
null;

let breakout=
nextResistance;

let breakoutState=
'BELOW';

if(
crossedResistance
){

const crossedDistance=
(
price-
crossedResistance
)/
price;

if(
crossedDistance<=.02
){

breakout=
crossedResistance;
breakoutState=
'BROKEN';

}

}

let planType='WAIT';

let entryLow=null;
let entryHigh=null;
let entryMid=null;

let sl=null;

let entryReady=false;

if(bestSupport){

planType='LIMIT';

const base=
bestSupport.value;

entryLow=
base-
Math.max(
A*.18,
price*.002
);

entryHigh=
base+
Math.max(
A*.30,
price*.0035
);

entryHigh=
Math.min(
entryHigh,
price*1.006
);

entryMid=
(
entryLow+
entryHigh
)/2;

const lowerStructures=
[
...P.lows
.map(x=>x.value),

...supportGroups
.map(x=>x.value)
]
.filter(
v=>
v<
base-
mergeDistance*.20
&&
v>=base*.90
)
.sort(
(a,b)=>b-a
);

const invalidation=
lowerStructures[0]
||
support2
||
(
base-
A*.80
);

sl=
invalidation-
Math.max(
A*.25,
price*.003
);

if(
sl>=entryLow
){

sl=
entryLow-
Math.max(
A*.45,
price*.005
);

}

const readyTolerance=
Math.max(
A*.25,
price*.0035
);

entryReady=
price>=
entryLow-
readyTolerance
&&
price<=
entryHigh+
readyTolerance;

}
else{

planType='WAIT';

}

let tp1=null;
let tp2=null;
let tp3=null;

let tp3Source='';

if(
Number.isFinite(entryMid) &&
breakout
){

const targetPressures=
allPressureGroups
.map(
x=>x.value
)
.filter(
v=>
v>
breakout+
mergeDistance*.55
)
.sort(
(a,b)=>a-b
);

const cleanTargets=[];

for(const v of targetPressures){

const last=
cleanTargets[
cleanTargets.length-1
];

if(
!last ||
v-last>
mergeDistance*.75
){

cleanTargets.push(v);

}

}

tp1=
cleanTargets[0]
||
null;

tp2=
tp1
?
cleanTargets.find(
v=>
v>
tp1+
mergeDistance
)
||
null
:
null;

tp3=
tp2
?
cleanTargets.find(
v=>
v>
tp2+
mergeDistance
)
||
null
:
null;

if(tp3){

tp3Source=
'第三層歷史壓力';

}

if(
!tp3 &&
tp1 &&
tp2
){

const extensionBase=
support2||
support1||
entryMid;

tp3=
tp2+
Math.max(
tp2-extensionBase,
A*3
)*
.618;

tp3Source=
'歷史壓力不足，Fib 0.618 延伸';

}

}

const risk=
Number.isFinite(entryMid) &&
Number.isFinite(sl) &&
entryMid>sl
?
entryMid-sl
:
null;

const riskPct=
risk
?
risk/
entryMid*
100
:
null;

function rr(target){

if(
!Number.isFinite(target) ||
!risk ||
risk<=0
){

return null;

}

return (
target-
entryMid
)/
risk;

}

const rr1=
rr(tp1);

const rr2=
rr(tp2);

const rr3=
rr(tp3);

const entryDistance=
bestSupport
?
(
price-
bestSupport.value
)/
price*
100
:
null;

const breakoutDistance=
breakout
?
(
breakout-price
)/
price*
100
:
null;

const validPlan=
planType==='LIMIT'
&&
Number.isFinite(entryLow)
&&
Number.isFinite(entryHigh)
&&
Number.isFinite(sl)
&&
sl<entryLow
&&
Number.isFinite(breakout)
&&
Number.isFinite(tp1)
&&
tp1>breakout;

return {

support1,
support2,

bestSupport:
bestSupport
?
bestSupport.value
:
null,

bestSupportStrength:
bestSupport
?
bestSupport.count
:
0,

breakout,

breakoutState,

nextResistance,

crossedResistance,

planType,

entryLow,
entryHigh,
entryMid,

sl,

risk,
riskPct,

tp1,
tp2,
tp3,
tp3Source,

rr1,
rr2,
rr3,

entryReady,

validPlan,

pressureCount:
allPressureGroups.length,

entryDistance,

breakoutDistance

};

}
