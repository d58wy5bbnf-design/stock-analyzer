<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幽冥分析</title>
<meta name="theme-color" content="#050706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="幽冥分析">

<style>
*{box-sizing:border-box}
:root{
--bg:#050706;
--bg2:#080b09;
--card:#0d110f;
--card2:#101512;
--border:#27302b;
--border2:#344139;
--text:#f7faf8;
--muted:#89938d;
--green:#49e6ad;
--green2:#9cf3d1;
--red:#ff6675;
--red2:#ff9ca5;
--yellow:#ffd166;
--orange:#ff9f43;
--purple:#b78cff;
--blue:#68a8ff
}
html{background:var(--bg);scroll-behavior:smooth}
body{
margin:0;
background:
radial-gradient(circle at 50% -10%,rgba(73,230,173,.08),transparent 32%),
linear-gradient(180deg,var(--bg),var(--bg2));
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC",Arial,sans-serif;
min-height:100vh;
-webkit-font-smoothing:antialiased
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.app{
width:min(100%,760px);
margin:auto;
min-height:100vh;
padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 80px)
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.logo{font-size:25px;font-weight:950;letter-spacing:-.8px;line-height:1}
.logo small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-top:7px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
border:1px solid var(--border);
background:linear-gradient(180deg,#111713,#0c100e);
color:var(--text);
border-radius:13px;
min-width:42px;
height:42px;
padding:0 12px;
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
font-weight:850;
cursor:pointer
}
.icon-btn:active{transform:scale(.97)}
.hero{margin:10px 0 18px}
.hero-title{font-size:31px;line-height:1.12;font-weight:950;letter-spacing:-1.2px;margin-bottom:9px}
.hero-sub{font-size:13px;line-height:1.7;color:var(--muted)}
.search-wrap{position:relative;margin:18px 0}
.search-box{display:flex;gap:9px}
.search-input-wrap{position:relative;flex:1}
.search-input{
width:100%;
height:54px;
border-radius:16px;
border:1px solid var(--border);
background:#0b0f0d;
color:var(--text);
outline:none;
padding:0 15px;
font-size:16px;
font-weight:800;
transition:.2s
}
.search-input:focus{border-color:#4d675b;box-shadow:0 0 0 3px rgba(73,230,173,.07)}
.search-input::placeholder{color:#657069}
.search-btn{
height:54px;
min-width:76px;
border:0;
border-radius:16px;
background:linear-gradient(135deg,var(--green),#2abf8d);
color:#03120c;
font-weight:950;
font-size:15px;
cursor:pointer;
box-shadow:0 10px 28px rgba(73,230,173,.12)
}
.search-btn:active{transform:scale(.98)}
.search-suggest{
position:absolute;
left:0;
right:85px;
top:61px;
z-index:100;
background:#0c110e;
border:1px solid var(--border2);
border-radius:15px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.45)
}
.suggest-item{
padding:13px 15px;
border-bottom:1px solid #202722;
cursor:pointer;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}
.suggest-item:last-child{border-bottom:0}
.suggest-item:active{background:#151c18}
.suggest-symbol{font-weight:950}
.suggest-name{font-size:12px;color:var(--muted)}
.card{
background:linear-gradient(180deg,rgba(15,20,17,.96),rgba(10,14,12,.96));
border:1px solid var(--border);
border-radius:20px;
padding:16px;
margin:12px 0;
box-shadow:0 14px 40px rgba(0,0,0,.16)
}
.section-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:13px
}
.section-title{font-size:16px;font-weight:950}
.section-sub{font-size:12px;line-height:1.6;color:var(--muted)}
.small-btn{
border:1px solid var(--border);
background:#101512;
color:#d9e1dc;
height:34px;
padding:0 11px;
border-radius:10px;
font-size:12px;
font-weight:850;
cursor:pointer
}
.history-wrap{display:flex;gap:8px;flex-wrap:wrap}
.history-chip{
border:1px solid var(--border);
background:#0b0f0d;
color:#dce4df;
border-radius:999px;
padding:8px 11px;
font-size:12px;
font-weight:850;
cursor:pointer
}
.empty{padding:18px 5px;color:var(--muted);font-size:13px;text-align:center}
.watch-item,.radar-item,.monster-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
padding:13px 2px;
border-bottom:1px solid #202722;
cursor:pointer
}
.watch-item:last-child,.radar-item:last-child,.monster-row:last-child{border-bottom:0}
.watch-symbol,.radar-symbol,.monster-symbol{font-size:15px;font-weight:950}
.watch-name,.radar-name,.monster-name{font-size:11px;color:var(--muted);margin-top:4px}
.watch-right,.radar-right,.monster-right{text-align:right}
.watch-right strong,.radar-right strong,.monster-right strong{display:block;font-size:14px}
.watch-right span,.radar-right span,.monster-right span{font-size:11px}
.positive{color:var(--red2)!important}
.negative{color:var(--green2)!important}
.neutral{color:#dce4df!important}
.countdown{font-variant-numeric:tabular-nums}
.home-entry{
padding:12px 0;
border-bottom:1px solid #202722;
cursor:pointer
}
.home-entry:last-child{border-bottom:0}
.home-entry-top{display:flex;justify-content:space-between;gap:10px}
.home-entry-symbol{font-weight:950}
.home-entry-score{font-weight:950;color:var(--green2)}
.home-entry-info{font-size:12px;color:var(--muted);line-height:1.65;margin-top:6px}
.monster-score{font-size:18px;font-weight:950;color:var(--orange)}
.analysis-top{
position:sticky;
top:0;
z-index:80;
margin:-16px -16px 14px;
padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
background:rgba(5,7,6,.88);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border-bottom:1px solid rgba(45,55,49,.7)
}
.analysis-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.analysis-nav-title{font-size:14px;font-weight:950}
.analysis-result{padding-bottom:30px}
.loading,.error{
padding:34px 15px;
text-align:center;
font-size:14px;
line-height:1.7;
color:var(--muted)
}
.error{color:var(--red2)}
.analysis-stock-head{
display:flex;
justify-content:space-between;
align-items:flex-end;
gap:14px;
padding:8px 1px 17px
}
.analysis-symbol{font-size:28px;font-weight:950;letter-spacing:-1px}
.analysis-name{font-size:13px;color:var(--muted);margin-top:5px}
.analysis-price{text-align:right}
.analysis-price strong{display:block;font-size:29px;font-weight:950}
.analysis-price span{font-size:13px;font-weight:900}
.analysis-summary-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:12px
}
.analysis-summary-grid>div{
border:1px solid var(--border);
background:#0c100e;
border-radius:14px;
padding:11px
}
.analysis-summary-grid span{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}
.analysis-summary-grid strong{font-size:14px}
.analysis-best{
border:1px solid #345347;
background:linear-gradient(135deg,rgba(73,230,173,.1),rgba(73,230,173,.025));
border-radius:17px;
padding:14px;
margin:12px 0;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}
.analysis-best span{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}
.analysis-best strong{font-size:13px}
.big-section-title{font-size:18px;font-weight:950;margin:25px 1px 10px}
.strategy-card{
border:1px solid var(--border);
background:linear-gradient(180deg,#0f1411,#0a0e0c);
border-radius:20px;
padding:16px;
margin-bottom:15px;
overflow:hidden
}
.strategy-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.strategy-card-title{font-size:18px;font-weight:950}
.strategy-card-sub{font-size:11px;color:var(--muted);line-height:1.6;margin-top:5px}
.strategy-score{text-align:right;min-width:62px}
.strategy-score strong{display:block;font-size:25px;color:var(--green2)}
.strategy-score span{font-size:10px;color:var(--muted)}
.strategy-market-price{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-top:14px;
padding:11px 12px;
border:1px solid #2b3530;
background:#0b100d;
border-radius:13px
}
.strategy-market-price span{font-size:11px;color:var(--muted)}
.strategy-market-price strong{font-size:16px}
.strategy-divider{height:1px;background:#222a25;margin:15px 0}
.strategy-subtitle{font-size:13px;font-weight:950}
.strategy-entry-box,.monster-entry-box{
margin-top:10px;
border:1px solid #416455;
background:rgba(73,230,173,.08);
border-radius:14px;
padding:12px;
display:flex;
justify-content:space-between;
gap:12px;
align-items:center
}
.strategy-entry-box span,.monster-entry-box span{font-size:11px;color:var(--muted)}
.strategy-entry-box strong,.monster-entry-box strong{font-size:14px;color:var(--green2)}
.strategy-stop-grid,.strategy-target-grid,.monster-target-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
margin-top:8px
}
.strategy-stop,.strategy-target,.strategy-resistance,.monster-target-grid>div{
border:1px solid var(--border);
background:#0b0f0d;
border-radius:13px;
padding:11px
}
.strategy-stop span,.strategy-target span,.strategy-resistance span,.monster-target-grid span{
display:block;font-size:10px;color:var(--muted);margin-bottom:5px
}
.strategy-stop strong{color:var(--red2)}
.strategy-target strong{color:var(--yellow)}
.strategy-target small{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.strategy-resistance{margin-top:8px}
.strategy-resistance strong{color:var(--orange)}
.strategy-target-wide{margin-top:8px}
.strategy-condition-count{font-size:11px;color:var(--muted);margin-top:6px}
.condition-list{margin-top:9px}
.condition-item{padding:10px 0;border-bottom:1px solid #202722}
.condition-item:last-child{border-bottom:0}
.condition-title{font-size:12px;font-weight:900}
.condition-title.pass{color:var(--green2)}
.condition-title.fail{color:#77827b}
.condition-explain{font-size:10px;color:var(--muted);line-height:1.55;margin-top:4px}
.not-qualified-target{
margin-top:10px;
border:1px solid #343c37;
background:#0b0f0d;
border-radius:14px;
padding:14px;
font-size:12px;
line-height:1.7;
color:var(--muted)
}
.qualified-badge{
margin-top:13px;
padding:11px;
border-radius:12px;
background:rgba(73,230,173,.09);
border:1px solid rgba(73,230,173,.3);
font-size:11px;
font-weight:900;
color:var(--green2)
}
.qualified-badge.not-qualified{
background:rgba(255,209,102,.06);
border-color:rgba(255,209,102,.2);
color:var(--yellow)
}
.backtest-box{
margin-top:13px;
border-top:1px solid #222a25;
padding-top:13px
}
.backtest-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:900}
.backtest-warning{color:var(--yellow)}
.backtest-good{color:var(--green2)}
.backtest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.backtest-grid>div{border:1px solid var(--border);background:#0b0f0d;border-radius:11px;padding:9px}
.backtest-grid span{display:block;font-size:9px;color:var(--muted);margin-bottom:4px}
.backtest-grid strong{font-size:12px}
.backtest-note{font-size:10px;line-height:1.55;color:var(--muted);margin-top:8px}
.position-card,.monster-analysis-card,.ai-card,.tracking-card{
border:1px solid var(--border);
background:linear-gradient(180deg,#0f1411,#0a0e0c);
border-radius:20px;
padding:16px
}
.position-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.position-grid>div,.monster-analysis-grid>div{
border:1px solid var(--border);
background:#0b0f0d;
border-radius:12px;
padding:11px
}
.position-grid span,.monster-analysis-grid span{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}
.position-note{font-size:10px;color:var(--muted);margin-top:10px}
.position-risk-box{margin-top:11px;border-top:1px solid #222a25;padding-top:10px}
.position-risk-box>div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:11px}
.monster-analysis-head{display:flex;justify-content:space-between;gap:12px}
.monster-analysis-title{font-size:17px;font-weight:950}
.monster-analysis-sub{font-size:10px;color:var(--muted);line-height:1.6;margin-top:5px}
.monster-analysis-score strong{font-size:27px;color:var(--orange)}
.monster-analysis-score span{font-size:10px;color:var(--muted)}
.monster-analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}
.monster-target-grid{grid-template-columns:repeat(3,1fr)}
.monster-warning{margin-top:10px;font-size:11px;color:var(--yellow);line-height:1.6}
.ai-button{
width:100%;
height:45px;
border:0;
border-radius:13px;
background:linear-gradient(135deg,#b78cff,#7d5ce0);
color:white;
font-weight:950;
cursor:pointer
}
.ai-result{font-size:12px;color:var(--muted);line-height:1.75;margin-top:12px}
.ai-answer{color:#dfe7e2}
.analysis-data-note{font-size:10px;color:#69736d;line-height:1.65;margin:20px 4px}
.strategy-quick-actions{display:flex;gap:8px;margin-top:13px}
.strategy-quick-btn{
flex:1;
height:36px;
border:1px solid var(--border);
background:#0b0f0d;
color:var(--muted);
border-radius:10px;
font-size:10px;
font-weight:850
}
.tracking-item{padding:11px 0;border-bottom:1px solid #202722}
.tracking-item:last-child{border-bottom:0}
.tracking-head{display:flex;justify-content:space-between;gap:10px}
.tracking-name{font-size:12px;font-weight:950}
.tracking-status{font-size:10px;color:var(--green2)}
.tracking-info{font-size:10px;color:var(--muted);line-height:1.65;margin-top:5px}
.radar-empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}
.swiping-back{transition:none!important}
.swipe-return{transition:transform .18s ease,opacity .18s ease!important}
@media(max-width:430px){
.hero-title{font-size:28px}
.analysis-summary-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>
<div class="app">

<section id="homeView">

<div class="topbar">
<div class="logo">
幽冥分析
<small>股票策略分析</small>
</div>

<div class="top-actions">
<button id="notificationButton" class="icon-btn" type="button">🔔</button>
</div>
</div>

<div class="hero">
<div class="hero-title">找股票，直接看策略。</div>
<div class="hero-sub">
支撐回踩、高 R 突破、強勢續攻、妖股啟動、持倉風險與歷史回測整合分析。
</div>
</div>

<div class="search-wrap">
<div class="search-box">

<div class="search-input-wrap">
<input
id="searchInput"
class="search-input"
type="text"
autocomplete="off"
placeholder="輸入股票代號或名稱">

<div id="searchSuggest" class="search-suggest hidden"></div>
</div>

<button id="searchButton" class="search-btn" type="button">
分析
</button>

</div>
</div>

<div class="card">
<div class="section-head">
<div>
<div class="section-title">最近搜尋</div>
<div class="section-sub">快速重新開啟最近分析的股票</div>
</div>
<button id="clearHistoryButton" class="small-btn" type="button">清除</button>
</div>
<div id="searchHistory" class="history-wrap"></div>
</div>

<div class="card">
<div class="section-head">
<div>
<div class="section-title">⭐ 我的自選</div>
<div class="section-sub">自選股會自動更新價格</div>
</div>
<button id="watchToggleButton" class="small-btn" type="button">全部收起</button>
</div>
<div id="watchlist"></div>
</div>

<div class="card">
<div class="section-head">
<div>
<div class="section-title">🎯 高品質進場提醒</div>
<div class="section-sub">符合策略條件且進入觀察區間的股票</div>
</div>
</div>
<div id="homeEntryAlerts"></div>
</div>

<div class="card">
<div class="section-head">
<div>
<div class="section-title">🔥 妖股雷達</div>
<div class="section-sub">掃描量價與短線動能異常股票</div>
</div>
</div>
<div id="monsterStocks"></div>
</div>

<div class="card">
<div class="section-head">
<div>
<div class="section-title">🟢 策略準備區</div>
<div class="section-sub">距離形成策略較接近</div>
</div>
<button id="strategyToggleButton" class="small-btn" type="button">全部收起</button>
</div>
<div id="strategyReadyList"></div>
</div>

<div class="card">
<div class="section-head">
<div>
<div class="section-title">📈 中長線觀察</div>
<div class="section-sub">趨勢結構相對穩定</div>
</div>
<button id="longToggleButton" class="small-btn" type="button">全部收起</button>
</div>
<div id="longWatchList"></div>
</div>

<div class="card">
<div class="section-head">
<div>
<div class="section-title">📡 市場雷達</div>
<div class="section-sub">
約 <span id="countdown" class="countdown">60</span> 秒重新掃描
</div>
</div>
<button id="radarToggleButton" class="small-btn" type="button">全部收起</button>
</div>
<div id="radarList"></div>
</div>

</section>

<section id="analysisView" class="hidden">

<div class="analysis-top">
<div class="analysis-nav">

<button id="backButton" class="icon-btn" type="button">‹</button>

<div class="analysis-nav-title">幽冥分析</div>

<div class="top-actions">
<button id="positionButton" class="icon-btn" type="button">💼</button>
<button id="favoriteButton" class="icon-btn" type="button">☆</button>
</div>

</div>
</div>

<div id="analysisResult" class="analysis-result"></div>

</section>

</div>

<script>
const WATCH_KEY="yaozi_watchlist";
const HISTORY_KEY="yaozi_search_history_v1";
const POSITION_KEY="yaozi_positions_v46";
const NOTIFY_COOLDOWN_KEY="yaozi_entry_notify_cooldown_v1";
const HOME_ENTRY_KEY="yaozi_home_entry_alerts_v1";
const STRATEGY_TRACK_KEY="yaozi_strategy_tracking_v1";
const POSITION_SL_KEY="yaozi_position_sl_notify_v1";
const MONSTER_NOTIFY_KEY="yaozi_monster_notify_v1";

const BACKTEST_DAYS=365;
const BACKTEST_MAX_HOLD=20;
const BACKTEST_MIN_TRADES=5;
const BACKTEST_WARNING_RATE=70;

var currentAnalysisSymbol="";
var currentAnalysisData=null;
var radarData=null;
var currentMarketMetrics=null;
var currentSetups=null;
var currentBacktests=null;
var analysisRefreshing=false;
var searchTimer=null;
var monsterStocks=[];
var analysisRequestSeq=0;

var expanded={
watch:true,
strategy:true,
long:true,
radar:true
};

var countdownSeconds=60;

function el(id){
return document.getElementById(id)
}

function normalizeSymbol(v){
return String(v||"")
.trim()
.toUpperCase()
.replace(/\s+/g,"")
}

function safe(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;")
}

function fmt(v,d=2){
v=Number(v);
if(!Number.isFinite(v))return"--";

return v.toLocaleString(
"zh-TW",
{
minimumFractionDigits:d,
maximumFractionDigits:d
}
)
}

function pct(v,d=2){
v=Number(v);
if(!Number.isFinite(v))return"--";

return(
(v>0?"+":"")+
v.toFixed(d)+
"%"
)
}

function pclass(v){
v=Number(v);
if(v>0)return"positive";
if(v<0)return"negative";
return"neutral"
}

function currentTimeText(){
return new Date().toLocaleTimeString(
"zh-TW",
{
hour:"2-digit",
minute:"2-digit"
}

function average(a){
var n=a
.map(Number)
.filter(Number.isFinite);

if(!n.length)return NaN;

return n.reduce(
(x,y)=>x+y,
0
)/n.length
}

function ema(values,period){
var a=values
.map(Number)
.filter(Number.isFinite);

if(!a.length)return NaN;

var k=2/(period+1);
var out=a[0];

for(var i=1;i<a.length;i++){
out=a[i]*k+out*(1-k)
}

return out
}

/* 搜尋建議 */
function localSearchCandidates(q){
q=String(q||"").trim().toUpperCase();
if(!q)return[];

var out=[];
var seen=new Set();

function add(x){
if(!x)return;

var symbol=normalizeSymbol(
typeof x==="string"?x:x.symbol
);

if(!symbol||seen.has(symbol))return;

var name=
typeof x==="string"
?""
:(x.name||"");

if(
symbol.includes(q)||
String(name).toUpperCase().includes(q)
){
seen.add(symbol);
out.push({
symbol,
name
})
}
}

getSearchHistory().forEach(add);
getWatchlist().forEach(add);

if(radarData){
[
"strategyReady",
"strategy",
"longWatch",
"long",
"radar",
"watch"
].forEach(k=>{
(radarData[k]||[]).forEach(add)
})
}

return out.slice(0,8)
}

async function fetchSearchCandidates(q){
var local=localSearchCandidates(q);

try{
var r=await fetch(
"/api/search?q="+encodeURIComponent(q),
{cache:"no-store"}
);

if(!r.ok)return local;

var d=await r.json();
var remote=Array.isArray(d)
?d
:(d.results||d.data||[]);

var map=new Map();

[...local,...remote].forEach(x=>{
var symbol=normalizeSymbol(
typeof x==="string"?x:x.symbol
);

if(!symbol)return;

if(!map.has(symbol)){
map.set(symbol,{
symbol,
name:typeof x==="string"?"":(x.name||"")
})
}
});

return[...map.values()].slice(0,10)

}catch(e){
return local
}
}

function adjustedPosition(p,market){
if(!p)return null;

var entry=Number(p.entry)||0;
var lots=Number(p.lots)||0;
var odd=Number(p.odd)||0;
var reduction=Math.max(
0,
Math.min(
99.99,
Number(p.capitalReduction)||0
)
);

var shares=
market==="US"
?lots
:lots*1000+odd;

var factor=
1-reduction/100;

:entry;

:shares;

return{

originalEntry:entry,
originalShares:shares,
reduction
}
}

/* 技術指標 */
function historicalRSI(rows,period=14){
if(!rows||rows.length<period+1)return NaN;

var gains=0;
var losses=0;

var start=rows.length-period;

for(var i=start;i<rows.length;i++){
var c=Number(rows[i].close);
var p=Number(rows[i-1].close);
var d=c-p;

if(d>0)gains+=d;
else losses-=d
}

var avgGain=gains/period;
var avgLoss=losses/period;

if(avgLoss===0)return 100;

var rs=avgGain/avgLoss;

return 100-(100/(1+rs))
}

function historicalMACD(rows){
if(!rows||rows.length<26)return NaN;

var closes=rows
.map(x=>Number(x.close))
.filter(Number.isFinite);

return ema(closes,12)-ema(closes,26)
}

function historicalATR(rows,period=14){
if(!rows||rows.length<period+1)return NaN;

var tr=[];

for(var i=1;i<rows.length;i++){
var h=Number(rows[i].high);
var l=Number(rows[i].low);
var pc=Number(rows[i-1].close);

tr.push(
Math.max(
h-l,
Math.abs(h-pc),
Math.abs(l-pc)
)
)
}

return average(
tr.slice(-period)
)
}

function marketOf(d){
var rows=
Array.isArray(d.rows)
?d.rows
:Array.isArray(d.history)
?d.history
:[];

var price=
Number(d.price);

if(
!Number.isFinite(price)&&
rows.length
){
price=Number(rows.at(-1).close)
}

var closes=
rows.map(x=>Number(x.close))
.filter(Number.isFinite);

var ma20=
closes.length>=20
?average(closes.slice(-20))
:price;

var ma60=
closes.length>=60
?average(closes.slice(-60))
:ma20;

var rsi=historicalRSI(rows,14);
var macd=historicalMACD(rows);
var atr=historicalATR(rows,14);

if(!Number.isFinite(atr)){
atr=price*.025
}

var recent20=rows.slice(-20);

var resistance=
recent20.length
?Math.max(
...recent20.map(x=>Number(x.high))
.filter(Number.isFinite)
)
:price+atr*2;

var support=
recent20.length
?Math.min(
...recent20.map(x=>Number(x.low))
.filter(Number.isFinite)
)
:price-atr*2;

var recent10=rows.slice(-10);

var low10=
recent10.length
?Math.min(
...recent10.map(x=>Number(x.low))
.filter(Number.isFinite)
)
:support;

return{
rows,
price,
ma20,
ma60,
rsi,
macd,
atr,
resistance,
support,
low10
}
}

function volumeMetrics(d,rows){

Number(d.volume);

!Number.isFinite(current)&&
rows.length
){
current=Number(rows.at(-1).volume)
}

var prev=rows
.slice(-21,-1)
.map(x=>Number(x.volume))
.filter(Number.isFinite);

var avg20=average(prev);

if(!Number.isFinite(avg20)){
avg20=current||0
}

var ratio=
avg20>0
?current/avg20
:1;

return{
current,
average20:avg20,
ratio
}
}

Number.isFinite(m.ma20)
?m.ma20
:p;

entryLow=Math.min(
base-atr*.25,
p
);

base+atr*.35,
p
);

m.low10,
entryLow-atr*.7
);

stop2=Math.min(
m.support,
stop1-atr*.65
);

m.resistance,
p+atr*1.2
);

tp1+atr,
p+atr*2.2
);

tp2+atr*1.2,
p+atr*3.4
);

}else if(type==="HIGH_R"){

}

}

return getStrategyTracks()
.filter(x=>normalizeSymbol(x.symbol)===symbol)
}

function addTrackEvent(track,type,price,text){
track.events=track.events||[];

track.events.push({
type,
price:Number(price),
text,
time:Date.now()
});

track.events=track.events.slice(-30)
}

function findActiveTrack(tracks,symbol,type){
symbol=normalizeSymbol(symbol);

return tracks.find(
x=>
normalizeSymbol(x.symbol)===symbol&&
x.type===type&&
x.status==="ACTIVE"
)
}

function createTrack(d,type,setup,m){
var t=strategyTargets(type,m);

var names={
PULLBACK:"支撐回踩",
HIGH_R:"高 R 突破",
SURGE:"強勢續攻"
};

return{
id:
normalizeSymbol(d.symbol)+
"-"+
type+
"-"+
Date.now(),

symbol:normalizeSymbol(d.symbol),
name:d.name||"",
type,
strategyName:names[type],
createdAt:Date.now(),
updatedAt:Date.now(),
status:"ACTIVE",
score:setup.score,
entryLow:t.entryLow,
entryHigh:t.entryHigh,
stop1:t.stop1,
stop2:t.stop2,
tp1:t.tp1,
tp2:t.tp2,
tp3:t.tp3,
previousHigh:t.previousHigh,
entered:false,
hitTP1:false,
hitTP2:false,
hitTP3:false,
hitSL1:false,
hitSL2:false,
events:[]
}
}

function materiallyDifferent(track,t){
var base=Math.max(
Number(track.entryHigh)||1,
1
);

return(
Math.abs(track.entryLow-t.entryLow)/base>.03||
Math.abs(track.entryHigh-t.entryHigh)/base>.03
)
}

function updateStrategyTracking(d,m,setups){
if(!d||!d.symbol)return;

var symbol=normalizeSymbol(d.symbol);
var tracks=getStrategyTracks();
var changed=false;

["PULLBACK","HIGH_R","SURGE"]
.forEach(type=>{

var setup=setups[type];
var active=findActiveTrack(
tracks,
symbol,
type
);

/*
只有真正 qualified 才建立新策略追蹤。
*/
if(setup.qualified&&!active){

active=createTrack(
d,
type,
setup,
m
);

tracks.push(active);
changed=true;

addTrackEvent(
active,
"CREATED",
m.price,
"策略條件正式成立"
)

}

if(!active)return;

var t=strategyTargets(type,m);
var price=m.price;

active.updatedAt=Date.now();
active.score=setup.score;

/*
如果還沒進場，
而且策略重新計算後有明顯變化，
才更新觀察區。
*/
if(
!active.entered&&
materiallyDifferent(active,t)
){
active.entryLow=t.entryLow;
active.entryHigh=t.entryHigh;
active.stop1=t.stop1;
active.stop2=t.stop2;
active.tp1=t.tp1;
active.tp2=t.tp2;
active.tp3=t.tp3;
active.previousHigh=t.previousHigh;
changed=true
}

if(
!active.entered&&
price>=active.entryLow&&
price<=active.entryHigh
){

active.entered=true;
changed=true;

addTrackEvent(
active,
"ENTRY",
price,
"價格進入策略進場區"
)
}

if(active.entered){

if(
!active.hitSL2&&
price<=active.stop2
){
active.hitSL2=true;
active.status="CLOSED";
changed=true;

addTrackEvent(
active,
"SL2",
price,
"觸及第二停損"
)

}else if(
!active.hitSL1&&
price<=active.stop1
){
active.hitSL1=true;
changed=true;

addTrackEvent(
active,
"SL1",
price,
"觸及第一停損"
)
}

if(
!active.hitTP1&&
price>=active.tp1
){
active.hitTP1=true;
changed=true;

addTrackEvent(
active,
"TP1",
price,
"到達第一目標"
)
}

if(
!active.hitTP2&&
price>=active.tp2
){
active.hitTP2=true;
changed=true;

addTrackEvent(
active,
"TP2",
price,
"到達第二目標"
)
}

if(
!active.hitTP3&&
price>=active.tp3
){
active.hitTP3=true;
active.status="CLOSED";
changed=true;

addTrackEvent(
active,
"TP3",
price,
"到達第三目標"
)
}

}

});

if(changed){
saveStrategyTracks(tracks)
}
}

/* 回測 */
function strategyConditionAt(type,rows,index){
var part=rows.slice(0,index+1);

if(part.length<65)return null;

var price=Number(part.at(-1).close);

var ma20=average(
part.slice(-20)
.map(x=>Number(x.close))
);

var ma60=average(
part.slice(-60)
.map(x=>Number(x.close))
);

var rsi=historicalRSI(part,14);
var macd=historicalMACD(part);
var atr=historicalATR(part,14);

var recent20=part.slice(-20);

var resistance=Math.max(
...recent20
.map(x=>Number(x.high))
.filter(Number.isFinite)
);

var support=Math.min(
...recent20
.map(x=>Number(x.low))
.filter(Number.isFinite)
);

var low10=Math.min(
...part.slice(-10)
.map(x=>Number(x.low))
.filter(Number.isFinite)
);

var vols=
part.slice(-21,-1)
.map(x=>Number(x.volume))
.filter(Number.isFinite);

var currentVolume=
Number(part.at(-1).volume)||0;

var avgVolume=
vols.length
?average(vols)
:0;

var ratio=
avgVolume>0
?currentVolume/avgVolume
:1;

var m={
price,
ma20,
ma60,
rsi,
macd,
atr,
resistance,
support,
low10,
rows:part
};

var v={
ratio,
current:currentVolume,
average20:avgVolume
};

var setups=buildStrategySetups({},m,v);
var setup=setups[type];

if(!setup)return null;

return{m,v,setup}
}

function backtestStrategy(type,rows){
if(
!Array.isArray(rows)||
rows.length<80
){
return{
trades:0,
wins:0,
losses:0,
winRate:0,
avgR:0,
warning:true
}
}

var start=Math.max(
65,
rows.length-BACKTEST_DAYS
);

var trades=[];
var i=start;

while(i<rows.length-2){

var state=strategyConditionAt(
type,
rows,
i
);

if(
!state||
state.setup.score<75
){
i++;
continue
}

var targets=strategyTargets(
type,
state.m
);

var row=rows[i];
var close=Number(row.close);

var inZone=
close>=targets.entryLow&&
close<=targets.entryHigh;

if(!inZone){
i++;
continue
}

var entry=close;
var stop=targets.stop1;
var risk=entry-stop;

if(
!Number.isFinite(risk)||
risk<=0
){
i++;
continue
}

var target=targets.tp2;
var result=null;
var exitR=0;

var end=Math.min(
rows.length-1,
i+BACKTEST_MAX_HOLD
);

for(var j=i+1;j<=end;j++){

var high=Number(rows[j].high);
var low=Number(rows[j].low);

if(low<=stop){
result="LOSS";
exitR=-1;
break
}

if(high>=target){
result="WIN";
exitR=(target-entry)/risk;
break
}

}

if(!result){

var finalClose=
Number(rows[end].close);

exitR=
(finalClose-entry)/risk;

result=
exitR>0
?"WIN"
:"LOSS"
}

trades.push({
result,
r:exitR
});

i=end+1
}

var wins=
trades.filter(
x=>x.result==="WIN"
).length;

var losses=
trades.length-wins;

var winRate=
trades.length
?wins/trades.length*100
:0;

var avgR=
trades.length
?average(trades.map(x=>x.r))
:0;

return{
trades:trades.length,
wins,
losses,
winRate,
avgR,
warning:
trades.length<BACKTEST_MIN_TRADES||
winRate<BACKTEST_WARNING_RATE
}
}

function buildBacktests(d){
var rows=d.rows||d.history||[];

return{
PULLBACK:backtestStrategy("PULLBACK",rows),
HIGH_R:backtestStrategy("HIGH_R",rows),
SURGE:backtestStrategy("SURGE",rows)
}
}

function backtestHTML(type){

if(!b)return"";

return`

/* 妖股候選掃描 */
async function scanMonsterCandidates(){
var map=new Map();

function add(x){
if(!x||!x.symbol)return;

var symbol=normalizeSymbol(x.symbol);

if(!map.has(symbol)){
map.set(
symbol,
{
symbol,
name:x.name||""
}
)
}
}

if(radarData){

[
"strategyReady",
"strategy",
"longWatch",
"long",
"radar",
"watch"
].forEach(k=>{

(radarData[k]||[])
.forEach(add)

})
}

getWatchlist().forEach(add);

var candidates=
[...map.values()]
.slice(0,18);

if(!candidates.length){
monsterStocks=[];
renderMonsterStocks();
return
}

var results=[];

for(var i=0;i<candidates.length;i++){

var c=candidates[i];

try{

var d=
await fetchStockData(c.symbol);

var m=marketOf(d);
var v=volumeMetrics(d,m.rows);

var z=monsterMetrics(
d,
m,
v
);

results.push({
symbol:normalizeSymbol(d.symbol),
name:d.name||c.name||"",
price:m.price,
volumeRatio:v.ratio,
monster:z
});

checkMonsterNotification(
d,
m,
v,
z
);

}catch(e){}

}

monsterStocks=
results.sort(
(a,b)=>
b.monster.score-
a.monster.score
);

renderMonsterStocks()
}

list[i].name||

changed=true;

}

);

/* iPhone 左滑返回 */
(function(){
var startX=0;
var startY=0;
var moving=false;

var view=el("analysisView");

view.addEventListener(
"touchstart",
e=>{

if(
view.classList.contains("hidden")||
!e.touches||
!e.touches.length
)return;

var t=e.touches[0];

if(t.clientX>35)return;

startX=t.clientX;
startY=t.clientY;
moving=true

},
{
passive:true
}
);

view.addEventListener(
"touchmove",
e=>{

if(
!moving||
!e.touches||
!e.touches.length
)return;

var t=e.touches[0];

var dx=
t.clientX-startX;

var dy=
Math.abs(
t.clientY-startY
);

if(
dx<=0||
dy>80
)return;

var x=
Math.min(
dx,
window.innerWidth
);

view.classList.add(
"swiping-back"
);

view.style.transform=
"translateX("+x+"px)";

view.style.opacity=
String(
Math.max(
.35,
1-x/window.innerWidth*.65
)
)

},
{
passive:true
}
);

view.addEventListener(
"touchend",
e=>{

if(!moving)return;

moving=false;

var changed=
e.changedTouches&&
e.changedTouches[0];

var dx=
changed
?changed.clientX-startX
:0;

if(dx>window.innerWidth*.28){

view.style.transform=
"translateX(100%)";

view.style.opacity="0";

setTimeout(
goBackHome,
160
)

}else{

view.classList.add(
"swipe-return"
);

view.style.transform="";
view.style.opacity="";

setTimeout(()=>{
view.classList.remove(
"swiping-back",
"swipe-return"
)
},180)

}

},
{
passive:true
}
)
})();
